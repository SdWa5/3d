# Ruff configuration. The Python side is Blender's bpy, which is only importable inside Blender, so
# nothing here can be type-checked against it — Ruff's lint rules are what is checkable from outside.
[tool.ruff]
line-length = 120
target-version = "py311"
include = ["blender/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
# UP031 wants f-strings in place of percent formatting, which is 52 `print()` calls across the Blender
# scripts and buys nothing but the risk of a typo inside a message somebody reads on a console.
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
# bpy is resolved by Blender at runtime and is not installable, so an unresolved import is expected.
"blender/**/*.py" = ["E402"]
