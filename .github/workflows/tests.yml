name: Tests

on:
  push:
  workflow_dispatch:
  # **THE NIGHTLY SCHEDULE IS GONE, BECAUSE THE JOB IT EXISTED FOR CANNOT SUCCEED.** `full` ran on 5, 6 and 7
  # September and was cancelled all three times with "the job has exceeded the maximum execution time of
  # 6h0m0s", which is a hard GitHub ceiling rather than a setting. Measured on run 34099956636: `phpunit`
  # 3 h 07 m 52 s and `full` 6 h 01 m 17 s, so roughly 548 minutes a night that bought nothing at all. The
  # nightly `phpunit` was the same sampled run a push already does, so removing the trigger loses only the
  # unattended repetition. `full` is `workflow_dispatch` only until it is made to fit, which is TOOL-20.

# **THE TOKEN GETS READ ACCESS AND NOTHING ELSE, WHICH IS WORTH STATING BEFORE THIS REPOSITORY IS PUBLIC.**
# Without this block the workflow inherits whatever the organization default happens to be, and a default is not
# a statement. No job here writes to the repository, none calls the API, and nothing in this file reads
# `secrets`, so read access to the contents is the whole requirement. `sdwa5-vps` has declared the same thing
# since its workflow was written.
permissions:
  contents: read

# **A superseded push should stop costing money the moment it is superseded.** On 8 September five pushes landed
# within a few hours and each one started its own 135-minute `phpunit` job, because nothing cancelled the one
# before it.
#
# **`cancel-in-progress` is off on `main` on purpose.** A merge commit's green run is the thing a release is
# judged by, and cancelling it because the next merge landed is how a branch ends up with no completed run at
# all. Everywhere else the newest push is the only one anybody is waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # **THE SHARD NAMES COME FROM ONE FILE, SO THE MATRIX AND THE PARTITION GUARD CANNOT DISAGREE.**
  # `.github/phpunit-shards.json` maps each shard to a `--filter`. This job only reads the keys, and `phpunit`
  # builds its matrix from them, so a shard added to the file runs without touching this workflow, and a shard
  # the guard in `static` checks is by construction a shard that runs.
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      names: ${{ steps.read.outputs.names }}
    steps:
      - uses: actions/checkout@v5

      - id: read
        run: echo "names=$(jq -c 'keys_unsorted' .github/phpunit-shards.json)" >> "$GITHUB_OUTPUT"

  # **THE SUITE RUNS AS THREE SHARDS, BECAUSE ONE JOB WAS AT THE MERCY OF A RANDOM DRAW.** Three single-job runs
  # on the public four-core runner, 2026-09-30 and 2026-10-01: 57:54 on `5d22cbf`, 1:28:40 on `16f9849`, and
  # cancelled at 90 minutes on `d8c9782`. Tests 1 to 63 alone swung between 3 and 18 minutes. That block holds
  # `BuildAllCommandTest`, whose replay draws a fresh 120 of 2726 scenes per run, so the cost moves with the seed.
  # Everything outside `App\Tests\Command\` was 12 to 15 minutes of those runs, so it stays one shard, and the
  # `Command` tests are split in two at `SceneStackCommandTest`, which was about half of them in a local 4-core
  # timing (19 of 39 minutes).
  #
  # Each shard is its own runner, which a public repository gets for free, so the wall time is the slowest shard
  # rather than the sum. `fail-fast` is off so one red shard does not hide the result of the others.
  phpunit:
    needs: shards
    name: phpunit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.names) }}
    # GitHub's default is 360 minutes, and that default is exactly what produced TOOL-20's three cancellations at
    # the six-hour ceiling for roughly 1644 minutes that bought nothing. A job that hits its own timeout reports a
    # failure somebody can read; one cancelled at the ceiling reports that it was cancelled. The 90 minutes now
    # apply per shard, which is more than twice what the slowest one is expected to take.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          # **THE JIT THIS REPOSITORY ASKS FOR IN TWO PLACES WAS MEASURABLY OFF ON 2026-09-11.**
          # `opcache.jit_buffer_size` is `PHP_INI_SYSTEM` and defaults to 0, so the `<ini>` entry in
          # `phpunit.xml` and the `ini_set()` in `bin/console` were both setting a mode for a compiler with
          # nowhere to emit code. Measured in the project container: `opcache.jit_buffer_size => 0` and
          # `opcache_get_status()['jit']['enabled'] === false`. setup-php sets no buffer either, so the runner
          # was in the same state. Stating it here is what makes it true rather than assumed.
          #
          # **IT IS WORTH ABOUT 1.5x ON THE COMMANDS AND ABOUT 1.5x ON THIS SUITE, BOTH MEASURED.** A bare
          # `scene:stack` sweep in one process is 18.1 s against 28.5 s, three repeats each. Inside PHPUnit, the
          # 434 cases of `generated/next-event` are 0.2154 s each against 0.3304 s, which is 1.53x.
          #
          # **0.113.0 stated the opposite here and it was an artefact of how the JIT was turned off.** That
          # release recorded 22:06.248 against 22:06.927 and concluded the suite could not benefit. The `<php>`
          # block in `phpunit.xml` sets `opcache.jit=tracing` at runtime, so a run started with
          # `php -d opcache.jit=off` has the JIT switched back on before a single test executes. Measured three
          # ways on the same 107 cases: 4.93 s as configured, 5.36 s with `-d opcache.jit=off`, and 6.92 s with
          # `-d opcache.jit_buffer_size=0`, which is the one form `ini_set` cannot undo because the buffer is
          # `PHP_INI_SYSTEM`. Only the third is a genuinely interpreted run.
          #
          # **The 90-minute budget rested on this while the suite was one job.** `composer test` was 108.98 min
          # on run 33846381809 with the JIT off, and the measured ratio made that roughly 71 min. The single job
          # later took between 58 and over 90 minutes, which is why it is sharded now. The guard step still
          # keeps a silent regression from costing every shard 1.5x.
          #
          # `opcache.enable_cli` is in the list because setup-php leaves it off and a JIT buffer without opcache
          # on the CLI buys nothing.
          ini-values: opcache.enable_cli=1, opcache.jit_buffer_size=64M, opcache.jit=tracing

      # **THE GUARD, BECAUSE THIS EXACT REGRESSION ALREADY HAPPENED ONCE AND NOTHING REPORTED IT.**
      #
      # `opcache.jit_buffer_size` can only be set at startup, so every way of asking for the JIT at runtime
      # succeeds whether or not there is a buffer to emit into. That is how this repository spent releases
      # believing the solver was compiled while it was interpreted: two config files said `opcache.jit=tracing`,
      # both calls returned cleanly, and the suite went green at 1.61x the cost it needed to.
      #
      # A silent 1.5x is worth a hard failure. If `ini-values` above ever stops being applied — a setup-php
      # change, a runner image change, a typo in the list — this turns it into a red build on the next push
      # instead of a slow job nobody looks at. It is also the only thing standing between the 90-minute budget
      # and a 108-minute interpreted run.
      - name: Confirm the JIT is actually on
        run: |
          php -r '
            if (!function_exists("opcache_get_status")) {
              fwrite(STDERR, "opcache is not loaded at all\n");
              exit(1);
            }
            $status = opcache_get_status(false);
            if (true !== ($status["jit"]["enabled"] ?? false)) {
              fwrite(STDERR, sprintf(
                "opcache JIT is OFF (mode=%s, buffer=%s) — the suite would run interpreted at about 1.6x the cost\n",
                ini_get("opcache.jit") ?: "(none)",
                ini_get("opcache.jit_buffer_size")
              ));
              exit(1);
            }
            printf("JIT on: mode=%s buffer=%s\n", ini_get("opcache.jit"), ini_get("opcache.jit_buffer_size"));
          '

      # **No `actions/cache` here, and that is a decision rather than an omission.** `composer install` was
      # measured at 1.8 seconds inside a 135-minute job. A cache round trip costs about that on a warm cache and
      # more on a cold one, and it adds a key that has to track `composer.lock` plus a silent staleness failure.
      # There is no `vendor/` build step, no `node_modules` and no compiled artifact. This job's minutes are CPU
      # in the solver, so caching is the wrong lever for it.
      - run: composer install --prefer-dist --no-progress --no-interaction

      # A missing key makes `jq` print `null`, which PHPUnit would take as a filter matching nothing and pass
      # with zero tests, so an unknown shard is a hard failure instead.
      - name: composer test (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          filter=$(jq -er --arg shard "$SHARD" '.[$shard]' .github/phpunit-shards.json)
          composer test -- --filter "$filter"


  # **The three static checks, in one job and ahead of nothing.** They cost seconds where the suite costs
  # minutes, so they run in parallel with it rather than gating it — a style violation and a failing solve are
  # both worth knowing about on the same push. The shard guard and `specs:validate` ride along for the same
  # reason.
  #
  # Ruff is pinned. `pipx run ruff` without a version picks up whatever is newest, and a new release that adds
  # a rule would fail a push that changed no Python.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          # PHPStan is the reason this job wants the JIT too; see the note in `phpunit`.
          ini-values: opcache.enable_cli=1, opcache.jit_buffer_size=64M, opcache.jit=tracing

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPStan
        run: composer stan

      - name: Symfony coding standards
        run: composer cs

      - name: Ruff
        run: pipx run 'ruff==0.16.6' check .

      # **EVERY TEST IN EXACTLY ONE SHARD, CHECKED RATHER THAN ASSUMED.** The filters in
      # `.github/phpunit-shards.json` are written as complements, so a new test class lands in exactly one of
      # them. This keeps it that way when somebody edits one: the shard lists together have to equal the
      # unfiltered list line for line, which catches a test that runs twice as well as one that runs nowhere.
      # `--list-tests` executes no test, so this costs seconds.
      - name: PHPUnit shards cover the suite exactly once
        run: |
          set -o pipefail
          vendor/bin/phpunit --list-tests | grep '^ - ' | sort > "$RUNNER_TEMP/all.txt"
          : > "$RUNNER_TEMP/shards.txt"
          for shard in $(jq -r 'keys_unsorted[]' .github/phpunit-shards.json); do
            filter=$(jq -er --arg shard "$shard" '.[$shard]' .github/phpunit-shards.json)
            count=$(vendor/bin/phpunit --list-tests --filter "$filter" | { grep '^ - ' || true; } | tee -a "$RUNNER_TEMP/shards.txt" | wc -l)
            echo "$shard: $count tests"
            if [ "$count" -eq 0 ]; then
              echo "::error::shard $shard selects no tests"
              exit 1
            fi
          done
          sort "$RUNNER_TEMP/shards.txt" > "$RUNNER_TEMP/shards.sorted.txt"
          echo "suite: $(wc -l < "$RUNNER_TEMP/all.txt") tests"
          diff "$RUNNER_TEMP/all.txt" "$RUNNER_TEMP/shards.sorted.txt" \
            || { echo "::error::the shards do not cover the suite exactly once (< missing, > duplicated)"; exit 1; }

      # Specs are checkable without Blender, so CI does it. This duplicates
      # `SpecsValidateCommandTest::testTheRepositorysOwnSpecsAreValid()` and is kept anyway, because it costs
      # seconds and it is the only thing that runs the command's real exit-code path through the console
      # application. It moved here from `phpunit` with the sharding, so it runs once rather than once per shard.
      #
      # **`bin/console scene:build --dry-run` used to run in `phpunit` and was 26.12 minutes of a 135-minute
      # job.** It compiled every scene in the repository, which is work `composer test` does to a stricter
      # standard in `ShippedScenesTest`. The reasoning was already written down in `SceneBuildCommandTest`,
      # which skips the identical whole-tree compile for exactly that reason; it had simply never been applied
      # to the workflow.
      #
      # What went with it is the command's own no-argument path, which is now covered by the `full` job and by
      # `SDWA5_FULL_REPLAY=1` rather than on every push. That is a real reduction and it is a small one: the
      # branch is `array_map([$loader, 'load'], $loader->files())`, both halves of which are covered directly,
      # and every scene it would have compiled is covered by the suite anyway. `SceneBuildCommandTest` carries
      # the longer version of this note, including why it was not replaced with a cheap throwaway-tree test.
      - run: bin/console specs:validate

  # **The same suite with nothing sampled, nightly and on demand.**
  #
  # `composer test` replays a seeded *sample* of the generated scenes rather than all 2688 of them, because one
  # solve per scene is 26 minutes and a suite nobody runs before committing is worth less than a fast one. The
  # sample is a fresh draw each run and prints its seed, so the set is covered over a week of pushes and any
  # failure is reproducible — but "over a week" is not "before this merge", which is what this job is for.
  #
  # It also un-skips the two paths whose cost is a full pass over the tree: the regenerate stage end to end, and
  # `scene:build` with no argument.
  #
  # **IT DOES NOT FIT IN A GITHUB JOB AS WRITTEN.** Three cancellations at the 6-hour ceiling say so, and the
  # local number says why: 23 m 20 s here against 2 h 15 m 20 s for the sampled `phpunit` on a runner, so the
  # runner is roughly 5.8× slower and the un-sampled replay of 1374 scenes has nowhere near the headroom. Until
  # it is sharded over a matrix or sampled harder — TOOL-20 — this is a button somebody presses, not a schedule.
  # The JIT below takes about a third off and does not close the gap on its own.
  full:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Under the 360-minute ceiling on purpose, so an overrun fails with a log instead of being cancelled without
    # one. That is the whole difference between TOOL-20 having three data points and having none.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.jit_buffer_size=64M, opcache.jit=tracing

      # The same guard as in `phpunit`, and it matters more here: this job is the one with a 330-minute budget,
      # so an interpreted run is the difference between finishing and being killed.
      - name: Confirm the JIT is actually on
        run: |
          php -r '
            $status = function_exists("opcache_get_status") ? opcache_get_status(false) : null;
            if (true !== ($status["jit"]["enabled"] ?? false)) {
              fwrite(STDERR, "opcache JIT is OFF — this job needs it to fit in its timeout\n");
              exit(1);
            }
            printf("JIT on: mode=%s buffer=%s\n", ini_get("opcache.jit"), ini_get("opcache.jit_buffer_size"));
          '

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: composer test
        env:
          SDWA5_FULL_REPLAY: '1'

  # Secret scanning, on the working tree and on the full history.
  #
  # The same job runs in all three SdWa5 repositories, because they are going
  # public and a public repository publishes every past commit at once. This
  # repository came back clean on 2026-09-08, tree and history both, but
  # sdwa5-vps had two real secrets sitting in its history since c516d41, so the
  # gate exists to stop the next one rather than to find a current one.
  #
  # The gitleaks CLI is used directly rather than gitleaks/gitleaks-action,
  # because that action requires a licence key for repositories owned by a
  # GitHub Organization, and moving these repositories into an `sdwa5`
  # organization is the plan.
  #
  # Runtime is not a concern here despite the 2707 committed scene files:
  # measured 1.5 s for 137 commits and 38 MB.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          # The history scan needs the history.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan the working tree
        run: /tmp/gitleaks dir . --redact --no-banner --config .gitleaks.toml

      - name: Scan the full history
        run: /tmp/gitleaks git . --redact --no-banner --config .gitleaks.toml
