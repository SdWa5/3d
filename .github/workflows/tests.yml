name: Tests

on:
  push:
  workflow_dispatch:
  # The full pass, nightly. See `full` below for why it is not on every push.
  schedule:
    - cron: '17 3 * * *'

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: composer test

      # Specs and scenes are both checkable without Blender, so CI does it.
      - run: bin/console specs:validate

      - run: bin/console scene:build --dry-run

  # **The three static checks, in one job and ahead of nothing.** They cost seconds where the suite costs
  # minutes, so they run in parallel with it rather than gating it — a style violation and a failing solve are
  # both worth knowing about on the same push.
  #
  # Ruff is pinned. `pipx run ruff` without a version picks up whatever is newest, and a new release that adds
  # a rule would fail a push that changed no Python.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPStan
        run: composer stan

      - name: Symfony coding standards
        run: composer cs

      - name: Ruff
        run: pipx run 'ruff==0.16.6' check .

  # **The same suite with nothing sampled, nightly and on demand.**
  #
  # `composer test` replays a seeded *sample* of the generated scenes rather than all 2688 of them, because one
  # solve per scene is 26 minutes and a suite nobody runs before committing is worth less than a fast one. The
  # sample is a fresh draw each run and prints its seed, so the set is covered over a week of pushes and any
  # failure is reproducible — but "over a week" is not "before this merge", which is what this job is for.
  #
  # It also un-skips the two paths whose cost is a full pass over the tree: the regenerate stage end to end, and
  # `scene:build` with no argument.
  full:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: composer test
        env:
          SDWA5_FULL_REPLAY: '1'

  # Secret scanning, on the working tree and on the full history.
  #
  # The same job runs in all three SdWa5 repositories, because they are going
  # public and a public repository publishes every past commit at once. This
  # repository came back clean on 2026-09-08, tree and history both, but
  # sdwa5-vps had two real secrets sitting in its history since c516d41, so the
  # gate exists to stop the next one rather than to find a current one.
  #
  # The gitleaks CLI is used directly rather than gitleaks/gitleaks-action,
  # because that action requires a licence key for repositories owned by a
  # GitHub Organization, and moving these repositories into an `sdwa5`
  # organization is the plan.
  #
  # Runtime is not a concern here despite the 2707 committed scene files:
  # measured 1.5 s for 137 commits and 38 MB.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # The history scan needs the history.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan the working tree
        run: /tmp/gitleaks dir . --redact --no-banner --config .gitleaks.toml

      - name: Scan the full history
        run: /tmp/gitleaks git . --redact --no-banner --config .gitleaks.toml
