# GMSS (Gena Made Sound System) — the full stack, as the builder describes it and the photograph shows it.
#
# READ THIS BEFORE TRUSTING ANYTHING IN IT. Every cabinet is an `estimated` spec, but for a different reason than
# before: the dimensions are now the **builder's own stated figures** rather than anything read off the photograph.
# `estimated` is the honest enum case for that — there is no datasheet, no plans in hand, and `measured` would claim
# we taped it ourselves. Two of his figures he hedged himself ("maybe 220kg", "~120kg"). `scene:build` warns that
# this scene uses another owner's gear and that the positions rely on un-measured cabinets; both stay.
#
# THE ARRANGEMENT, and it is now described rather than deduced — "the outer columns are each three subs in a pillar
# on top of one other speaker in the bottom":
#
#   each outer column   1 nuke ON ITS SIDE, 3 IQ subs stacked on it        0.590 + 3 x 0.670 = 2.600 m
#   middle bay, row 1   2 wall basses side by side                                            1.400 m
#   middle bay, row 2   the USB mid bass lying across both of them         1.400 + 0.500     = 1.900 m
#   on top of that      the 3 turbo tops, side by side in ONE ROW          1.900 + 0.710     = 2.610 m
#
# FOURTEEN CABINETS, 994 kg, and every one of them accounted for: 2 nukes + 6 IQ subs + 2 wall basses + 1 mid bass
# + 3 tops. The "8 turbo subs" of the original message is two different boxes — 6 IQ subs and 2 nukes — which is
# what made the count read as six in the photo and eight in the sentence. Nothing is left out of this rig any more.
#
# THE MID BASS NEEDS NO ROLL, and that is the correction that matters most here. Earlier passes put a *middle sub* on
# its side in row 2, because what the photo shows there is distinctly wider than it is tall and no cabinet in the
# stated list was that shape. The USB is: 1.200 wide and 0.500 tall as it stands. The rolled cabinet was a
# reconstruction of a box that does not exist, and it is gone.
#
# EVERY POSITION IS DERIVED, none is chosen:
#
#   wall basses   2 x 0.660 + 0.02 = 1.340 m, so the middle bay runs to 0.670 either side of centre
#   mid bass      1.200 m centred over it, which is 0.600 either side — inside the bay, not proud of it
#   turbo tops    3 x 0.450 + 2 x 0.02 = 1.390 m, centred, so each outer top overhangs the 1.200 m mid bass by
#                 95 mm and keeps 79% of itself on it
#   columns       the ROLLED nuke is the widest thing in a column at 0.770, so 0.670 + 0.020 gap + 0.385 puts each
#                 column's centre at 1.075 — 90 mm further out than an upright nuke needed
#
# CLEARANCES: the nuke at each foot reaches inward to 0.690 against the wall basses' 0.670 — 20 mm, the tightest fit
# in the rig, and the reason the column centre is where it is. Above 0.590 m the columns are IQ subs, whose inner
# faces are at 0.810, against the tops' 0.695: 115 mm, so nothing above the ground row comes near anything.
#
# THE COLUMNS FINISH 10 mm BELOW THE TOPS, at 2.600 m against 2.610, and that is what turning the nukes bought. Upright
# they made the columns 2.780 m and stood 170 mm proud of the tops; on their sides the two are level to within a
# centimetre, which is how the photograph reads. It also widens the rig from 2.560 m to 2.920 m across — the same
# trade a folded horn on its side always makes, wider and lower out of the same cabinets.
#
# WHAT IS STILL UNKNOWN: every depth is the builder's figure but none is cross-checked; no passbands, no crossover
# points, and apart from the wall bass's stated 18" no driver sizes. The low boxes under the middle bay in the photo
# are still not modelled — nothing is known about them beyond that they are there. Nor are the 9 m truss, the two
# 5.2 m towers or the 4 Martin MAC Performance 2 moving heads: those are in `gmss-full-stack-truss.yaml`.
id: gmss-full-stack
name: "GMSS — the full stack"

focus:
  distance_m: 12.0
  height_m: 1.8

placements:
  # THE MIDDLE BAY, bottom up. The wall basses go on the ground because they are far the heaviest thing in the rig at
  # about 220 kg each — 440 of the stack's 994 kg — and because in the photo they are what the whole centre stands on.
  - id: wall-basses
    device: wall-bass
    at: [ 0.0, 0.0 ]
    row:
      count: 2
      gap_m: 0.02

  # The USB mid bass, lying across both of them exactly as it stands: 1.200 wide by 0.500 tall is already the shape
  # the photograph shows, so there is no roll here and no speculation left in this placement.
  - id: mid-bass
    device: mid-bass
    on: wall-basses
    at: [ 0.0, 0.0 ]

  # THE THREE TOPS, ONE ROW, on the mid bass.
  - id: tops
    device: turbo-top
    on: mid-bass
    at: [ 0.0, 0.0 ]
    row:
      count: 3
      gap_m: 0.02

  # THE OUTER COLUMNS. A nuke on the ground with three IQ subs stacked on it — the builder's own description.
  #
  # THE NUKES ARE ON THEIR SIDES, a quarter turn each, so each column stands on a 0.770 × 0.590 foot rather than a
  # 0.590 × 0.770 one. Mirrored rather than both turned the same way — 270 on the left and 90 on the right — which is
  # the same convention `roll_mirror` applies inside a solved tier: the rig is meant to be symmetric about its centre
  # line, and two cabinets rolled the same way are a rig built twice rather than a pair.
  #
  # `at` IS NOT THE COLUMN CENTRE for these two, and that is the whole reason the numbers look wrong. A rolled
  # cabinet's body lies entirely to ONE SIDE of its placement point — at 90 the 0.770 m runs from the point rightward,
  # at 270 leftward — so centring a body on ±1.075 means placing the point 0.385 m the other way, at ±0.690. The
  # upright IQ subs above them are ordinary and sit on ±1.075 directly.
  - id: nuke-left
    device: nuke
    at: [ -0.690, 0.0 ]
    roll_deg: 270

  - id: column-left
    device: iq-sub
    on: nuke-left
    at: [ -1.075, 0.0 ]
    lattice:
      count: [ 1, 1, 3 ]

  - id: nuke-right
    device: nuke
    at: [ 0.690, 0.0 ]
    roll_deg: 90

  - id: column-right
    device: iq-sub
    on: nuke-right
    at: [ 1.075, 0.0 ]
    lattice:
      count: [ 1, 1, 3 ]

notes: |
  The GMSS stack as its builder describes it — 14 cabinets, 994 kg, 2.610 m tall and 2.920 m across.

  THE TWO NUKES ARE ON THEIR SIDES, mirrored, so each column stands on a 0.770 x 0.590 foot. That is what makes the
  columns finish level with the tops: upright they reached 2.780 m against the tops' 2.610 and stood 170 mm proud,
  turned they reach 2.600 and the two are level to within a centimetre — which is how the photograph reads. The rig
  is 360 mm wider for it, the trade a horn on its side always makes. `gmss-full-stack-truss.yaml` still has them
  upright; the two files are deliberately one line apart.

  Stated by GMSS, verbatim: "Middle subs are 18/1600rms USB 2x 700rms mid bass 8 turbo subs 3000rms 3 turbo top
  2500rms And 4pcs Martin mac performance 2 and many more 9m truss 2 pcs towers max 5.2m" — and then, asked what the
  photo actually shows: "That's the mid bass (usb) and the ones on the outside of the bottom row are also turbo subs",
  with dimensions and weights for each, and "the outer columns are each three subs in a pillar on top of one other
  speaker in the bottom".

  SEVENTH PASS, AND THE FIRST WITH REAL NUMBERS IN IT. Passes one to six sized every box off the photograph and
  rearranged them six times; this one throws all of that away and uses the builder's figures. What the photo-derived
  reconstruction got wrong is worth keeping as a record of how far a photograph can mislead:

  - the tops were 0.935 m tall against a real 0.710, and 0.391 wide against 0.450 — too tall AND too narrow, because
    obliquity compresses apparent width and nothing corrected for it
  - "8 turbo subs" was modelled as one cabinet type, so six were drawn and two written off as absent from the photo.
    They are two types: 6 IQ subs and 2 nukes, and all eight are in the picture
  - the mid bass was modelled as two 0.595 m boxes at the feet of the columns. It is one 1.200 m box lying across the
    wall basses — the wide cross-braced mouth in the middle of the photo, which four passes tried to explain with a
    cabinet laid on its side because no listed box had that shape
  - the wall basses ("middle subs") were 0.595 x 1.020 x 0.850 at 81 kg against a real 0.660 x 1.400 x 1.000 at about
    220 kg. Nearly three times the mass, and they are what the rig stands on

  What this scene does NOT guess at: no passbands, no crossover points and — apart from the wall bass's stated 18" —
  no driver sizes. The one thing a tape measure would still settle is whether the builder's centimetres are as round
  as they look.
