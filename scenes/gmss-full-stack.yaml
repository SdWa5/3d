# GMSS (Gena Made Sound System) — the full stack, reconstructed from GMSS.jpeg.
#
# READ THIS BEFORE TRUSTING ANYTHING IN IT. Every cabinet here is an `estimated` spec: GMSS supplied counts and
# power ratings and one site photograph with no scale reference, so the boxes are reconstructions. `scene:build`
# will warn that this scene uses gear from an owner other than sdwa5 and that the positions rely on un-measured
# cabinets. Both warnings are correct and both should stay until somebody takes a tape measure to the rig.
#
# THIS IS THE SECOND PASS. The first got two things wrong that the photograph plainly shows, and they are worth
# recording so they are not repeated:
#
#   1. THE THREE TOPS ARE ONE ROW, side by side on top of the middle section. The first pass split them — one on
#      each outer column and one in the middle — which made a silhouette the photo does not have.
#   2. THE CABINETS ARE MUCH BIGGER, and the subs are TALLER THAN WIDE rather than the near-cubes they were
#      estimated as. The stack came out 2.66 m wide and 3.94 m tall, a narrow tower; the photograph is a BROAD
#      WALL. It is now 3.46 m wide, which is the shape that was wrong rather than only the numbers.
#
# WHAT THE PHOTO SHOWS, and how the counts confirm the reading:
#
#   two outer columns   grille-fronted cabinets, four to a side      8 — matches "8 turbo subs 3000rms"
#   middle, on ground   a pair of big fin-mouthed folded horns       the 18" "middle subs"
#   middle, above       cross-braced horn mouths                     the "USB 2x 700rms mid bass"
#   one row on top      tall curved-front cabinets                   3 — matches "3 turbo top 2500rms"
#
# Four per column is what makes the eight work out, and the low box at the foot of each column is one of them
# rather than a riser: it carries the same recessed oval logo as the cabinets above it. The first pass read those
# two boxes as plinths and was then two cabinets short.
#
# EVERY NUMBER BELOW IS DERIVED, none is chosen:
#
#   middle subs   2 x 0.900 + 0.02 = 1.820 m across, so the bay runs to 0.910 either side of centre
#   mid bass      2 x 0.900 + 0.02 = 1.820 m, the same span, which is why the tops have a flat row to stand on
#   turbo tops    3 x 0.460 + 2 x 0.02 = 1.420 m, centred inside that 1.820
#   columns       0.910 + 0.020 gap + 0.400 half-width puts each column's centre at 1.330
#
# CLEARANCES, because the middle bay is bracketed by the columns for its whole height: the mid-bass pair reaches
# 0.910 either side and the inner face of each column is at 0.930, so they pass with 20 mm. That is the tightest
# fit in the scene and the reason the mid-bass cabinets are 0.900 wide rather than wider.
#
# WHAT STILL DISAGREES WITH THE PHOTO: the columns finish at 3.800 m and the tops at 3.100, so the tops sit
# 0.700 m below the shoulders. In the photograph they look closer to level than that. Something in the middle
# section is therefore still too short — most likely it stands on a riser, and the low boxes under the middle
# bay are not modelled because nothing is known about them. ONE REAL DIMENSION off any GMSS cabinet would
# settle this and every other number here in a single pass.
id: gmss-full-stack
name: "GMSS — the full stack"

focus:
  distance_m: 12.0
  height_m: 1.8

placements:
  # The middle bay, bottom up. The folded horns go on the ground because they are the heaviest thing in the rig
  # at 125 kg each, and because in the photo they are what the whole centre stands on.
  - id: middle-subs
    device: gmss-middle-sub
    at: [ 0.0, 0.0 ]
    row:
      count: 2
      gap_m: 0.02

  # Both mid-bass horns side by side, spanning the same 1.820 m as the pair below — which is the arrangement
  # that gives the three tops one flat row to stand on. The first pass stacked them, because at 0.800 wide a
  # pair would have driven into the columns; at 0.900 on a 1.820 m bay they sit inside it exactly.
  - id: mid-bass
    device: gmss-mid-bass
    on: middle-subs
    at: [ 0.0, 0.0 ]
    row:
      count: 2
      gap_m: 0.02

  # THE THREE TOPS, ONE ROW. This is the correction the whole second pass is for.
  - id: tops
    device: gmss-turbo-top
    on: mid-bass
    at: [ 0.0, 0.0 ]
    row:
      count: 3
      gap_m: 0.02

  # The two outer columns, four turbo subs each — the whole holding of eight.
  - id: column-left
    device: gmss-turbo-sub
    at: [ -1.330, 0.0 ]
    lattice:
      count: [ 1, 1, 4 ]

  - id: column-right
    device: gmss-turbo-sub
    at: [ 1.330, 0.0 ]
    lattice:
      count: [ 1, 1, 4 ]

notes: |
  A reconstruction of GMSS.jpeg, not a measured rig. Every GMSS spec is `provenance: estimated` and every one of
  them is in the measuring backlog — `catalog` lists them.

  Stated by GMSS, verbatim and in full: "Middle subs are 18/1600rms USB 2x 700rms mid bass 8 turbo subs 3000rms
  3 turbo top 2500rms And 4pcs Martin mac performance 2 and many more 9m truss 2 pcs towers max 5.2m".

  Second pass. The first had the three tops spread across the stack instead of in one row, and had every cabinet
  far too small — a 2.66 x 3.94 m tower where the photograph shows a 3.46 m wide wall.

  Scale comes from the blue illuminated logo on the sub faces, taken as a ~60 mm badge, which puts a pixel at
  about 3 mm at the near column. THAT 60 mm IS AN ASSUMPTION and it scales everything else, so one real
  measurement off any GMSS cabinet would correct the whole set at once.

  What this scene still guesses at: the depth of every cabinet, since the side faces are foreshortened past
  reading; the counts of the middle subs and mid-bass horns, which are not stated; and the height of the middle
  section, which is the one place the reconstruction still disagrees with the photo.

  What it does NOT guess at: no passbands, no crossover points and — apart from the middle sub's stated 18" — no
  driver sizes.
