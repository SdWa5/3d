# GMSS (Gena Made Sound System) — the full stack, reconstructed from GMSS.jpeg.
#
# READ THIS BEFORE TRUSTING ANYTHING IN IT. Every cabinet here is an `estimated` spec: GMSS supplied counts and
# power ratings and one site photograph with no scale reference, so the boxes are reconstructions. `scene:build`
# warns that this scene uses another owner's gear and that the positions rely on un-measured cabinets. Both
# warnings are correct and both should stay until somebody takes a tape measure to the rig.
#
# THE ARRANGEMENT:
#
#   each outer column   1 mid-bass on the ground, 3 turbo subs on top of it        0.600 + 2.850 = 3.450 m
#   middle bay, row 1   2 middle subs side by side                                         1.350 m
#   middle bay, row 2   1 middle sub ON ITS SIDE, across both of them              1.350 + 0.900 = 2.250 m
#   on top of that      the 3 turbo tops, side by side in ONE ROW                  2.250 + 1.150 = 3.400 m
#
# SIX TURBO SUBS, NOT EIGHT. GMSS states eight and only six are in this photograph — three to a column — so this
# scene builds the six that can be seen and leaves the other two out. `scene:build` warns about over-using gear,
# never about under-using it, so a rig that spends part of the inventory is a legitimate arrangement rather than
# an error. When the other two turn up in a photo or a message, they go in.
#
# THE MID-BASS CABINETS ARE THE FOOT OF THE COLUMNS, not a row in the middle. In the photo each column stands on
# a short wide box carrying the same recessed oval logo as the cabinets above it. An earlier pass read those as a
# fourth turbo sub per column, and the one before that as plinths. They are the small subs, they are on the
# ground, and the turbo subs stand on them.
#
# ROW 2 IS A MIDDLE SUB LAID ON ITS SIDE, and that is the one genuinely speculative placement in the rig. What
# the photograph shows between the middle subs and the tops is a cross-braced horn mouth, distinctly WIDER THAN
# IT IS TALL, where a middle sub standing up is 0.900 wide and 1.350 tall. Rolled a quarter turn it is 1.350 wide
# and 0.900 tall, which is that shape — and two things then fall out rather than being arranged:
#
#   IT CARRIES THE TOPS. The row of three tops is 1.420 m across. On a cabinet standing up it would have 0.900 m
#   under it and each outer top would hang half off; rolled, there is 1.350 m and every top keeps 92% of itself
#   on the cabinet.
#
#   THE HEIGHTS COME OUT LEVEL. The tops finish at 3.400 m and the columns at 3.450 — 50 mm apart, which is what
#   the photograph shows. Standing that cabinet up instead puts the tops at 3.850 m, 400 mm PROUD of the columns,
#   which the photograph does not show.
#
# Neither of those was aimed for. That the same quarter turn fixes the bearing and the height at once is the
# reason to believe it, but it remains a reading of a photograph: it could be a cabinet type GMSS never listed.
#
# EVERY POSITION IS DERIVED, none is chosen:
#
#   middle subs   2 x 0.900 + 0.02 = 1.820 m, so the middle bay runs to 0.910 either side of centre
#   row 2         1.350 m rolled, centred — hence `at: -0.675`, because a rolled cabinet's body lies to one
#                 side of its placement point rather than around it
#   turbo tops    3 x 0.460 + 2 x 0.02 = 1.420 m, centred inside that 1.350
#   columns       0.910 + 0.020 gap + 0.450 (half a mid-bass) puts each column's centre at 1.380
#
# CLEARANCES: the mid-bass at each foot reaches inward to 0.930 against the middle subs' 0.910, which is 20 mm
# and the tightest fit in the rig. Above 0.600 m the columns are turbo subs, whose inner faces are at 0.980,
# against row 2's 0.675 and the tops' 0.710 — so nothing above the ground row comes near anything.
#
# WHAT IS STILL GUESSED: every depth, since the side faces are foreshortened past reading; the counts of middle
# subs and mid-bass cabinets, which GMSS never stated; and the absolute scale, which rests entirely on reading
# the blue logo as a ~60 mm badge. ONE REAL DIMENSION off any GMSS cabinet would settle the whole set at once.
#
# The low boxes under the middle bay in the photo are not modelled: nothing is known about them beyond that they
# are there. Nor are the 9 m truss, the two 5.2 m towers or the 4 Martin MAC Performance 2 moving heads.
id: gmss-full-stack
name: "GMSS — the full stack"

focus:
  distance_m: 12.0
  height_m: 1.8

placements:
  # THE MIDDLE BAY, bottom up. The folded horns go on the ground because they are the heaviest thing in the rig
  # at 125 kg each, and because in the photo they are what the whole centre stands on.
  - id: middle-subs
    device: gmss-middle-sub
    at: [ 0.0, 0.0 ]
    row:
      count: 2
      gap_m: 0.02

  # The third middle sub, a quarter turn onto its side — see the header. `at` is -0.675 rather than 0 because a
  # rolled cabinet's body lies to one side of its placement point, so this is what centres its 1.350 m.
  - id: middle-sub-upper
    device: gmss-middle-sub
    on: middle-subs
    at: [ -0.675, 0.0 ]
    roll_deg: 90

  # THE THREE TOPS, ONE ROW, on the rolled cabinet and 50 mm off level with both columns.
  - id: tops
    device: gmss-turbo-top
    on: middle-sub-upper
    at: [ 0.0, 0.0 ]
    row:
      count: 3
      gap_m: 0.02

  # THE OUTER COLUMNS. A mid-bass on the ground with three turbo subs standing on it.
  - id: small-sub-left
    device: gmss-mid-bass
    at: [ -1.380, 0.0 ]

  - id: column-left
    device: gmss-turbo-sub
    on: small-sub-left
    at: [ -1.380, 0.0 ]
    lattice:
      count: [ 1, 1, 3 ]

  - id: small-sub-right
    device: gmss-mid-bass
    at: [ 1.380, 0.0 ]

  - id: column-right
    device: gmss-turbo-sub
    on: small-sub-right
    at: [ 1.380, 0.0 ]
    lattice:
      count: [ 1, 1, 3 ]

notes: |
  A reconstruction of GMSS.jpeg, not a measured rig. Every GMSS spec is `provenance: estimated` and every one is
  in the measuring backlog — `catalog` lists them.

  Stated by GMSS, verbatim and in full: "Middle subs are 18/1600rms USB 2x 700rms mid bass 8 turbo subs 3000rms
  3 turbo top 2500rms And 4pcs Martin mac performance 2 and many more 9m truss 2 pcs towers max 5.2m".

  Fourth pass. What each earlier one got wrong, since the corrections are the useful record here:

  - the first split the three tops across the stack instead of putting them in one row, and had every cabinet far
    too small — a 2.66 x 3.94 m tower where the photo shows a wide wall
  - the second fixed both of those but read the short wide box at each column's foot as a fourth turbo sub, which
    left the middle bay to be filled with the mid-bass
  - the third put the mid-bass where the photo has it, under the columns, and built the six turbo subs the photo
    shows rather than all eight — but left the middle bay's second row empty, so the tops sat 0.950 m low
  - this one fills that row with a third middle sub on its side, which is both the shape the photo shows there and
    what brings the tops level with the columns

  Scale comes from the blue illuminated logo on the sub faces, taken as a ~60 mm badge, which puts a pixel at
  about 3 mm at the near column. THAT 60 mm IS AN ASSUMPTION and it scales every dimension in the rig, so one
  real measurement off any GMSS cabinet would correct the whole set at once.

  What this scene does NOT guess at: no passbands, no crossover points and — apart from the middle sub's stated
  18" — no driver sizes.
