# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 12 cabinets in 3 rows:
#
#   1  2× flexy-folded-horn-hybrid + 1× skram + 2× flexy-folded-horn-hybrid    3.054 m wide
#   2  1× flexy-folded-horn-hybrid + 3× achenbach-18 + 1× flexy-folded-horn-hybrid    3.062 m wide
#   3  1× tecnare-m2122 + 1× eighteensound-2way-15                            0.9856 m wide
#
# Subs reach 1.677 m against a 1.6 m interface. The stack is 2.637 m of cabinet.
#   * tecnare-m2122: LEFT OUT, 1 of 3 — 2 stacks take 1 each, and an odd cabinet would make one stack a different
#     rig from the others
#
# main-2 — 2, 12 cabinets in 3 rows:
#
#   1  2× flexy-folded-horn-hybrid + 1× skram + 2× flexy-folded-horn-hybrid    3.054 m wide
#   2  1× flexy-folded-horn-hybrid + 3× achenbach-18 + 1× flexy-folded-horn-hybrid    3.062 m wide
#   3  1× eighteensound-2way-15 + 1× tecnare-m2122                            0.9856 m wide
#
# Subs reach 1.677 m against a 1.6 m interface. The stack is 2.637 m of cabinet.
#   * tecnare-m2122: LEFT OUT, 1 of 3 — 2 stacks take 1 each, and an odd cabinet would make one stack a different
#     rig from the others
#
id: stacked-two-flat-center
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 12 cabinets in 3 rows
  - id: main-1
    at: [-2.083, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.7
      interface_height_m: 1.6
      gap_m: 0.02
      mirror: true             # the mirror image of stack 1
      from:
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: achenbach-18
          count: 3
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # 2, 12 cabinets in 3 rows
  - id: main-2
    at: [1.479, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.7
      interface_height_m: 1.6
      gap_m: 0.02
      from:
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: achenbach-18
          count: 3
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
