# The whole SdWa5 PA as it would go up: a 12-cabinet sub wall in two stacked rows of six,
# with the three M2122 tops on top of the outer ends. Written to be read and edited — change
# `count`, `step` or a `device` and rebuild.
#
# Coordinates: metres, X to the right, Y depth (cabinets face -Y), Z up. Positions are the
# bottom-center of each cabinet; `on` works the height out from the specs, so no z is ever written.
id: full-rig
name: "Full rig — 12 subs, 3 tops"

placements:
  # Bottom row of the sub wall: 7 Flexys side by side, 20 mm apart.
  - id: sub-row-bottom
    device: flexy-folded-horn-hybrid
    at: [-0.302, 0.0]        # the middle of the wall, not its left edge
    row:
      count: 6
      gap_m: 0.02

  # Second row, stacked directly on the first. Same x/y, z resolved from the row below.
  - id: sub-row-top
    device: flexy-folded-horn-hybrid
    on: sub-row-bottom
    at: [-0.302, 0.0]        # the middle of the wall, not its left edge
    row:
      count: 6
      gap_m: 0.02

  # The two factory tops go on the ends of the wall, aimed straight ahead.
  - id: top-left
    device: tecnare-m2122
    on: sub-row-top
    at: [-1.8295, 0.0]

  - id: top-right
    device: tecnare-m2122
    on: sub-row-top
    at: [1.2255, 0.0]

  # The self-built third top fills the centre.
  - id: top-centre
    device: tecnare-m2122
    on: sub-row-top
    at: [-0.302, 0.0]

notes: |
  A starting point, not a proven setup — the real layouts are in Drive under
  `Hardware/Speaker Enclosures _ Lautsprecher-Gehäuse/setups/` as SVG, and porting those is
  TODO item 2.5.
  `sub-row-top` repeats from its own `at`, so the second row sits squarely on the first; drop the
  `at` and it would inherit the last cabinet of the row below instead.
  Sepp's Eighteensound tops and Achenbach subs are deliberately absent — see `scene:build`'s
  borrowed-gear note when you add them.
