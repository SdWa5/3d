# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --from=gmss-wall-bass --from=gmss-mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=gmss-iq-sub --from=tecnare-m2122 --from=gmss-turbo-top
#     --stacks=1 --align=stereo --shape=free --mirror-style=alternate --id=stacked-gmss-sdwa5-1
#
# What it deals out today:
#
#   1  1× gmss-wall-bass rolled 270° + 1× gmss-mid-bass rolled 90° + 1× gmss-wall-bass rolled 90°     3.34 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 2× skram rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    4.197 m wide
#   3  3× flexy-folded-horn-hybrid rolled 270° + 3× flexy-folded-horn-hybrid rolled 90°    4.678 m wide
#   4  1× gmss-nuke rolled 270° + 2× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× gmss-nuke rolled 90° + 1× gmss-iq-sub rolled 90°    4.599 m wide
#   5  2× gmss-iq-sub rolled 270° + 3× gmss-iq-sub rolled 90°                 3.43 m wide
#   6  1× tecnare-m2122 + 1× gmss-turbo-top + 1× tecnare-m2122 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× tecnare-m2122     2.95 m wide
#
# Subs reach 3.522 m against a 2.0 m interface. The stack is 4.482 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.522 m against the 3.000 m ceiling asked for, so they stand 522 mm too high — 3.522 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× flexy-folded-horn-hybrid rolled 270° + 2× skram rolled 270° + 2× flexy-folded-horn-hybrid rolled
#     90° row is 4.197 m on a 3.340 m row, so it overhangs 429 mm each side
#   * the 3× flexy-folded-horn-hybrid rolled 270° + 3× flexy-folded-horn-hybrid rolled 90° row is 4.678 m on a
#     4.197 m row, so it overhangs 240 mm each side
#
id: stacked-gmss-sdwa5-1-free----turned--alternate-stereo
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: gmss-mid-bass
          roll_mirror: 90.0
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - tecnare-m2122
        - device: gmss-turbo-top
          aim: near

