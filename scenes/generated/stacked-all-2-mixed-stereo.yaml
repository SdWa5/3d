id: stacked-all-2-mixed-stereo
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 23 cabinets in 5 rows
  - id: main-2
    at: [-1.7165, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 5.2
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2
        - device: gmss-turbo-top
          count: 2
          aim: near

  # 1, 15 cabinets in 5 rows
  - id: main-1
    at: [2.393, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 5.2
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: gmss-turbo-top
          count: 1
          aim: near

