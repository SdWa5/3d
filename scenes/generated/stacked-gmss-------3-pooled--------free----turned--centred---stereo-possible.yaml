#
# Subs reach 1.78 m against a 2.0 m interface. The stack is 2.49 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-mid-bass: LEFT OUT, it cannot be carried in this stack — a gmss-nuke in the 1× gmss-iq-sub rolled 270°
#     + 1× gmss-nuke rolled 270° + 1× gmss-nuke rolled 90° + 1× gmss-iq-sub rolled 90° row would land on only 21% of
#     its own width — it is touching what carries it rather than sitting on it. Line the segments up with what carries
#     them
