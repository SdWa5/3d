id: stacked-all--------2-systems-apart-pyramid-mixed---alternate-block--possible
name: "Solved rig — 6 stacks side by side, tiers justified"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-1, 4 cabinets in 2 rows
  - id: main-gmss-1
    at: [-6.7395, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: block
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: gmss-turbo-top
          count: 1

