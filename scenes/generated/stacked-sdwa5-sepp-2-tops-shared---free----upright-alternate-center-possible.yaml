id: stacked-sdwa5-sepp-2-tops-shared---free----upright-alternate-center-possible
name: "Solved rig — 4 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # sepp-2, 5 cabinets in 2 rows
  - id: main-sepp-2
    at: [-3.785, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: achenbach-18
          count: 3
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # sdwa5-2, 7 cabinets in 3 rows
  - id: main-sdwa5-2
    at: [-1.4585, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6

  # sdwa5-1, 8 cabinets in 4 rows
  - id: main-sdwa5-1
    at: [0.8545, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror: true             # the mirror image of stack sdwa5-1
      from:
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: eighteensound-2way-15
          count: 1

  # sepp-1, 5 cabinets in 2 rows
  - id: main-sepp-1
    at: [3.181, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror: true             # the mirror image of stack sepp-1
      from:
        - device: achenbach-18
          count: 3
        - device: tecnare-m2122
          count: 2

