id: stacked-all--------1-systems-apart-v-------mixed---centred---stereo-possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 14 cabinets in 4 rows
  - id: main-gmss
    at: [-3.2735, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - gmss-turbo-top

  # sepp, 8 cabinets in 4 rows
  - id: main-sepp
    at: [-0.5185, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
      from:
        - achenbach-18
        - eighteensound-2way-15

  # sdwa5, 17 cabinets in 4 rows
  - id: main-sdwa5
    at: [2.453, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - tecnare-m2122

