# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --from=skram --from=flexy-folded-horn-hybrid --from=achenbach-18
#     --from=tecnare-m2122 --from=eighteensound-2way-15 --stacks=2 --align=center --shape=pyramid --mirror-style=alternate
#     --id=stacked-sdwa5-sepp-2
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 12 cabinets in 4 rows:
#
#   1  4× flexy-folded-horn-hybrid                                              2.424 m wide
#   2  1× achenbach-18 + 2× flexy-folded-horn-hybrid                           1.822 m wide
#   3  1× achenbach-18 + 1× skram + 1× achenbach-18                            1.85 m wide
#   4  1× tecnare-m2122 + 1× eighteensound-2way-15                            0.9856 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.4 m of cabinet.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the 1× achenbach-18 + 1× skram + 1× achenbach-18 row is 1.850 m on a 1.822 m row, so it overhangs 14 mm each
#     side
#
# main-2 — 2, 13 cabinets in 3 rows:
#
#   1  6× flexy-folded-horn-hybrid                                              3.646 m wide
#   2  1× achenbach-18 + 1× skram + 2× achenbach-18                            2.47 m wide
#   3  1× eighteensound-2way-15 + 2× tecnare-m2122                            1.5056 m wide
#
# Subs reach 1.677 m against a 2.0 m interface. The stack is 2.637 m of cabinet.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 1.677 m against the 2.000 m interface asked for, so the tops sit 323 mm lower than ideal —
#     1.677 m is the most they reach while every tier is still carried
#
id: stacked-sdwa5-sepp-2-pyramid-upright-alternate-center-possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 12 cabinets in 4 rows
  - id: main-1
    at: [-2.375, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: achenbach-18
          count: 3
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # 2, 13 cabinets in 3 rows
  - id: main-2
    at: [1.16, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: achenbach-18
          count: 3
        - device: tecnare-m2122
          count: 2
        - device: eighteensound-2way-15
          count: 1
          aim: near

