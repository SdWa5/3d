# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=3.7 --orientation=mixed --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=gmss-nuke --from=gmss-iq-sub --from=gmss-turbo-top --stacks=1 --align=center --shape=free
#     --mirror-style=centred --id=stacked-gmss-1
#
# What it deals out today:
#
#   1  1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass rolled 90°           2.82 m wide
#   2  1× gmss-nuke rolled 270° + 1× gmss-nuke + 1× gmss-mid-bass              2.6 m wide
#   3  1× gmss-iq-sub rolled 270° + 1× gmss-iq-sub + 1× gmss-iq-sub rolled 90°     1.91 m wide
#   4  1× gmss-iq-sub rolled 270° + 1× gmss-iq-sub + 1× gmss-iq-sub rolled 90°     1.91 m wide
#   5  3× gmss-turbo-top                                                         1.39 m wide
#
# Subs reach 2.77 m against a 2.0 m interface. The stack is 3.48 m of cabinet.
#
id: stacked-gmss-1-free-mixed-centred-center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - gmss-turbo-top

