# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --clearance=0.24 --room-width=13 --room-height=4
#     --backdrop=truss-f33-2m:5:truss-tower-4m --system-interface=innschleife:1.6 --system-interface=sdwa5:1.6
#     --system-interface=sepp:1.6 --system-target=innschleife:1.75 --system-target=sdwa5:1.75 --system-target=sepp:1.75
#     --system-orientation=innschleife:turned --system-orientation=psl:turned --system-orientation=sdwa5:upright
#     --system-orientation=sepp:upright --system-low-end=innschleife:low --system-low-end=sdwa5:central
#     --system-low-end=sepp:central --stand=kicker-15 --systems=tops-shared --order=ours,psl,innschleife
#     --quantity=achenbach-18:4 --quantity=concert-audio-ef6:2 --quantity=concert-audio-esf:0
#     --quantity=concert-audio-esx:9 --quantity=deco-panel-8x2-03:1 --quantity=hk-linear5-112x:0 --quantity=sub-60x60:0
#     --quantity=thebox-achat-112m:0 --quantity=thebox-achat-115m:0 --quantity=thebox-dsp-112:0 --quantity=thebox-pa302:0
#     --quantity=thebox-tp118-800:0 --quantity=thebox-tp218-1600:0 --quantity=tms4:1 --from=wsx-18 --from=sbh-18
#     --from=skram --from=concert-audio-esx --from=flexy-folded-horn-hybrid --from=kicker-15 --from=achenbach-18
#     --from=tms4 --from=tecnare-m2122 --from=concert-audio-ef6 --from=tms2 --from=eighteensound-2way-15 --stacks=1
#     --align=stereo --low-end=low --shape=pyramid --mirror-style=column --id=stacked --into=next-event-light-achenbach
#
# 3 stacks side by side, with 0.24 m of air between them.
#
# main-ours — ours, 19 cabinets in 4 rows:
#
#   1  3× flexy-folded-horn-hybrid rolled 180° + 1× skram rolled 180° + 3× flexy-folded-horn-hybrid rolled 180°    4.276 m wide
#   2  3× flexy-folded-horn-hybrid + 1× skram + 3× flexy-folded-horn-hybrid    4.276 m wide
#   3  4× achenbach-18                                                           2.46 m wide
#   4  1× eighteensound-2way-15                                                0.4656 m wide
#
# Subs reach 2.428 m against a 1.6 m interface. The stack is 3.264 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
# main-psl — psl, 13 cabinets in 4 rows:
#
#   1  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   2  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   3  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   4  1× tms4 + 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tms2      1.9556 m wide
#
# Subs reach 1.77 m against a 2.0 m interface. The stack is 2.91 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.770 m against the 2.000 m interface asked for, so the tops sit 230 mm lower than ideal —
#     1.770 m is the most they reach while every tier is still carried
#
# main-innschleife — innschleife, 17 cabinets in 4 rows:
#
#   1  1× kicker-15 + 1× sbh-18 rolled 270° + 1× sbh-18 rolled 90° + 1× kicker-15     4.36 m wide
#   2  1× kicker-15 + 1× sbh-18 rolled 270° + 1× sbh-18 rolled 90° + 1× kicker-15     4.36 m wide
#   3  2× wsx-18 rolled 270° + 2× wsx-18 rolled 90°                           4.46 m wide
#   4  1× concert-audio-ef6 + 1× tecnare-m2122 + 1× tms2 + 1× tecnare-m2122 + 1× concert-audio-ef6    2.686 m wide
#
# Subs reach 1.71 m against a 1.6 m interface. The stack is 2.67 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 2× wsx-18 rolled 270° + 2× wsx-18 rolled 90° row is 4.460 m on a 4.360 m row, so it overhangs 50 mm each
#     side
#
id: stacked-1-tops-shared---pyramid-stated--column----stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 19 cabinets in 4 rows
  - id: main-ours
    at: [-4.6487, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 1.6
      max_sub_height_m: 3.0
      target_sub_height_m: 1.75
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      low_end: central
      shape: pyramid
      from:
        - skram
        - flexy-folded-horn-hybrid
        - device: achenbach-18
          count: 4
        - device: eighteensound-2way-15
          count: 1

  # psl, 13 cabinets in 4 rows
  - id: main-psl
    at: [-0.43, -0.0245]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: pyramid
      from:
        - device: concert-audio-esx
          count: 9
          roll_mirror: 90.0
        - device: tms4
          count: 1
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: tms2
          count: 1
          aim: near

  # innschleife, 17 cabinets in 4 rows
  - id: main-innschleife
    at: [3.9527, -0.032]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      max_width_m: 4.659
      interface_height_m: 1.6
      max_sub_height_m: 3.0
      target_sub_height_m: 1.75
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: pyramid
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - kicker-15
        - device: concert-audio-ef6
          count: 2
        - device: tecnare-m2122
          count: 2
          aim: near
        - device: tms2
          count: 1
          aim: near

  # Backdrop: deco-panel-8x2-03 hung from 5× truss-f33-2m on two truss-tower-4m, 0.75 m behind the rig's deepest back face.
  # The truss tops out at 4 m. Each tower carries 35.4 kg.
  - id: backdrop-tower-left
    device: truss-tower-4m
    at: [-5.2, 1.232]
    extend_to_m: 3.742
  - id: backdrop-tower-right
    device: truss-tower-4m
    at: [4.597, 1.232]
    extend_to_m: 3.742
  - id: backdrop-truss
    device: truss-f33-2m
    at: [-0.302, 1.232]
    fly:
      height_m: 3.742
      id: backdrop
    row:
      count: 5
      gap_m: 0.0
  - id: backdrop-deco
    device: deco-panel-8x2-03
    at: [-0.302, 1.062]
    fly:
      height_m: 1.974
      id: backdrop
