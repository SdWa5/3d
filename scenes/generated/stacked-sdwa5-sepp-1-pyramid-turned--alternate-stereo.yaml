# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --from=skram --from=flexy-folded-horn-hybrid --from=achenbach-18
#     --from=tecnare-m2122 --from=eighteensound-2way-15 --stacks=1 --align=stereo --shape=pyramid --mirror-style=alternate
#     --id=stacked-sdwa5-sepp-1
#
# What it deals out today:
#
#   1  4× flexy-folded-horn-hybrid rolled 270° + 4× flexy-folded-horn-hybrid rolled 90°    6.244 m wide
#   2  2× flexy-folded-horn-hybrid rolled 270° + 2× achenbach-18 rolled 270° + 2× achenbach-18 rolled 90° + 2× flexy-folded-horn-hybrid rolled 90°    5.592 m wide
#   3  1× achenbach-18 rolled 270° + 1× skram rolled 270° + 1× skram rolled 90° + 1× achenbach-18 rolled 90°    3.088 m wide
#   4  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122   2.5112 m wide
#
# Subs reach 1.801 m against a 2.0 m interface. The stack is 2.761 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.801 m against the 2.000 m interface asked for, so the tops sit 199 mm lower than ideal —
#     1.801 m is the most they reach while every tier is still carried
#
id: stacked-sdwa5-sepp-1-pyramid-turned--alternate-stereo
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near

