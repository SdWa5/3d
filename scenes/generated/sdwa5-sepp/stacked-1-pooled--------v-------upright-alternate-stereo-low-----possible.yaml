# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=skram --from=flexy-folded-horn-hybrid
#     --from=achenbach-18 --from=tecnare-m2122 --from=eighteensound-2way-15 --stacks=1 --align=stereo --low-end=low
#     --shape=v --mirror-style=alternate --id=stacked --into=sdwa5-sepp
#
# What it deals out today:
#
#   1  2× skram                                                                  1.24 m wide
#   2  3× achenbach-18                                                           1.84 m wide
#   3  3× achenbach-18                                                           1.84 m wide
#   4  4× flexy-folded-horn-hybrid                                              2.424 m wide
#   5  4× flexy-folded-horn-hybrid                                              2.424 m wide
#   6  4× flexy-folded-horn-hybrid                                              2.424 m wide
#   7  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122   2.5112 m wide
#
# Subs reach 4.403 m against a 2.0 m interface. The stack is 5.363 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 4.403 m against the 3.000 m ceiling asked for, so they stand 1403 mm too high — 4.403 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 3× achenbach-18 row is 1.840 m on a 1.240 m row, so it overhangs 300 mm each side
#   * the 4× flexy-folded-horn-hybrid row is 2.424 m on a 1.840 m row, so it overhangs 292 mm each side
#   * the 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1×
#     tecnare-m2122 row is 2.511 m on a 2.424 m row, so it overhangs 44 mm each side
#
id: stacked-1-pooled--------v-------upright-alternate-stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - skram
        - flexy-folded-horn-hybrid
        - achenbach-18
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near

