#   3  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° at 314 mm gaps     1.84 m wide
#   4  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° at 314 mm gaps     1.84 m wide
#   5  1× tecnare-m2122 + 1× eighteensound-2way-15                            0.9856 m wide
#
# Subs reach 2.373 m against a 2.0 m interface. The stack is 3.333 m of cabinet.
#   * skram: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#
# main-2 — 2, 14 cabinets in 5 rows:
#
#   1  3× achenbach-18                                                           1.84 m wide
#   2  1× skram rolled 270° + 1× skram rolled 90°                            1.848 m wide
