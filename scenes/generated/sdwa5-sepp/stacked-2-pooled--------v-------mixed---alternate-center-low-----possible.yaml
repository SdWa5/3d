id: stacked-2-pooled--------v-------mixed---alternate-center-low-----possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 11 cabinets in 5 rows
  - id: main-1
    at: [-1.7165, 0.0]
