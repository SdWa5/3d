# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=skram --from=flexy-folded-horn-hybrid
#     --from=achenbach-18 --from=tecnare-m2122 --from=eighteensound-2way-15 --stacks=1 --align=center --low-end=low
#     --shape=v --mirror-style=centred --id=stacked --into=sdwa5-sepp
#
# What it deals out today:
#
#   1  2× achenbach-18 + 1× skram rolled 270° + 1× skram + 3× achenbach-18    4.644 m wide
#   2  3× flexy-folded-horn-hybrid rolled 270° + 1× achenbach-18 + 3× flexy-folded-horn-hybrid rolled 90°    5.298 m wide
#   3  3× flexy-folded-horn-hybrid rolled 270° + 3× flexy-folded-horn-hybrid rolled 90° at 144 mm gaps    5.298 m wide
#   4  1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15   2.5112 m wide
#
# Subs reach 2.105 m against a 2.0 m interface. The stack is 3.065 m of cabinet.
#   * the 3× flexy-folded-horn-hybrid rolled 270° + 1× achenbach-18 + 3× flexy-folded-horn-hybrid rolled 90° row
#     is 5.298 m on a 4.644 m row, so it overhangs 327 mm each side
#
id: stacked-1-pooled--------v-------mixed---centred---center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - achenbach-18
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near

