# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=skram --from=flexy-folded-horn-hybrid
#     --from=achenbach-18 --from=tecnare-m2122 --from=eighteensound-2way-15 --stacks=3 --align=stereo --low-end=low
#     --shape=v --mirror-style=alternate --id=stacked --into=sdwa5-sepp
#
# 3 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 9 cabinets in 5 rows:
#
#   1  2× achenbach-18                                                           1.22 m wide
#   2  2× skram                                                                  1.24 m wide
#   3  2× flexy-folded-horn-hybrid rolled 180° at 58 mm gaps                    1.24 m wide
#   4  2× flexy-folded-horn-hybrid at 58 mm gaps                                 1.24 m wide
#   5  1× tecnare-m2122                                                           0.5 m wide
#
# Subs reach 3.04 m against a 2.0 m interface. The stack is 4.0 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.040 m against the 3.000 m ceiling asked for, so they stand 40 mm too high — 3.040 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 2× skram row is 1.240 m on a 1.220 m row, so it overhangs 10 mm each side
#
# main-3 — 3, 8 cabinets in 4 rows:
#
#   1  2× achenbach-18                                                           1.22 m wide
#   2  2× flexy-folded-horn-hybrid rolled 180° at 38 mm gaps                    1.22 m wide
#   3  2× flexy-folded-horn-hybrid at 38 mm gaps                                 1.22 m wide
#   4  1× tecnare-m2122 + 1× eighteensound-2way-15                            0.9856 m wide
#
# Subs reach 2.126 m against a 2.0 m interface. The stack is 3.086 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
# main-1 — 1, 8 cabinets in 4 rows:
#
#   1  2× achenbach-18                                                           1.22 m wide
#   2  2× flexy-folded-horn-hybrid rolled 180° at 38 mm gaps                    1.22 m wide
#   3  2× flexy-folded-horn-hybrid at 38 mm gaps                                 1.22 m wide
#   4  1× eighteensound-2way-15 + 1× tecnare-m2122                            0.9856 m wide
#
# Subs reach 2.126 m against a 2.0 m interface. The stack is 3.086 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
id: stacked-3-pooled--------v-------upright-alternate-stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 9 cabinets in 5 rows
  - id: main-2
    at: [-2.022, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - skram
        - device: flexy-folded-horn-hybrid
          count: 4
        - device: achenbach-18
          count: 2
        - device: tecnare-m2122
          count: 1

  # 3, 8 cabinets in 4 rows
  - id: main-3
    at: [-0.292, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - device: flexy-folded-horn-hybrid
          count: 4
        - device: achenbach-18
          count: 2
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # 1, 8 cabinets in 4 rows
  - id: main-1
    at: [1.428, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: flexy-folded-horn-hybrid
          count: 4
        - device: achenbach-18
          count: 2
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near

