# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --from=gmss-wall-bass --from=gmss-mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=gmss-turbo-top --stacks=1 --align=center --shape=pyramid
#     --mirror-style=alternate --id=stacked-all--------1
#
# What it deals out today:
#
#   1  3× achenbach-18 + 3× gmss-iq-sub + 6× flexy-folded-horn-hybrid + 1× gmss-nuke + 1× skram + 2× gmss-wall-bass + 1× skram + 1× gmss-nuke + 6× flexy-folded-horn-hybrid + 3× gmss-iq-sub + 3× achenbach-18   18.172 m wide
#   2  2× gmss-turbo-top + 1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15 + 1× gmss-turbo-top   3.9212 m wide
#
# Subs reach 1.4 m against a 2.0 m interface. The stack is 2.36 m of cabinet.
#   * gmss-mid-bass: LEFT OUT, it cannot be carried in this stack — the 2× gmss-turbo-top + 1×
#     eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15 + 1× gmss-turbo-top row is 3.921 m on a 2.420 m
#     row, so it steps out 751 mm each side against the 45 mm a 0.450 m cabinet may sit proud — `shape: pyramid` asks for
#     a wall that does not widen as it rises
#   * the subs reach 1.400 m against the 2.000 m interface asked for, so the tops sit 600 mm lower than ideal —
#     1.400 m is the most they reach while every tier is still carried
#
id: stacked-all--------1-pyramid-upright-alternate-center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - gmss-wall-bass
        - skram
        - flexy-folded-horn-hybrid
        - gmss-nuke
        - achenbach-18
        - gmss-iq-sub
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near
        - device: gmss-turbo-top
          aim: near

