id: stacked-all--------1-tops-shared---pyramid-upright-alternate-stereo-possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # sdwa5, 17 cabinets in 4 rows
  - id: main-sdwa5
    at: [-3.732, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - skram
        - flexy-folded-horn-hybrid
        - device: tecnare-m2122
          count: 2
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # sepp, 7 cabinets in 4 rows
  - id: main-sepp
    at: [-1.1045, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - achenbach-18
        - device: gmss-turbo-top
          count: 1

  # gmss, 15 cabinets in 3 rows
  - id: main-gmss
    at: [2.3255, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - gmss-iq-sub
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: gmss-turbo-top
          count: 2
          aim: near

