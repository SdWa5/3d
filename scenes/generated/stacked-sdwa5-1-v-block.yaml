# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=3.7 --orientation=upright --from=skram --from=flexy-folded-horn-hybrid
#     --from=tecnare-m2122 --stacks=1 --align=block --shape=v --mirror-style=alternate --id=stacked-sdwa5-1
#
# What it deals out today:
#
#   1  1× flexy-folded-horn-hybrid + 2× skram + 1× flexy-folded-horn-hybrid    2.462 m wide
#   2  5× flexy-folded-horn-hybrid                                              3.035 m wide
#   3  5× flexy-folded-horn-hybrid                                              3.035 m wide
#   4  3× tecnare-m2122                                                          1.54 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.4 m of cabinet.
# `align: block` spreads the top tier onto the edges of the row carrying it.
#   * the 5× flexy-folded-horn-hybrid row is 3.035 m on a 2.462 m row, so it overhangs 286 mm each side
#
id: stacked-sdwa5-1-v-block
name: "Solved rig — one stack, tiers justified"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: block
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - skram
        - flexy-folded-horn-hybrid
        - tecnare-m2122

