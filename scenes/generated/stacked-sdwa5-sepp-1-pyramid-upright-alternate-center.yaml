# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --from=skram --from=flexy-folded-horn-hybrid --from=achenbach-18
#     --from=tecnare-m2122 --from=eighteensound-2way-15 --stacks=1 --align=center --shape=pyramid --mirror-style=alternate
#     --id=stacked-sdwa5-sepp-1
#
# What it deals out today:
#
#   1  8× flexy-folded-horn-hybrid                                              4.868 m wide
#   2  2× achenbach-18 + 4× flexy-folded-horn-hybrid + 2× achenbach-18        4.904 m wide
#   3  1× achenbach-18 + 2× skram + 1× achenbach-18                            2.48 m wide
#   4  1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15   2.5112 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.4 m of cabinet.
#   * the 2× achenbach-18 + 4× flexy-folded-horn-hybrid + 2× achenbach-18 row is 4.904 m on a 4.868 m row, so it
#     overhangs 18 mm each side
#   * the 1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15 row is 2.511 m on a 2.480 m row,
#     so it overhangs 16 mm each side
#
id: stacked-sdwa5-sepp-1-pyramid-upright-alternate-center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - skram
        - flexy-folded-horn-hybrid
        - achenbach-18
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near

