# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --from=gmss-wall-bass --from=gmss-mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=gmss-iq-sub --from=tecnare-m2122 --from=gmss-turbo-top
#     --stacks=1 --align=stereo --shape=pyramid --mirror-style=centred --id=stacked-gmss-sdwa5-1
#
# What it deals out today:
#
#   1  5× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid + 5× flexy-folded-horn-hybrid rolled 90°    8.421 m wide
#   2  3× gmss-iq-sub rolled 270° + 1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass + 1× flexy-folded-horn-hybrid rolled 90° + 3× gmss-iq-sub rolled 90°    7.003 m wide
#   3  1× gmss-nuke rolled 270° + 1× skram rolled 270° + 1× skram + 1× gmss-nuke rolled 90° + 1× gmss-mid-bass    4.344 m wide
#   4  1× tecnare-m2122 + 1× gmss-turbo-top + 1× tecnare-m2122 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× tecnare-m2122     2.95 m wide
#
# Subs reach 3.077 m against a 2.0 m interface. The stack is 4.037 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.077 m against the 3.000 m ceiling asked for, so they stand 77 mm too high — 3.077 m is the
#     nearest the 2.500 m target that every tier is still carried at
#
id: stacked-gmss-sdwa5-1-pyramid-mixed---centred---stereo
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - tecnare-m2122
        - device: gmss-turbo-top
          aim: near

