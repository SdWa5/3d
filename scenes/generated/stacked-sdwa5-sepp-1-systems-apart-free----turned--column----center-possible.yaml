# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --per-owner --from=skram --from=flexy-folded-horn-hybrid
#     --from=achenbach-18 --from=tecnare-m2122 --from=eighteensound-2way-15 --stacks=1 --align=center --shape=free
#     --mirror-style=column --id=stacked-sdwa5-sepp-1-systems-apart
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-sdwa5 — sdwa5, 17 cabinets in 5 rows:
#
#   1  1× skram rolled 270° + 1× skram rolled 90° + 1× flexy-folded-horn-hybrid rolled 90°    2.631 m wide
#   2  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   3  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   4  1× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    2.329 m wide
#   5  3× tecnare-m2122                                                          1.54 m wide
#
# Subs reach 2.383 m against a 2.0 m interface. The stack is 3.343 m of cabinet.
#   * the 2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90° row is 3.112 m on a
#     2.631 m row, so it overhangs 240 mm each side
#
# main-sepp — sepp, 8 cabinets in 4 rows:
#
#   1  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   2  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   3  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   4  2× eighteensound-2way-15                                                0.9512 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 2.636 m of cabinet.
#   * the subs reach 1.800 m against the 2.000 m interface asked for, so the tops sit 200 mm lower than ideal —
#     1.800 m is the most they reach while every tier is still carried
#
id: stacked-sdwa5-sepp-1-systems-apart-free----turned--column----center-possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # sdwa5, 17 cabinets in 5 rows
  - id: main-sdwa5
    at: [-1.162, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - tecnare-m2122

  # sepp, 8 cabinets in 4 rows
  - id: main-sepp
    at: [1.504, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      from:
        - device: achenbach-18
          roll_mirror: 90.0
        - eighteensound-2way-15

