#     8.603 m row, so it overhangs 149 mm each side
#
id: stacked-all--------1-pooled--------free----turned--alternate-center-possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near
        - device: gmss-turbo-top
          aim: near

