# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --from=gmss-wall-bass --from=gmss-mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=gmss-turbo-top --stacks=1 --align=center --shape=free --mirror-style=alternate
#     --id=stacked-all--------1-pooled-------
#
# What it deals out today:
#
#   1  2× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 270° + 1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass rolled 90° + 1× skram rolled 90° + 3× flexy-folded-horn-hybrid rolled 90°    8.603 m wide
#   2  1× gmss-nuke rolled 270° + 3× flexy-folded-horn-hybrid rolled 270° + 2× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90° + 4× flexy-folded-horn-hybrid rolled 90° + 1× gmss-nuke rolled 90°    8.901 m wide
#   3  3× gmss-iq-sub rolled 270° + 1× achenbach-18 rolled 270° + 2× achenbach-18 rolled 90° + 3× gmss-iq-sub rolled 90°     5.98 m wide
#   4  2× gmss-turbo-top + 1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15 + 1× gmss-turbo-top   3.9212 m wide
#
# Subs reach 1.86 m against a 2.0 m interface. The stack is 2.82 m of cabinet.
#   * gmss-mid-bass: LEFT OUT, it cannot be carried in this stack — a gmss-turbo-top in the 2× gmss-turbo-top + 1×
#     eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15 + 1× gmss-turbo-top row has nothing under it at
#     all, so it would fall to the floor — inside the row below it
#   * the subs reach 1.860 m against the 2.000 m interface asked for, so the tops sit 140 mm lower than ideal —
#     1.860 m is the most they reach while every tier is still carried
#   * the 1× gmss-nuke rolled 270° + 3× flexy-folded-horn-hybrid rolled 270° + 2× achenbach-18 rolled 270° + 1×
