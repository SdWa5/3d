# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --from=gmss-wall-bass --from=gmss-mid-bass --from=gmss-nuke
#     --from=gmss-iq-sub --from=gmss-turbo-top --stacks=2 --align=stereo --shape=v --mirror-style=alternate
#     --id=stacked-gmss-------2-pooled-------
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 8 cabinets in 5 rows:
#
#   1  1× gmss-mid-bass rolled 90°                                               0.5 m wide
#   2  1× gmss-nuke rolled 270°                                                 0.77 m wide
#   3  1× gmss-wall-bass rolled 90°                                              1.4 m wide
#   4  2× gmss-iq-sub rolled 270° + 1× gmss-iq-sub rolled 90°                 2.05 m wide
#   5  1× gmss-turbo-top + 1× gmss-turbo-top                                    0.92 m wide
#
# Subs reach 2.98 m against a 2.0 m interface. The stack is 3.69 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * the 1× gmss-nuke rolled 270° row is 0.770 m on a 0.500 m row, so it overhangs 135 mm each side
#   * the 1× gmss-wall-bass rolled 90° row is 1.400 m on a 0.770 m row, so it overhangs 315 mm each side
#   * the 2× gmss-iq-sub rolled 270° + 1× gmss-iq-sub rolled 90° row is 2.050 m on a 1.400 m row, so it overhangs
#     325 mm each side
#
# main-1 — 1, 6 cabinets in 4 rows:
#
#   1  1× gmss-nuke rolled 270°                                                 0.77 m wide
#   2  1× gmss-wall-bass rolled 90°                                              1.4 m wide
#   3  2× gmss-iq-sub rolled 270° + 1× gmss-iq-sub rolled 90°                 2.05 m wide
#   4  1× gmss-turbo-top                                                         0.45 m wide
#
# Subs reach 1.78 m against a 2.0 m interface. The stack is 2.49 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 1.780 m against the 2.000 m interface asked for, so the tops sit 220 mm lower than ideal —
#     1.780 m is the most they reach while every tier is still carried
#   * the 1× gmss-wall-bass rolled 90° row is 1.400 m on a 0.770 m row, so it overhangs 315 mm each side
#   * the 2× gmss-iq-sub rolled 270° + 1× gmss-iq-sub rolled 90° row is 2.050 m on a 1.400 m row, so it overhangs
#     325 mm each side
#
id: stacked-gmss-------2-pooled--------v-------turned--alternate-stereo-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 8 cabinets in 5 rows
  - id: main-2
    at: [-1.577, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - device: gmss-wall-bass
          count: 1
          roll_mirror: 90.0
        - device: gmss-mid-bass
          roll_mirror: 90.0
        - device: gmss-nuke
          count: 1
          roll_mirror: 90.0
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: gmss-turbo-top
          count: 2

  # 1, 6 cabinets in 4 rows
  - id: main-1
    at: [0.973, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: gmss-wall-bass
          count: 1
          roll_mirror: 90.0
        - device: gmss-nuke
          count: 1
          roll_mirror: 90.0
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: gmss-turbo-top
          count: 1

