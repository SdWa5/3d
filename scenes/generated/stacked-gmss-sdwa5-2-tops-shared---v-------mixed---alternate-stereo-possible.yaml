id: stacked-gmss-sdwa5-2-tops-shared---v-------mixed---alternate-stereo-possible
name: "Solved rig — 4 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # sdwa5-1, 8 cabinets in 5 rows
  - id: main-sdwa5-1
    at: [-3.875, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      mirror: true             # the mirror image of stack sdwa5-1
      from:
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: gmss-turbo-top
          count: 1

  # gmss-2, 8 cabinets in 5 rows
  - id: main-gmss-2
    at: [-1.577, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - device: gmss-wall-bass
          count: 1
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: gmss-nuke
          count: 1
          roll_mirror: 90.0
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: gmss-turbo-top
          count: 1
          aim: near

  # gmss-1, 7 cabinets in 4 rows
  - id: main-gmss-1
    at: [0.973, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: gmss-wall-bass
          count: 1
          roll_mirror: 90.0
        - device: gmss-nuke
          count: 1
          roll_mirror: 90.0
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2

  # sdwa5-2, 8 cabinets in 5 rows
  - id: main-sdwa5-2
    at: [3.271, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: gmss-turbo-top
          count: 1

