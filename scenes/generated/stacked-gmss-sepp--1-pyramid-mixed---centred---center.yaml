# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --from=gmss-wall-bass --from=gmss-mid-bass --from=gmss-nuke
#     --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top --stacks=1 --align=center
#     --shape=pyramid --mirror-style=centred --id=stacked-gmss-sepp--1
#
# What it deals out today:
#
#   1  3× gmss-iq-sub rolled 270° + 3× gmss-iq-sub rolled 90°                 4.12 m wide
#   2  6× achenbach-18                                                            3.7 m wide
#   3  1× gmss-nuke rolled 270° + 1× gmss-nuke + 1× gmss-mid-bass              2.6 m wide
#   4  2× gmss-turbo-top + 2× eighteensound-2way-15 + 1× gmss-turbo-top      2.3612 m wide
#
# Subs reach 1.9 m against a 2.0 m interface. The stack is 2.736 m of cabinet.
#   * gmss-wall-bass: LEFT OUT, it cannot be carried in this stack — the 2× gmss-turbo-top + 2×
#     eighteensound-2way-15 + 1× gmss-turbo-top row is 2.361 m on a 1.990 m row, so it steps out 186 mm each side against
#     the 45 mm a 0.450 m cabinet may sit proud — `shape: pyramid` asks for a wall that does not widen as it rises
#   * the subs reach 1.900 m against the 2.000 m interface asked for, so the tops sit 100 mm lower than ideal —
#     1.900 m is the most they reach while every tier is still carried
#
id: stacked-gmss-sepp--1-pyramid-mixed---centred---center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      from:
        - gmss-mid-bass
        - device: gmss-nuke
          roll_mirror: 90.0
        - achenbach-18
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: gmss-turbo-top
          aim: near

