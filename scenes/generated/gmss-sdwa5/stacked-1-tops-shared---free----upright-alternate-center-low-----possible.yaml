# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=tops-shared --from=wall-bass --from=mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top
#     --stacks=1 --align=center --low-end=low --shape=free --mirror-style=alternate --id=stacked --into=gmss-sdwa5
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 13 cabinets in 6 rows:
#
#   1  2× wall-bass                                                              1.34 m wide
#   2  1× mid-bass                                                                1.2 m wide
#   3  2× nuke                                                                    1.2 m wide
#   4  3× iq-sub                                                                 1.63 m wide
#   5  3× iq-sub                                                                 1.63 m wide
#   6  1× turbo-top + 1× tecnare-m2122                                          0.97 m wide
#
# Subs reach 4.01 m against a 2.0 m interface. The stack is 4.97 m of cabinet.
#   * the subs reach 4.010 m against the 3.000 m ceiling asked for, so they stand 1010 mm too high — 4.010 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 3× iq-sub row is 1.630 m on a 1.200 m row, so it overhangs 215 mm each side
#
# main-ours — ours, 18 cabinets in 4 rows:
#
#   1  2× flexy-folded-horn-hybrid + 2× skram + 2× flexy-folded-horn-hybrid    3.684 m wide
#   2  4× flexy-folded-horn-hybrid rolled 180°                                 2.424 m wide
#   3  4× flexy-folded-horn-hybrid                                              2.424 m wide
#   4  1× turbo-top + 2× tecnare-m2122 + 1× turbo-top                          1.96 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.4 m of cabinet.
#
id: stacked-1-tops-shared---free----upright-alternate-center-low-----possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 13 cabinets in 6 rows
  - id: main-gmss
    at: [-2.394, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      from:
        - wall-bass
        - mid-bass
        - nuke
        - iq-sub
        - device: tecnare-m2122
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # ours, 18 cabinets in 4 rows
  - id: main-ours
    at: [0.763, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
