id: stacked-2-tops-shared---pyramid-upright-alternate-stereo-low-----possible
name: "Solved rig — 4 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-1, 6 cabinets in 4 rows
  - id: main-gmss-1
    at: [-4.935, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: wall-bass
          count: 1
        - device: nuke
          count: 1
        - device: iq-sub
          count: 3
        - device: turbo-top
          count: 1

  # ours-2, 8 cabinets in 4 rows
  - id: main-ours-2
    at: [-2.7135, 0.0]
