id: stacked-3-tops-shared---v-------upright-alternate-block--low-----possible
name: "Solved rig — 6 stacks side by side, tiers justified"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-3, 2 cabinets in 1 row
  - id: main-gmss-3
    at: [-6.141, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: block
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - device: iq-sub
          count: 2

  # ours-2, 8 cabinets in 2 rows
  - id: main-ours-2
    at: [-3.259, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: block
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - skram
        - device: flexy-folded-horn-hybrid
          count: 4
        - device: turbo-top
          count: 2

  # ours-1, 4 cabinets in 2 rows
  - id: main-ours-1
    at: [-0.316, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: block
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      mirror: true             # the mirror image of stack ours-1
      from:
        - device: flexy-folded-horn-hybrid
          count: 4

  # gmss-2, 10 cabinets in 3 rows
  - id: main-gmss-2
    at: [1.79, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: block
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - wall-bass
        - nuke
        - device: iq-sub
          count: 2
        - tecnare-m2122
        - device: turbo-top
          count: 1
          aim: near

  # ours-3, 4 cabinets in 2 rows
  - id: main-ours-3
    at: [3.896, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: block
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - device: flexy-folded-horn-hybrid
          count: 4

  # gmss-1, 2 cabinets in 1 row
  - id: main-gmss-1
    at: [5.537, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
