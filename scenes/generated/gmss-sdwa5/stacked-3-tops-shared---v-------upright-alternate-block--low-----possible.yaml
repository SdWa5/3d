#
# Subs reach 0.67 m against a 2.0 m interface. The stack is 0.67 m of cabinet.
# `align: block` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 0.670 m against the 2.000 m interface asked for and **nothing stands on them** — this stack is
#     a sub wing, so the interface decides nothing about it
#
