# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=tops-shared --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top --stacks=1
#     --align=stereo --low-end=low --shape=pyramid --mirror-style=alternate --id=stacked --into=gmss-sdwa5
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 13 cabinets in 6 rows:
#
#   1  1× wall-bass rolled 270° + 1× nuke rolled 270° + 1× nuke rolled 90° + 1× wall-bass rolled 90°      4.4 m wide
#   2  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   3  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   4  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   5  1× mid-bass                                                                1.2 m wide
#   6  1× tecnare-m2122 + 1× turbo-top                                          0.97 m wide
#
# Subs reach 2.75 m against a 2.0 m interface. The stack is 3.71 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
# main-ours — ours, 18 cabinets in 4 rows:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    3.895 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 2× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    3.895 m wide
#   3  1× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 270° + 1× skram rolled 90° + 1× flexy-folded-horn-hybrid rolled 90°    3.414 m wide
#   4  1× tecnare-m2122 + 1× turbo-top + 1× turbo-top + 1× tecnare-m2122      1.96 m wide
#
# Subs reach 1.792 m against a 2.0 m interface. The stack is 2.752 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.792 m against the 2.000 m interface asked for, so the tops sit 208 mm lower than ideal —
#     1.792 m is the most they reach while every tier is still carried
#
id: stacked-1-tops-shared---pyramid-mixed---alternate-stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 13 cabinets in 6 rows
  - id: main-gmss
    at: [-2.4995, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # ours, 18 cabinets in 4 rows
  - id: main-ours
    at: [2.148, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2
        - device: turbo-top
          count: 2
          aim: near
