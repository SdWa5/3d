#     --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top --stacks=1
#     --align=center --low-end=central --shape=pyramid --mirror-style=column --id=stacked --into=gmss-sdwa5
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 15 cabinets in 4 rows:
#
#   1  1× iq-sub rolled 270° + 1× wall-bass rolled 270° + 1× wall-bass rolled 90° + 1× iq-sub rolled 90°      4.2 m wide
#   2  2× iq-sub rolled 270° + 2× iq-sub rolled 90°                           2.74 m wide
#   3  1× nuke rolled 270° + 1× mid-bass rolled 90° + 1× nuke rolled 90°     2.08 m wide
#   4  1× turbo-top + 2× tecnare-m2122 + 1× turbo-top                          1.96 m wide
#
# Subs reach 2.39 m against a 2.0 m interface. The stack is 3.35 m of cabinet.
#
# main-ours — ours, 16 cabinets in 6 rows:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 90° + 1× flexy-folded-horn-hybrid rolled 90°     2.48 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 90° + 1× flexy-folded-horn-hybrid rolled 90°     2.48 m wide
#   3  1× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    2.329 m wide
#   4  1× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    2.329 m wide
#   5  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    1.546 m wide
#   6  1× turbo-top + 1× tecnare-m2122                                          0.97 m wide
