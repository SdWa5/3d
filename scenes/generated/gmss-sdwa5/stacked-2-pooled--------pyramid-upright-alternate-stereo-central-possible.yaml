# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top --stacks=2
#     --align=stereo --low-end=central --shape=pyramid --mirror-style=alternate --id=stacked --into=gmss-sdwa5
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 14 cabinets in 3 rows:
#
#   1  6× flexy-folded-horn-hybrid                                              3.646 m wide
#   2  2× iq-sub + 1× nuke + 1× skram + 1× wall-bass + 1× iq-sub             3.55 m wide
#   3  1× turbo-top + 1× tecnare-m2122                                          0.97 m wide
#
# Subs reach 2.163 m against a 2.0 m interface. The stack is 3.123 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#
# main-2 — 2, 17 cabinets in 2 rows:
#
#   1  1× iq-sub + 3× flexy-folded-horn-hybrid + 1× wall-bass + 1× skram + 1× nuke + 3× flexy-folded-horn-hybrid + 2× iq-sub + 1× mid-bass    8.436 m wide
#   2  1× tecnare-m2122 + 1× turbo-top + 1× turbo-top + 1× tecnare-m2122      1.96 m wide
#
# Subs reach 1.4 m against a 2.0 m interface. The stack is 2.36 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 1.400 m against the 2.000 m interface asked for, so the tops sit 600 mm lower than ideal —
#     1.400 m is the most they reach while every tier is still carried
#
id: stacked-2-pooled--------pyramid-upright-alternate-stereo-central-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 14 cabinets in 3 rows
  - id: main-1
    at: [-4.77, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: wall-bass
          count: 1
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: nuke
          count: 1
        - device: iq-sub
          count: 3
        - device: tecnare-m2122
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # 2, 17 cabinets in 2 rows
  - id: main-2
    at: [1.771, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: pyramid
      from:
        - device: wall-bass
          count: 1
        - mid-bass
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: nuke
          count: 1
        - device: iq-sub
          count: 3
        - device: tecnare-m2122
          count: 2
        - device: turbo-top
          count: 2
          aim: near
