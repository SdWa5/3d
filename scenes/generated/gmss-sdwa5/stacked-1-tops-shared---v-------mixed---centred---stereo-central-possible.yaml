#   2  1× wall-bass rolled 270° + 1× wall-bass + 1× iq-sub rolled 90°        2.77 m wide
#   3  2× iq-sub rolled 270° + 1× iq-sub + 2× iq-sub rolled 90°              3.29 m wide
#   4  1× turbo-top + 1× turbo-top                                              0.92 m wide
