id: stacked-1-tops-shared---free----upright-alternate-stereo-central-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 13 cabinets in 5 rows
  - id: main-gmss
    at: [-2.079, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      low_end: central
      from:
        - wall-bass
        - mid-bass
        - nuke
        - iq-sub
        - device: tecnare-m2122
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # ours, 18 cabinets in 4 rows
  - id: main-ours
    at: [1.068, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      low_end: central
      from:
        - skram
        - flexy-folded-horn-hybrid
        - device: tecnare-m2122
          count: 2
        - device: turbo-top
          count: 2
          aim: near

