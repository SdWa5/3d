# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=tops-shared --from=wall-bass --from=mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top
#     --stacks=1 --align=stereo --low-end=central --shape=free --mirror-style=alternate --id=stacked --into=gmss-sdwa5
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 13 cabinets in 5 rows:
#
#   1  2× wall-bass                                                              1.34 m wide
#   2  1× nuke + 1× mid-bass                                                    1.81 m wide
#   3  1× iq-sub + 1× nuke + 2× iq-sub                                         2.24 m wide
#   4  3× iq-sub                                                                 1.63 m wide
#   5  1× tecnare-m2122 + 1× turbo-top                                          0.97 m wide
#
# Subs reach 3.61 m against a 2.0 m interface. The stack is 4.57 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.610 m against the 3.000 m ceiling asked for, so they stand 610 mm too high — 3.610 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× nuke + 1× mid-bass row is 1.810 m on a 1.340 m row, so it overhangs 235 mm each side
#   * the 1× iq-sub + 1× nuke + 2× iq-sub row is 2.240 m on a 1.810 m row, so it overhangs 215 mm each side
#
# main-ours — ours, 18 cabinets in 4 rows:
#
#   1  2× flexy-folded-horn-hybrid + 1× skram + 2× flexy-folded-horn-hybrid    3.054 m wide
#   2  2× flexy-folded-horn-hybrid + 1× skram + 2× flexy-folded-horn-hybrid    3.054 m wide
#   3  4× flexy-folded-horn-hybrid                                              2.424 m wide
#   4  1× tecnare-m2122 + 1× turbo-top + 1× turbo-top + 1× tecnare-m2122      1.96 m wide
#
# Subs reach 2.591 m against a 2.0 m interface. The stack is 3.551 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
