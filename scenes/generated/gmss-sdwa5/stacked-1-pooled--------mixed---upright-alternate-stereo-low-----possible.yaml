# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top --stacks=1
#     --align=stereo --low-end=low --shape=mixed --mirror-style=alternate --id=stacked --into=gmss-sdwa5
#
# What it deals out today:
#
#   1  12× flexy-folded-horn-hybrid                                             7.312 m wide
#   2  3× iq-sub + 1× nuke + 1× skram + 2× wall-bass + 1× skram + 1× nuke + 3× iq-sub     7.12 m wide
#   3  1× tecnare-m2122 + 1× turbo-top + 1× tecnare-m2122 + 1× turbo-top + 1× turbo-top + 1× tecnare-m2122     2.95 m wide
#
# Subs reach 2.163 m against a 2.0 m interface. The stack is 3.123 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * mid-bass: LEFT OUT, it cannot be carried in this stack — the 1× tecnare-m2122 + 1× turbo-top + 1×
#     tecnare-m2122 + 1× turbo-top + 1× turbo-top + 1× tecnare-m2122 row is 2.950 m on a 2.420 m row, so it steps out 265
#     mm each side against the 50 mm a 0.500 m cabinet may sit proud — `shape: mixed` asks for a wall that does not widen
#     as it rises
#
id: stacked-1-pooled--------mixed---upright-alternate-stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: mixed
      from:
        - wall-bass
        - skram
        - flexy-folded-horn-hybrid
        - nuke
        - iq-sub
        - tecnare-m2122
        - device: turbo-top
          aim: near
