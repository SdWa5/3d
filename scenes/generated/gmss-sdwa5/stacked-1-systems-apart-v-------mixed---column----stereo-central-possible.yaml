#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=systems-apart --from=wall-bass --from=mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top
#     --stacks=1 --align=stereo --low-end=central --shape=v --mirror-style=column --id=stacked --into=gmss-sdwa5
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 14 cabinets in 6 rows:
#
#   1  1× mid-bass                                                                1.2 m wide
#   2  1× nuke rolled 270° + 1× nuke rolled 90°                               1.56 m wide
#   3  1× wall-bass rolled 270° + 1× wall-bass rolled 90°                     2.82 m wide
#   4  1× iq-sub rolled 270° + 2× iq-sub rolled 90° at 405 mm gaps            2.82 m wide
#   5  1× iq-sub rolled 270° + 2× iq-sub rolled 90° at 405 mm gaps            2.82 m wide
#   6  1× turbo-top + 1× turbo-top + 1× turbo-top                              1.39 m wide
#
# Subs reach 2.81 m against a 2.0 m interface. The stack is 3.52 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× nuke rolled 270° + 1× nuke rolled 90° row is 1.560 m on a 1.200 m row, so it overhangs 180 mm each
#     side
#   * the 1× wall-bass rolled 270° + 1× wall-bass rolled 90° row is 2.820 m on a 1.560 m row, so it overhangs 630
#     mm each side
#
# main-ours — ours, 17 cabinets in 5 rows:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 90° + 1× flexy-folded-horn-hybrid rolled 90°     2.48 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 90° + 1× flexy-folded-horn-hybrid rolled 90°     2.48 m wide
#   3  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   4  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   5  1× tecnare-m2122 + 1× tecnare-m2122 + 1× tecnare-m2122                  1.54 m wide
#
