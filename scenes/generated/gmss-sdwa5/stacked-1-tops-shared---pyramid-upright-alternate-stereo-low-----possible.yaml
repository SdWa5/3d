# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=tops-shared --from=wall-bass --from=mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top
#     --stacks=1 --align=stereo --low-end=low --shape=pyramid --mirror-style=alternate --id=stacked --into=gmss-sdwa5
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-ours — ours, 17 cabinets in 4 rows:
#
#   1  5× flexy-folded-horn-hybrid rolled 180°                                 3.035 m wide
#   2  5× flexy-folded-horn-hybrid                                              3.035 m wide
#   3  1× flexy-folded-horn-hybrid + 2× skram + 1× flexy-folded-horn-hybrid    2.462 m wide
#   4  1× tecnare-m2122 + 1× turbo-top + 1× tecnare-m2122                      1.49 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.4 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
# main-gmss — gmss, 14 cabinets in 3 rows:
#
#   1  3× iq-sub + 2× wall-bass + 3× iq-sub                                    4.64 m wide
#   2  2× nuke + 1× mid-bass                                                    2.42 m wide
#   3  1× turbo-top + 1× tecnare-m2122 + 1× turbo-top                          1.44 m wide
#
# Subs reach 2.17 m against a 2.0 m interface. The stack is 3.13 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
id: stacked-1-tops-shared---pyramid-upright-alternate-stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 17 cabinets in 4 rows
  - id: main-ours
    at: [-2.872, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - skram
        - flexy-folded-horn-hybrid
        - device: tecnare-m2122
          count: 2
        - device: turbo-top
          count: 1
          aim: near

  # gmss, 14 cabinets in 3 rows
  - id: main-gmss
    at: [1.4655, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - wall-bass
        - mid-bass
        - nuke
        - iq-sub
        - device: tecnare-m2122
          count: 1
        - device: turbo-top
          count: 2
          aim: near
