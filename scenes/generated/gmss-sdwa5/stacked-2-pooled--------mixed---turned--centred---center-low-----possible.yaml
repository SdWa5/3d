id: stacked-2-pooled--------mixed---turned--centred---center-low-----possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 11 cabinets in 4 rows
  - id: main-1
    at: [-1.962, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: mixed
      mirror: true             # the mirror image of stack 1
      from:
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # 2, 20 cabinets in 8 rows
  - id: main-2
    at: [1.0265, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: mixed
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - device: mid-bass
          roll_mirror: 90.0
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
