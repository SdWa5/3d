# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=tops-shared --from=wall-bass --from=mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top
#     --stacks=1 --align=center --low-end=low --shape=tower --mirror-style=alternate --id=stacked --into=gmss-sdwa5
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 15 cabinets in 2 rows:
#
#   1  3× iq-sub + 1× nuke + 2× wall-bass + 1× nuke + 3× iq-sub              5.86 m wide
#   2  1× turbo-top + 3× tecnare-m2122 + 1× turbo-top                          2.48 m wide
#
# Subs reach 1.4 m against a 2.0 m interface. The stack is 2.36 m of cabinet.
#   * mid-bass: LEFT OUT, it cannot be carried in this stack — the 2× nuke + 1× mid-bass row is 2.420 m on a 4.640
#     m row; shape: tower asks for a flush base within 59 mm per side
#   * the subs reach 1.400 m against the 2.000 m interface asked for, so the tops sit 600 mm lower than ideal —
#     1.400 m is the most they reach while every tier is still carried
#
# main-ours — ours, 15 cabinets in 4 rows:
#
#   1  5× flexy-folded-horn-hybrid rolled 180°                                 3.035 m wide
#   2  5× flexy-folded-horn-hybrid                                              3.035 m wide
#   3  1× flexy-folded-horn-hybrid + 2× skram + 1× flexy-folded-horn-hybrid at 211 mm gaps    3.035 m wide
#   4  1× turbo-top                                                              0.45 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.15 m of cabinet.
#
id: stacked-1-tops-shared---tower---upright-alternate-center-low-----possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 15 cabinets in 2 rows
  - id: main-gmss
    at: [-2.0695, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
