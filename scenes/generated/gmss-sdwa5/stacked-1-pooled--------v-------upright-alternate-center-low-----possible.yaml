# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top --stacks=1
#     --align=center --low-end=low --shape=v --mirror-style=alternate --id=stacked --into=gmss-sdwa5
#
# What it deals out today:
#
#   1  1× nuke + 1× skram + 2× wall-bass + 1× skram + 1× nuke + 1× mid-bass     5.04 m wide
#   2  3× iq-sub + 3× flexy-folded-horn-hybrid + 3× iq-sub                    5.113 m wide
#   3  9× flexy-folded-horn-hybrid                                              5.479 m wide
#   4  2× turbo-top + 3× tecnare-m2122 + 1× turbo-top                          2.95 m wide
#
# Subs reach 2.926 m against a 2.0 m interface. The stack is 3.886 m of cabinet.
#   * the 3× iq-sub + 3× flexy-folded-horn-hybrid + 3× iq-sub row is 5.113 m on a 5.040 m row, so it overhangs 37
#     mm each side
#   * the 9× flexy-folded-horn-hybrid row is 5.479 m on a 5.113 m row, so it overhangs 183 mm each side
#
id: stacked-1-pooled--------v-------upright-alternate-center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - wall-bass
        - mid-bass
        - skram
        - flexy-folded-horn-hybrid
        - nuke
        - iq-sub
        - tecnare-m2122
        - device: turbo-top
          aim: near

