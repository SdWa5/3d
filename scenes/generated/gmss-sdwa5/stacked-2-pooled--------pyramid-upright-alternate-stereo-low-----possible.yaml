id: stacked-2-pooled--------pyramid-upright-alternate-stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 20 cabinets in 3 rows
  - id: main-2
    at: [-1.4585, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - wall-bass
        - mid-bass
        - skram
        - device: flexy-folded-horn-hybrid
          count: 6
        - nuke
        - device: iq-sub
          count: 3
        - device: tecnare-m2122
          count: 2
        - device: turbo-top
          count: 2
          aim: near

  # 1, 11 cabinets in 4 rows
  - id: main-1
    at: [3.276, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: iq-sub
          count: 3
        - device: tecnare-m2122
          count: 1
        - device: turbo-top
          count: 1
          aim: near

