#     m is the most they reach while every tier is still carried
#   * the 1× nuke rolled 270° + 1× iq-sub rolled 270° + 1× iq-sub rolled 90° + 1× nuke rolled 90° row is 2.940
#     m on a 2.780 m row, so it overhangs 80 mm each side
