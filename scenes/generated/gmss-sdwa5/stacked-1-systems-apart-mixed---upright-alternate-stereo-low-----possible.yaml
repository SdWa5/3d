# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=systems-apart --from=wall-bass --from=mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top
#     --stacks=1 --align=stereo --low-end=low --shape=mixed --mirror-style=alternate --id=stacked --into=gmss-sdwa5
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-ours — ours, 17 cabinets in 4 rows:
#
#   1  2× flexy-folded-horn-hybrid + 2× skram + 2× flexy-folded-horn-hybrid    3.684 m wide
#   2  4× flexy-folded-horn-hybrid at 440 mm gaps                               3.684 m wide
#   3  4× flexy-folded-horn-hybrid                                              2.424 m wide
#   4  1× tecnare-m2122 + 1× tecnare-m2122 + 1× tecnare-m2122                  1.54 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.4 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
# main-gmss — gmss, 14 cabinets in 3 rows:
#
#   1  3× iq-sub + 2× wall-bass + 3× iq-sub                                    4.64 m wide
#   2  1× nuke + 1× mid-bass + 1× nuke                                         2.42 m wide
#   3  1× turbo-top + 1× turbo-top + 1× turbo-top                              1.39 m wide
#
# Subs reach 2.17 m against a 2.0 m interface. The stack is 2.88 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
id: stacked-1-systems-apart-mixed---upright-alternate-stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 17 cabinets in 4 rows
  - id: main-ours
    at: [-2.872, -0.018]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: mixed
      from:
        - skram
        - flexy-folded-horn-hybrid
        - tecnare-m2122

  # gmss, 14 cabinets in 3 rows
  - id: main-gmss
    at: [1.79, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
