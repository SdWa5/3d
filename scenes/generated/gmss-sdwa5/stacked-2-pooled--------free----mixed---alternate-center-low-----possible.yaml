id: stacked-2-pooled--------free----mixed---alternate-center-low-----possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 11 cabinets in 5 rows
  - id: main-1
    at: [-2.115, -0.018]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror: true             # the mirror image of stack 1
      from:
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # 2, 20 cabinets in 6 rows
  - id: main-2
    at: [0.973, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2
        - device: turbo-top
          count: 2
          aim: near
