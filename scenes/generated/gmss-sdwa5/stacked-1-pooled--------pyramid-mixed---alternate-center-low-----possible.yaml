# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top --stacks=1
#     --align=center --low-end=low --shape=pyramid --mirror-style=alternate --id=stacked --into=gmss-sdwa5
#
# What it deals out today:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°     7.81 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 3× iq-sub rolled 270° + 3× iq-sub rolled 90° + 1× flexy-folded-horn-hybrid rolled 90°    5.686 m wide
#   3  1× wall-bass rolled 270° + 1× skram rolled 270° + 1× skram rolled 90° + 1× wall-bass rolled 90°    4.688 m wide
#   4  1× nuke rolled 270° + 1× mid-bass + 1× nuke rolled 90° at 60 mm gaps     2.86 m wide
#   5  2× turbo-top + 3× tecnare-m2122 + 1× turbo-top                          2.95 m wide
#
# Subs reach 2.432 m against a 2.0 m interface. The stack is 3.392 m of cabinet.
#   * the 2× turbo-top + 3× tecnare-m2122 + 1× turbo-top row is 2.950 m on a 2.860 m row, so it overhangs 45 mm
#     each side
#
id: stacked-1-pooled--------pyramid-mixed---alternate-center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - tecnare-m2122
        - device: turbo-top
          aim: near
