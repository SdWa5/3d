id: stacked-2-systems-apart-pyramid-mixed---centred---stereo-low-----possible
name: "Solved rig — 4 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours-2, 10 cabinets in 4 rows
  - id: main-ours-2
    at: [-4.19, -0.018]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2

  # ours-1, 7 cabinets in 4 rows
  - id: main-ours-1
    at: [-1.829, -0.018]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      mirror: true             # the mirror image of stack ours-1
      from:
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1

  # gmss-1, 4 cabinets in 2 rows
  - id: main-gmss-1
    at: [0.399, -0.22]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: turbo-top
          count: 1

  # gmss-2, 10 cabinets in 4 rows
  - id: main-gmss-2
    at: [3.264, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: turbo-top
          count: 2
