# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top --stacks=1
#     --align=center --low-end=low --shape=v --mirror-style=column --id=stacked --into=gmss-sdwa5
#
# What it deals out today:
#
#   1  1× nuke rolled 270° + 1× skram rolled 270° + 1× skram rolled 90° + 1× nuke rolled 90° + 1× mid-bass    4.648 m wide
#   2  1× iq-sub rolled 270° + 1× wall-bass rolled 270° + 1× wall-bass rolled 90° + 2× iq-sub rolled 90°     4.89 m wide
#   3  1× iq-sub rolled 270° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 2× iq-sub rolled 90° at 339 mm gaps    4.892 m wide
#   4  2× flexy-folded-horn-hybrid rolled 270° + 3× flexy-folded-horn-hybrid rolled 90° at 270 mm gaps    4.895 m wide
#   5  2× flexy-folded-horn-hybrid rolled 270° + 3× flexy-folded-horn-hybrid rolled 90° at 270 mm gaps    4.895 m wide
#   6  2× turbo-top + 3× tecnare-m2122 + 1× turbo-top                          2.95 m wide
#
# Subs reach 3.043 m against a 2.0 m interface. The stack is 4.003 m of cabinet.
#   * the subs reach 3.043 m against the 3.000 m ceiling asked for, so they stand 43 mm too high — 3.043 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× iq-sub rolled 270° + 1× wall-bass rolled 270° + 1× wall-bass rolled 90° + 2× iq-sub rolled 90°
#     row is 4.890 m on a 4.648 m row, so it overhangs 121 mm each side
#
id: stacked-1-pooled--------v-------mixed---column----center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: v
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - tecnare-m2122
        - device: turbo-top
          aim: near

