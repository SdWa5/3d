# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=tops-shared --from=wall-bass --from=mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top
#     --stacks=1 --align=stereo --low-end=central --shape=v --mirror-style=alternate --id=stacked --into=gmss-sdwa5
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-ours — ours, 14 cabinets in 2 rows:
#
#   1  3× flexy-folded-horn-hybrid rolled 180° + 1× skram rolled 180° + 3× flexy-folded-horn-hybrid rolled 180°    4.276 m wide
#   2  3× flexy-folded-horn-hybrid + 1× skram + 3× flexy-folded-horn-hybrid    4.276 m wide
#
# Subs reach 1.828 m against a 2.0 m interface. The stack is 1.828 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.828 m against the 2.000 m interface asked for and **nothing stands on them** — this stack is
#     a sub wing, so the interface decides nothing about it
#
# main-gmss — gmss, 17 cabinets in 2 rows:
#
#   1  3× iq-sub + 1× nuke + 1× wall-bass + 1× mid-bass + 1× wall-bass + 1× nuke + 3× iq-sub     7.08 m wide
#   2  1× tecnare-m2122 + 1× turbo-top + 1× tecnare-m2122 + 1× turbo-top + 1× turbo-top + 1× tecnare-m2122     2.95 m wide
#
# Subs reach 1.4 m against a 2.0 m interface. The stack is 2.36 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.400 m against the 2.000 m interface asked for, so the tops sit 600 mm lower than ideal —
#     1.400 m is the most they reach while every tier is still carried
#
id: stacked-1-tops-shared---v-------upright-alternate-stereo-central-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 14 cabinets in 2 rows
  - id: main-ours
    at: [-4.1026, -0.018]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      low_end: central
      shape: v
      from:
        - skram
        - flexy-folded-horn-hybrid

  # gmss, 17 cabinets in 2 rows
  - id: main-gmss
    at: [2.086, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      low_end: central
      shape: v
      from:
        - wall-bass
        - mid-bass
        - nuke
        - iq-sub
        - tecnare-m2122
        - device: turbo-top
          aim: near
