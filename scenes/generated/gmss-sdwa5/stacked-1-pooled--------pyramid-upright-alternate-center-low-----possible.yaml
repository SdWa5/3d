# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=iq-sub --from=tecnare-m2122 --from=turbo-top --stacks=1
#     --align=center --low-end=low --shape=pyramid --mirror-style=alternate --id=stacked --into=gmss-sdwa5
#
# What it deals out today:
#
#   1  7× flexy-folded-horn-hybrid                                              4.257 m wide
#   2  1× iq-sub + 5× flexy-folded-horn-hybrid + 1× iq-sub                    4.135 m wide
#   3  2× iq-sub + 1× wall-bass + 1× skram + 1× wall-bass + 2× iq-sub        4.17 m wide
#   4  1× nuke + 1× skram + 1× nuke + 1× mid-bass                             3.05 m wide
#   5  2× turbo-top + 3× tecnare-m2122 + 1× turbo-top                          2.95 m wide
#
# Subs reach 3.84 m against a 2.0 m interface. The stack is 4.8 m of cabinet.
#   * the subs reach 3.840 m against the 3.000 m ceiling asked for, so they stand 840 mm too high — 3.840 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 2× iq-sub + 1× wall-bass + 1× skram + 1× wall-bass + 2× iq-sub row is 4.170 m on a 4.135 m row, so it
#     overhangs 18 mm each side
#   * row 4 (1× nuke + 1× skram + 1× nuke + 1× mid-bass) is not mirror-symmetric, and the search found no
#     symmetric arrangement of these cabinets that stands
#
id: stacked-1-pooled--------pyramid-upright-alternate-center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - wall-bass
        - mid-bass
        - skram
        - flexy-folded-horn-hybrid
        - nuke
        - iq-sub
        - tecnare-m2122
        - device: turbo-top
          aim: near
