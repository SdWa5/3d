#   3  2× iq-sub rolled 270° + 2× iq-sub rolled 90° at 507 mm gaps           4.201 m wide
#   4  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° at 383 mm gaps    4.201 m wide
#   5  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° at 383 mm gaps    4.201 m wide
#   6  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° at 383 mm gaps    4.201 m wide
#   7  2× turbo-top + 3× tecnare-m2122 + 1× turbo-top                          2.95 m wide
#
# Subs reach 3.573 m against a 2.0 m interface. The stack is 4.533 m of cabinet.
#   * mid-bass: LEFT OUT, it cannot be carried in this stack — the 1× nuke rolled 90° row is a single column, and
#     2 of them are in this stack — a one-wide tier is a pillar rather than a rig, however well each cabinet is carried.
#     Widen the rows and accept a lower interface, or take cabinets out of the stack
#   * the subs reach 3.573 m against the 3.000 m ceiling asked for, so they stand 573 mm too high — 3.573 m is the
#     nearest the 2.500 m target that every tier is still carried at
