id: stacked-2-systems-apart-free----upright-alternate-stereo-central-possible
name: "Solved rig — 4 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-2, 10 cabinets in 4 rows
  - id: main-gmss-2
    at: [-3.384, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      from:
        - wall-bass
        - mid-bass
        - nuke
        - device: iq-sub
          count: 3
        - device: turbo-top
          count: 2

  # ours-1, 7 cabinets in 4 rows
  - id: main-ours-1
    at: [-1.163, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      mirror: true             # the mirror image of stack ours-1
      from:
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: tecnare-m2122
          count: 1

  # gmss-1, 4 cabinets in 2 rows
  - id: main-gmss-1
    at: [0.753, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: iq-sub
          count: 3
        - device: turbo-top
          count: 1

  # ours-2, 10 cabinets in 4 rows
  - id: main-ours-2
    at: [2.984, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      from:
        - skram
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: tecnare-m2122
          count: 2
