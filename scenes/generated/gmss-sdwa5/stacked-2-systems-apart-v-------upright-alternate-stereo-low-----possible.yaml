  - id: main-gmss-2
    at: [-3.384, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - device: wall-bass
          count: 1
        - mid-bass
        - device: nuke
          count: 1
        - device: iq-sub
          count: 3
        - device: turbo-top
          count: 2

