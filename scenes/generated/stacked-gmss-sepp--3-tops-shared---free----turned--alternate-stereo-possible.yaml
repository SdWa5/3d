id: stacked-gmss-sepp--3-tops-shared---free----turned--alternate-stereo-possible
name: "Solved rig — 6 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-2, 11 cabinets in 3 rows
  - id: main-gmss-2
    at: [-4.742, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: gmss-mid-bass
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          count: 2
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: gmss-turbo-top
          count: 2
          aim: near

  # sepp-2, 2 cabinets in 1 row
  - id: main-sepp-2
    at: [-1.962, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: achenbach-18
          count: 2
          roll_mirror: 90.0

  # gmss-1, 3 cabinets in 2 rows
  - id: main-gmss-1
    at: [-0.172, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: gmss-iq-sub
          count: 2
          roll_mirror: 90.0
        - device: gmss-turbo-top
          count: 1

  # gmss-3, 2 cabinets in 1 row
  - id: main-gmss-3
    at: [1.688, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: gmss-iq-sub
          count: 2
          roll_mirror: 90.0

  # sepp-3, 2 cabinets in 1 row
  - id: main-sepp-3
    at: [3.478, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: achenbach-18
          count: 2
          roll_mirror: 90.0

  # sepp-1, 2 cabinets in 1 row
  - id: main-sepp-1
    at: [5.198, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror: true             # the mirror image of stack sepp-1
      from:
        - device: achenbach-18
          count: 2
          roll_mirror: 90.0

