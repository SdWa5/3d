#
# main-2 — 2, 7 cabinets in 4 rows:
#
#   1  1× skram rolled 90°                                                     0.914 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    1.546 m wide
#   3  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    1.546 m wide
#   4  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    1.546 m wide
#
# Subs reach 2.383 m against a 2.0 m interface. The stack is 2.383 m of cabinet.
#   * the 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° row is 1.546 m on a
#     0.914 m row, so it overhangs 316 mm each side
#
# The tops stand in one row across both walls: tecnare-m2122 + tecnare-m2122 + tecnare-m2122, at an equal pitch of
#     1.461 m.
#
id: stacked-2-pooled--------free----turned--alternate-stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 7 cabinets in 4 rows
  - id: main-1
    at: [-1.24, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror: true             # the mirror image of stack 1
      shared_tops: true        # the tops below stand on this wall
      from:
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0

  # 2, 7 cabinets in 4 rows
  - id: main-2
    at: [0.636, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shared_tops: true        # the tops below stand on this wall
      from:
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0

  # The tops, one row standing on both walls at an equal pitch of 1.461 m.
  - id: tops-1
    device: tecnare-m2122
    on: main-1
    at: [-1.763, -0.222]
    aim: far
  - id: tops-2
    device: tecnare-m2122
    on: main-2
    at: [-0.302, -0.222]
    aim: far
  - id: tops-3
    device: tecnare-m2122
    on: main-2
    at: [1.159, -0.222]
    aim: far
