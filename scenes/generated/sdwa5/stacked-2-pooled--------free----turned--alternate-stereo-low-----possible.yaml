#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=pooled --from=skram --from=flexy-folded-horn-hybrid
#     --from=tecnare-m2122 --stacks=2 --align=stereo --low-end=low --shape=free --mirror-style=alternate --id=stacked
#     --into=sdwa5
#
