# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=skram --from=flexy-folded-horn-hybrid
#     --from=tecnare-m2122 --stacks=2 --align=stereo --low-end=central --shape=pyramid --mirror-style=alternate
#     --id=stacked --into=sdwa5
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 8 cabinets in 4 rows:
#
#   1  3× flexy-folded-horn-hybrid rolled 180°                                 1.813 m wide
#   2  3× flexy-folded-horn-hybrid                                              1.813 m wide
#   3  1× skram                                                                  0.61 m wide
#   4  1× tecnare-m2122                                                           0.5 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.4 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#
# main-2 — 2, 9 cabinets in 4 rows:
#
#   1  1× flexy-folded-horn-hybrid + 1× skram + 1× flexy-folded-horn-hybrid    1.832 m wide
#   2  2× flexy-folded-horn-hybrid rolled 180°                                 1.202 m wide
#   3  2× flexy-folded-horn-hybrid                                              1.202 m wide
#   4  1× tecnare-m2122 + 1× tecnare-m2122                                      1.02 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.4 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#
id: stacked-2-pooled--------pyramid-upright-alternate-stereo-central-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 8 cabinets in 4 rows
  - id: main-1
    at: [-1.468, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: tecnare-m2122
          count: 1

  # 2, 9 cabinets in 4 rows
  - id: main-2
    at: [0.8545, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: pyramid
      from:
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: tecnare-m2122
          count: 2
