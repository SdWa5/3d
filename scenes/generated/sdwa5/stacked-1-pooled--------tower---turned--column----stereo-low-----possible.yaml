# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=pooled --from=skram --from=flexy-folded-horn-hybrid
#     --from=tecnare-m2122 --stacks=1 --align=stereo --low-end=low --shape=tower --mirror-style=column --id=stacked
#     --into=sdwa5
#
# What it deals out today:
#
#   1  1× skram rolled 270° + 1× skram rolled 90°                            1.848 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° at 322 mm gaps    1.848 m wide
#   3  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° at 322 mm gaps    1.848 m wide
#   4  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° at 322 mm gaps    1.848 m wide
#   5  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° at 322 mm gaps    1.848 m wide
#   6  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° at 322 mm gaps    1.848 m wide
#   7  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° at 322 mm gaps    1.848 m wide
#   8  1× tecnare-m2122 + 1× tecnare-m2122 + 1× tecnare-m2122                  1.54 m wide
#
# Subs reach 4.156 m against a 2.0 m interface. The stack is 5.116 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 4.156 m against the 3.000 m ceiling asked for, so they stand 1156 mm too high — 4.156 m is the
#     nearest the 2.500 m target that every tier is still carried at
#
id: stacked-1-pooled--------tower---turned--column----stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: tower
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - tecnare-m2122
