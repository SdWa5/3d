# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=pooled --from=skram --from=flexy-folded-horn-hybrid
#     --from=tecnare-m2122 --stacks=1 --align=center --low-end=low --shape=v --mirror-style=centred --id=stacked
#     --into=sdwa5
#
# What it deals out today:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 270° + 1× skram rolled 90° + 1× flexy-folded-horn-hybrid rolled 90°    3.414 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    3.723 m wide
#   3  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    3.723 m wide
#   4  3× tecnare-m2122                                                          1.54 m wide
#
# Subs reach 2.136 m against a 2.0 m interface. The stack is 3.096 m of cabinet.
#   * the 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1×
#     flexy-folded-horn-hybrid + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° row is
#     3.723 m on a 3.414 m row, so it overhangs 154 mm each side
#
id: stacked-1-pooled--------v-------turned--centred---center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - tecnare-m2122

