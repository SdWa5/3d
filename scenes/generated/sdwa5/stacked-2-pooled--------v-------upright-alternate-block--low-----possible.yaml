# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=skram --from=flexy-folded-horn-hybrid
#     --from=tecnare-m2122 --stacks=2 --align=block --low-end=low --shape=v --mirror-style=alternate --id=stacked
#     --into=sdwa5
#
# 2 stacks side by side, with 0.33 m of air between them.
#
# main-1 — 1, 7 cabinets in 3 rows:
#
#   1  1× flexy-folded-horn-hybrid + 1× skram + 1× flexy-folded-horn-hybrid    1.832 m wide
#   2  2× flexy-folded-horn-hybrid rolled 180° at 650 mm gaps                  1.832 m wide
#   3  2× flexy-folded-horn-hybrid at 650 mm gaps                               1.832 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 2.44 m of cabinet.
#
# main-2 — 2, 7 cabinets in 3 rows:
#
#   1  1× flexy-folded-horn-hybrid + 1× skram + 1× flexy-folded-horn-hybrid    1.832 m wide
#   2  2× flexy-folded-horn-hybrid rolled 180° at 650 mm gaps                  1.832 m wide
#   3  2× flexy-folded-horn-hybrid at 650 mm gaps                               1.832 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 2.44 m of cabinet.
#
# The tops stand in one row across both walls: tecnare-m2122 + tecnare-m2122 + tecnare-m2122, at an equal pitch of
#     1.747 m.
#
id: stacked-2-pooled--------v-------upright-alternate-block--low-----possible
name: "Solved rig — 2 stacks side by side, tiers justified"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 7 cabinets in 3 rows
  - id: main-1
    at: [-1.383, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      mirror: true             # the mirror image of stack 1
      shared_tops: true        # the tops below stand on this wall
      from:
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6

  # 2, 7 cabinets in 3 rows
  - id: main-2
    at: [0.779, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      shared_tops: true        # the tops below stand on this wall
      from:
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6

  # The tops, one row standing on both walls at an equal pitch of 1.747 m.
  - id: tops-1
    device: tecnare-m2122
    on: main-1
    at: [-2.049, -0.222]
    aim: far
  - id: tops-2
    device: tecnare-m2122
    on: main-1
    at: [-0.302, -0.222]
    aim: far
  - id: tops-3
    device: tecnare-m2122
    on: main-2
    at: [1.445, -0.222]
    aim: far
