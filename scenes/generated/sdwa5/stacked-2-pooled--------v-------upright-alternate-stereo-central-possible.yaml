# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=skram --from=flexy-folded-horn-hybrid
#     --from=tecnare-m2122 --stacks=2 --align=stereo --low-end=central --shape=v --mirror-style=alternate --id=stacked
#     --into=sdwa5
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 10 cabinets in 4 rows:
#
#   1  1× flexy-folded-horn-hybrid + 1× skram + 1× flexy-folded-horn-hybrid    1.832 m wide
#   2  1× flexy-folded-horn-hybrid + 1× skram + 1× flexy-folded-horn-hybrid    1.832 m wide
#   3  2× flexy-folded-horn-hybrid at 650 mm gaps                               1.832 m wide
#   4  1× tecnare-m2122 + 1× tecnare-m2122                                      1.02 m wide
#
# Subs reach 2.591 m against a 2.0 m interface. The stack is 3.551 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * skram: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#
# main-1 — 1, 7 cabinets in 4 rows:
#
#   1  2× flexy-folded-horn-hybrid                                              1.202 m wide
#   2  2× flexy-folded-horn-hybrid                                              1.202 m wide
#   3  2× flexy-folded-horn-hybrid                                              1.202 m wide
#   4  1× tecnare-m2122                                                           0.5 m wide
#
# Subs reach 2.289 m against a 2.0 m interface. The stack is 3.249 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * skram: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#
id: stacked-2-pooled--------v-------upright-alternate-stereo-central-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 10 cabinets in 4 rows
  - id: main-2
    at: [-1.153, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: v
      from:
        - skram
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: tecnare-m2122
          count: 2

  # 1, 7 cabinets in 4 rows
  - id: main-1
    at: [0.864, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: tecnare-m2122
          count: 1

