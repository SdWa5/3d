id: stacked-gmss-sepp--2-free----upright-alternate-stereo
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 14 cabinets in 6 rows
  - id: main-2
    at: [-1.162, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - device: achenbach-18
          count: 3
        - device: gmss-iq-sub
          count: 3
        - device: eighteensound-2way-15
          count: 1
        - device: gmss-turbo-top
          count: 2
          aim: near

  # 1, 8 cabinets in 4 rows
  - id: main-1
    at: [0.868, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror: true             # the mirror image of stack 1
      from:
        - device: achenbach-18
          count: 3
        - device: gmss-iq-sub
          count: 3
        - device: eighteensound-2way-15
          count: 1
        - device: gmss-turbo-top
          count: 1
          aim: near

