#   2  2× gmss-iq-sub rolled 270° + 1× gmss-iq-sub rolled 90°                 2.05 m wide
#   3  1× gmss-nuke rolled 270° + 1× gmss-nuke rolled 90°                     1.56 m wide
#   4  1× gmss-mid-bass                                                           1.2 m wide
#   5  2× gmss-turbo-top                                                         0.92 m wide
#
# Subs reach 2.28 m against a 2.0 m interface. The stack is 2.99 m of cabinet.
#   * gmss-wall-bass: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * gmss-nuke: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
