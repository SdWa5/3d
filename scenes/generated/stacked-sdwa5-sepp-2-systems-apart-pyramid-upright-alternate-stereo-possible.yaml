#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --per-owner --from=skram --from=flexy-folded-horn-hybrid
#     --from=achenbach-18 --from=tecnare-m2122 --from=eighteensound-2way-15 --stacks=2 --align=stereo --shape=pyramid
#     --mirror-style=alternate --id=stacked-sdwa5-sepp-2-systems-apart
#
# 4 stacks side by side, with 0.5 m of air between them.
