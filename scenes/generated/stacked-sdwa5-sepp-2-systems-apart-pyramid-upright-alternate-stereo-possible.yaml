#   2  3× flexy-folded-horn-hybrid                                              1.813 m wide
#   3  1× skram                                                                  0.61 m wide
#   4  1× tecnare-m2122                                                           0.5 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.4 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#
# main-sepp-1 — sepp-1, 4 cabinets in 2 rows:
#
#   1  3× achenbach-18                                                           1.84 m wide
#   2  1× eighteensound-2way-15                                                0.4656 m wide
#
# Subs reach 0.6 m against a 2.0 m interface. The stack is 1.436 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 0.600 m against the 2.000 m interface asked for, so the tops sit 1400 mm lower than ideal —
#     0.600 m is the most they reach while every tier is still carried
#
# main-sepp-2 — sepp-2, 4 cabinets in 2 rows:
