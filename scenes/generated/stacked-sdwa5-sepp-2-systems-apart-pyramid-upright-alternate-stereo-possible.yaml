#   2  2× flexy-folded-horn-hybrid                                              1.202 m wide
#   3  2× flexy-folded-horn-hybrid                                              1.202 m wide
#   4  1× tecnare-m2122 + 1× tecnare-m2122                                      1.02 m wide
#
