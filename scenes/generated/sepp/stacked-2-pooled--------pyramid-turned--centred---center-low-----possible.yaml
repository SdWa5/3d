# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=pooled --from=achenbach-18 --from=eighteensound-2way-15
#     --stacks=2 --align=center --low-end=low --shape=pyramid --mirror-style=centred --id=stacked --into=sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 3 cabinets in 1 row:
#
#   1  1× achenbach-18 rolled 270° + 1× achenbach-18 + 1× achenbach-18 rolled 90°     1.84 m wide
#
# Subs reach 0.6 m against a 2.0 m interface. The stack is 0.6 m of cabinet.
#   * the subs reach 0.600 m against the 2.000 m interface asked for, so the tops sit 1400 mm lower than ideal —
#     0.600 m is the most they reach while every tier is still carried
#
# main-2 — 2, 3 cabinets in 1 row:
#
#   1  1× achenbach-18 rolled 270° + 1× achenbach-18 + 1× achenbach-18 rolled 90°     1.84 m wide
#
# Subs reach 0.6 m against a 2.0 m interface. The stack is 0.6 m of cabinet.
#   * the subs reach 0.600 m against the 2.000 m interface asked for, so the tops sit 1400 mm lower than ideal —
#     0.600 m is the most they reach while every tier is still carried
#
# The tops stand in one row across both walls: eighteensound-2way-15 + eighteensound-2way-15, at an equal pitch of
#     3.7144 m.
#
id: stacked-2-pooled--------pyramid-turned--centred---center-low-----possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 3 cabinets in 1 row
  - id: main-1
    at: [-1.472, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      shared_tops: true        # the tops below stand on this wall
      from:
        - device: achenbach-18
          count: 3
          roll_mirror: 90.0

  # 2, 3 cabinets in 1 row
  - id: main-2
    at: [0.868, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      shared_tops: true        # the tops below stand on this wall
      from:
        - device: achenbach-18
          count: 3
          roll_mirror: 90.0

  # The tops, one row standing on both walls at an equal pitch of 3.7144 m.
  - id: tops-1
    device: eighteensound-2way-15
    on: main-1
    at: [-2.1592, -0.1366]
    aim: far
  - id: tops-2
    device: eighteensound-2way-15
    on: main-2
    at: [1.5552, -0.1366]
    aim: far
