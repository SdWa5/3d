id: stacked-gmss-sdwa5-1-free----upright-alternate-center-possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - skram
        - flexy-folded-horn-hybrid
        - gmss-nuke
        - gmss-iq-sub
        - tecnare-m2122
