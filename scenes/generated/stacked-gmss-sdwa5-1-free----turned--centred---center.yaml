# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --from=gmss-wall-bass --from=gmss-mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=gmss-iq-sub --from=tecnare-m2122 --from=gmss-turbo-top
#     --stacks=1 --align=center --shape=free --mirror-style=centred --id=stacked-gmss-sdwa5-1
#
# What it deals out today:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 270° + 1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass + 1× skram rolled 90° + 2× flexy-folded-horn-hybrid rolled 90°    6.297 m wide
#   2  4× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid + 4× flexy-folded-horn-hybrid rolled 90°    6.855 m wide
#   3  3× gmss-iq-sub rolled 270° + 1× gmss-nuke rolled 270° + 1× gmss-nuke rolled 90° + 3× gmss-iq-sub rolled 90°      5.7 m wide
#   4  2× gmss-turbo-top + 3× tecnare-m2122 + 1× gmss-turbo-top                2.95 m wide
#
# Subs reach 2.753 m against a 2.0 m interface. The stack is 3.713 m of cabinet.
#   * gmss-mid-bass: LEFT OUT, it cannot be carried in this stack — a gmss-turbo-top in the 2× gmss-turbo-top + 3×
#     tecnare-m2122 + 1× gmss-turbo-top row would land on only 31% of its own width — it is touching what carries it
#     rather than sitting on it. Line the segments up with what carries them
#   * the 4× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid + 4× flexy-folded-horn-hybrid
#     rolled 90° row is 6.855 m on a 6.297 m row, so it overhangs 279 mm each side
#
id: stacked-gmss-sdwa5-1-free----turned--centred---center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - tecnare-m2122
        - device: gmss-turbo-top
          aim: near

