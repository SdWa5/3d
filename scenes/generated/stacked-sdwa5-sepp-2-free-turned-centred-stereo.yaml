# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=3.7 --orientation=turned --from=skram --from=flexy-folded-horn-hybrid
#     --from=achenbach-18 --from=tecnare-m2122 --from=eighteensound-2way-15 --stacks=2 --align=stereo --shape=free
#     --mirror-style=centred --id=stacked-sdwa5-sepp-2
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 12 cabinets in 4 rows:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× skram + 1× flexy-folded-horn-hybrid rolled 90°    2.176 m wide
#   2  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   3  1× achenbach-18 rolled 270° + 1× achenbach-18 + 1× achenbach-18 rolled 90°     1.84 m wide
#   4  1× eighteensound-2way-15 + 1× tecnare-m2122                            0.9856 m wide
#
# Subs reach 2.105 m against a 2.0 m interface. The stack is 3.065 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the 2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90° row is 3.112 m on a
#     2.176 m row, so it overhangs 468 mm each side
#
# main-2 — 2, 13 cabinets in 4 rows:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× skram + 1× flexy-folded-horn-hybrid rolled 90°    2.176 m wide
#   2  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   3  1× achenbach-18 rolled 270° + 1× achenbach-18 + 1× achenbach-18 rolled 90°     1.84 m wide
#   4  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122        1.5056 m wide
#
# Subs reach 2.105 m against a 2.0 m interface. The stack is 3.065 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the 2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90° row is 3.112 m on a
#     2.176 m row, so it overhangs 468 mm each side
#
id: stacked-sdwa5-sepp-2-free-turned-centred-stereo
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 12 cabinets in 4 rows
  - id: main-1
    at: [-2.108, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      mirror: true             # the mirror image of stack 1
      from:
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # 2, 13 cabinets in 4 rows
  - id: main-2
    at: [1.504, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      from:
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2
        - device: eighteensound-2way-15
          count: 1
          aim: near

