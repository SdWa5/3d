# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=4.4 --orientation=mixed --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top
#     --stacks=1 --align=stereo --shape=v --mirror-style=centred --id=stacked-gmss-sepp-1
#
# What it deals out today:
#
#   1  1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass + 1× gmss-mid-bass      3.3 m wide
#   2  6× achenbach-18                                                            3.7 m wide
#   3  3× gmss-iq-sub rolled 270° + 3× gmss-iq-sub rolled 90°                 4.12 m wide
#   4  1× eighteensound-2way-15 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× eighteensound-2way-15   2.3612 m wide
#
# Subs reach 2.53 m against a 2.0 m interface. The stack is 3.366 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-nuke: LEFT OUT, it cannot be carried in this stack — the 2× gmss-iq-sub rolled 270° + 1× gmss-iq-sub +
#     2× gmss-iq-sub rolled 90° row is 3.290 m on a 3.770 m row, so the wall narrows as it rises — `shape: v` asks for
#     the opposite and this is not one of its arrangements
#   * the 6× achenbach-18 row is 3.700 m on a 3.300 m row, so it overhangs 200 mm each side
#   * the 3× gmss-iq-sub rolled 270° + 3× gmss-iq-sub rolled 90° row is 4.120 m on a 3.700 m row, so it overhangs
#     210 mm each side
#
id: stacked-gmss-sepp-1-v-mixed-centred-stereo
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 4.4
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - gmss-mid-bass
        - achenbach-18
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: gmss-turbo-top
          aim: near

