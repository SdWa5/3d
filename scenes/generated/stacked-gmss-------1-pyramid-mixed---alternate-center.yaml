# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --from=gmss-wall-bass --from=gmss-mid-bass --from=gmss-nuke
#     --from=gmss-iq-sub --from=gmss-turbo-top --stacks=1 --align=center --shape=pyramid --mirror-style=alternate
#     --id=stacked-gmss-------1
#
# What it deals out today:
#
#   1  1× gmss-iq-sub rolled 270° + 1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass rolled 90° + 1× gmss-iq-sub rolled 90°      4.2 m wide
#   2  2× gmss-iq-sub rolled 270° + 2× gmss-iq-sub rolled 90°                 2.74 m wide
#   3  1× gmss-nuke rolled 270° + 1× gmss-mid-bass + 1× gmss-nuke rolled 90°     2.78 m wide
#   4  3× gmss-turbo-top                                                         1.39 m wide
#
# Subs reach 1.78 m against a 2.0 m interface. The stack is 2.49 m of cabinet.
#   * the subs reach 1.780 m against the 2.000 m interface asked for, so the tops sit 220 mm lower than ideal —
#     1.780 m is the most they reach while every tier is still carried
#   * the 1× gmss-nuke rolled 270° + 1× gmss-mid-bass + 1× gmss-nuke rolled 90° row is 2.780 m on a 2.740 m row,
#     so it overhangs 20 mm each side
#
id: stacked-gmss-------1-pyramid-mixed---alternate-center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - gmss-turbo-top

