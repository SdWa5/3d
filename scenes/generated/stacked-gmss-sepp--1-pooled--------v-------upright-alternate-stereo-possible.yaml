#     --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top --stacks=1 --align=stereo
#     --shape=v --mirror-style=alternate --id=stacked-gmss-sepp--1-pooled-------
#
# What it deals out today:
#
#   1  2× gmss-nuke                                                               1.2 m wide
#   2  1× gmss-mid-bass                                                           1.2 m wide
#   3  2× gmss-wall-bass                                                         1.34 m wide
#   4  3× gmss-iq-sub                                                            1.63 m wide
#   5  3× gmss-iq-sub                                                            1.63 m wide
#   6  3× achenbach-18                                                           1.84 m wide
#   7  3× achenbach-18                                                           1.84 m wide
#   8  1× eighteensound-2way-15 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× eighteensound-2way-15   2.3612 m wide
#
# Subs reach 5.21 m against a 2.0 m interface. The stack is 6.046 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 5.210 m against the 3.000 m ceiling asked for, so they stand 2210 mm too high — 5.210 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 2× gmss-wall-bass row is 1.340 m on a 1.200 m row, so it overhangs 70 mm each side
#   * the 3× gmss-iq-sub row is 1.630 m on a 1.340 m row, so it overhangs 145 mm each side
#   * the 3× achenbach-18 row is 1.840 m on a 1.630 m row, so it overhangs 105 mm each side
#   * the 1× eighteensound-2way-15 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× gmss-turbo-top + 1×
#     eighteensound-2way-15 row is 2.361 m on a 1.840 m row, so it overhangs 261 mm each side
#
id: stacked-gmss-sepp--1-pooled--------v-------upright-alternate-stereo-possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - achenbach-18
        - gmss-iq-sub
        - eighteensound-2way-15
        - device: gmss-turbo-top
          aim: near

