# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --from=skram --from=flexy-folded-horn-hybrid --from=achenbach-18
#     --from=tecnare-m2122 --from=eighteensound-2way-15 --stacks=1 --align=stereo --shape=free --mirror-style=alternate
#     --id=stacked-sdwa5-sepp-1-pooled-------
#
# What it deals out today:
#
#   1  3× flexy-folded-horn-hybrid + 2× skram + 3× flexy-folded-horn-hybrid    4.906 m wide
#   2  6× flexy-folded-horn-hybrid                                              3.646 m wide
#   3  6× achenbach-18                                                            3.7 m wide
#   4  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122   2.5112 m wide
#
# Subs reach 2.277 m against a 2.0 m interface. The stack is 3.237 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 6× achenbach-18 row is 3.700 m on a 3.646 m row, so it overhangs 27 mm each side
#
id: stacked-sdwa5-sepp-1-pooled--------free----upright-alternate-stereo-possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      from:
        - skram
        - flexy-folded-horn-hybrid
        - achenbach-18
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near

