id: stacked-all--------3-tops-shared---v-------turned--centred---stereo-possible
name: "Solved rig — 9 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-2, 9 cabinets in 5 rows
  - id: main-gmss-2
    at: [-9.528, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: gmss-mid-bass
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          count: 2
          roll_mirror: 90.0
        - device: gmss-turbo-top
          count: 2

  # sdwa5-3, 4 cabinets in 2 rows
  - id: main-sdwa5-3
    at: [-6.845, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      from:
        - device: flexy-folded-horn-hybrid
          count: 4
          roll_mirror: 90.0

  # sepp-1, 2 cabinets in 1 row
