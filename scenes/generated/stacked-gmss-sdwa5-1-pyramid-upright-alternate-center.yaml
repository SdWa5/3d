# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --from=gmss-wall-bass --from=gmss-mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=gmss-iq-sub --from=tecnare-m2122 --from=gmss-turbo-top
#     --stacks=1 --align=center --shape=pyramid --mirror-style=alternate --id=stacked-gmss-sdwa5-1
#
# What it deals out today:
#
#   1  9× flexy-folded-horn-hybrid                                              5.479 m wide
#   2  3× gmss-iq-sub + 3× flexy-folded-horn-hybrid + 3× gmss-iq-sub          5.113 m wide
#   3  1× gmss-nuke + 1× skram + 2× gmss-wall-bass + 1× skram + 1× gmss-nuke     3.82 m wide
#   4  2× gmss-turbo-top + 3× tecnare-m2122 + 1× gmss-turbo-top                2.95 m wide
#
# Subs reach 2.926 m against a 2.0 m interface. The stack is 3.886 m of cabinet.
#   * gmss-mid-bass: LEFT OUT, it cannot be carried in this stack — the 2× gmss-turbo-top + 3× tecnare-m2122 + 1×
#     gmss-turbo-top row is 2.950 m on a 2.420 m row, so it steps out 265 mm each side against the 45 mm a 0.450 m cabinet
#     may sit proud — `shape: pyramid` asks for a wall that does not widen as it rises
#
id: stacked-gmss-sdwa5-1-pyramid-upright-alternate-center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - gmss-wall-bass
        - skram
        - flexy-folded-horn-hybrid
        - gmss-nuke
        - gmss-iq-sub
        - tecnare-m2122
        - device: gmss-turbo-top
          aim: near

