#   2  1× gmss-iq-sub rolled 270° + 1× flexy-folded-horn-hybrid + 1× gmss-iq-sub rolled 90°    1.971 m wide
#   3  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
