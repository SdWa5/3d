# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=tops-shared --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=gmss-iq-sub --from=tecnare-m2122
#     --from=gmss-turbo-top --stacks=1 --align=stereo --shape=free --mirror-style=column
#     --id=stacked-gmss-sdwa5-1-tops-shared--
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-sdwa5 — sdwa5, 17 cabinets in 5 rows:
#
#   1  1× skram rolled 270° + 1× skram rolled 90° + 1× flexy-folded-horn-hybrid rolled 90°    2.631 m wide
#   2  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   3  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   4  1× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    2.329 m wide
#   5  1× tecnare-m2122 + 1× gmss-turbo-top + 1× tecnare-m2122                 1.49 m wide
#
# Subs reach 2.383 m against a 2.0 m interface. The stack is 3.343 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90° row is 3.112 m on a
#     2.631 m row, so it overhangs 240 mm each side
#
# main-gmss — gmss, 14 cabinets in 5 rows:
#
#   1  1× gmss-wall-bass rolled 270° + 1× gmss-mid-bass + 1× gmss-wall-bass rolled 90°     4.04 m wide
#   2  1× gmss-nuke rolled 270° + 1× gmss-nuke rolled 90°                     1.56 m wide
#   3  1× gmss-iq-sub rolled 270° + 2× gmss-iq-sub rolled 90°                 2.05 m wide
#   4  1× gmss-iq-sub rolled 270° + 2× gmss-iq-sub rolled 90°                 2.05 m wide
#   5  1× gmss-turbo-top + 1× tecnare-m2122 + 1× gmss-turbo-top                1.44 m wide
#
# Subs reach 2.31 m against a 2.0 m interface. The stack is 3.27 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× gmss-iq-sub rolled 270° + 2× gmss-iq-sub rolled 90° row is 2.050 m on a 1.560 m row, so it overhangs
#     245 mm each side
#
id: stacked-gmss-sdwa5-1-tops-shared---free----mixed---column----stereo-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # sdwa5, 17 cabinets in 5 rows
  - id: main-sdwa5
    at: [-2.572, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2
        - device: gmss-turbo-top
          count: 1
          aim: near

  # gmss, 14 cabinets in 5 rows
  - id: main-gmss
    at: [1.504, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: gmss-turbo-top
          count: 2
          aim: near

