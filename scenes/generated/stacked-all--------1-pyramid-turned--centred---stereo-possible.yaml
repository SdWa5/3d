# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --from=gmss-wall-bass --from=gmss-mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=gmss-turbo-top --stacks=1 --align=stereo --shape=pyramid --mirror-style=centred
#     --id=stacked-all--------1
#
# What it deals out today:
#
#   1  5× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid + 5× flexy-folded-horn-hybrid rolled 90°    8.421 m wide
#   2  3× gmss-iq-sub rolled 270° + 3× achenbach-18 rolled 270° + 2× achenbach-18 rolled 90° + 1× flexy-folded-horn-hybrid rolled 90° + 3× gmss-iq-sub rolled 90°    8.003 m wide
#   3  1× gmss-nuke rolled 270° + 1× skram rolled 270° + 1× gmss-wall-bass rolled 270° + 1× gmss-mid-bass rolled 270° + 1× gmss-wall-bass rolled 90° + 1× skram rolled 90° + 1× achenbach-18 rolled 90° + 1× gmss-nuke rolled 90°    7.408 m wide
#   4  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× gmss-turbo-top + 1× tecnare-m2122 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× eighteensound-2way-15 + 1× tecnare-m2122   3.9212 m wide
#
# Subs reach 2.563 m against a 2.0 m interface. The stack is 3.523 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
id: stacked-all--------1-pyramid-turned--centred---stereo-possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: pyramid
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: gmss-mid-bass
          roll_mirror: 90.0
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near
        - device: gmss-turbo-top
          aim: near

