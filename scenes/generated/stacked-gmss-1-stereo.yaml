# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=3.7 --orientation=upright --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=gmss-nuke --from=gmss-iq-sub --from=gmss-turbo-top --stacks=1 --align=stereo --shape=pyramid
#     --mirror-style=alternate --id=stacked-gmss-1
#
# What it deals out today:
#
#   1  6× gmss-iq-sub                                                            3.28 m wide
#   2  1× gmss-nuke + 2× gmss-wall-bass + 1× gmss-nuke                         2.56 m wide
#   3  1× gmss-turbo-top + 1× gmss-turbo-top + 1× gmss-turbo-top               1.39 m wide
#
# Subs reach 2.07 m against a 2.0 m interface. The stack is 2.78 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-mid-bass: LEFT OUT, it cannot be carried in this stack — the 1× gmss-iq-sub + 2× gmss-wall-bass + 1×
#     gmss-iq-sub row is 2.440 m on a 2.180 m row, so it steps out 130 mm each side against the 53 mm a 0.530 m cabinet may
#     sit proud — `shape: pyramid` asks for a wall that does not widen as it rises
#
id: stacked-gmss-1-stereo
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - gmss-wall-bass
        - gmss-nuke
        - gmss-iq-sub
        - gmss-turbo-top

