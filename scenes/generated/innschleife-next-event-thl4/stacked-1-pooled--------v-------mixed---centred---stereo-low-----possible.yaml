# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --quantity=sub-95x57:0 --quantity=tms4:0
#     --from=wsx-18 --from=sbh-18 --from=kicker-15 --from=thl4 --stacks=1 --align=stereo --low-end=low --shape=v
#     --mirror-style=centred --id=stacked --into=innschleife-next-event-thl4
#
# What it deals out today:
#
#   1  2× kicker-15                                                              1.22 m wide
#   2  2× kicker-15                                                              1.22 m wide
#   3  1× wsx-18 rolled 270° + 1× wsx-18 rolled 90°                           2.22 m wide
#   4  1× wsx-18 rolled 270° + 1× wsx-18 rolled 90°                           2.22 m wide
#   5  1× sbh-18 rolled 270° + 1× sbh-18 rolled 90°                           2.42 m wide
#   6  1× sbh-18 rolled 270° + 1× sbh-18 rolled 90°                           2.42 m wide
#   7  1× thl4 + 1× thl4                                                        1.02 m wide
#
# Subs reach 3.44 m against a 2.0 m interface. The stack is 4.58 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.440 m against the 3.000 m ceiling asked for, so they stand 440 mm too high — 3.440 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× wsx-18 rolled 270° + 1× wsx-18 rolled 90° row is 2.220 m on a 1.220 m row, so it overhangs 500 mm
#     each side
#   * the 1× sbh-18 rolled 270° + 1× sbh-18 rolled 90° row is 2.420 m on a 2.220 m row, so it overhangs 100 mm
#     each side
#
id: stacked-1-pooled--------v-------mixed---centred---stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - kicker-15
        - thl4

