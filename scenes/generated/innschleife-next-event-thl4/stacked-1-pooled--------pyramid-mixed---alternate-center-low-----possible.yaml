# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --quantity=sub-95x57:0 --quantity=tms4:0
#     --from=wsx-18 --from=sbh-18 --from=kicker-15 --from=thl4 --stacks=1 --align=center --low-end=low --shape=pyramid
#     --mirror-style=alternate --id=stacked --into=innschleife-next-event-thl4
#
# What it deals out today:
#
#   1  1× sbh-18 rolled 270° + 2× sbh-18 rolled 90°                           3.64 m wide
#   2  2× wsx-18 rolled 270° + 1× sbh-18 rolled 90°                           3.44 m wide
#   3  1× wsx-18 rolled 270° + 2× kicker-15 + 1× wsx-18 rolled 90°           3.46 m wide
#   4  2× kicker-15                                                              1.22 m wide
#   5  2× thl4                                                                   1.02 m wide
#
# Subs reach 2.32 m against a 2.0 m interface. The stack is 3.46 m of cabinet.
#
id: stacked-1-pooled--------pyramid-mixed---alternate-center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - kicker-15
        - thl4

