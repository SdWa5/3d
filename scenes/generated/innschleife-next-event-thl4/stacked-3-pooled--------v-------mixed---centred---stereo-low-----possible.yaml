id: stacked-3-pooled--------v-------mixed---centred---stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 6 cabinets in 3 rows
  - id: main-2
    at: [-3.212, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      from:
        - device: wsx-18
          count: 2
          roll_mirror: 90.0
        - device: sbh-18
          count: 2
          roll_mirror: 90.0
        - device: kicker-15
          count: 2

  # 3, 4 cabinets in 2 rows
  - id: main-3
    at: [-0.297, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      from:
        - device: wsx-18
          count: 1
          roll_mirror: 90.0
        - device: sbh-18
          count: 1
          roll_mirror: 90.0
        - device: kicker-15
          count: 1
        - device: thl4
          count: 1

  # 1, 4 cabinets in 2 rows
  - id: main-1
    at: [2.613, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: wsx-18
          count: 1
          roll_mirror: 90.0
        - device: sbh-18
          count: 1
          roll_mirror: 90.0
        - device: kicker-15
          count: 1
        - device: thl4
          count: 1

