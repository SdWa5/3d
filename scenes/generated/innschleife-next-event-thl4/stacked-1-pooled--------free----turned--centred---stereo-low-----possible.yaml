# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=pooled --quantity=sub-95x57:0 --quantity=tms4:0
#     --from=wsx-18 --from=sbh-18 --from=kicker-15 --from=thl4 --stacks=1 --align=stereo --low-end=low --shape=free
#     --mirror-style=centred --id=stacked --into=innschleife-next-event-thl4
#
# What it deals out today:
#
#   1  2× wsx-18 rolled 270° + 2× wsx-18 rolled 90°                           4.46 m wide
#   2  1× sbh-18 rolled 270° + 1× sbh-18 + 1× sbh-18 rolled 90°              2.99 m wide
#   3  2× kicker-15 rolled 270° + 1× kicker-15 + 1× kicker-15 rolled 90° + 1× sbh-18 rolled 90°     3.68 m wide
#   4  1× thl4 + 1× thl4                                                        1.02 m wide
#
# Subs reach 2.37 m against a 2.0 m interface. The stack is 3.51 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 2× kicker-15 rolled 270° + 1× kicker-15 + 1× kicker-15 rolled 90° + 1× sbh-18 rolled 90° row is 3.680
#     m on a 2.990 m row, so it overhangs 345 mm each side
#
id: stacked-1-pooled--------free----turned--centred---stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - device: kicker-15
          roll_mirror: 90.0
        - thl4

