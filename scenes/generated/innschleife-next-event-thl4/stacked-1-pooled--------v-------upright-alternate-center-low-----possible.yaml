# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --quantity=sub-95x57:0 --quantity=tms4:0
#     --from=wsx-18 --from=sbh-18 --from=kicker-15 --from=thl4 --stacks=1 --align=center --low-end=low --shape=v
#     --mirror-style=alternate --id=stacked --into=innschleife-next-event-thl4
#
# What it deals out today:
#
#   1  4× sbh-18                                                                 2.26 m wide
#   2  4× wsx-18                                                                 2.34 m wide
#   3  4× kicker-15                                                              2.46 m wide
#   4  2× thl4                                                                   1.02 m wide
#
# Subs reach 2.9 m against a 2.0 m interface. The stack is 4.04 m of cabinet.
#   * the 4× wsx-18 row is 2.340 m on a 2.260 m row, so it overhangs 40 mm each side
#   * the 4× kicker-15 row is 2.460 m on a 2.340 m row, so it overhangs 60 mm each side
#
id: stacked-1-pooled--------v-------upright-alternate-center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - wsx-18
        - sbh-18
        - kicker-15
        - thl4

