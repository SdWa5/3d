          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: turbo-top
          count: 1
          aim: near

