id: stacked-1-tops-shared---v-------turned--centred---center-central-possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 15 cabinets in 4 rows
  - id: main-gmss
