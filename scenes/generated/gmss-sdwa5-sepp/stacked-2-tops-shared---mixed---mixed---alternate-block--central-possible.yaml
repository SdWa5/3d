id: stacked-2-tops-shared---mixed---mixed---alternate-block--central-possible
name: "Solved rig — 4 stacks side by side, tiers justified"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-1, 5 cabinets in 2 rows
  - id: main-gmss-1
    at: [-5.0895, -0.22]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: block
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: mixed
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # gmss-2, 8 cabinets in 4 rows
  - id: main-gmss-2
    at: [-2.1545, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
