id: stacked-2-systems-apart-free----mixed---alternate-center-central-possible
name: "Solved rig — 4 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-2, 8 cabinets in 4 rows
  - id: main-gmss-2
    at: [-3.622, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      from:
        - device: wall-bass
          count: 1
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          count: 1
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: turbo-top
          count: 2

