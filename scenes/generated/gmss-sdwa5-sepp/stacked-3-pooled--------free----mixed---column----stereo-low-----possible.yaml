id: stacked-3-pooled--------free----mixed---column----stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 17 cabinets in 6 rows
  - id: main-2
    at: [-2.348, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 4
          roll_mirror: 90.0
        - device: nuke
          roll_mirror: 90.0
        - device: achenbach-18
          count: 2
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # 3, 11 cabinets in 5 rows
  - id: main-3
    at: [0.459, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      from:
        - device: flexy-folded-horn-hybrid
          count: 4
          roll_mirror: 90.0
        - device: achenbach-18
          count: 2
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: turbo-top
          count: 1
          aim: near

  # 1, 11 cabinets in 5 rows
  - id: main-1
    at: [2.505, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      mirror: true             # the mirror image of stack 1
      from:
        - device: flexy-folded-horn-hybrid
          count: 4
          roll_mirror: 90.0
        - device: achenbach-18
          count: 2
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: turbo-top
          count: 1
          aim: near

