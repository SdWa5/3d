id: stacked-3-pooled--------v-------turned--column----stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 11 cabinets in 5 rows
  - id: main-1
    at: [-7.9115, -0.018]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: flexy-folded-horn-hybrid
          count: 4
          roll_mirror: 90.0
        - device: achenbach-18
          count: 2
          roll_mirror: 90.0
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: turbo-top
          count: 1
          aim: near

  # 2, 16 cabinets in 2 rows
