# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=tops-shared --from=wall-bass --from=mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=nuke --from=achenbach-18 --from=iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=stereo --low-end=low --shape=free
#     --mirror-style=alternate --id=stacked --into=gmss-sdwa5-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 13 cabinets in 5 rows:
#
#   1  2× wall-bass                                                              1.34 m wide
#   2  1× nuke + 1× mid-bass                                                    1.81 m wide
#   3  1× iq-sub + 1× nuke + 2× iq-sub                                         2.24 m wide
#   4  3× iq-sub                                                                 1.63 m wide
#   5  1× turbo-top + 1× turbo-top                                              0.92 m wide
#
# Subs reach 3.61 m against a 2.0 m interface. The stack is 4.32 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.610 m against the 3.000 m ceiling asked for, so they stand 610 mm too high — 3.610 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× nuke + 1× mid-bass row is 1.810 m on a 1.340 m row, so it overhangs 235 mm each side
#   * the 1× iq-sub + 1× nuke + 2× iq-sub row is 2.240 m on a 1.810 m row, so it overhangs 215 mm each side
#
# main-ours — ours, 26 cabinets in 4 rows:
#
#   1  3× flexy-folded-horn-hybrid + 2× skram + 3× flexy-folded-horn-hybrid    4.906 m wide
#   2  6× flexy-folded-horn-hybrid                                              3.646 m wide
#   3  6× achenbach-18                                                            3.7 m wide
#   4  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× turbo-top + 1× eighteensound-2way-15 + 1× tecnare-m2122   2.9812 m wide
#
# Subs reach 2.277 m against a 2.0 m interface. The stack is 3.237 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 6× achenbach-18 row is 3.700 m on a 3.646 m row, so it overhangs 27 mm each side
#
id: stacked-1-tops-shared---free----upright-alternate-stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 13 cabinets in 5 rows
  - id: main-gmss
    at: [-3.005, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      from:
        - wall-bass
        - mid-bass
        - nuke
        - iq-sub
        - device: turbo-top
          count: 2

  # ours, 26 cabinets in 4 rows
  - id: main-ours
    at: [1.068, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      from:
        - skram
        - flexy-folded-horn-hybrid
        - achenbach-18
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near
        - device: turbo-top
          count: 1
          aim: near

