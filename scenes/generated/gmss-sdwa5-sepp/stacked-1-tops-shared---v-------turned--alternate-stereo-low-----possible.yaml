# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=tops-shared --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=achenbach-18 --from=iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=stereo --low-end=low --shape=v
#     --mirror-style=alternate --id=stacked --into=gmss-sdwa5-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-ours — ours, 26 cabinets in 6 rows:
#
#   1  1× achenbach-18 rolled 270° + 1× skram rolled 270° + 1× skram rolled 90° + 1× achenbach-18 rolled 90°    3.088 m wide
#   2  2× achenbach-18 rolled 270° + 2× achenbach-18 rolled 90° at 230 mm gaps     3.09 m wide
#   3  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   4  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   5  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   6  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× turbo-top + 1× eighteensound-2way-15 + 1× tecnare-m2122   2.9812 m wide
#
# Subs reach 2.983 m against a 2.0 m interface. The stack is 3.943 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1×
#     flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° row is 3.112 m on a 3.090 m row, so
#     it overhangs 11 mm each side
#
# main-gmss — gmss, 12 cabinets in 5 rows:
#
#   1  1× nuke rolled 270° + 1× nuke rolled 90°                               1.56 m wide
#   2  1× wall-bass rolled 270° + 1× wall-bass rolled 90°                     2.82 m wide
#   3  1× iq-sub rolled 270° + 2× iq-sub rolled 90° at 405 mm gaps            2.82 m wide
#   4  2× iq-sub rolled 270° + 1× iq-sub rolled 90° at 405 mm gaps            2.82 m wide
#   5  1× turbo-top + 1× turbo-top                                              0.92 m wide
#
# Subs reach 2.31 m against a 2.0 m interface. The stack is 3.02 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * mid-bass: LEFT OUT, it cannot be carried in this stack — the 2× iq-sub rolled 270° + 2× iq-sub rolled 90°
#     row is 2.740 m on a 2.780 m row, so the wall narrows as it rises — `shape: v` asks for the opposite and this is not
#     one of its arrangements
