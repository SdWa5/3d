# Subs reach 2.392 m against a 2.0 m interface. The stack is 3.352 m of cabinet.
#   * the 1× turbo-top + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× turbo-top row is 1.926 m on a 1.848 m
