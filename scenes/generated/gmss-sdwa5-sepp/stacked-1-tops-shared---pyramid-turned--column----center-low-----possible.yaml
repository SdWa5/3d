# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=tops-shared --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=achenbach-18 --from=iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=center --low-end=low --shape=pyramid
#     --mirror-style=column --id=stacked --into=gmss-sdwa5-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 15 cabinets in 4 rows:
#
#   1  1× iq-sub rolled 270° + 1× wall-bass rolled 270° + 1× wall-bass rolled 90° + 1× iq-sub rolled 90°      4.2 m wide
#   2  2× iq-sub rolled 270° + 2× iq-sub rolled 90°                           2.74 m wide
#   3  1× nuke rolled 270° + 1× mid-bass rolled 90° + 1× nuke rolled 90°     2.08 m wide
#   4  1× turbo-top + 1× eighteensound-2way-15 + 2× tecnare-m2122            1.9756 m wide
#
# Subs reach 2.39 m against a 2.0 m interface. The stack is 3.35 m of cabinet.
#
# main-ours — ours, 24 cabinets in 5 rows:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    4.678 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    4.678 m wide
#   3  3× achenbach-18 rolled 270° + 3× achenbach-18 rolled 90°                3.7 m wide
#   4  1× skram rolled 270° + 1× skram rolled 90°                            1.848 m wide
#   5  1× turbo-top + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× turbo-top   1.9256 m wide
