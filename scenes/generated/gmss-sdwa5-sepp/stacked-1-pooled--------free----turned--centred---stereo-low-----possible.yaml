# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=pooled --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=achenbach-18 --from=iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=stereo --low-end=low --shape=free
#     --mirror-style=centred --id=stacked --into=gmss-sdwa5-sepp
#
# What it deals out today:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 270° + 1× wall-bass rolled 270° + 1× wall-bass rolled 90° + 1× skram rolled 90° + 1× flexy-folded-horn-hybrid rolled 90°    6.254 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    6.244 m wide
#   3  1× nuke rolled 270° + 1× flexy-folded-horn-hybrid rolled 270° + 2× achenbach-18 rolled 270° + 1× achenbach-18 + 2× achenbach-18 rolled 90° + 1× flexy-folded-horn-hybrid rolled 90° + 1× nuke rolled 90°    6.226 m wide
#   4  3× iq-sub rolled 270° + 1× achenbach-18 + 3× iq-sub rolled 90°        4.74 m wide
#   5  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× turbo-top + 1× tecnare-m2122 + 1× turbo-top + 1× turbo-top + 1× eighteensound-2way-15 + 1× tecnare-m2122   3.9212 m wide
#
# Subs reach 2.451 m against a 2.0 m interface. The stack is 3.411 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * mid-bass: LEFT OUT, it cannot be carried in this stack — a flexy-folded-horn-hybrid in the 1×
#     flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled
#     270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× flexy-folded-horn-hybrid rolled 270° + 1×
#     flexy-folded-horn-hybrid rolled 90° row would land on only 29% of its own width — it is touching what carries it
#     rather than sitting on it. Line the segments up with what carries them
#
id: stacked-1-pooled--------free----turned--centred---stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: nuke
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near
        - device: turbo-top
          aim: near
