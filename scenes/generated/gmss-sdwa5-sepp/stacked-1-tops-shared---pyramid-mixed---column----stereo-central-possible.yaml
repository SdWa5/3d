# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=tops-shared --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=achenbach-18 --from=iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=stereo --low-end=central --shape=pyramid
#     --mirror-style=column --id=stacked --into=gmss-sdwa5-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 13 cabinets in 5 rows:
#
#   1  2× iq-sub rolled 270° + 2× iq-sub rolled 90°                           2.74 m wide
#   2  1× iq-sub rolled 270° + 1× wall-bass rolled 90° + 1× iq-sub rolled 90°     2.78 m wide
#   3  1× wall-bass rolled 270° + 1× nuke rolled 90°                          2.19 m wide
#   4  1× nuke rolled 270° + 1× mid-bass                                       1.99 m wide
#   5  1× eighteensound-2way-15 + 1× turbo-top                                0.9356 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.276 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× iq-sub rolled 270° + 1× wall-bass rolled 90° + 1× iq-sub rolled 90° row is 2.780 m on a 2.740 m
#     row, so it overhangs 20 mm each side
#
# main-ours — ours, 26 cabinets in 4 rows:
#
#   1  3× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 90° + 3× flexy-folded-horn-hybrid rolled 90°    5.612 m wide
#   2  3× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 90° + 3× flexy-folded-horn-hybrid rolled 90°    5.612 m wide
#   3  6× achenbach-18                                                            3.7 m wide
#   4  1× tecnare-m2122 + 1× turbo-top + 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× turbo-top + 1× tecnare-m2122   2.9656 m wide
#
# Subs reach 1.82 m against a 2.0 m interface. The stack is 2.78 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.820 m against the 2.000 m interface asked for, so the tops sit 180 mm lower than ideal —
#     1.820 m is the most they reach while every tier is still carried
#
id: stacked-1-tops-shared---pyramid-mixed---column----stereo-central-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 13 cabinets in 5 rows
  - id: main-gmss
    at: [-3.358, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      low_end: central
      shape: pyramid
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # ours, 26 cabinets in 4 rows
  - id: main-ours
    at: [1.338, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      low_end: central
      shape: pyramid
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - achenbach-18
        - tecnare-m2122
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: turbo-top
          count: 2
          aim: near

