id: stacked-2-systems-apart-free----turned--alternate-center-low-----possible
name: "Solved rig — 4 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-1, 4 cabinets in 2 rows
  - id: main-gmss-1
    at: [-4.8065, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: turbo-top
          count: 1

  # ours-1, 11 cabinets in 5 rows
  - id: main-ours-1
    at: [-2.3615, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
