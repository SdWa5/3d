# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=tops-shared --from=wall-bass --from=mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=nuke --from=achenbach-18 --from=iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=center --low-end=low --shape=v
#     --mirror-style=alternate --id=stacked --into=gmss-sdwa5-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 11 cabinets in 1 row:
#
#   1  3× iq-sub + 1× nuke + 2× wall-bass + 1× nuke + 3× iq-sub + 1× mid-bass     7.08 m wide
#
# Subs reach 1.4 m against a 2.0 m interface. The stack is 1.4 m of cabinet.
#   * the subs reach 1.400 m against the 2.000 m interface asked for and **nothing stands on them** — this stack is
#     a sub wing, so the interface decides nothing about it
#
# main-ours — ours, 28 cabinets in 2 rows:
#
#   1  3× achenbach-18 + 6× flexy-folded-horn-hybrid + 2× skram + 6× flexy-folded-horn-hybrid + 3× achenbach-18   12.292 m wide
#   2  2× turbo-top + 1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15 + 1× turbo-top   3.9212 m wide
#
# Subs reach 0.914 m against a 2.0 m interface. The stack is 1.874 m of cabinet.
#   * the subs reach 0.914 m against the 2.000 m interface asked for, so the tops sit 1086 mm lower than ideal —
#     0.914 m is the most they reach while every tier is still carried
#
