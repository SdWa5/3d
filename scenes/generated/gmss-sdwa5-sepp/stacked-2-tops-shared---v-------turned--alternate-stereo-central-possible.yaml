id: stacked-2-tops-shared---v-------turned--alternate-stereo-central-possible
name: "Solved rig — 4 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours-2, 13 cabinets in 5 rows
  - id: main-ours-2
    at: [-4.57, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: v
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # gmss-2, 10 cabinets in 4 rows
  - id: main-gmss-2
    at: [-1.4955, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: v
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2
        - device: turbo-top
          count: 1
          aim: near

  # gmss-1, 4 cabinets in 2 rows
  - id: main-gmss-1
    at: [1.4395, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: v
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1

  # ours-1, 11 cabinets in 4 rows
  - id: main-ours-1
    at: [4.0475, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: v
      mirror: true             # the mirror image of stack ours-1
      from:
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 1
