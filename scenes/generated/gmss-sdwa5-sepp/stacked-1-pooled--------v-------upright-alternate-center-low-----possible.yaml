# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=achenbach-18 --from=iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=center --low-end=low --shape=v
#     --mirror-style=alternate --id=stacked --into=gmss-sdwa5-sepp
#
# What it deals out today:
#
#   1  1× nuke + 2× skram + 1× nuke + 1× mid-bass                             3.68 m wide
#   2  6× iq-sub at 100 mm gaps                                                  3.68 m wide
#   3  6× achenbach-18                                                            3.7 m wide
#   4  6× flexy-folded-horn-hybrid at 31 mm gaps                                3.701 m wide
#   5  6× flexy-folded-horn-hybrid at 31 mm gaps                                3.701 m wide
#   6  2× turbo-top + 1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15 + 1× turbo-top   3.9212 m wide
#
# Subs reach 3.71 m against a 2.0 m interface. The stack is 4.67 m of cabinet.
#   * wall-bass: LEFT OUT, it cannot be carried in this stack — the 4× flexy-folded-horn-hybrid row is 2.424 m on a
#     6.108 m row, so the wall narrows as it rises — `shape: v` asks for the opposite and this is not one of its
#     arrangements
#   * the subs reach 3.710 m against the 3.000 m ceiling asked for, so they stand 710 mm too high — 3.710 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 2× turbo-top + 1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15 + 1× turbo-top
#     row is 3.921 m on a 3.701 m row, so it overhangs 110 mm each side
#
id: stacked-1-pooled--------v-------upright-alternate-center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - mid-bass
        - skram
        - flexy-folded-horn-hybrid
        - nuke
        - achenbach-18
        - iq-sub
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near
        - device: turbo-top
          aim: near

