# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=achenbach-18 --from=iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=center --low-end=low --shape=v
#     --mirror-style=alternate --id=stacked --into=gmss-sdwa5-sepp
#
# What it deals out today:
#
#   1  1× nuke + 1× skram + 1× wall-bass + 1× mid-bass + 1× wall-bass + 1× skram + 1× nuke     5.04 m wide
#   2  1× achenbach-18 + 6× iq-sub + 1× achenbach-18 at 95 mm gaps            5.045 m wide
#   3  2× achenbach-18 + 4× flexy-folded-horn-hybrid + 2× achenbach-18 at 41 mm gaps    5.051 m wide
#   4  8× flexy-folded-horn-hybrid at 47 mm gaps                                5.057 m wide
#   5  2× turbo-top + 1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15 + 1× turbo-top   3.9212 m wide
#
# Subs reach 3.596 m against a 2.0 m interface. The stack is 4.556 m of cabinet.
#   * the subs reach 3.596 m against the 3.000 m ceiling asked for, so they stand 596 mm too high — 3.596 m is the
#     nearest the 2.500 m target that every tier is still carried at
#
id: stacked-1-pooled--------v-------upright-alternate-center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - wall-bass
        - mid-bass
        - skram
        - flexy-folded-horn-hybrid
        - nuke
        - achenbach-18
        - iq-sub
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near
        - device: turbo-top
          aim: near
