# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=tops-shared --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=achenbach-18 --from=iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=stereo --low-end=low --shape=v
#     --mirror-style=centred --id=stacked --into=gmss-sdwa5-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 13 cabinets in 6 rows:
#
#   1  1× mid-bass                                                                1.2 m wide
#   2  1× nuke rolled 270° + 1× nuke rolled 90°                               1.56 m wide
#   3  1× wall-bass rolled 270° + 1× wall-bass rolled 90°                     2.82 m wide
#   4  1× iq-sub rolled 270° + 1× iq-sub + 1× iq-sub rolled 90° at 475 mm gaps     2.82 m wide
#   5  1× iq-sub rolled 270° + 1× iq-sub + 1× iq-sub rolled 90° at 475 mm gaps     2.82 m wide
#   6  1× turbo-top + 1× turbo-top                                              0.92 m wide
#
# Subs reach 3.09 m against a 2.0 m interface. The stack is 3.8 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.090 m against the 3.000 m ceiling asked for, so they stand 90 mm too high — 3.090 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× nuke rolled 270° + 1× nuke rolled 90° row is 1.560 m on a 1.200 m row, so it overhangs 180 mm each
#     side
#   * the 1× wall-bass rolled 270° + 1× wall-bass rolled 90° row is 2.820 m on a 1.560 m row, so it overhangs 630
#     mm each side
#
# main-ours — ours, 26 cabinets in 4 rows:
#
#   1  2× achenbach-18 rolled 270° + 1× skram rolled 270° + 1× skram + 3× achenbach-18 rolled 90°    4.644 m wide
#   2  3× flexy-folded-horn-hybrid rolled 270° + 1× achenbach-18 + 3× flexy-folded-horn-hybrid rolled 90°    5.298 m wide
#   3  3× flexy-folded-horn-hybrid rolled 270° + 3× flexy-folded-horn-hybrid rolled 90° at 144 mm gaps    5.298 m wide
#   4  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× turbo-top + 1× eighteensound-2way-15 + 1× tecnare-m2122   2.9812 m wide
#
# Subs reach 2.105 m against a 2.0 m interface. The stack is 3.065 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 3× flexy-folded-horn-hybrid rolled 270° + 1× achenbach-18 + 3× flexy-folded-horn-hybrid rolled 90° row
#     is 5.298 m on a 4.644 m row, so it overhangs 327 mm each side
#
id: stacked-1-tops-shared---v-------turned--centred---stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 13 cabinets in 6 rows
  - id: main-gmss
    at: [-3.201, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - device: mid-bass
          roll_mirror: 90.0
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - device: turbo-top
          count: 2

  # ours, 26 cabinets in 4 rows
  - id: main-ours
    at: [1.358, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near
        - device: turbo-top
          count: 1
          aim: near

