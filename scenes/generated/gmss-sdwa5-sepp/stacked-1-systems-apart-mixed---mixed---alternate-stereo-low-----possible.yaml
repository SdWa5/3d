id: stacked-1-systems-apart-mixed---mixed---alternate-stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 25 cabinets in 6 rows
  - id: main-ours
    at: [-1.962, -0.018]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: mixed
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - achenbach-18
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near

  # gmss, 14 cabinets in 5 rows
  - id: main-gmss
    at: [1.504, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: mixed
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - turbo-top
