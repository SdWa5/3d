# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=achenbach-18 --from=iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=stereo --low-end=low --shape=pyramid
#     --mirror-style=alternate --id=stacked --into=gmss-sdwa5-sepp
#
# What it deals out today:
#
#   1  9× flexy-folded-horn-hybrid                                              5.479 m wide
#   2  3× achenbach-18 + 3× flexy-folded-horn-hybrid + 3× achenbach-18        5.533 m wide
#   3  3× iq-sub + 2× wall-bass + 1× skram + 3× iq-sub                        5.27 m wide
#   4  1× nuke + 1× skram + 1× nuke + 1× mid-bass at 278 mm gaps             3.824 m wide
#   5  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× turbo-top + 1× tecnare-m2122 + 1× turbo-top + 1× turbo-top + 1× eighteensound-2way-15 + 1× tecnare-m2122   3.9212 m wide
#
# Subs reach 3.84 m against a 2.0 m interface. The stack is 4.8 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.840 m against the 3.000 m ceiling asked for, so they stand 840 mm too high — 3.840 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 3× achenbach-18 + 3× flexy-folded-horn-hybrid + 3× achenbach-18 row is 5.533 m on a 5.479 m row, so it
#     overhangs 27 mm each side
#   * the 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× turbo-top + 1× tecnare-m2122 + 1× turbo-top + 1×
#     turbo-top + 1× eighteensound-2way-15 + 1× tecnare-m2122 row is 3.921 m on a 3.824 m row, so it overhangs 49 mm each
#     side
#
id: stacked-1-pooled--------pyramid-upright-alternate-stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - wall-bass
        - mid-bass
        - skram
        - flexy-folded-horn-hybrid
        - nuke
        - achenbach-18
        - iq-sub
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near
        - device: turbo-top
          aim: near

