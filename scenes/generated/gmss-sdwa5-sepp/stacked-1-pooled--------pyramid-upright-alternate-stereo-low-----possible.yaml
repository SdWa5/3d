# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=nuke --from=achenbach-18 --from=iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=stereo --low-end=low --shape=pyramid
#     --mirror-style=alternate --id=stacked --into=gmss-sdwa5-sepp
#
# What it deals out today:
#
#   1  10× flexy-folded-horn-hybrid                                              6.09 m wide
#   2  3× achenbach-18 + 1× iq-sub + 2× flexy-folded-horn-hybrid + 1× iq-sub + 3× achenbach-18    6.022 m wide
#   3  2× iq-sub + 1× nuke + 1× skram + 2× wall-bass + 1× skram + 1× nuke + 2× iq-sub     6.02 m wide
#   4  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× turbo-top + 1× tecnare-m2122 + 1× turbo-top + 1× turbo-top + 1× eighteensound-2way-15 + 1× tecnare-m2122   3.9212 m wide
#
# Subs reach 2.926 m against a 2.0 m interface. The stack is 3.886 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * mid-bass: LEFT OUT, it cannot be carried in this stack — the 1× tecnare-m2122 + 1× eighteensound-2way-15 +
#     1× turbo-top + 1× tecnare-m2122 + 1× turbo-top + 1× turbo-top + 1× eighteensound-2way-15 + 1× tecnare-m2122 row
#     is 3.921 m on a 2.420 m row, so it steps out 751 mm each side against the 50 mm a 0.500 m cabinet may sit proud —
#     `shape: pyramid` asks for a wall that does not widen as it rises
#
id: stacked-1-pooled--------pyramid-upright-alternate-stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - wall-bass
        - skram
        - flexy-folded-horn-hybrid
        - nuke
        - achenbach-18
        - iq-sub
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near
        - device: turbo-top
          aim: near
