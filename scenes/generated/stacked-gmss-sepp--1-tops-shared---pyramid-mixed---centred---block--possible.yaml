# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=tops-shared --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top
#     --stacks=1 --align=block --shape=pyramid --mirror-style=centred --id=stacked-gmss-sepp--1-tops-shared--
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 14 cabinets in 4 rows:
#
#   1  3× gmss-iq-sub rolled 270° + 3× gmss-iq-sub rolled 90°                 4.12 m wide
#   2  1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass + 1× gmss-nuke rolled 90°     2.87 m wide
#   3  1× gmss-nuke rolled 270° + 1× gmss-mid-bass                             1.99 m wide
#   4  1× gmss-turbo-top + 2× eighteensound-2way-15                           1.4212 m wide
#
# Subs reach 2.52 m against a 2.0 m interface. The stack is 3.356 m of cabinet.
# `align: block` spreads the top tier onto the edges of the row carrying it.
#
# main-sepp — sepp, 8 cabinets in 4 rows:
#
#   1  2× achenbach-18                                                           1.22 m wide
#   2  2× achenbach-18                                                           1.22 m wide
#   3  2× achenbach-18                                                           1.22 m wide
#   4  2× gmss-turbo-top                                                         0.92 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 2.51 m of cabinet.
# `align: block` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.800 m against the 2.000 m interface asked for, so the tops sit 200 mm lower than ideal —
#     1.800 m is the most they reach while every tier is still carried
#
id: stacked-gmss-sepp--1-tops-shared---pyramid-mixed---centred---block--possible
name: "Solved rig — 2 stacks side by side, tiers justified"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 14 cabinets in 4 rows
  - id: main-gmss
    at: [-1.162, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: block
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: pyramid
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: gmss-turbo-top
          count: 1
          aim: near

  # sepp, 8 cabinets in 4 rows
  - id: main-sepp
    at: [2.008, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: block
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: pyramid
      from:
        - achenbach-18
        - device: gmss-turbo-top
          count: 2

