id: stacked-gmss-sdwa5-2-tops-shared---pyramid-mixed---centred---center-possible
name: "Solved rig — 4 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-2, 11 cabinets in 2 rows
  - id: main-gmss-2
    at: [-5.119, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2
        - device: gmss-turbo-top
          count: 1
          aim: near

  # sdwa5-2, 9 cabinets in 3 rows
  - id: main-sdwa5-2
    at: [1.565, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: gmss-turbo-top
          count: 1

  # sdwa5-1, 7 cabinets in 4 rows
  - id: main-sdwa5-1
    at: [5.177, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      mirror: true             # the mirror image of stack sdwa5-1
      from:
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: gmss-turbo-top
          count: 1

  # gmss-1, 4 cabinets in 2 rows
  - id: main-gmss-1
    at: [7.405, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1

