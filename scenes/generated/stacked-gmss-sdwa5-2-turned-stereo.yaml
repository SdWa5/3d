#   2  1× gmss-iq-sub rolled 270° + 1× gmss-wall-bass rolled 270° + 1× flexy-folded-horn-hybrid rolled 270° + 2× gmss-iq-sub rolled 90°    4.253 m wide
#   3  1× gmss-mid-bass rolled 270° + 1× skram rolled 90° + 1× gmss-nuke rolled 90°    2.224 m wide
#   4  1× tecnare-m2122 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× tecnare-m2122     1.96 m wide
#
# Subs reach 2.451 m against a 2.0 m interface. The stack is 3.411 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * the 1× gmss-iq-sub rolled 270° + 1× gmss-wall-bass rolled 270° + 1× flexy-folded-horn-hybrid rolled 270° +
