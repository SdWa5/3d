# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=3.7 --from=gmss-wall-bass --from=gmss-mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=gmss-turbo-top --stacks=2 --align=stereo --shape=pyramid
#     --mirror-style=alternate --id=stacked-all-2
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 22 cabinets in 4 rows:
#
#   1  6× flexy-folded-horn-hybrid                                              3.646 m wide
#   2  1× achenbach-18 + 3× gmss-iq-sub + 2× achenbach-18                      3.49 m wide
#   3  1× gmss-nuke + 2× skram + 1× gmss-nuke + 1× gmss-mid-bass              3.68 m wide
#   4  1× tecnare-m2122 + 1× gmss-turbo-top + 1× eighteensound-2way-15 + 1× gmss-turbo-top + 1× tecnare-m2122   2.4456 m wide
#
# Subs reach 2.347 m against a 2.0 m interface. The stack is 3.307 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-wall-bass: LEFT OUT, it cannot be carried in this stack — a gmss-nuke in the 2× gmss-nuke + 1×
#     gmss-mid-bass row would land on only 8% of its own width — it is touching what carries it rather than sitting on it.
#     Line the segments up with what carries them
#   * skram: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * gmss-nuke: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * the 1× gmss-nuke + 2× skram + 1× gmss-nuke + 1× gmss-mid-bass row is 3.680 m on a 3.490 m row, so it
#     overhangs 95 mm each side
#
# main-1 — 1, 15 cabinets in 4 rows:
#
#   1  6× flexy-folded-horn-hybrid                                              3.646 m wide
#   2  3× achenbach-18                                                           1.84 m wide
#   3  3× gmss-iq-sub                                                            1.63 m wide
#   4  1× gmss-turbo-top + 1× eighteensound-2way-15 + 1× tecnare-m2122       1.4556 m wide
#
# Subs reach 2.033 m against a 2.0 m interface. The stack is 2.993 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-wall-bass: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * skram: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * gmss-nuke: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#
id: stacked-all-2-stereo
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 22 cabinets in 4 rows
  - id: main-2
    at: [-2.375, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - gmss-mid-bass
        - skram
        - device: flexy-folded-horn-hybrid
          count: 6
        - gmss-nuke
        - device: achenbach-18
          count: 3
        - device: gmss-iq-sub
          count: 3
        - device: tecnare-m2122
          count: 2
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: gmss-turbo-top
          count: 2
          aim: near

  # 1, 15 cabinets in 4 rows
  - id: main-1
    at: [1.788, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: achenbach-18
          count: 3
        - device: gmss-iq-sub
          count: 3
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: gmss-turbo-top
          count: 1
          aim: near

