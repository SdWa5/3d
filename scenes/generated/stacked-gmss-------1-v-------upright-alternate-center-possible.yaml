# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --from=gmss-wall-bass --from=gmss-mid-bass --from=gmss-nuke
#     --from=gmss-iq-sub --from=gmss-turbo-top --stacks=1 --align=center --shape=v --mirror-style=alternate
#     --id=stacked-gmss-------1
#
# What it deals out today:
#
#   1  2× gmss-nuke                                                               1.2 m wide
#   2  1× gmss-mid-bass                                                           1.2 m wide
#   3  2× gmss-wall-bass                                                         1.34 m wide
#   4  3× gmss-iq-sub                                                            1.63 m wide
#   5  3× gmss-iq-sub                                                            1.63 m wide
#   6  3× gmss-turbo-top                                                         1.39 m wide
#
# Subs reach 4.01 m against a 2.0 m interface. The stack is 4.72 m of cabinet.
#   * the subs reach 4.010 m against the 3.000 m ceiling asked for, so they stand 1010 mm too high — 4.010 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 2× gmss-wall-bass row is 1.340 m on a 1.200 m row, so it overhangs 70 mm each side
#   * the 3× gmss-iq-sub row is 1.630 m on a 1.340 m row, so it overhangs 145 mm each side
#
id: stacked-gmss-------1-v-------upright-alternate-center-possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - gmss-iq-sub
        - gmss-turbo-top

