id: stacked-1-pooled--------free----turned--column----center-low-----impossible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: concert-audio-esx
          count: 12
          roll_mirror: 90.0
        - device: kicker-15
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0
        - top-70x93
        - device: tecnare-m2122
          aim: near
        - device: concert-audio-ef6
          count: 5
          aim: near
        - device: tms2
          aim: near
        - device: eighteensound-2way-15
          aim: near

  # Backdrop: deco-panel-10x2-5 hung from 5× truss-f33-2m on two truss-tower-4m, 0.8 m behind the rig's deepest back face.
  # The truss tops out at 4 m. Each tower carries 42 kg.
  - id: backdrop-tower-left
    device: truss-tower-4m
    at: [-5.2, 1.282]
    extend_to_m: 3.742
  - id: backdrop-tower-right
    device: truss-tower-4m
    at: [4.597, 1.282]
    extend_to_m: 3.742
  - id: backdrop-truss
    device: truss-f33-2m
    at: [-0.302, 1.282]
    fly:
      height_m: 3.742
      id: backdrop
    row:
      count: 5
      gap_m: 0.0
  - id: backdrop-deco
    device: deco-panel-10x2-5
    at: [-0.302, 1.112]
    fly:
      height_m: 1.5
      id: backdrop

