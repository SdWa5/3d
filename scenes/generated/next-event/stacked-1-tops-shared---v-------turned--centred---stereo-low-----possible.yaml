id: stacked-1-tops-shared---v-------turned--centred---stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 23 cabinets in 8 rows
  - id: main-ours
    at: [-9.042, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # psl, 12 cabinets in 3 rows
  - id: main-psl
    at: [-5.0735, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
      from:
        - device: concert-audio-esx
          count: 12
          roll_mirror: 90.0

  # innschleife, 21 cabinets in 2 rows
  - id: main-innschleife
    at: [3.6665, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - device: kicker-15
          roll_mirror: 90.0
        - device: concert-audio-ef6
          count: 5
        - device: tms4
          aim: near
        - device: tecnare-m2122
          count: 1
          aim: near
        - device: eighteensound-2way-15
          count: 1
          aim: near

