id: stacked-1-systems-apart-pyramid-upright-alternate-center-low-----possible
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 25 cabinets in 4 rows
  - id: main-ours
    at: [-3.852, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - skram
        - flexy-folded-horn-hybrid
        - achenbach-18
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near

  # psl, 17 cabinets in 3 rows
  - id: main-psl
    at: [0.6055, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - device: concert-audio-esx
          count: 12
        - device: concert-audio-ef6
          count: 5

  # innschleife, 14 cabinets in 4 rows
  - id: main-innschleife
    at: [4.1555, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
