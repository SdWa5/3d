# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=systems-apart --order=ours,psl,innschleife
#     --quantity=concert-audio-ef6:5 --quantity=concert-audio-esf:0 --quantity=concert-audio-esx:12
#     --quantity=hk-linear5-112x:0 --quantity=sub-60x60:0 --quantity=thebox-achat-112m:0 --quantity=thebox-achat-115m:0
#     --quantity=thebox-dsp-112:0 --quantity=thebox-pa302:0 --quantity=thebox-tp118-800:0 --quantity=thebox-tp218-1600:0
#     --quantity=tms2:0 --from=wsx-18 --from=sbh-18 --from=skram --from=flexy-folded-horn-hybrid --from=concert-audio-esx
#     --from=kicker-15 --from=achenbach-18 --from=tms4 --from=tecnare-m2122 --from=concert-audio-ef6
#     --from=eighteensound-2way-15 --stacks=1 --align=stereo --low-end=low --shape=pyramid --mirror-style=centred
#     --id=stacked --into=next-event
#
# 3 stacks side by side, with 0.5 m of air between them.
#
# main-ours — ours, 25 cabinets in 4 rows:
#
#   1  4× flexy-folded-horn-hybrid rolled 270° + 4× flexy-folded-horn-hybrid rolled 90°    6.244 m wide
#   2  2× flexy-folded-horn-hybrid rolled 270° + 5× achenbach-18 + 2× flexy-folded-horn-hybrid rolled 90°    6.212 m wide
#   3  1× skram rolled 270° + 1× skram + 1× achenbach-18 at 144 mm gaps      2.412 m wide
#   4  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122   2.5112 m wide
#
# Subs reach 2.105 m against a 2.0 m interface. The stack is 3.065 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1×
#     tecnare-m2122 row is 2.511 m on a 2.412 m row, so it overhangs 50 mm each side
#
# main-psl — psl, 17 cabinets in 3 rows:
#
#   1  3× concert-audio-esx rolled 270° + 1× concert-audio-esx + 3× concert-audio-esx rolled 90°     7.79 m wide
#   2  2× concert-audio-esx rolled 270° + 1× concert-audio-esx + 2× concert-audio-esx rolled 90°     5.39 m wide
#   3  2× concert-audio-ef6 + 1× concert-audio-ef6 + 2× concert-audio-ef6      3.02 m wide
#
# Subs reach 2.36 m against a 2.0 m interface. The stack is 3.14 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
# main-innschleife — innschleife, 14 cabinets in 7 rows:
#
#   1  1× sbh-18 rolled 270° + 1× sbh-18 rolled 90°                           2.42 m wide
#   2  1× sbh-18 rolled 270° + 1× sbh-18 rolled 90°                           2.42 m wide
#   3  1× wsx-18 rolled 270° + 1× wsx-18 rolled 90°                           2.22 m wide
#   4  1× wsx-18 rolled 270° + 1× wsx-18 rolled 90°                           2.22 m wide
#   5  2× kicker-15                                                              1.92 m wide
#   6  2× kicker-15                                                              1.92 m wide
#   7  1× tms4 + 1× tms4                                                        1.02 m wide
#
# Subs reach 3.38 m against a 2.0 m interface. The stack is 4.52 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.380 m against the 3.000 m ceiling asked for, so they stand 380 mm too high — 3.380 m is the
#     nearest the 2.500 m target that every tier is still carried at
#
id: stacked-1-systems-apart-pyramid-mixed---centred---stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 25 cabinets in 4 rows
  - id: main-ours
    at: [-5.907, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: pyramid
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - achenbach-18
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near

  # psl, 17 cabinets in 3 rows
  - id: main-psl
    at: [1.61, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: pyramid
      from:
        - device: concert-audio-esx
          count: 12
          roll_mirror: 90.0
        - device: concert-audio-ef6
          count: 5

  # innschleife, 14 cabinets in 7 rows
  - id: main-innschleife
    at: [7.215, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: pyramid
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - kicker-15
        - tms4

