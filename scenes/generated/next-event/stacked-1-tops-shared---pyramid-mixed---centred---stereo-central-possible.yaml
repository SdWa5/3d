id: stacked-1-tops-shared---pyramid-mixed---centred---stereo-central-possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 23 cabinets in 4 rows
  - id: main-ours
    at: [-6.192, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      low_end: central
      shape: pyramid
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - achenbach-18
        - device: concert-audio-ef6
          count: 1
        - device: tms4
          count: 1
          aim: near
        - device: tecnare-m2122
          count: 1
          aim: near

  # psl, 17 cabinets in 3 rows
  - id: main-psl
    at: [0.857, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      low_end: central
      shape: pyramid
      from:
        - device: concert-audio-esx
          count: 12
          roll_mirror: 90.0
        - device: concert-audio-ef6
          count: 3
        - device: tecnare-m2122
          count: 1
          aim: near
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # innschleife, 16 cabinets in 5 rows
  - id: main-innschleife
    at: [6.747, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      low_end: central
      shape: pyramid
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - kicker-15
        - device: concert-audio-ef6
          count: 1
        - device: tms4
          count: 1
          aim: near
        - device: tecnare-m2122
          count: 1
          aim: near
        - device: eighteensound-2way-15
          count: 1
          aim: near

