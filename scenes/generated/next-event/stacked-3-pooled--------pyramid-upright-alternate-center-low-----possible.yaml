id: stacked-3-pooled--------pyramid-upright-alternate-center-low-----possible
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 15 cabinets in 2 rows
  - id: main-1
    at: [-5.299, 0.0]
