id: stacked-2-pooled--------free----upright-alternate-center-low-----possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 26 cabinets in 5 rows
  - id: main-1
    at: [-2.442, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror: true             # the mirror image of stack 1
      from:
        - device: wsx-18
          count: 2
        - device: sbh-18
          count: 2
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
