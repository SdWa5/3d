          count: 2
        - device: achenbach-18
          count: 3
        - device: tecnare-m2122
          count: 1
          aim: near
        - device: concert-audio-ef6
          count: 2
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # 2, 28 cabinets in 5 rows
  - id: main-2
