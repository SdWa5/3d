id: stacked-3-pooled--------free----turned--alternate-stereo-central-possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 20 cabinets in 5 rows
  - id: main-2
    at: [-12.884, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      from:
        - device: wsx-18
          count: 2
          roll_mirror: 90.0
        - device: sbh-18
          count: 2
          roll_mirror: 90.0
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 4
          roll_mirror: 90.0
        - device: concert-audio-esx
          count: 4
          roll_mirror: 90.0
        - device: kicker-15
          count: 2
          roll_mirror: 90.0
        - device: achenbach-18
          count: 2
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
          aim: near
        - device: concert-audio-ef6
          count: 1

  # 1, 18 cabinets in 2 rows
  - id: main-1
    at: [-3.853, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      mirror: true             # the mirror image of stack 1
      from:
