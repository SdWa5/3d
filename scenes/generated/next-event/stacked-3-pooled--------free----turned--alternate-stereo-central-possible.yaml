          count: 1
          aim: near
        - device: tecnare-m2122
          count: 1
          aim: near
        - device: concert-audio-ef6
          count: 2
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # 3, 18 cabinets in 2 rows
