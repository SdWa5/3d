id: stacked-2-pooled--------free----upright-alternate-stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 27 cabinets in 5 rows
  - id: main-1
    at: [-2.372, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror: true             # the mirror image of stack 1
      from:
        - device: wsx-18
          count: 2
        - device: sbh-18
          count: 2
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: concert-audio-esx
          count: 6
        - device: achenbach-18
          count: 3
        - device: kicker-15
          count: 2
        - device: tecnare-m2122
          count: 1
          aim: near
        - device: concert-audio-ef6
          count: 2
        - device: thl4
          count: 1
          aim: near
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # 2, 28 cabinets in 5 rows
  - id: main-2
    at: [1.773, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: wsx-18
          count: 2
        - device: sbh-18
          count: 2
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: concert-audio-esx
          count: 6
        - device: achenbach-18
          count: 3
        - device: kicker-15
          count: 2
        - device: tecnare-m2122
          count: 2
          aim: near
        - device: concert-audio-ef6
          count: 3
        - device: eighteensound-2way-15
