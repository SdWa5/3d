# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --order=ours,psl,innschleife
#     --quantity=concert-audio-ef6:5 --quantity=concert-audio-esf:0 --quantity=concert-audio-esx:12
#     --quantity=hk-linear5-112x:0 --quantity=sub-60x60:0 --quantity=thebox-achat-112m:0 --quantity=thebox-achat-115m:0
#     --quantity=thebox-dsp-112:0 --quantity=thebox-pa302:0 --quantity=thebox-tp118-800:0 --quantity=thebox-tp218-1600:0
#     --quantity=tms2:0 --from=wsx-18 --from=sbh-18 --from=skram --from=flexy-folded-horn-hybrid --from=concert-audio-esx
#     --from=kicker-15 --from=achenbach-18 --from=tms4 --from=tecnare-m2122 --from=concert-audio-ef6
#     --from=eighteensound-2way-15 --stacks=2 --align=stereo --low-end=low --shape=free --mirror-style=alternate
#     --id=stacked --into=next-event
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 26 cabinets in 3 rows:
#
#   1  3× flexy-folded-horn-hybrid + 1× wsx-18 + 3× concert-audio-esx + 2× sbh-18 + 3× concert-audio-esx + 1× wsx-18 + 3× flexy-folded-horn-hybrid    9.626 m wide
#   2  1× kicker-15 + 3× achenbach-18 + 1× kicker-15                           3.78 m wide
#   3  1× concert-audio-ef6 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× tms4 + 1× concert-audio-ef6   2.7216 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 2.94 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * skram: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * concert-audio-ef6: SPLIT UNEVENLY, 1 of 5 over 2 stacks — 2 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 1.800 m against the 2.000 m interface asked for, so the tops sit 200 mm lower than ideal —
#     1.800 m is the most they reach while every tier is still carried
#
# main-2 — 2, 29 cabinets in 3 rows:
#
#   1  3× flexy-folded-horn-hybrid + 1× skram + 1× wsx-18 + 3× concert-audio-esx + 2× sbh-18 + 3× concert-audio-esx + 1× wsx-18 + 1× skram + 3× flexy-folded-horn-hybrid   10.886 m wide
#   2  1× kicker-15 + 3× achenbach-18 + 1× kicker-15                           3.78 m wide
#   3  1× concert-audio-ef6 + 1× tecnare-m2122 + 1× concert-audio-ef6 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× concert-audio-ef6   3.3296 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 2.76 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * skram: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * concert-audio-ef6: SPLIT UNEVENLY, 1 of 5 over 2 stacks — 2 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * tms4: LEFT OUT, it cannot be carried in this stack — a tecnare-m2122 in the 1× concert-audio-ef6 + 1×
#     tecnare-m2122 + 1× concert-audio-ef6 + 1× tms4 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1×
#     concert-audio-ef6 row would land on only 21% of its own width — it is touching what carries it rather than sitting
#     on it. Line the segments up with what carries them
#   * the subs reach 1.800 m against the 2.000 m interface asked for, so the tops sit 200 mm lower than ideal —
#     1.800 m is the most they reach while every tier is still carried
