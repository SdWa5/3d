# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=tops-shared --order=ours,psl,innschleife
#     --quantity=concert-audio-ef6:5 --quantity=concert-audio-esf:0 --quantity=concert-audio-esx:12
#     --quantity=hk-linear5-112x:0 --quantity=sub-60x60:0 --quantity=thebox-achat-112m:0 --quantity=thebox-achat-115m:0
#     --quantity=thebox-dsp-112:0 --quantity=thebox-pa302:0 --quantity=thebox-tp118-800:0 --quantity=thebox-tp218-1600:0
#     --quantity=tms2:0 --from=wsx-18 --from=sbh-18 --from=skram --from=flexy-folded-horn-hybrid --from=concert-audio-esx
#     --from=kicker-15 --from=achenbach-18 --from=tms4 --from=tecnare-m2122 --from=concert-audio-ef6
#     --from=eighteensound-2way-15 --stacks=1 --align=center --low-end=low --shape=v --mirror-style=column --id=stacked
#     --into=next-event
#
# 3 stacks side by side, with 0.5 m of air between them.
#
# main-ours — ours, 25 cabinets in 6 rows:
#
#   1  1× achenbach-18 rolled 270° + 1× skram rolled 270° + 1× skram rolled 90° + 1× achenbach-18 rolled 90°    3.088 m wide
#   2  2× achenbach-18 rolled 270° + 2× achenbach-18 rolled 90° at 230 mm gaps     3.09 m wide
#   3  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   4  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   5  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   6  1× eighteensound-2way-15 + 1× tecnare-m2122 + 3× concert-audio-ef6    2.8096 m wide
#
# Subs reach 2.983 m against a 2.0 m interface. The stack is 3.943 m of cabinet.
#   * the 2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90° row is 3.112 m on a
#     3.090 m row, so it overhangs 11 mm each side
#
# main-psl — psl, 15 cabinets in 5 rows:
#
#   1  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   2  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   3  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   4  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   5  1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× tms4                 1.5056 m wide
#
# Subs reach 2.36 m against a 2.0 m interface. The stack is 3.5 m of cabinet.
#
# main-innschleife — innschleife, 16 cabinets in 6 rows:
#
#   1  2× kicker-15 rolled 270° + 2× kicker-15 rolled 90°                     2.34 m wide
#   2  1× wsx-18 rolled 270° + 1× wsx-18 rolled 90° at 140 mm gaps            2.34 m wide
#   3  1× wsx-18 rolled 270° + 1× wsx-18 rolled 90° at 140 mm gaps            2.34 m wide
#   4  1× sbh-18 rolled 270° + 1× sbh-18 rolled 90°                           2.42 m wide
#   5  1× sbh-18 rolled 270° + 1× sbh-18 rolled 90°                           2.42 m wide
#   6  1× tecnare-m2122 + 1× tms4 + 2× concert-audio-ef6                      2.236 m wide
#
# Subs reach 3.19 m against a 2.0 m interface. The stack is 4.33 m of cabinet.
#   * the subs reach 3.190 m against the 3.000 m ceiling asked for, so they stand 190 mm too high — 3.190 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× sbh-18 rolled 270° + 1× sbh-18 rolled 90° row is 2.420 m on a 2.340 m row, so it overhangs 40 mm each
#     side
#
id: stacked-1-tops-shared---v-------turned--column----center-low-----possible
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 25 cabinets in 6 rows
  - id: main-ours
    at: [-3.802, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: v
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0
        - device: concert-audio-ef6
          count: 3
        - device: tecnare-m2122
          count: 1
          aim: near
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # psl, 15 cabinets in 5 rows
  - id: main-psl
    at: [0.044, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: v
      from:
        - device: concert-audio-esx
          count: 12
          roll_mirror: 90.0
        - device: tms4
          count: 1
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # innschleife, 16 cabinets in 6 rows
  - id: main-innschleife
    at: [3.544, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: v
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - device: kicker-15
          roll_mirror: 90.0
        - device: concert-audio-ef6
          count: 2
        - device: tms4
          count: 1
          aim: near
        - device: tecnare-m2122
          count: 1
          aim: near

