id: stacked-1-tops-shared---free----mixed---centred---center-low-----possible
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 25 cabinets in 5 rows
  - id: main-ours
    at: [-8.127, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
