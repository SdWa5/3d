    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 15 cabinets in 5 rows
  - id: main-1
    at: [-4.5928, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
