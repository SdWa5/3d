id: stacked-1-tops-shared---free----mixed---centred---stereo-central-possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # innschleife, 14 cabinets in 6 rows
  - id: main-innschleife
    at: [-7.351, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      low_end: central
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - kicker-15
        - device: thl4
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # psl, 18 cabinets in 3 rows
  - id: main-psl
    at: [-1.726, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      low_end: central
      from:
        - device: concert-audio-esx
          count: 12
          roll_mirror: 90.0
        - device: concert-audio-ef6
          count: 3
        - device: tecnare-m2122
          count: 2
          aim: near
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # ours, 24 cabinets in 4 rows
  - id: main-ours
    at: [5.323, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      low_end: central
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - achenbach-18
        - device: concert-audio-ef6
          count: 2
        - device: tecnare-m2122
          count: 1
          aim: near
        - device: thl4
          count: 1
          aim: near

