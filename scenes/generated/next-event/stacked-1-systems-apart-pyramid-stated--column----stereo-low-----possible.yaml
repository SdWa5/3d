# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --clearance=0.24 --room-width=13 --room-height=4
#     --backdrop=truss-f33-2m:5:truss-tower-4m --system-interface=innschleife:1.6 --system-target=innschleife:1.75
#     --system-orientation=innschleife:turned --system-orientation=psl:turned --system-orientation=sdwa5:upright
#     --system-orientation=sepp:upright --system-low-end=innschleife:low --system-low-end=sdwa5:central
#     --system-low-end=sepp:central --stand=kicker-15 --systems=systems-apart --order=ours,psl,innschleife
#     --quantity=concert-audio-esf:0 --quantity=concert-audio-esx:12 --quantity=deco-panel-10x3-03:1
#     --quantity=hk-linear5-112x:0 --quantity=sub-60x60:0 --quantity=thebox-achat-112m:0 --quantity=thebox-achat-115m:0
#     --quantity=thebox-dsp-112:0 --quantity=thebox-pa302:0 --quantity=thebox-tp118-800:0 --quantity=thebox-tp218-1600:0
#     --quantity=tms4:1 --from=wsx-18 --from=sbh-18 --from=skram --from=flexy-folded-horn-hybrid --from=concert-audio-esx
#     --from=kicker-15 --from=achenbach-18 --from=tms4 --from=tecnare-m2122 --from=concert-audio-ef6 --from=tms2
#     --from=eighteensound-2way-15 --stacks=1 --align=stereo --low-end=low --shape=pyramid --mirror-style=column
#     --id=stacked --into=next-event
#
# 3 stacks side by side, with 0.24 m of air between them.
#
# main-ours — ours, 25 cabinets in 4 rows:
#
#   1  3× flexy-folded-horn-hybrid + 1× skram + 3× flexy-folded-horn-hybrid    4.276 m wide
#   2  3× flexy-folded-horn-hybrid + 1× skram + 3× flexy-folded-horn-hybrid    4.276 m wide
#   3  6× achenbach-18                                                            3.7 m wide
#   4  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122   2.5112 m wide
#
# Subs reach 2.428 m against a 2.0 m interface. The stack is 3.388 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
# main-psl — psl, 16 cabinets in 5 rows:
#
#   1  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   2  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   3  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   4  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   5  2× concert-audio-ef6 + 2× concert-audio-ef6                             2.412 m wide
#
# Subs reach 2.36 m against a 2.0 m interface. The stack is 3.14 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
# main-innschleife — innschleife, 15 cabinets in 4 rows:
#
#   1  1× wsx-18 rolled 270° + 1× sbh-18 rolled 270° + 1× sbh-18 rolled 90° + 1× wsx-18 rolled 90°     4.66 m wide
#   2  1× wsx-18 rolled 270° + 1× sbh-18 rolled 270° + 1× sbh-18 rolled 90° + 1× wsx-18 rolled 90°     4.66 m wide
#   3  4× kicker-15                                                              3.86 m wide
#   4  1× tms2 + 1× tms4 + 1× tms2                                              1.4 m wide
#
# Subs reach 1.71 m against a 1.6 m interface. The stack is 2.85 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
id: stacked-1-systems-apart-pyramid-stated--column----stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 25 cabinets in 4 rows
  - id: main-ours
    at: [-4.662, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      low_end: central
      shape: pyramid
      from:
        - skram
        - flexy-folded-horn-hybrid
        - achenbach-18
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near

  # psl, 16 cabinets in 5 rows
  - id: main-psl
    at: [-0.494, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: pyramid
      from:
        - device: concert-audio-esx
          count: 12
          roll_mirror: 90.0
        - concert-audio-ef6

  # innschleife, 15 cabinets in 4 rows
  - id: main-innschleife
    at: [3.866, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 1.6
      max_sub_height_m: 3.0
      target_sub_height_m: 1.75
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: pyramid
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - kicker-15
        - device: tms4
          count: 1
        - device: tms2
          aim: near

  # Backdrop: deco-panel-10x3-03 hung from 5× truss-f33-2m on two truss-tower-4m, 0.8 m behind the rig's deepest back face.
  # The truss tops out at 4 m. Each tower carries 45.975 kg.
  - id: backdrop-tower-left
    device: truss-tower-4m
    at: [-5.2, 1.282]
    extend_to_m: 3.742
  - id: backdrop-tower-right
    device: truss-tower-4m
    at: [4.597, 1.282]
    extend_to_m: 3.742
  - id: backdrop-truss
    device: truss-f33-2m
    at: [-0.302, 1.282]
    fly:
      height_m: 3.742
      id: backdrop
    row:
      count: 5
      gap_m: 0.0
  - id: backdrop-deco
    device: deco-panel-10x3-03
    at: [-0.302, 1.112]
    fly:
      height_m: 0.97
      id: backdrop

