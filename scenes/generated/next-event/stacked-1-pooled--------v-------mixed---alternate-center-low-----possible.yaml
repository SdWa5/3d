#   2  1× eighteensound-2way-15 + 1× thl4 + 2× tecnare-m2122 + 5× concert-audio-ef6 + 1× tecnare-m2122 + 1× thl4 + 1× eighteensound-2way-15   6.5912 m wide
#
# Subs reach 0.61 m against a 2.0 m interface. The stack is 1.75 m of cabinet.
#   * the subs reach 0.610 m against the 2.000 m interface asked for, so the tops sit 1390 mm lower than ideal —
#     0.610 m is the most they reach while every tier is still carried
