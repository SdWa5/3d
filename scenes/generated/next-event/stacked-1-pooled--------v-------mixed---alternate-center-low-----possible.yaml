id: stacked-1-pooled--------v-------mixed---alternate-center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: concert-audio-esx
          count: 12
          roll_mirror: 90.0
        - achenbach-18
        - kicker-15
        - device: tecnare-m2122
          aim: near
        - device: concert-audio-ef6
          count: 5
        - device: thl4
          aim: near
        - device: eighteensound-2way-15
          aim: near

