        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - kicker-15
        - device: concert-audio-ef6
          count: 1
        - device: tms4
          count: 1
          aim: near
        - device: tecnare-m2122
          count: 1
          aim: near
        - device: eighteensound-2way-15
          count: 1
