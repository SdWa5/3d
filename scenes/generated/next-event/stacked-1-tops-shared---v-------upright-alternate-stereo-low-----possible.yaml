id: stacked-1-tops-shared---v-------upright-alternate-stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 26 cabinets in 4 rows
  - id: main-ours
    at: [-4.067, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - skram
        - flexy-folded-horn-hybrid
        - achenbach-18
        - device: concert-audio-ef6
          count: 3
        - device: tms4
          count: 1
          aim: near
        - device: tecnare-m2122
          count: 1
          aim: near
        - device: eighteensound-2way-15
          count: 1
          aim: near

