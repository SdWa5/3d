# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=tops-shared --order=ours,psl,innschleife
#     --quantity=concert-audio-ef6:5 --quantity=concert-audio-esf:0 --quantity=concert-audio-esx:12
#     --quantity=hk-linear5-112x:0 --quantity=sub-60x60:0 --quantity=thebox-achat-112m:0 --quantity=thebox-achat-115m:0
#     --quantity=thebox-dsp-112:0 --quantity=thebox-pa302:0 --quantity=thebox-tp118-800:0 --quantity=thebox-tp218-1600:0
#     --quantity=tms2:0 --from=wsx-18 --from=sbh-18 --from=skram --from=flexy-folded-horn-hybrid --from=concert-audio-esx
#     --from=kicker-15 --from=achenbach-18 --from=tms4 --from=tecnare-m2122 --from=concert-audio-ef6
#     --from=eighteensound-2way-15 --stacks=1 --align=stereo --low-end=low --shape=v --mirror-style=alternate --id=stacked
#     --into=next-event
#
# 3 stacks side by side, with 0.5 m of air between them.
#
# main-ours — ours, 20 cabinets in 4 rows:
#
#   1  2× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 270° + 1× skram rolled 90° + 2× flexy-folded-horn-hybrid rolled 90°     4.98 m wide
#   2  3× achenbach-18 rolled 270° + 3× achenbach-18 rolled 90° at 276 mm gaps     4.98 m wide
#   3  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90° at 643 mm gaps    4.981 m wide
#   4  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90° at 643 mm gaps    4.981 m wide
#
# Subs reach 2.392 m against a 2.0 m interface. The stack is 2.392 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
# main-psl — psl, 12 cabinets in 4 rows:
#
#   1  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   2  2× concert-audio-esx rolled 270° + 1× concert-audio-esx rolled 90°     3.58 m wide
#   3  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   4  2× concert-audio-esx rolled 270° + 1× concert-audio-esx rolled 90°     3.58 m wide
#
# Subs reach 2.36 m against a 2.0 m interface. The stack is 2.36 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
# main-innschleife — innschleife, 24 cabinets in 2 rows:
#
#   1  2× sbh-18 rolled 270° + 2× wsx-18 rolled 270° + 2× kicker-15 rolled 270° + 2× kicker-15 rolled 90° + 2× wsx-18 rolled 90° + 2× sbh-18 rolled 90°     11.7 m wide
#   2  2× concert-audio-ef6 + 1× tms4 + 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× concert-audio-ef6 + 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× tms4 + 2× concert-audio-ef6   6.5912 m wide
#
# Subs reach 0.95 m against a 2.0 m interface. The stack is 2.09 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 0.950 m against the 2.000 m interface asked for, so the tops sit 1050 mm lower than ideal —
#     0.950 m is the most they reach while every tier is still carried
#
id: stacked-1-tops-shared---v-------turned--alternate-stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 20 cabinets in 4 rows
  - id: main-ours
    at: [-8.442, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0

  # psl, 12 cabinets in 4 rows
  - id: main-psl
    at: [-3.6615, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - device: concert-audio-esx
          count: 12
          roll_mirror: 90.0

  # innschleife, 24 cabinets in 2 rows
  - id: main-innschleife
    at: [4.4785, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - device: kicker-15
          roll_mirror: 90.0
        - device: concert-audio-ef6
          count: 5
        - device: tms4
          aim: near
        - device: tecnare-m2122
          aim: near
        - device: eighteensound-2way-15
          aim: near

