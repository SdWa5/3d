# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --from=gmss-wall-bass --from=gmss-mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=gmss-iq-sub --from=tecnare-m2122 --from=gmss-turbo-top
#     --stacks=1 --align=stereo --shape=v --mirror-style=alternate --id=stacked-gmss-sdwa5-1
#
# What it deals out today:
#
#   1  3× gmss-iq-sub rolled 270° + 1× gmss-nuke rolled 270° + 6× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 270° + 1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass rolled 90° + 1× skram rolled 90° + 6× flexy-folded-horn-hybrid rolled 90° + 1× gmss-nuke rolled 90° + 3× gmss-iq-sub rolled 90°   19.804 m wide
#   2  1× tecnare-m2122 + 1× gmss-turbo-top + 1× tecnare-m2122 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× tecnare-m2122     2.95 m wide
#
# Subs reach 0.66 m against a 2.0 m interface. The stack is 1.62 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-mid-bass: LEFT OUT, it cannot be carried in this stack — the 1× gmss-nuke rolled 270° row is a single
#     column, and 2 of them are in this stack — a one-wide tier is a pillar rather than a rig, however well each cabinet
#     is carried. Widen the rows and accept a lower interface, or take cabinets out of the stack
#   * the subs reach 0.660 m against the 2.000 m interface asked for, so the tops sit 1340 mm lower than ideal —
#     0.660 m is the most they reach while every tier is still carried
#
id: stacked-gmss-sdwa5-1-v-------turned--alternate-stereo
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - tecnare-m2122
        - device: gmss-turbo-top
          aim: near

