id: stacked-gmss-sepp--3-tops-shared---free----turned--centred---stereo-possible
name: "Solved rig — 6 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-2, 7 cabinets in 4 rows
  - id: main-gmss-2
    at: [-4.742, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          count: 2
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1

  # sepp-2, 3 cabinets in 2 rows
  - id: main-sepp-2
    at: [-2.222, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      from:
        - device: achenbach-18
          count: 2
          roll_mirror: 90.0
        - device: gmss-turbo-top
          count: 1

  # gmss-1, 3 cabinets in 2 rows
  - id: main-gmss-1
    at: [-0.432, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: gmss-iq-sub
          count: 2
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1

  # gmss-3, 3 cabinets in 2 rows
