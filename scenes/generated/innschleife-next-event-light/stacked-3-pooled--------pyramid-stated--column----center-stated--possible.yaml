id: stacked-3-pooled--------pyramid-stated--column----center-stated--possible
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 7 cabinets in 4 rows
  - id: main-2
    at: [-1.742, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 1.6
      max_sub_height_m: 3.0
      target_sub_height_m: 1.75
      gap_m: 0.02
      mirror_style: column
      shape: pyramid
      from:
        - device: wsx-18
          count: 2
          roll_mirror: 90.0
        - device: sbh-18
          count: 2
          roll_mirror: 90.0
        - device: kicker-15
          count: 2
        - device: tms4
          count: 1

  # 1, 4 cabinets in 4 rows
