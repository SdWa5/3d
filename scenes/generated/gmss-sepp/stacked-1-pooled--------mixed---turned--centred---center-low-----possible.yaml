# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=center
#     --low-end=low --shape=mixed --mirror-style=centred --id=stacked --into=gmss-sepp
#
# What it deals out today:
#
#   1  3× achenbach-18 rolled 270° + 3× achenbach-18 rolled 90°                3.7 m wide
#   2  2× iq-sub rolled 270° + 1× iq-sub + 2× iq-sub rolled 90° at 123 mm gaps    3.702 m wide
#   3  1× wall-bass rolled 270° + 1× wall-bass + 1× iq-sub rolled 90°        2.77 m wide
#   4  1× nuke rolled 270° + 1× mid-bass + 1× nuke rolled 90°                2.78 m wide
#   5  2× turbo-top + 2× eighteensound-2way-15 + 1× turbo-top                2.3612 m wide
#
# Subs reach 3.26 m against a 2.0 m interface. The stack is 4.096 m of cabinet.
#   * the subs reach 3.260 m against the 3.000 m ceiling asked for, so they stand 260 mm too high — 3.260 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * row 3 (1× wall-bass rolled 270° + 1× wall-bass + 1× iq-sub rolled 90°) is not mirror-symmetric, and the
#     search found no symmetric arrangement of these cabinets that stands
#
id: stacked-1-pooled--------mixed---turned--centred---center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: mixed
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - device: mid-bass
          roll_mirror: 90.0
        - device: nuke
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: turbo-top
          aim: near
