# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=stereo
#     --low-end=low --shape=mixed --mirror-style=column --id=stacked --into=gmss-sepp
#
# What it deals out today:
#
#   1  3× iq-sub rolled 270° + 3× iq-sub rolled 90°                           4.12 m wide
#   2  6× achenbach-18 at 104 mm gaps                                            4.12 m wide
#   3  1× wall-bass rolled 270° + 1× wall-bass rolled 90° + 1× nuke rolled 90°     3.61 m wide
#   4  1× nuke rolled 270° + 1× mid-bass at 299 mm gaps                       2.269 m wide
#   5  1× eighteensound-2way-15 + 1× turbo-top + 1× turbo-top + 1× turbo-top + 1× eighteensound-2way-15   2.3612 m wide
#
# Subs reach 2.38 m against a 2.0 m interface. The stack is 3.216 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× eighteensound-2way-15 + 1× turbo-top + 1× turbo-top + 1× turbo-top + 1× eighteensound-2way-15 row is
#     2.361 m on a 2.269 m row, so it overhangs 46 mm each side
#
id: stacked-1-pooled--------mixed---mixed---column----stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: mixed
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - achenbach-18
        - device: iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: turbo-top
          aim: near
