# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=3 --align=center
#     --low-end=low --shape=pyramid --mirror-style=alternate --id=stacked --into=gmss-sepp
#
# 3 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 6 cabinets in 3 rows:
#
#   1  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   2  2× achenbach-18                                                           1.22 m wide
#   3  1× eighteensound-2way-15 + 1× turbo-top                                0.9356 m wide
#
# Subs reach 1.13 m against a 2.0 m interface. The stack is 1.966 m of cabinet.
#   * the subs reach 1.130 m against the 2.000 m interface asked for, so the tops sit 870 mm lower than ideal —
#     1.130 m is the most they reach while every tier is still carried
#
# main-2 — 2, 10 cabinets in 5 rows:
#
#   1  1× wall-bass rolled 270° + 1× wall-bass rolled 90°                     2.82 m wide
#   2  1× nuke rolled 270° + 1× iq-sub rolled 90° + 1× nuke rolled 270°     2.25 m wide
#   3  1× achenbach-18 + 1× iq-sub rolled 90° + 1× achenbach-18               1.91 m wide
#   4  1× mid-bass                                                                1.2 m wide
#   5  1× turbo-top                                                              0.45 m wide
#
# Subs reach 2.35 m against a 2.0 m interface. The stack is 3.06 m of cabinet.
#
# main-3 — 3, 6 cabinets in 3 rows:
#
#   1  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   2  2× achenbach-18                                                           1.22 m wide
#   3  1× turbo-top + 1× eighteensound-2way-15                                0.9356 m wide
#
# Subs reach 1.13 m against a 2.0 m interface. The stack is 1.966 m of cabinet.
#   * the subs reach 1.130 m against the 2.000 m interface asked for, so the tops sit 870 mm lower than ideal —
#     1.130 m is the most they reach while every tier is still carried
