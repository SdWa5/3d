#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=2 --align=stereo
#     --low-end=central --shape=tower --mirror-style=alternate --id=stacked --into=gmss-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 14 cabinets in 5 rows:
#
#   1  1× wall-bass rolled 270° + 1× wall-bass rolled 90°                     2.82 m wide
#   2  2× iq-sub rolled 270° + 1× iq-sub rolled 90° at 405 mm gaps            2.82 m wide
#   3  3× achenbach-18 at 510 mm gaps                                            2.82 m wide
#   4  1× nuke rolled 270° + 1× mid-bass + 1× nuke rolled 90° at 40 mm gaps     2.82 m wide
#   5  1× turbo-top + 1× eighteensound-2way-15 + 1× turbo-top                1.4056 m wide
#
# Subs reach 2.38 m against a 2.0 m interface. The stack is 3.216 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * wall-bass: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * nuke: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#
# main-1 — 1, 8 cabinets in 3 rows:
#
#   1  2× iq-sub rolled 270° + 1× iq-sub rolled 90°                           2.05 m wide
#   2  3× achenbach-18 at 125 mm gaps                                            2.05 m wide
#   3  1× turbo-top + 1× eighteensound-2way-15                                0.9356 m wide
#
# Subs reach 1.13 m against a 2.0 m interface. The stack is 1.966 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * wall-bass: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * nuke: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 1.130 m against the 2.000 m interface asked for, so the tops sit 870 mm lower than ideal —
#     1.130 m is the most they reach while every tier is still carried
#
id: stacked-2-pooled--------tower---mixed---alternate-stereo-central-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 14 cabinets in 5 rows
  - id: main-2
    at: [-1.6097, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: tower
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 2
          aim: near

  # 1, 8 cabinets in 3 rows
  - id: main-1
    at: [1.4046, -0.15]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: tower
      mirror: true             # the mirror image of stack 1
      from:
        - device: achenbach-18
          count: 3
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 1
          aim: near
