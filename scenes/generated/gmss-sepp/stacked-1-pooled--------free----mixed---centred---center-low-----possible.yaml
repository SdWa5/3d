# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=center
#     --low-end=low --shape=free --mirror-style=centred --id=stacked --into=gmss-sepp
#
# What it deals out today:
#
#   1  1× nuke rolled 270° + 2× wall-bass rolled 270° + 1× achenbach-18 + 1× nuke rolled 90° + 1× mid-bass     6.24 m wide
#   2  5× achenbach-18 + 1× iq-sub rolled 90°                                  3.77 m wide
#   3  2× iq-sub rolled 270° + 1× iq-sub + 2× iq-sub rolled 90°              3.29 m wide
#   4  2× turbo-top + 2× eighteensound-2way-15 + 1× turbo-top                2.3612 m wide
#
# Subs reach 1.93 m against a 2.0 m interface. The stack is 2.766 m of cabinet.
#   * the subs reach 1.930 m against the 2.000 m interface asked for, so the tops sit 70 mm lower than ideal — 1.930
#     m is the most they reach while every tier is still carried
#
id: stacked-1-pooled--------free----mixed---centred---center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - achenbach-18
        - device: iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: turbo-top
          aim: near
