id: stacked-2-pooled--------v-------mixed---column----stereo-central-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 12 cabinets in 6 rows
  - id: main-2
    at: [-1.6865, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      low_end: central
      shape: v
      from:
        - device: wall-bass
          count: 1
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          count: 1
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 2
          aim: near

  # 1, 10 cabinets in 5 rows
  - id: main-1
    at: [1.1007, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      low_end: central
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: wall-bass
          count: 1
          roll_mirror: 90.0
        - device: nuke
          count: 1
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 1
          aim: near
