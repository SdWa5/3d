# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=tops-shared --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=center
#     --low-end=low --shape=v --mirror-style=alternate --id=stacked --into=gmss-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 15 cabinets in 4 rows:
#
#   1  2× nuke + 1× mid-bass                                                    2.42 m wide
#   2  1× iq-sub + 2× wall-bass + 1× iq-sub                                    2.44 m wide
#   3  4× iq-sub at 107 mm gaps                                                 2.441 m wide
#   4  1× turbo-top + 2× eighteensound-2way-15 + 1× turbo-top                1.8912 m wide
#
# Subs reach 2.84 m against a 2.0 m interface. The stack is 3.676 m of cabinet.
#   * the 1× iq-sub + 2× wall-bass + 1× iq-sub row is 2.440 m on a 2.420 m row, so it overhangs 10 mm each side
#
# main-ours — ours, 7 cabinets in 4 rows:
#
#   1  2× achenbach-18                                                           1.22 m wide
#   2  2× achenbach-18                                                           1.22 m wide
#   3  2× achenbach-18                                                           1.22 m wide
#   4  1× turbo-top                                                              0.45 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 2.51 m of cabinet.
#   * the subs reach 1.800 m against the 2.000 m interface asked for, so the tops sit 200 mm lower than ideal —
#     1.800 m is the most they reach while every tier is still carried
#
id: stacked-1-tops-shared---v-------upright-alternate-center-low-----possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 15 cabinets in 4 rows
  - id: main-gmss
    at: [-1.162, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - wall-bass
        - mid-bass
        - nuke
        - iq-sub
        - eighteensound-2way-15
        - device: turbo-top
          count: 2
          aim: near

  # ours, 7 cabinets in 4 rows
  - id: main-ours
    at: [1.1685, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - achenbach-18
        - device: turbo-top
          count: 1
