# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=center
#     --low-end=low --shape=pyramid --mirror-style=centred --id=stacked --into=gmss-sepp
#
# What it deals out today:
#
#   1  6× achenbach-18                                                            3.7 m wide
#   2  2× iq-sub rolled 270° + 1× iq-sub + 2× iq-sub rolled 90°              3.29 m wide
#   3  1× wall-bass rolled 270° + 1× wall-bass + 1× iq-sub rolled 90°        2.77 m wide
#   4  1× nuke rolled 270° + 1× nuke + 1× mid-bass                             2.6 m wide
#   5  2× turbo-top + 2× eighteensound-2way-15 + 1× turbo-top                2.3612 m wide
#
# Subs reach 3.44 m against a 2.0 m interface. The stack is 4.276 m of cabinet.
#   * the subs reach 3.440 m against the 3.000 m ceiling asked for, so they stand 440 mm too high — 3.440 m is the
#     nearest the 2.500 m target that every tier is still carried at
#
id: stacked-1-pooled--------pyramid-mixed---centred---center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: pyramid
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - achenbach-18
        - device: iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: turbo-top
          aim: near
