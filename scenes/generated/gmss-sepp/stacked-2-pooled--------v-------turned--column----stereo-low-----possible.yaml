# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=2 --align=stereo
#     --low-end=low --shape=v --mirror-style=column --id=stacked --into=gmss-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 12 cabinets in 6 rows:
#
#   1  1× mid-bass rolled 90°                                                    0.5 m wide
#   2  1× nuke rolled 90°                                                       0.77 m wide
#   3  1× wall-bass rolled 90°                                                   1.4 m wide
#   4  1× achenbach-18 rolled 270° + 2× achenbach-18 rolled 90°               1.84 m wide
#   5  1× iq-sub rolled 270° + 2× iq-sub rolled 90°                           2.05 m wide
#   6  1× turbo-top + 1× eighteensound-2way-15 + 1× turbo-top                1.4056 m wide
#
# Subs reach 3.58 m against a 2.0 m interface. The stack is 4.416 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 3.580 m against the 3.000 m ceiling asked for, so they stand 580 mm too high — 3.580 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× nuke rolled 90° row is 0.770 m on a 0.500 m row, so it overhangs 135 mm each side
#   * the 1× wall-bass rolled 90° row is 1.400 m on a 0.770 m row, so it overhangs 315 mm each side
#   * the 1× achenbach-18 rolled 270° + 2× achenbach-18 rolled 90° row is 1.840 m on a 1.400 m row, so it
#     overhangs 220 mm each side
#   * the 1× iq-sub rolled 270° + 2× iq-sub rolled 90° row is 2.050 m on a 1.840 m row, so it overhangs 105 mm
#     each side
#
# main-1 — 1, 10 cabinets in 5 rows:
#
#   1  1× nuke rolled 270° + 1× wall-bass rolled 90°                          2.19 m wide
#   2  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90° at 990 mm gaps     2.19 m wide
#   3  1× iq-sub rolled 270° + 1× achenbach-18 rolled 90° at 920 mm gaps      2.19 m wide
#   4  1× iq-sub rolled 270° + 1× iq-sub rolled 90° at 850 mm gaps            2.19 m wide
#   5  1× turbo-top + 1× eighteensound-2way-15                                0.9356 m wide
#
# Subs reach 2.39 m against a 2.0 m interface. The stack is 3.226 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#
id: stacked-2-pooled--------v-------turned--column----stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 12 cabinets in 6 rows
  - id: main-2
    at: [-1.647, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      shape: v
      from:
        - device: wall-bass
          count: 1
          roll_mirror: 90.0
        - device: mid-bass
          roll_mirror: 90.0
        - device: nuke
          count: 1
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 2
          aim: near

  # 1, 10 cabinets in 5 rows
  - id: main-1
    at: [0.973, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: wall-bass
          count: 1
          roll_mirror: 90.0
        - device: nuke
          count: 1
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 1
          aim: near
