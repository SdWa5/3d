# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=center
#     --low-end=low --shape=free --mirror-style=alternate --id=stacked --into=gmss-sepp
#
# What it deals out today:
#
#   1  1× wall-bass rolled 270° + 1× wall-bass rolled 90°                     2.82 m wide
#   2  2× nuke rolled 270° + 1× mid-bass                                       2.78 m wide
#   3  4× achenbach-18                                                           2.46 m wide
#   4  1× iq-sub rolled 270° + 2× achenbach-18 + 1× iq-sub rolled 90°         2.6 m wide
#   5  2× iq-sub rolled 270° + 2× iq-sub rolled 90°                           2.74 m wide
#   6  2× turbo-top + 2× eighteensound-2way-15 + 1× turbo-top                2.3612 m wide
#
# Subs reach 2.98 m against a 2.0 m interface. The stack is 3.816 m of cabinet.
#   * the 1× iq-sub rolled 270° + 2× achenbach-18 + 1× iq-sub rolled 90° row is 2.600 m on a 2.460 m row, so it
#     overhangs 70 mm each side
#   * the 2× iq-sub rolled 270° + 2× iq-sub rolled 90° row is 2.740 m on a 2.600 m row, so it overhangs 70 mm each
#     side
#   * row 2 (2× nuke rolled 270° + 1× mid-bass) is not mirror-symmetric, and the search found no symmetric
#     arrangement of these cabinets that stands
#
id: stacked-1-pooled--------free----mixed---alternate-center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - achenbach-18
        - device: iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: turbo-top
          aim: near
