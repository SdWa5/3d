id: stacked-3-pooled--------tower---upright-alternate-center-low-----possible
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 6 cabinets in 3 rows
  - id: main-1
    at: [-2.703, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: tower
      mirror: true             # the mirror image of stack 1
      from:
        - device: achenbach-18
          count: 2
        - device: iq-sub
          count: 2
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # 2, 9 cabinets in 3 rows
  - id: main-2
    at: [-0.302, 0.0]
