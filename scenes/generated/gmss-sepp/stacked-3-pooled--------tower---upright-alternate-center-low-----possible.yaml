    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: tower
      from:
        - wall-bass
        - nuke
        - device: achenbach-18
          count: 2
        - device: iq-sub
          count: 2
        - device: turbo-top
          count: 1
          aim: near

  # 3, 6 cabinets in 3 rows
