#   2  2× iq-sub rolled 270° + 2× iq-sub rolled 90°                           2.74 m wide
#   3  1× nuke rolled 270° + 1× mid-bass rolled 90° + 1× nuke rolled 90°     2.08 m wide
#   4  3× turbo-top                                                              1.39 m wide
#
