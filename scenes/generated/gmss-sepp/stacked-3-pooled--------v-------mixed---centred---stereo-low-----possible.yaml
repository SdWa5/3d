#
#   1  1× mid-bass                                                                1.2 m wide
#   2  2× achenbach-18                                                           1.22 m wide
#   3  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   4  1× nuke rolled 270° + 1× nuke rolled 90°                               1.56 m wide
#   5  1× wall-bass rolled 270° + 1× wall-bass rolled 90°                     2.82 m wide
#   6  1× turbo-top                                                              0.45 m wide
#
# Subs reach 2.88 m against a 2.0 m interface. The stack is 3.59 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 2× achenbach-18 row is 1.220 m on a 1.200 m row, so it overhangs 10 mm each side
#   * the 1× iq-sub rolled 270° + 1× iq-sub rolled 90° row is 1.360 m on a 1.220 m row, so it overhangs 70 mm each
#     side
#   * the 1× nuke rolled 270° + 1× nuke rolled 90° row is 1.560 m on a 1.360 m row, so it overhangs 100 mm each
#     side
#   * the 1× wall-bass rolled 270° + 1× wall-bass rolled 90° row is 2.820 m on a 1.560 m row, so it overhangs 630
#     mm each side
#
# main-3 — 3, 6 cabinets in 3 rows:
#
#   1  2× achenbach-18                                                           1.22 m wide
#   2  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   3  1× eighteensound-2way-15 + 1× turbo-top                                0.9356 m wide
#
# Subs reach 1.13 m against a 2.0 m interface. The stack is 1.966 m of cabinet.
