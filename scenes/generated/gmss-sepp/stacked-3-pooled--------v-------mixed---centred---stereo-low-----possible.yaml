#   2  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   3  1× turbo-top + 1× eighteensound-2way-15                                0.9356 m wide
#
# Subs reach 1.13 m against a 2.0 m interface. The stack is 1.966 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.130 m against the 2.000 m interface asked for, so the tops sit 870 mm lower than ideal —
#     1.130 m is the most they reach while every tier is still carried
#   * the 1× iq-sub rolled 270° + 1× iq-sub rolled 90° row is 1.360 m on a 1.220 m row, so it overhangs 70 mm each
