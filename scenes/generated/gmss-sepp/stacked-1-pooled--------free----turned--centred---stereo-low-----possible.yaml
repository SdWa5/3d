# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=stereo
#     --low-end=low --shape=free --mirror-style=centred --id=stacked --into=gmss-sepp
#
# What it deals out today:
#
#   1  1× wall-bass rolled 270° + 1× wall-bass rolled 90°                     2.82 m wide
#   2  1× nuke rolled 270° + 1× achenbach-18 rolled 270° + 1× achenbach-18 + 1× achenbach-18 rolled 90° + 1× nuke rolled 90°     3.42 m wide
#   3  1× iq-sub rolled 270° + 1× achenbach-18 rolled 270° + 1× achenbach-18 + 1× achenbach-18 rolled 90° + 1× iq-sub rolled 90°     3.22 m wide
#   4  2× iq-sub rolled 270° + 2× iq-sub rolled 90°                           2.74 m wide
#   5  1× eighteensound-2way-15 + 1× turbo-top + 1× turbo-top + 1× turbo-top + 1× eighteensound-2way-15   2.3612 m wide
#
# Subs reach 2.39 m against a 2.0 m interface. The stack is 3.226 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * mid-bass: LEFT OUT, it cannot be carried in this stack — a turbo-top in the 1× eighteensound-2way-15 + 1×
#     turbo-top + 1× turbo-top + 1× turbo-top + 1× eighteensound-2way-15 row would land on only 29% of its own width —
#     it is touching what carries it rather than sitting on it. Line the segments up with what carries them
#   * the 1× nuke rolled 270° + 1× achenbach-18 rolled 270° + 1× achenbach-18 + 1× achenbach-18 rolled 90° +
#     1× nuke rolled 90° row is 3.420 m on a 2.820 m row, so it overhangs 300 mm each side
#
id: stacked-1-pooled--------free----turned--centred---stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - device: nuke
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: turbo-top
          aim: near

