id: stacked-2-pooled--------v-------mixed---centred---stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 10 cabinets in 5 rows
  - id: main-1
    at: [-2.167, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: wall-bass
          count: 1
          roll_mirror: 90.0
        - device: nuke
          count: 1
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # 2, 12 cabinets in 4 rows
  - id: main-2
    at: [1.043, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      from:
        - device: wall-bass
          count: 1
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          count: 1
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 2
          aim: near
