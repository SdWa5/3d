# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=2 --align=stereo
#     --low-end=low --shape=v --mirror-style=centred --id=stacked --into=gmss-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 10 cabinets in 5 rows:
#
#   1  1× nuke rolled 270° + 1× wall-bass rolled 90°                          2.19 m wide
#   2  2× achenbach-18 at 990 mm gaps                                            2.19 m wide
#   3  1× iq-sub rolled 270° + 1× achenbach-18 at 920 mm gaps                  2.19 m wide
#   4  1× iq-sub rolled 270° + 1× iq-sub rolled 90° at 850 mm gaps            2.19 m wide
#   5  1× turbo-top + 1× eighteensound-2way-15                                0.9356 m wide
#
# Subs reach 2.39 m against a 2.0 m interface. The stack is 3.226 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * row 1 (1× nuke rolled 270° + 1× wall-bass rolled 90°) is not mirror-symmetric, and the search found no
#     symmetric arrangement of these cabinets that stands
#   * row 3 (1× iq-sub rolled 270° + 1× achenbach-18 at 920 mm gaps) is not mirror-symmetric, and the search found
#     no symmetric arrangement of these cabinets that stands
#
# main-2 — 2, 12 cabinets in 4 rows:
#
#   1  1× wall-bass rolled 270° + 1× nuke + 1× mid-bass                       3.23 m wide
#   2  3× achenbach-18 at 715 mm gaps                                            3.23 m wide
#   3  1× iq-sub rolled 270° + 1× iq-sub + 1× iq-sub rolled 90° at 680 mm gaps     3.23 m wide
#   4  1× turbo-top + 1× eighteensound-2way-15 + 1× turbo-top                1.4056 m wide
#
# Subs reach 2.04 m against a 2.0 m interface. The stack is 2.876 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * row 1 (1× wall-bass rolled 270° + 1× nuke + 1× mid-bass) is not mirror-symmetric, and the search found no
