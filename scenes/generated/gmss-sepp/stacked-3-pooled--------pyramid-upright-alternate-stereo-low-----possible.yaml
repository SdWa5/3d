# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=3 --align=stereo
#     --low-end=low --shape=pyramid --mirror-style=alternate --id=stacked --into=gmss-sepp
#
# 3 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 10 cabinets in 6 rows:
#
#   1  2× wall-bass                                                              1.34 m wide
#   2  1× mid-bass                                                                1.2 m wide
#   3  2× achenbach-18                                                           1.22 m wide
#   4  2× nuke                                                                    1.2 m wide
#   5  2× iq-sub                                                                 1.08 m wide
#   6  1× turbo-top                                                              0.45 m wide
#
# Subs reach 3.94 m against a 2.0 m interface. The stack is 4.65 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.940 m against the 3.000 m ceiling asked for, so they stand 940 mm too high — 3.940 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 2× achenbach-18 row is 1.220 m on a 1.200 m row, so it overhangs 10 mm each side
#
# main-3 — 3, 6 cabinets in 3 rows:
#
#   1  2× achenbach-18                                                           1.22 m wide
#   2  2× iq-sub                                                                 1.08 m wide
#   3  1× eighteensound-2way-15 + 1× turbo-top                                0.9356 m wide
#
# Subs reach 1.27 m against a 2.0 m interface. The stack is 2.106 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.270 m against the 2.000 m interface asked for, so the tops sit 730 mm lower than ideal —
#     1.270 m is the most they reach while every tier is still carried
#
# main-1 — 1, 6 cabinets in 3 rows:
#
#   1  2× achenbach-18                                                           1.22 m wide
#   2  2× iq-sub                                                                 1.08 m wide
#   3  1× turbo-top + 1× eighteensound-2way-15                                0.9356 m wide
#
# Subs reach 1.27 m against a 2.0 m interface. The stack is 2.106 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.270 m against the 2.000 m interface asked for, so the tops sit 730 mm lower than ideal —
#     1.270 m is the most they reach while every tier is still carried
#
id: stacked-3-pooled--------pyramid-upright-alternate-stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 10 cabinets in 6 rows
  - id: main-2
    at: [-2.022, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - wall-bass
        - mid-bass
        - nuke
        - device: achenbach-18
          count: 2
        - device: iq-sub
          count: 2
        - device: turbo-top
          count: 1
          aim: near

  # 3, 6 cabinets in 3 rows
  - id: main-3
    at: [-0.242, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: achenbach-18
          count: 2
        - device: iq-sub
          count: 2
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # 1, 6 cabinets in 3 rows
  - id: main-1
    at: [1.478, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: achenbach-18
          count: 2
        - device: iq-sub
          count: 2
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 1
          aim: near
