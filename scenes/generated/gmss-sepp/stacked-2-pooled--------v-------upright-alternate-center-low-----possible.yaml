# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=2 --align=center
#     --low-end=low --shape=v --mirror-style=alternate --id=stacked --into=gmss-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 10 cabinets in 4 rows:
#
#   1  1× nuke + 1× wall-bass                                                   1.27 m wide
#   2  3× iq-sub                                                                 1.63 m wide
#   3  3× achenbach-18                                                           1.84 m wide
#   4  1× eighteensound-2way-15 + 1× turbo-top                                0.9356 m wide
#
# Subs reach 2.67 m against a 2.0 m interface. The stack is 3.506 m of cabinet.
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the 3× iq-sub row is 1.630 m on a 1.270 m row, so it overhangs 180 mm each side
#   * the 3× achenbach-18 row is 1.840 m on a 1.630 m row, so it overhangs 105 mm each side
#
# main-2 — 2, 12 cabinets in 6 rows:
#
#   1  1× nuke                                                                   0.59 m wide
#   2  1× wall-bass                                                              0.66 m wide
#   3  1× mid-bass                                                                1.2 m wide
#   4  3× iq-sub                                                                 1.63 m wide
#   5  3× achenbach-18                                                           1.84 m wide
#   6  1× turbo-top + 1× eighteensound-2way-15 + 1× turbo-top                1.4056 m wide
#
# Subs reach 3.94 m against a 2.0 m interface. The stack is 4.776 m of cabinet.
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 3.940 m against the 3.000 m ceiling asked for, so they stand 940 mm too high — 3.940 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× wall-bass row is 0.660 m on a 0.590 m row, so it overhangs 35 mm each side
#   * the 1× mid-bass row is 1.200 m on a 0.660 m row, so it overhangs 270 mm each side
#   * the 3× iq-sub row is 1.630 m on a 1.200 m row, so it overhangs 215 mm each side
#   * the 3× achenbach-18 row is 1.840 m on a 1.630 m row, so it overhangs 105 mm each side
#
id: stacked-2-pooled--------v-------upright-alternate-center-low-----possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 10 cabinets in 4 rows
  - id: main-1
    at: [-1.472, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: wall-bass
          count: 1
        - device: nuke
          count: 1
        - device: achenbach-18
          count: 3
        - device: iq-sub
          count: 3
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # 2, 12 cabinets in 6 rows
  - id: main-2
    at: [0.868, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - device: wall-bass
          count: 1
        - mid-bass
        - device: nuke
          count: 1
        - device: achenbach-18
          count: 3
        - device: iq-sub
          count: 3
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 2
          aim: near
