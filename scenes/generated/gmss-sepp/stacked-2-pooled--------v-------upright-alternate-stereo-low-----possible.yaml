id: stacked-2-pooled--------v-------upright-alternate-stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 14 cabinets in 3 rows
  - id: main-2
    at: [-1.5132, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - wall-bass
        - mid-bass
        - nuke
        - device: achenbach-18
          count: 3
        - device: iq-sub
          count: 3
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 2
          aim: near

  # 1, 8 cabinets in 3 rows
  - id: main-1
    at: [1.9041, -0.15]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: achenbach-18
          count: 3
        - device: iq-sub
          count: 3
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 1
          aim: near
