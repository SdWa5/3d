# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=tops-shared --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=stereo
#     --low-end=central --shape=pyramid --mirror-style=alternate --id=stacked --into=gmss-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 14 cabinets in 5 rows:
#
#   1  2× iq-sub rolled 270° + 2× iq-sub rolled 90°                           2.74 m wide
#   2  1× iq-sub rolled 270° + 1× wall-bass rolled 270° + 1× iq-sub rolled 90°     2.78 m wide
#   3  1× wall-bass rolled 270° + 1× nuke rolled 90°                          2.19 m wide
#   4  1× nuke rolled 270° + 1× mid-bass                                       1.99 m wide
#   5  1× eighteensound-2way-15 + 1× turbo-top + 1× eighteensound-2way-15    1.4212 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.276 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× iq-sub rolled 270° + 1× wall-bass rolled 270° + 1× iq-sub rolled 90° row is 2.780 m on a 2.740 m
#     row, so it overhangs 20 mm each side
#
# main-ours — ours, 8 cabinets in 4 rows:
#
#   1  2× achenbach-18                                                           1.22 m wide
#   2  2× achenbach-18                                                           1.22 m wide
#   3  2× achenbach-18                                                           1.22 m wide
#   4  1× turbo-top + 1× turbo-top                                              0.92 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 2.51 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.800 m against the 2.000 m interface asked for, so the tops sit 200 mm lower than ideal —
#     1.800 m is the most they reach while every tier is still carried
#
id: stacked-1-tops-shared---pyramid-mixed---alternate-stereo-central-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 14 cabinets in 5 rows
  - id: main-gmss
    at: [-1.162, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      low_end: central
      shape: pyramid
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: turbo-top
          count: 1
          aim: near

  # ours, 8 cabinets in 4 rows
  - id: main-ours
    at: [1.338, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      low_end: central
      shape: pyramid
      from:
        - achenbach-18
        - device: turbo-top
          count: 2

