#   4  1× wall-bass + 1× nuke at 66 mm gaps                                    1.316 m wide
#   5  1× turbo-top + 1× eighteensound-2way-15 + 1× turbo-top                1.4056 m wide
#
# Subs reach 3.17 m against a 2.0 m interface. The stack is 4.006 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 3.170 m against the 3.000 m ceiling asked for, so they stand 170 mm too high — 3.170 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× wall-bass + 1× nuke at 66 mm gaps row is 1.316 m on a 1.200 m row, so it overhangs 58 mm each side
#   * the 1× turbo-top + 1× eighteensound-2way-15 + 1× turbo-top row is 1.406 m on a 1.316 m row, so it overhangs
#     45 mm each side
#   * row 4 (1× wall-bass + 1× nuke at 66 mm gaps) is not mirror-symmetric, and the search found no symmetric
#     arrangement of these cabinets that stands
#
# main-1 — 1, 10 cabinets in 4 rows:
#
#   1  3× achenbach-18                                                           1.84 m wide
#   2  3× iq-sub                                                                 1.63 m wide
#   3  1× nuke + 1× wall-bass                                                   1.27 m wide
#   4  1× turbo-top + 1× eighteensound-2way-15                                0.9356 m wide
#
# Subs reach 2.67 m against a 2.0 m interface. The stack is 3.506 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
