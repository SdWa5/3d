# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=tops-shared --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=stereo
#     --low-end=central --shape=v --mirror-style=centred --id=stacked --into=gmss-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 15 cabinets in 6 rows:
#
#   1  1× mid-bass                                                                1.2 m wide
#   2  1× nuke rolled 270° + 1× nuke rolled 90°                               1.56 m wide
#   3  1× wall-bass rolled 270° + 1× wall-bass rolled 90°                     2.82 m wide
#   4  1× iq-sub rolled 270° + 1× iq-sub + 1× iq-sub rolled 90° at 475 mm gaps     2.82 m wide
#   5  1× iq-sub rolled 270° + 1× iq-sub + 1× iq-sub rolled 90° at 475 mm gaps     2.82 m wide
#   6  1× eighteensound-2way-15 + 1× turbo-top + 1× turbo-top + 1× eighteensound-2way-15   1.8912 m wide
#
# Subs reach 3.09 m against a 2.0 m interface. The stack is 3.926 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.090 m against the 3.000 m ceiling asked for, so they stand 90 mm too high — 3.090 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× nuke rolled 270° + 1× nuke rolled 90° row is 1.560 m on a 1.200 m row, so it overhangs 180 mm each
#     side
#   * the 1× wall-bass rolled 270° + 1× wall-bass rolled 90° row is 2.820 m on a 1.560 m row, so it overhangs 630
#     mm each side
#
# main-ours — ours, 7 cabinets in 4 rows:
#
#   1  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   2  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   3  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   4  1× turbo-top                                                              0.45 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 2.51 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.800 m against the 2.000 m interface asked for, so the tops sit 200 mm lower than ideal —
#     1.800 m is the most they reach while every tier is still carried
#
id: stacked-1-tops-shared---v-------turned--centred---stereo-central-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 15 cabinets in 6 rows
  - id: main-gmss
    at: [-1.162, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      low_end: central
      shape: v
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - device: mid-bass
          roll_mirror: 90.0
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: turbo-top
          count: 2
          aim: near

  # ours, 7 cabinets in 4 rows
  - id: main-ours
    at: [1.358, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      low_end: central
      shape: v
      from:
        - device: achenbach-18
          roll_mirror: 90.0
        - device: turbo-top
          count: 1

