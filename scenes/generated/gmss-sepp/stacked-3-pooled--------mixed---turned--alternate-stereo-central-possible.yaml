# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=3 --align=stereo
#     --low-end=central --shape=mixed --mirror-style=alternate --id=stacked --into=gmss-sepp
#
# 3 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 10 cabinets in 4 rows:
#
#   1  1× wall-bass rolled 270° + 1× wall-bass rolled 90°                     2.82 m wide
#   2  1× nuke rolled 270° + 1× iq-sub rolled 270° + 1× iq-sub rolled 90° + 1× nuke rolled 90°     2.94 m wide
#   3  1× achenbach-18 rolled 270° + 1× mid-bass rolled 90° + 1× achenbach-18 rolled 90°     1.74 m wide
#   4  1× turbo-top                                                              0.45 m wide
#
# Subs reach 2.45 m against a 2.0 m interface. The stack is 3.16 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× nuke rolled 270° + 1× iq-sub rolled 270° + 1× iq-sub rolled 90° + 1× nuke rolled 90° row is 2.940
#     m on a 2.820 m row, so it overhangs 60 mm each side
#
# main-3 — 3, 6 cabinets in 3 rows:
#
#   1  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   2  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   3  1× eighteensound-2way-15 + 1× turbo-top                                0.9356 m wide
#
# Subs reach 1.13 m against a 2.0 m interface. The stack is 1.966 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.130 m against the 2.000 m interface asked for, so the tops sit 870 mm lower than ideal —
#     1.130 m is the most they reach while every tier is still carried
#
# main-1 — 1, 6 cabinets in 3 rows:
#
#   1  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   2  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   3  1× turbo-top + 1× eighteensound-2way-15                                0.9356 m wide
#
# Subs reach 1.13 m against a 2.0 m interface. The stack is 1.966 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.130 m against the 2.000 m interface asked for, so the tops sit 870 mm lower than ideal —
#     1.130 m is the most they reach while every tier is still carried
#
id: stacked-3-pooled--------mixed---turned--alternate-stereo-central-possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 10 cabinets in 4 rows
  - id: main-2
    at: [-2.162, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: mixed
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - device: mid-bass
          roll_mirror: 90.0
        - device: nuke
          roll_mirror: 90.0
        - device: achenbach-18
          count: 2
          roll_mirror: 90.0
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: turbo-top
          count: 1
          aim: near

  # 3, 6 cabinets in 3 rows
  - id: main-3
    at: [0.488, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: mixed
      from:
        - device: achenbach-18
          count: 2
          roll_mirror: 90.0
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 1
          aim: near

  # 1, 6 cabinets in 3 rows
  - id: main-1
    at: [2.348, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: mixed
      mirror: true             # the mirror image of stack 1
      from:
        - device: achenbach-18
          count: 2
          roll_mirror: 90.0
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: turbo-top
          count: 1
          aim: near
