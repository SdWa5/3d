# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=stereo
#     --low-end=low --shape=tower --mirror-style=alternate --id=stacked --into=gmss-sepp
#
# What it deals out today:
#
#   1  5× achenbach-18                                                           3.08 m wide
#   2  4× iq-sub + 1× achenbach-18 at 90 mm gaps                                3.08 m wide
#   3  1× iq-sub + 2× wall-bass + 1× iq-sub at 234 mm gaps                    3.082 m wide
#   4  2× nuke + 1× mid-bass at 350 mm gaps                                     3.08 m wide
#   5  1× eighteensound-2way-15 + 1× turbo-top + 1× turbo-top + 1× turbo-top + 1× eighteensound-2way-15   2.3612 m wide
#
# Subs reach 3.44 m against a 2.0 m interface. The stack is 4.276 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.440 m against the 3.000 m ceiling asked for, so they stand 440 mm too high — 3.440 m is the
#     nearest the 2.500 m target that every tier is still carried at
#
id: stacked-1-pooled--------tower---upright-alternate-stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: tower
      from:
        - wall-bass
        - mid-bass
        - nuke
        - achenbach-18
        - iq-sub
        - eighteensound-2way-15
        - device: turbo-top
          aim: near
