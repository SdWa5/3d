# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=tops-shared --from=wall-bass --from=mid-bass --from=nuke
#     --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=stereo
#     --low-end=central --shape=v --mirror-style=centred --id=stacked --into=gmss-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 16 cabinets in 4 rows:
#
#   1  1× nuke rolled 270° + 1× nuke + 1× mid-bass                             2.6 m wide
#   2  1× wall-bass rolled 270° + 1× wall-bass + 1× iq-sub rolled 90°        2.77 m wide
#   3  2× iq-sub rolled 270° + 1× iq-sub + 2× iq-sub rolled 90°              3.29 m wide
#   4  1× eighteensound-2way-15 + 1× turbo-top + 1× turbo-top + 1× turbo-top + 1× eighteensound-2way-15   2.3612 m wide
#
# Subs reach 2.84 m against a 2.0 m interface. The stack is 3.676 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× wall-bass rolled 270° + 1× wall-bass + 1× iq-sub rolled 90° row is 2.770 m on a 2.600 m row, so it
#     overhangs 85 mm each side
#   * the 2× iq-sub rolled 270° + 1× iq-sub + 2× iq-sub rolled 90° row is 3.290 m on a 2.770 m row, so it
#     overhangs 260 mm each side
#   * row 1 (1× nuke rolled 270° + 1× nuke + 1× mid-bass) is not mirror-symmetric, and the search found no
#     symmetric arrangement of these cabinets that stands
#   * row 2 (1× wall-bass rolled 270° + 1× wall-bass + 1× iq-sub rolled 90°) is not mirror-symmetric, and the
#     search found no symmetric arrangement of these cabinets that stands
#
# main-ours — ours, 6 cabinets in 3 rows:
#
#   1  2× achenbach-18                                                           1.22 m wide
#   2  2× achenbach-18                                                           1.22 m wide
#   3  2× achenbach-18                                                           1.22 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 1.8 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.800 m against the 2.000 m interface asked for and **nothing stands on them** — this stack is
#     a sub wing, so the interface decides nothing about it
#
id: stacked-1-tops-shared---v-------mixed---centred---stereo-central-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 16 cabinets in 4 rows
  - id: main-gmss
    at: [-1.162, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      low_end: central
      shape: v
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: turbo-top
          aim: near

  # ours, 6 cabinets in 3 rows
  - id: main-ours
    at: [1.593, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      low_end: central
      shape: v
      from:
        - achenbach-18
