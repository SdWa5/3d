id: stacked-2-systems-apart-free----turned--centred---center-low-----possible
name: "Solved rig — 4 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours-2, 4 cabinets in 2 rows
  - id: main-ours-2
    at: [-4.947, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      from:
        - device: achenbach-18
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1

  # gmss-1, 4 cabinets in 2 rows
  - id: main-gmss-1
