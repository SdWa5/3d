# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=systems-apart --from=wall-bass --from=mid-bass
#     --from=nuke --from=achenbach-18 --from=iq-sub --from=eighteensound-2way-15 --from=turbo-top --stacks=1 --align=block
#     --low-end=low --shape=free --mirror-style=alternate --id=stacked --into=gmss-sepp
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 14 cabinets in 5 rows:
#
#   1  2× wall-bass                                                              1.34 m wide
#   2  1× nuke + 1× mid-bass                                                    1.81 m wide
#   3  1× iq-sub + 1× nuke + 2× iq-sub                                         2.24 m wide
#   4  3× iq-sub                                                                 1.63 m wide
#   5  3× turbo-top                                                              1.39 m wide
#
# Subs reach 3.61 m against a 2.0 m interface. The stack is 4.32 m of cabinet.
# `align: block` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.610 m against the 3.000 m ceiling asked for, so they stand 610 mm too high — 3.610 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× nuke + 1× mid-bass row is 1.810 m on a 1.340 m row, so it overhangs 235 mm each side
#   * the 1× iq-sub + 1× nuke + 2× iq-sub row is 2.240 m on a 1.810 m row, so it overhangs 215 mm each side
#
# main-ours — ours, 8 cabinets in 4 rows:
#
#   1  2× achenbach-18                                                           1.22 m wide
#   2  2× achenbach-18                                                           1.22 m wide
#   3  2× achenbach-18                                                           1.22 m wide
#   4  2× eighteensound-2way-15                                                0.9512 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 2.636 m of cabinet.
# `align: block` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.800 m against the 2.000 m interface asked for, so the tops sit 200 mm lower than ideal —
#     1.800 m is the most they reach while every tier is still carried
#
id: stacked-1-systems-apart-free----upright-alternate-block--low-----possible
name: "Solved rig — 2 stacks side by side, tiers justified"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 14 cabinets in 5 rows
  - id: main-gmss
    at: [-1.162, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: block
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      from:
        - wall-bass
        - mid-bass
        - nuke
        - iq-sub
        - turbo-top

  # ours, 8 cabinets in 4 rows
  - id: main-ours
    at: [1.068, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: block
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      from:
        - achenbach-18
        - eighteensound-2way-15

