# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=3.7 --orientation=turned --from=skram --from=flexy-folded-horn-hybrid
#     --from=tecnare-m2122 --stacks=1 --align=stereo --shape=free --mirror-style=centred --id=stacked-sdwa5-1
#
# What it deals out today:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 270° + 1× skram rolled 90° + 1× flexy-folded-horn-hybrid rolled 90°    3.414 m wide
#   2  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   3  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid + 1× flexy-folded-horn-hybrid rolled 90°    2.157 m wide
#   4  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid + 1× flexy-folded-horn-hybrid rolled 90°    2.157 m wide
#   5  1× tecnare-m2122 + 1× tecnare-m2122 + 1× tecnare-m2122                  1.54 m wide
#
# Subs reach 2.727 m against a 2.0 m interface. The stack is 3.687 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
id: stacked-sdwa5-1-free-turned-centred-stereo
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - tecnare-m2122

