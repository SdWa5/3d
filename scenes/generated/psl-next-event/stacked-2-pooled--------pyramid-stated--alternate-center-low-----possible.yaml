# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --clearance=0.24 --room-width=13 --room-height=4
#     --backdrop=truss-f33-2m:5:truss-tower-4m --system-interface=innschleife:1.6 --system-target=innschleife:1.75
#     --system-orientation=innschleife:turned --system-orientation=psl:turned --system-orientation=sdwa5:upright
#     --system-orientation=sepp:upright --system-low-end=innschleife:low --system-low-end=sdwa5:central
#     --system-low-end=sepp:central --stand=kicker-15 --systems=pooled --quantity=concert-audio-esf:0
#     --quantity=concert-audio-esx:12 --quantity=deco-panel-10x3-03:1 --quantity=hk-linear5-112x:0
#     --quantity=thebox-achat-112m:0 --quantity=thebox-achat-115m:0 --quantity=thebox-dsp-112:0 --quantity=thebox-pa302:0
#     --quantity=thebox-tp118-800:0 --quantity=thebox-tp218-1600:0 --from=concert-audio-esx --from=concert-audio-ef6
#     --stacks=2 --align=center --low-end=low --shape=pyramid --mirror-style=alternate --id=stacked --into=psl-next-event
#
# 2 stacks side by side, with 0.24 m of air between them.
#
# main-1 — 1, 8 cabinets in 4 rows:
#
#   1  1× concert-audio-esx rolled 270° + 1× concert-audio-esx rolled 90°     2.38 m wide
#   2  1× concert-audio-esx rolled 270° + 1× concert-audio-esx rolled 90°     2.38 m wide
#   3  1× concert-audio-esx rolled 270° + 1× concert-audio-esx rolled 90°     2.38 m wide
#   4  2× concert-audio-ef6                                                     1.196 m wide
#
# Subs reach 1.77 m against a 2.0 m interface. The stack is 2.55 m of cabinet.
#   * the subs reach 1.770 m against the 2.000 m interface asked for, so the tops sit 230 mm lower than ideal —
#     1.770 m is the most they reach while every tier is still carried
#
# main-2 — 2, 8 cabinets in 4 rows:
#
#   1  1× concert-audio-esx rolled 270° + 1× concert-audio-esx rolled 90°     2.38 m wide
#   2  1× concert-audio-esx rolled 270° + 1× concert-audio-esx rolled 90°     2.38 m wide
#   3  1× concert-audio-esx rolled 270° + 1× concert-audio-esx rolled 90°     2.38 m wide
#   4  2× concert-audio-ef6                                                     1.196 m wide
#
# Subs reach 1.77 m against a 2.0 m interface. The stack is 2.55 m of cabinet.
#   * the subs reach 1.770 m against the 2.000 m interface asked for, so the tops sit 230 mm lower than ideal —
#     1.770 m is the most they reach while every tier is still carried
#
id: stacked-2-pooled--------pyramid-stated--alternate-center-low-----possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 8 cabinets in 4 rows
  - id: main-1
    at: [-1.612, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: concert-audio-esx
          count: 6
          roll_mirror: 90.0
        - device: concert-audio-ef6
          count: 2

  # 2, 8 cabinets in 4 rows
  - id: main-2
    at: [1.008, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: concert-audio-esx
          count: 6
          roll_mirror: 90.0
        - device: concert-audio-ef6
          count: 2

  # Backdrop: deco-panel-10x3-03 hung from 5× truss-f33-2m on two truss-tower-4m, 0.8 m behind the rig's deepest back face.
  # The truss tops out at 4 m. Each tower carries 45.975 kg.
  - id: backdrop-tower-left
    device: truss-tower-4m
    at: [-5.2, 1.258]
    extend_to_m: 3.742
  - id: backdrop-tower-right
    device: truss-tower-4m
    at: [4.597, 1.258]
    extend_to_m: 3.742
  - id: backdrop-truss
    device: truss-f33-2m
    at: [-0.302, 1.258]
    fly:
      height_m: 3.742
      id: backdrop
    row:
      count: 5
      gap_m: 0.0
  - id: backdrop-deco
    device: deco-panel-10x3-03
    at: [-0.302, 1.088]
    fly:
      height_m: 0.97
      id: backdrop

