# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --room-width=13 --room-height=4 --system-interface=innschleife:1.6
#     --system-target=innschleife:1.75 --orientation=turned --systems=pooled --quantity=concert-audio-ef6:5
#     --quantity=concert-audio-esf:0 --quantity=concert-audio-esx:12 --quantity=hk-linear5-112x:0
#     --quantity=thebox-achat-112m:0 --quantity=thebox-achat-115m:0 --quantity=thebox-dsp-112:0 --quantity=thebox-pa302:0
#     --quantity=thebox-tp118-800:0 --quantity=thebox-tp218-1600:0 --from=concert-audio-esx --from=concert-audio-ef6
#     --stacks=2 --align=stereo --low-end=low --shape=pyramid --mirror-style=centred --id=stacked --into=psl-next-event
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 8 cabinets in 3 rows:
#
#   1  1× concert-audio-esx rolled 270° + 1× concert-audio-esx + 1× concert-audio-esx rolled 90°     2.99 m wide
#   2  1× concert-audio-esx rolled 270° + 1× concert-audio-esx + 1× concert-audio-esx rolled 90°     2.99 m wide
#   3  1× concert-audio-ef6 + 1× concert-audio-ef6                             1.196 m wide
#
# Subs reach 2.36 m against a 2.0 m interface. The stack is 3.14 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * concert-audio-ef6: SPLIT UNEVENLY, 1 of 5 over 2 stacks — 2 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#
# main-2 — 2, 9 cabinets in 3 rows:
#
#   1  1× concert-audio-esx rolled 270° + 1× concert-audio-esx + 1× concert-audio-esx rolled 90°     2.99 m wide
#   2  1× concert-audio-esx rolled 270° + 1× concert-audio-esx + 1× concert-audio-esx rolled 90°     2.99 m wide
#   3  1× concert-audio-ef6 + 1× concert-audio-ef6 + 1× concert-audio-ef6     1.804 m wide
#
# Subs reach 2.36 m against a 2.0 m interface. The stack is 3.14 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * concert-audio-ef6: SPLIT UNEVENLY, 1 of 5 over 2 stacks — 2 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#
id: stacked-2-pooled--------pyramid-turned--centred---stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 8 cabinets in 3 rows
  - id: main-1
    at: [-2.047, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: concert-audio-esx
          count: 6
          roll_mirror: 90.0
        - device: concert-audio-ef6
          count: 2

  # 2, 9 cabinets in 3 rows
  - id: main-2
    at: [1.443, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      from:
        - device: concert-audio-esx
          count: 6
          roll_mirror: 90.0
        - device: concert-audio-ef6
          count: 3

