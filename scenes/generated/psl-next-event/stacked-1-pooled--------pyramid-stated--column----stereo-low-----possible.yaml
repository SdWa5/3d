# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --clearance=0.24 --room-width=13 --room-height=4
#     --backdrop=truss-f33-2m:5:truss-tower-4m --system-interface=innschleife:1.6 --system-target=innschleife:1.75
#     --system-orientation=innschleife:turned --system-orientation=psl:turned --system-orientation=sdwa5:upright
#     --system-orientation=sepp:upright --system-low-end=innschleife:low --system-low-end=sdwa5:central
#     --system-low-end=sepp:central --stand=kicker-15 --systems=pooled --quantity=concert-audio-esf:0
#     --quantity=concert-audio-esx:12 --quantity=deco-panel-10x3-03:1 --quantity=hk-linear5-112x:0
#     --quantity=thebox-achat-112m:0 --quantity=thebox-achat-115m:0 --quantity=thebox-dsp-112:0 --quantity=thebox-pa302:0
#     --quantity=thebox-tp118-800:0 --quantity=thebox-tp218-1600:0 --from=concert-audio-esx --from=concert-audio-ef6
#     --stacks=1 --align=stereo --low-end=low --shape=pyramid --mirror-style=column --id=stacked --into=psl-next-event
#
# What it deals out today:
#
#   1  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   2  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   3  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   4  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   5  2× concert-audio-ef6 + 2× concert-audio-ef6                             2.412 m wide
#
# Subs reach 2.36 m against a 2.0 m interface. The stack is 3.14 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
id: stacked-1-pooled--------pyramid-stated--column----stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: pyramid
      from:
        - device: concert-audio-esx
          count: 12
          roll_mirror: 90.0
        - concert-audio-ef6

  # Backdrop: deco-panel-10x3-03 hung from 5× truss-f33-2m on two truss-tower-4m, 0.8 m behind the rig's deepest back face.
  # The truss tops out at 4 m. Each tower carries 45.975 kg.
  - id: backdrop-tower-left
    device: truss-tower-4m
    at: [-5.2, 1.258]
    extend_to_m: 3.742
  - id: backdrop-tower-right
    device: truss-tower-4m
    at: [4.597, 1.258]
    extend_to_m: 3.742
  - id: backdrop-truss
    device: truss-f33-2m
    at: [-0.302, 1.258]
    fly:
      height_m: 3.742
      id: backdrop
    row:
      count: 5
      gap_m: 0.0
  - id: backdrop-deco
    device: deco-panel-10x3-03
    at: [-0.302, 1.088]
    fly:
      height_m: 0.97
      id: backdrop

