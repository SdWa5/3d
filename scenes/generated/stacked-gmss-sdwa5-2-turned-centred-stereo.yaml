# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=4.4 --orientation=turned --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=gmss-iq-sub --from=tecnare-m2122
#     --from=gmss-turbo-top --stacks=2 --align=stereo --shape=pyramid --mirror-style=centred --id=stacked-gmss-sdwa5-2
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 20 cabinets in 5 rows:
#
#   1  2× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid + 2× flexy-folded-horn-hybrid rolled 90°    3.723 m wide
#   2  2× gmss-wall-bass rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× gmss-iq-sub rolled 90°    4.293 m wide
#   3  1× gmss-iq-sub rolled 270° + 1× skram rolled 270° + 1× skram rolled 90° + 1× gmss-iq-sub rolled 90°    3.228 m wide
#   4  1× gmss-nuke rolled 270° + 1× gmss-mid-bass + 1× gmss-nuke rolled 90°     2.78 m wide
#   5  1× tecnare-m2122 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× tecnare-m2122     1.96 m wide
#
# Subs reach 2.623 m against a 2.0 m interface. The stack is 3.583 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-wall-bass: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * skram: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * gmss-nuke: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * the 2× gmss-wall-bass rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× gmss-iq-sub rolled 90° row
#     is 4.293 m on a 3.723 m row, so it overhangs 285 mm each side
#
# main-1 — 1, 11 cabinets in 5 rows:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    1.546 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    1.546 m wide
#   3  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    1.546 m wide
#   4  1× gmss-iq-sub rolled 270° + 1× gmss-iq-sub + 1× gmss-iq-sub rolled 90°     1.91 m wide
#   5  1× gmss-turbo-top + 1× tecnare-m2122                                     0.97 m wide
#
# Subs reach 2.443 m against a 2.0 m interface. The stack is 3.403 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-wall-bass: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * skram: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * gmss-nuke: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * the 1× gmss-iq-sub rolled 270° + 1× gmss-iq-sub + 1× gmss-iq-sub rolled 90° row is 1.910 m on a 1.546 m
