id: stacked-gmss-sepp--2-systems-apart-v-------turned--centred---stereo-possible
name: "Solved rig — 4 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-1, 6 cabinets in 2 rows
  - id: main-gmss-1
    at: [-4.932, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: gmss-wall-bass
          count: 1
          roll_mirror: 90.0
        - device: gmss-nuke
          count: 1
          roll_mirror: 90.0
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: gmss-turbo-top
          count: 1

  # sepp-1, 4 cabinets in 2 rows
  - id: main-sepp-1
    at: [-1.472, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      mirror: true             # the mirror image of stack sepp-1
      from:
        - device: achenbach-18
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1

  # sepp-2, 4 cabinets in 2 rows
  - id: main-sepp-2
    at: [0.868, 0.0]
