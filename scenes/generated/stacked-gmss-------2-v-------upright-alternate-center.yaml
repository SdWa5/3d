# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --from=gmss-wall-bass --from=gmss-mid-bass --from=gmss-nuke
#     --from=gmss-iq-sub --from=gmss-turbo-top --stacks=2 --align=center --shape=v --mirror-style=alternate
#     --id=stacked-gmss-------2
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 6 cabinets in 3 rows:
#
#   1  1× gmss-nuke + 1× gmss-wall-bass                                         1.27 m wide
#   2  3× gmss-iq-sub                                                            1.63 m wide
#   3  1× gmss-turbo-top                                                         0.45 m wide
#
# Subs reach 2.07 m against a 2.0 m interface. The stack is 2.78 m of cabinet.
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * the 3× gmss-iq-sub row is 1.630 m on a 1.270 m row, so it overhangs 180 mm each side
#
# main-2 — 2, 8 cabinets in 5 rows:
#
#   1  1× gmss-nuke                                                              0.59 m wide
#   2  1× gmss-wall-bass                                                         0.66 m wide
#   3  1× gmss-mid-bass                                                           1.2 m wide
#   4  3× gmss-iq-sub                                                            1.63 m wide
#   5  2× gmss-turbo-top                                                         0.92 m wide
#
# Subs reach 3.34 m against a 2.0 m interface. The stack is 4.05 m of cabinet.
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 3.340 m against the 3.000 m ceiling asked for, so they stand 340 mm too high — 3.340 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× gmss-wall-bass row is 0.660 m on a 0.590 m row, so it overhangs 35 mm each side
#   * the 1× gmss-mid-bass row is 1.200 m on a 0.660 m row, so it overhangs 270 mm each side
#   * the 3× gmss-iq-sub row is 1.630 m on a 1.200 m row, so it overhangs 215 mm each side
#
id: stacked-gmss-------2-v-------upright-alternate-center
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 6 cabinets in 3 rows
  - id: main-1
    at: [-1.367, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: gmss-wall-bass
          count: 1
        - device: gmss-nuke
          count: 1
        - device: gmss-iq-sub
          count: 3
        - device: gmss-turbo-top
          count: 1

  # 2, 8 cabinets in 5 rows
  - id: main-2
    at: [0.763, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - device: gmss-wall-bass
          count: 1
        - gmss-mid-bass
        - device: gmss-nuke
          count: 1
        - device: gmss-iq-sub
          count: 3
        - device: gmss-turbo-top
          count: 2

