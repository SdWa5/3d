#
#   bin/console scene:stack --orientation=turned --systems=tops-shared --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=gmss-iq-sub --from=tecnare-m2122
#     --from=gmss-turbo-top --stacks=1 --align=center --shape=pyramid --mirror-style=alternate
#     --id=stacked-gmss-sdwa5-1-tops-shared--
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 13 cabinets in 4 rows:
#
#   1  3× gmss-iq-sub rolled 270° + 3× gmss-iq-sub rolled 90°                 4.12 m wide
#   2  2× gmss-wall-bass rolled 270° + 1× gmss-nuke rolled 90°                3.61 m wide
#   3  1× gmss-mid-bass rolled 270° + 1× gmss-nuke rolled 90°                 1.29 m wide
#   4  2× gmss-turbo-top                                                         0.92 m wide
#
# Subs reach 2.39 m against a 2.0 m interface. The stack is 3.1 m of cabinet.
#
# main-sdwa5 — sdwa5, 18 cabinets in 4 rows:
#
#   1  2× flexy-folded-horn-hybrid rolled 270° + 3× flexy-folded-horn-hybrid rolled 90°    3.895 m wide
#   2  3× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.895 m wide
#   3  1× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 270° + 1× skram rolled 90° + 1× flexy-folded-horn-hybrid rolled 90°    3.414 m wide
#   4  1× gmss-turbo-top + 3× tecnare-m2122                                     2.01 m wide
#
# Subs reach 1.792 m against a 2.0 m interface. The stack is 2.752 m of cabinet.
#   * the subs reach 1.792 m against the 2.000 m interface asked for, so the tops sit 208 mm lower than ideal —
#     1.792 m is the most they reach while every tier is still carried
#
id: stacked-gmss-sdwa5-1-tops-shared---pyramid-turned--alternate-center-possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 13 cabinets in 4 rows
  - id: main-gmss
    at: [-2.4995, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: gmss-mid-bass
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - device: gmss-turbo-top
          count: 2

  # sdwa5, 18 cabinets in 4 rows
  - id: main-sdwa5
    at: [2.008, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - tecnare-m2122
        - device: gmss-turbo-top
          count: 1
          aim: near

