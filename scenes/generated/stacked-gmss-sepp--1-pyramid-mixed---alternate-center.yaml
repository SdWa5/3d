# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --from=gmss-wall-bass --from=gmss-mid-bass --from=gmss-nuke
#     --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top --stacks=1 --align=center
#     --shape=pyramid --mirror-style=alternate --id=stacked-gmss-sepp--1
#
# What it deals out today:
#
#   1  3× gmss-iq-sub rolled 270° + 1× gmss-nuke rolled 270° + 3× achenbach-18 + 1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass rolled 90° + 3× achenbach-18 + 1× gmss-nuke rolled 90° + 3× gmss-iq-sub rolled 90° + 1× gmss-mid-bass    13.48 m wide
#   2  2× gmss-turbo-top + 2× eighteensound-2way-15 + 1× gmss-turbo-top      2.3612 m wide
#
# Subs reach 0.66 m against a 2.0 m interface. The stack is 1.496 m of cabinet.
#   * the subs reach 0.660 m against the 2.000 m interface asked for, so the tops sit 1340 mm lower than ideal —
#     0.660 m is the most they reach while every tier is still carried
#
id: stacked-gmss-sepp--1-pyramid-mixed---alternate-center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: gmss-nuke
          roll_mirror: 90.0
        - achenbach-18
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: gmss-turbo-top
          aim: near

