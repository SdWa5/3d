# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=2.8 --orientation=mixed --from=skram --from=flexy-folded-horn-hybrid
#     --from=achenbach-18 --from=tecnare-m2122 --from=eighteensound-2way-15 --stacks=2 --align=stereo --shape=pyramid
#     --mirror-style=centred --id=stacked-sdwa5-sepp-2
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 11 cabinets in 4 rows:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid + 1× flexy-folded-horn-hybrid rolled 90°    2.157 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid + 1× flexy-folded-horn-hybrid rolled 90°    2.157 m wide
#   3  3× achenbach-18                                                           1.84 m wide
#   4  1× eighteensound-2way-15 + 1× tecnare-m2122                            0.9856 m wide
#
# Subs reach 2.126 m against a 2.0 m interface. The stack is 3.086 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * skram: LEFT OUT, it cannot be carried in this stack — the 1× eighteensound-2way-15 + 1× tecnare-m2122 row is
#     0.986 m on a 0.610 m row, so it steps out 188 mm each side against the 47 mm a 0.466 m cabinet may sit proud —
#     `shape: pyramid` asks for a wall that does not widen as it rises
#
# main-2 — 2, 12 cabinets in 4 rows:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid + 1× flexy-folded-horn-hybrid rolled 90°    2.157 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid + 1× flexy-folded-horn-hybrid rolled 90°    2.157 m wide
#   3  3× achenbach-18                                                           1.84 m wide
#   4  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122        1.5056 m wide
#
# Subs reach 2.126 m against a 2.0 m interface. The stack is 3.086 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * skram: LEFT OUT, it cannot be carried in this stack — the 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1×
#     tecnare-m2122 row is 1.506 m on a 0.610 m row, so it steps out 448 mm each side against the 50 mm a 0.500 m cabinet
#     may sit proud — `shape: pyramid` asks for a wall that does not widen as it rises
#
id: stacked-sdwa5-sepp-2-mixed-centred-stereo
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 11 cabinets in 4 rows
  - id: main-1
    at: [-1.6305, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 2.8
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # 2, 12 cabinets in 4 rows
  - id: main-2
    at: [1.0265, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 2.8
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      from:
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
        - device: tecnare-m2122
          count: 2
        - device: eighteensound-2way-15
          count: 1
          aim: near

