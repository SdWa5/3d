# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=iq-sub --from=turbo-top --stacks=3 --align=center --low-end=low --shape=v --mirror-style=alternate
#     --id=stacked --into=gmss
#
# 3 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 3 cabinets in 2 rows:
#
#   1  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   2  1× turbo-top                                                              0.45 m wide
#
# Subs reach 0.53 m against a 2.0 m interface. The stack is 1.24 m of cabinet.
#   * the subs reach 0.530 m against the 2.000 m interface asked for, so the tops sit 1470 mm lower than ideal —
#     0.530 m is the most they reach while every tier is still carried
#
# main-2 — 2, 8 cabinets in 5 rows:
#
#   1  1× mid-bass rolled 90°                                                    0.5 m wide
#   2  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   3  1× nuke rolled 270° + 1× nuke rolled 90°                               1.56 m wide
#   4  1× wall-bass rolled 270° + 1× wall-bass rolled 90°                     2.82 m wide
#   5  1× turbo-top                                                              0.45 m wide
#
# Subs reach 2.98 m against a 2.0 m interface. The stack is 3.69 m of cabinet.
#   * the 1× iq-sub rolled 270° + 1× iq-sub rolled 90° row is 1.360 m on a 0.500 m row, so it overhangs 430 mm
#     each side
#   * the 1× nuke rolled 270° + 1× nuke rolled 90° row is 1.560 m on a 1.360 m row, so it overhangs 100 mm each
#     side
#   * the 1× wall-bass rolled 270° + 1× wall-bass rolled 90° row is 2.820 m on a 1.560 m row, so it overhangs 630
#     mm each side
#
# main-3 — 3, 3 cabinets in 2 rows:
#
#   1  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   2  1× turbo-top                                                              0.45 m wide
#
# Subs reach 0.53 m against a 2.0 m interface. The stack is 1.24 m of cabinet.
#   * the subs reach 0.530 m against the 2.000 m interface asked for, so the tops sit 1470 mm lower than ideal —
#     0.530 m is the most they reach while every tier is still carried
#
id: stacked-3-pooled--------v-------turned--alternate-center-low-----possible
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 3 cabinets in 2 rows
  - id: main-1
    at: [-2.892, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: turbo-top
          count: 1

  # 2, 8 cabinets in 5 rows
  - id: main-2
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - device: mid-bass
          roll_mirror: 90.0
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: turbo-top
          count: 1

  # 3, 3 cabinets in 2 rows
  - id: main-3
    at: [2.288, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: turbo-top
          count: 1
