# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=iq-sub --from=turbo-top --stacks=2 --align=stereo --low-end=central --shape=pyramid --mirror-style=alternate
#     --id=stacked --into=gmss
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 6 cabinets in 4 rows:
#
#   1  3× iq-sub                                                                 1.63 m wide
#   2  1× wall-bass                                                              0.66 m wide
#   3  1× nuke                                                                   0.59 m wide
#   4  1× turbo-top                                                              0.45 m wide
#
# Subs reach 2.84 m against a 2.0 m interface. The stack is 3.55 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#
# main-2 — 2, 8 cabinets in 4 rows:
#
#   1  3× iq-sub                                                                 1.63 m wide
#   2  1× mid-bass                                                                1.2 m wide
#   3  1× wall-bass + 1× nuke                                                   1.27 m wide
#   4  1× turbo-top + 1× turbo-top                                              0.92 m wide
#
# Subs reach 2.57 m against a 2.0 m interface. The stack is 3.28 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the 1× wall-bass + 1× nuke row is 1.270 m on a 1.200 m row, so it overhangs 35 mm each side
#   * row 3 (1× wall-bass + 1× nuke) is not mirror-symmetric, and the search found no symmetric arrangement of these
#     cabinets that stands
#
id: stacked-2-pooled--------pyramid-upright-alternate-stereo-central-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 6 cabinets in 4 rows
  - id: main-1
    at: [-1.367, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: wall-bass
          count: 1
        - device: nuke
          count: 1
        - device: iq-sub
          count: 3
        - device: turbo-top
          count: 1

  # 2, 8 cabinets in 4 rows
  - id: main-2
    at: [0.763, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: pyramid
      from:
        - device: wall-bass
          count: 1
        - mid-bass
        - device: nuke
          count: 1
        - device: iq-sub
          count: 3
        - device: turbo-top
          count: 2
