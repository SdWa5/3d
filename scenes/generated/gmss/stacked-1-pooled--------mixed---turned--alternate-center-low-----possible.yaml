# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=iq-sub --from=turbo-top --stacks=1 --align=center --low-end=low --shape=mixed --mirror-style=alternate
#     --id=stacked --into=gmss
#
# What it deals out today:
#
#   1  2× iq-sub rolled 270° + 3× iq-sub rolled 90°                           3.43 m wide
#   2  1× wall-bass rolled 270° + 1× iq-sub rolled 90° + 1× wall-bass rolled 270°     3.51 m wide
#   3  1× nuke rolled 270° + 1× mid-bass rolled 90° + 1× nuke rolled 90°     2.08 m wide
#   4  3× turbo-top                                                              1.39 m wide
#
# Subs reach 2.39 m against a 2.0 m interface. The stack is 3.1 m of cabinet.
#   * the 1× wall-bass rolled 270° + 1× iq-sub rolled 90° + 1× wall-bass rolled 270° row is 3.510 m on a 3.430 m
#     row, so it overhangs 40 mm each side
#
id: stacked-1-pooled--------mixed---turned--alternate-center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: mixed
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - device: mid-bass
          roll_mirror: 90.0
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - turbo-top
