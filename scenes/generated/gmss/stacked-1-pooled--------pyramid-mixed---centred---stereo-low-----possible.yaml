# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=iq-sub --from=turbo-top --stacks=1 --align=stereo --low-end=low --shape=pyramid --mirror-style=centred
#     --id=stacked --into=gmss
#
# What it deals out today:
#
#   1  1× iq-sub rolled 270° + 1× iq-sub rolled 90° at 932 mm gaps           2.272 m wide
#   2  1× iq-sub rolled 270° + 1× iq-sub rolled 90° at 1066 mm gaps          2.406 m wide
#   3  1× iq-sub rolled 270° + 1× iq-sub rolled 90° at 1200 mm gaps           2.54 m wide
#   4  1× wall-bass rolled 270° + 1× wall-bass rolled 90°                     2.82 m wide
#   5  1× nuke rolled 270° + 1× mid-bass + 1× nuke rolled 90°                2.78 m wide
#   6  1× turbo-top + 1× turbo-top + 1× turbo-top                              1.39 m wide
#
# Subs reach 2.84 m against a 2.0 m interface. The stack is 3.55 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× iq-sub rolled 270° + 1× iq-sub rolled 90° at 1066 mm gaps row is 2.406 m on a 2.272 m row, so it
#     overhangs 67 mm each side
#   * the 1× iq-sub rolled 270° + 1× iq-sub rolled 90° at 1200 mm gaps row is 2.540 m on a 2.406 m row, so it
#     overhangs 67 mm each side
#   * the 1× wall-bass rolled 270° + 1× wall-bass rolled 90° row is 2.820 m on a 2.540 m row, so it overhangs 140
#     mm each side
#
id: stacked-1-pooled--------pyramid-mixed---centred---stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: pyramid
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - turbo-top
