# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=iq-sub --from=turbo-top --stacks=2 --align=stereo --low-end=central --shape=mixed --mirror-style=alternate
#     --id=stacked --into=gmss
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 10 cabinets in 5 rows:
#
#   1  3× iq-sub                                                                 1.63 m wide
#   2  2× wall-bass at 310 mm gaps                                               1.63 m wide
#   3  1× mid-bass                                                                1.2 m wide
#   4  2× nuke                                                                    1.2 m wide
#   5  1× turbo-top + 1× turbo-top                                              0.92 m wide
#
# Subs reach 3.34 m against a 2.0 m interface. The stack is 4.05 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * wall-bass: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * nuke: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 3.340 m against the 3.000 m ceiling asked for, so they stand 340 mm too high — 3.340 m is the
#     nearest the 2.500 m target that every tier is still carried at
#
# main-1 — 1, 4 cabinets in 2 rows:
#
#   1  3× iq-sub                                                                 1.63 m wide
#   2  1× turbo-top                                                              0.45 m wide
#
# Subs reach 0.67 m against a 2.0 m interface. The stack is 1.38 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * wall-bass: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * nuke: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 0.670 m against the 2.000 m interface asked for, so the tops sit 1330 mm lower than ideal —
#     0.670 m is the most they reach while every tier is still carried
#
id: stacked-2-pooled--------mixed---upright-alternate-stereo-central-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 10 cabinets in 5 rows
  - id: main-2
    at: [-1.367, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: mixed
      from:
        - wall-bass
        - mid-bass
        - nuke
        - device: iq-sub
          count: 3
        - device: turbo-top
          count: 2

  # 1, 4 cabinets in 2 rows
  - id: main-1
    at: [0.763, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      shape: mixed
      mirror: true             # the mirror image of stack 1
      from:
        - device: iq-sub
          count: 3
        - device: turbo-top
          count: 1
