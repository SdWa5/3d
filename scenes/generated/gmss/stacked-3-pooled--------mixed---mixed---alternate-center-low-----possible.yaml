id: stacked-3-pooled--------mixed---mixed---alternate-center-low-----possible
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 3 cabinets in 2 rows
  - id: main-1
    at: [-2.952, -0.22]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: mixed
      mirror: true             # the mirror image of stack 1
      from:
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: turbo-top
          count: 1

  # 2, 8 cabinets in 4 rows
  - id: main-2
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: mixed
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: turbo-top
          count: 1

  # 3, 3 cabinets in 2 rows
  - id: main-3
    at: [2.348, -0.22]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: mixed
      from:
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: turbo-top
          count: 1
