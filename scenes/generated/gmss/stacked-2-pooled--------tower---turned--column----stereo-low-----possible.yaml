# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=iq-sub --from=turbo-top --stacks=2 --align=stereo --low-end=low --shape=tower --mirror-style=column
#     --id=stacked --into=gmss
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 8 cabinets in 2 rows:
#
#   1  1× iq-sub rolled 270° + 1× mid-bass rolled 270° + 1× wall-bass rolled 270° + 1× nuke rolled 90° + 2× iq-sub rolled 90°     4.78 m wide
#   2  1× turbo-top + 1× turbo-top                                              0.92 m wide
#
# Subs reach 1.2 m against a 2.0 m interface. The stack is 1.91 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 1.200 m against the 2.000 m interface asked for, so the tops sit 800 mm lower than ideal —
#     1.200 m is the most they reach while every tier is still carried
#   * row 1 (1× iq-sub rolled 270° + 1× mid-bass rolled 270° + 1× wall-bass rolled 270° + 1× nuke rolled 90° +
#     2× iq-sub rolled 90°) is not mirror-symmetric, and the search found no symmetric arrangement of these cabinets that
#     stands
#
# main-1 — 1, 6 cabinets in 3 rows:
#
#   1  2× iq-sub rolled 270° + 1× iq-sub rolled 90°                           2.05 m wide
#   2  1× nuke rolled 270° + 1× wall-bass rolled 90°                          2.19 m wide
#   3  1× turbo-top                                                              0.45 m wide
#
# Subs reach 1.19 m against a 2.0 m interface. The stack is 1.9 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 1.190 m against the 2.000 m interface asked for, so the tops sit 810 mm lower than ideal —
#     1.190 m is the most they reach while every tier is still carried
#   * the 1× nuke rolled 270° + 1× wall-bass rolled 90° row is 2.190 m on a 2.050 m row, so it overhangs 70 mm
#     each side
#   * row 2 (1× nuke rolled 270° + 1× wall-bass rolled 90°) is not mirror-symmetric, and the search found no
#     symmetric arrangement of these cabinets that stands
#
id: stacked-2-pooled--------tower---turned--column----stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 8 cabinets in 2 rows
  - id: main-2
    at: [-1.6225, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      shape: tower
      from:
        - device: wall-bass
          count: 1
          roll_mirror: 90.0
        - device: mid-bass
          roll_mirror: 90.0
        - device: nuke
          count: 1
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: turbo-top
          count: 2

  # 1, 6 cabinets in 3 rows
  - id: main-1
    at: [2.382, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      shape: tower
      mirror: true             # the mirror image of stack 1
      from:
        - device: wall-bass
          count: 1
          roll_mirror: 90.0
        - device: nuke
          count: 1
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: turbo-top
          count: 1
