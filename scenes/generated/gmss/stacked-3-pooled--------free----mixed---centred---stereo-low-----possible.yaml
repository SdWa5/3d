# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=iq-sub --from=turbo-top --stacks=3 --align=stereo --low-end=low --shape=free --mirror-style=centred
#     --id=stacked --into=gmss
#
# 3 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 8 cabinets in 2 rows:
#
#   1  1× iq-sub rolled 270° + 1× nuke rolled 270° + 1× wall-bass rolled 270° + 1× wall-bass + 1× nuke rolled 90° + 1× iq-sub rolled 90° + 1× mid-bass     6.26 m wide
#   2  1× turbo-top                                                              0.45 m wide
#
# Subs reach 1.4 m against a 2.0 m interface. The stack is 2.11 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.400 m against the 2.000 m interface asked for, so the tops sit 600 mm lower than ideal —
#     1.400 m is the most they reach while every tier is still carried
#   * row 1 (1× iq-sub rolled 270° + 1× nuke rolled 270° + 1× wall-bass rolled 270° + 1× wall-bass + 1× nuke
#     rolled 90° + 1× iq-sub rolled 90° + 1× mid-bass) is not mirror-symmetric, and the search found no symmetric
#     arrangement of these cabinets that stands
#
# main-3 — 3, 3 cabinets in 2 rows:
#
#   1  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   2  1× turbo-top                                                              0.45 m wide
#
# Subs reach 0.53 m against a 2.0 m interface. The stack is 1.24 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 0.530 m against the 2.000 m interface asked for, so the tops sit 1470 mm lower than ideal —
#     0.530 m is the most they reach while every tier is still carried
#
# main-1 — 1, 3 cabinets in 2 rows:
#
#   1  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   2  1× turbo-top                                                              0.45 m wide
#
# Subs reach 0.53 m against a 2.0 m interface. The stack is 1.24 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 0.530 m against the 2.000 m interface asked for, so the tops sit 1470 mm lower than ideal —
#     0.530 m is the most they reach while every tier is still carried
#
id: stacked-3-pooled--------free----mixed---centred---stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 8 cabinets in 2 rows
  - id: main-2
    at: [-2.162, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: turbo-top
          count: 1

  # 3, 3 cabinets in 2 rows
  - id: main-3
    at: [2.148, -0.22]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      from:
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: turbo-top
          count: 1

  # 1, 3 cabinets in 2 rows
  - id: main-1
    at: [4.008, -0.22]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      mirror: true             # the mirror image of stack 1
      from:
        - device: iq-sub
          count: 2
          roll_mirror: 90.0
        - device: turbo-top
          count: 1
