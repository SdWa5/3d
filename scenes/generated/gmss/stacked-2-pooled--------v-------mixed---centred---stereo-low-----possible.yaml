# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=iq-sub --from=turbo-top --stacks=2 --align=stereo --low-end=low --shape=v --mirror-style=centred --id=stacked
#     --into=gmss
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 8 cabinets in 4 rows:
#
#   1  1× nuke rolled 270° + 1× mid-bass                                       1.99 m wide
#   2  1× wall-bass rolled 270° + 1× iq-sub rolled 90°                        2.09 m wide
#   3  1× iq-sub rolled 270° + 1× iq-sub rolled 90° at 750 mm gaps            2.09 m wide
#   4  1× turbo-top + 1× turbo-top                                              0.92 m wide
#
# Subs reach 1.78 m against a 2.0 m interface. The stack is 2.49 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 1.780 m against the 2.000 m interface asked for, so the tops sit 220 mm lower than ideal —
#     1.780 m is the most they reach while every tier is still carried
#   * the 1× wall-bass rolled 270° + 1× iq-sub rolled 90° row is 2.090 m on a 1.990 m row, so it overhangs 50 mm
#     each side
#
# main-1 — 1, 6 cabinets in 2 rows:
#
#   1  2× iq-sub rolled 270° + 1× nuke + 1× wall-bass rolled 90° + 1× iq-sub rolled 90°     4.08 m wide
#   2  1× turbo-top                                                              0.45 m wide
#
# Subs reach 0.77 m against a 2.0 m interface. The stack is 1.48 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 0.770 m against the 2.000 m interface asked for, so the tops sit 1230 mm lower than ideal —
#     0.770 m is the most they reach while every tier is still carried
#
id: stacked-2-pooled--------v-------mixed---centred---stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 8 cabinets in 4 rows
  - id: main-2
    at: [-2.592, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      from:
        - device: wall-bass
          count: 1
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          count: 1
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: turbo-top
          count: 2

  # 1, 6 cabinets in 2 rows
  - id: main-1
    at: [0.993, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: wall-bass
          count: 1
          roll_mirror: 90.0
        - device: nuke
          count: 1
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: turbo-top
          count: 1

