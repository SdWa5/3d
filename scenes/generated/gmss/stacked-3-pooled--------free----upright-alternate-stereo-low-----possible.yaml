# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=iq-sub --from=turbo-top --stacks=3 --align=stereo --low-end=low --shape=free --mirror-style=alternate
#     --id=stacked --into=gmss
#
# 3 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 8 cabinets in 4 rows:
#
#   1  2× wall-bass                                                              1.34 m wide
#   2  1× nuke + 1× mid-bass                                                    1.81 m wide
#   3  1× iq-sub + 1× nuke + 1× iq-sub                                         1.69 m wide
#   4  1× turbo-top                                                              0.45 m wide
#
# Subs reach 2.94 m against a 2.0 m interface. The stack is 3.65 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× nuke + 1× mid-bass row is 1.810 m on a 1.340 m row, so it overhangs 235 mm each side
#   * row 2 (1× nuke + 1× mid-bass) is not mirror-symmetric, and the search found no symmetric arrangement of these
#     cabinets that stands
#
# main-3 — 3, 3 cabinets in 2 rows:
#
#   1  2× iq-sub                                                                 1.08 m wide
#   2  1× turbo-top                                                              0.45 m wide
#
# Subs reach 0.67 m against a 2.0 m interface. The stack is 1.38 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 0.670 m against the 2.000 m interface asked for, so the tops sit 1330 mm lower than ideal —
#     0.670 m is the most they reach while every tier is still carried
#
# main-1 — 1, 3 cabinets in 2 rows:
#
#   1  2× iq-sub                                                                 1.08 m wide
#   2  1× turbo-top                                                              0.45 m wide
#
# Subs reach 0.67 m against a 2.0 m interface. The stack is 1.38 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 0.670 m against the 2.000 m interface asked for, so the tops sit 1330 mm lower than ideal —
#     0.670 m is the most they reach while every tier is still carried
#
id: stacked-3-pooled--------free----upright-alternate-stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 8 cabinets in 4 rows
  - id: main-2
    at: [-1.882, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - wall-bass
        - mid-bass
        - nuke
        - device: iq-sub
          count: 2
        - device: turbo-top
          count: 1

  # 3, 3 cabinets in 2 rows
  - id: main-3
    at: [0.063, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: iq-sub
          count: 2
        - device: turbo-top
          count: 1

  # 1, 3 cabinets in 2 rows
  - id: main-1
    at: [1.643, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror: true             # the mirror image of stack 1
      from:
        - device: iq-sub
          count: 2
        - device: turbo-top
          count: 1
