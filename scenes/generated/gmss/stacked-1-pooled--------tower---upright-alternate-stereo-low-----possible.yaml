# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=iq-sub --from=turbo-top --stacks=1 --align=stereo --low-end=low --shape=tower --mirror-style=alternate
#     --id=stacked --into=gmss
#
# What it deals out today:
#
#   1  3× iq-sub at 485 mm gaps                                                  2.56 m wide
#   2  3× iq-sub at 485 mm gaps                                                  2.56 m wide
#   3  1× wall-bass + 2× nuke + 1× wall-bass                                   2.56 m wide
#   4  1× turbo-top + 1× turbo-top + 1× turbo-top                              1.39 m wide
#
# Subs reach 2.74 m against a 2.0 m interface. The stack is 3.45 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * mid-bass: LEFT OUT, it cannot be carried in this stack — the 2× nuke + 1× mid-bass row is 2.420 m on a 4.640
#     m row; shape: tower asks for a flush base within 59 mm per side
#
id: stacked-1-pooled--------tower---upright-alternate-stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: tower
      from:
        - wall-bass
        - nuke
        - iq-sub
        - turbo-top
