# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=iq-sub --from=turbo-top --stacks=2 --align=block --low-end=low --shape=pyramid --mirror-style=centred
#     --id=stacked --into=gmss
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 4 cabinets in 2 rows:
#
#   1  1× iq-sub rolled 270° + 1× iq-sub + 1× iq-sub rolled 90°              1.91 m wide
#   2  1× turbo-top                                                              0.45 m wide
#
# Subs reach 0.67 m against a 2.0 m interface. The stack is 1.38 m of cabinet.
# `align: block` spreads the top tier onto the edges of the row carrying it.
#   * wall-bass: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * nuke: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 0.670 m against the 2.000 m interface asked for, so the tops sit 1330 mm lower than ideal —
#     0.670 m is the most they reach while every tier is still carried
#
# main-2 — 2, 10 cabinets in 4 rows:
#
#   1  1× wall-bass rolled 270° + 1× wall-bass rolled 90°                     2.82 m wide
#   2  1× iq-sub rolled 270° + 1× iq-sub + 1× iq-sub rolled 90° at 378 mm gaps    2.626 m wide
#   3  1× nuke rolled 270° + 1× mid-bass + 1× nuke rolled 90°                2.78 m wide
#   4  2× turbo-top                                                              0.92 m wide
#
# Subs reach 1.92 m against a 2.0 m interface. The stack is 2.63 m of cabinet.
# `align: block` spreads the top tier onto the edges of the row carrying it.
#   * wall-bass: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be
#     flanked into a row that carries anything: the row above it ends up half off its support. Turning them makes the split
#     work, which is what the -turned rig does
#   * nuke: KEPT TOGETHER, all 2 in one stack — 2 stacks would take one each, and one on its own cannot be flanked
#     into a row that carries anything: the row above it ends up half off its support. Turning them makes the split work,
#     which is what the -turned rig does
#   * turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 1.920 m against the 2.000 m interface asked for, so the tops sit 80 mm lower than ideal — 1.920
#     m is the most they reach while every tier is still carried
#   * the 1× nuke rolled 270° + 1× mid-bass + 1× nuke rolled 90° row is 2.780 m on a 2.626 m row, so it overhangs
#     77 mm each side
#
id: stacked-2-pooled--------pyramid-mixed---centred---block--low-----possible
name: "Solved rig — 2 stacks side by side, tiers justified"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 4 cabinets in 2 rows
  - id: main-1
    at: [-1.962, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: block
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: turbo-top
          count: 1

  # 2, 10 cabinets in 4 rows
  - id: main-2
    at: [0.903, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: block
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0
        - device: turbo-top
          count: 2

