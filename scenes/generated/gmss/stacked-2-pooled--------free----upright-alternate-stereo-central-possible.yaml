id: stacked-2-pooled--------free----upright-alternate-stereo-central-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 10 cabinets in 4 rows
  - id: main-2
    at: [-1.367, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      from:
        - wall-bass
        - mid-bass
        - nuke
        - device: iq-sub
          count: 3
        - device: turbo-top
          count: 2

  # 1, 4 cabinets in 2 rows
  - id: main-1
    at: [1.068, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      low_end: central
      mirror: true             # the mirror image of stack 1
      from:
        - device: iq-sub
          count: 3
        - device: turbo-top
          count: 1
