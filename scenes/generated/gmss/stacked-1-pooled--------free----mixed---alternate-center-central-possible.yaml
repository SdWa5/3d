# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=iq-sub --from=turbo-top --stacks=1 --align=center --low-end=central --shape=free --mirror-style=alternate
#     --id=stacked --into=gmss
#
# What it deals out today:
#
#   1  1× wall-bass rolled 270° + 1× wall-bass rolled 90° + 1× mid-bass      4.04 m wide
#   2  2× nuke rolled 270° + 1× iq-sub rolled 90°                             2.25 m wide
#   3  1× iq-sub rolled 270° + 2× iq-sub rolled 90°                           2.05 m wide
#   4  1× iq-sub rolled 270° + 1× iq-sub rolled 90°                           1.36 m wide
#   5  3× turbo-top                                                              1.39 m wide
#
# Subs reach 2.31 m against a 2.0 m interface. The stack is 3.02 m of cabinet.
#   * the 3× turbo-top row is 1.390 m on a 1.360 m row, so it overhangs 15 mm each side
#
id: stacked-1-pooled--------free----mixed---alternate-center-central-possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      low_end: central
      from:
        - device: wall-bass
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          roll_mirror: 90.0
        - device: iq-sub
          roll_mirror: 90.0
        - turbo-top
