# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=iq-sub --from=turbo-top --stacks=2 --align=block --low-end=low --shape=tower --mirror-style=alternate
#     --id=stacked --into=gmss
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 5 cabinets in 2 rows:
#
#   1  2× iq-sub rolled 270° + 1× iq-sub rolled 90°                           2.05 m wide
#   2  1× nuke rolled 270° + 1× wall-bass rolled 90°                          2.19 m wide
#
# Subs reach 1.19 m against a 2.0 m interface. The stack is 1.19 m of cabinet.
#   * the subs reach 1.190 m against the 2.000 m interface asked for, so the tops sit 810 mm lower than ideal —
#     1.190 m is the most they reach while every tier is still carried
#   * the 1× nuke rolled 270° + 1× wall-bass rolled 90° row is 2.190 m on a 2.050 m row, so it overhangs 70 mm
#     each side
#   * row 2 (1× nuke rolled 270° + 1× wall-bass rolled 90°) is not mirror-symmetric, and the search found no
#     symmetric arrangement of these cabinets that stands
#
# main-2 — 2, 6 cabinets in 1 row:
#
#   1  1× iq-sub rolled 270° + 1× wall-bass rolled 270° + 1× nuke rolled 270° + 2× iq-sub rolled 90° + 1× mid-bass     5.48 m wide
#
# Subs reach 0.66 m against a 2.0 m interface. The stack is 0.66 m of cabinet.
#   * the subs reach 0.660 m against the 2.000 m interface asked for, so the tops sit 1340 mm lower than ideal —
#     0.660 m is the most they reach while every tier is still carried
#   * row 1 (1× iq-sub rolled 270° + 1× wall-bass rolled 270° + 1× nuke rolled 270° + 2× iq-sub rolled 90° +
#     1× mid-bass) is not mirror-symmetric, and the search found no symmetric arrangement of these cabinets that stands
#
# The tops stand in one row across both walls: turbo-top + turbo-top + turbo-top, at an equal pitch of 0.475 m.
#
id: stacked-2-pooled--------tower---mixed---alternate-block--low-----possible
name: "Solved rig — 2 stacks side by side, tiers justified"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 5 cabinets in 2 rows
  - id: main-1
    at: [-3.292, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: tower
      mirror: true             # the mirror image of stack 1
      shared_tops: true        # the tops below stand on this wall
      from:
        - device: wall-bass
          count: 1
          roll_mirror: 90.0
        - device: nuke
          count: 1
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0

  # 2, 6 cabinets in 1 row
  - id: main-2
    at: [1.043, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: tower
      shared_tops: true        # the tops below stand on this wall
      from:
        - device: wall-bass
          count: 1
          roll_mirror: 90.0
        - mid-bass
        - device: nuke
          count: 1
          roll_mirror: 90.0
        - device: iq-sub
          count: 3
          roll_mirror: 90.0

  # The tops, one row standing on both walls at an equal pitch of 0.475 m.
  - id: tops-1
    device: turbo-top
    on: main-1
    at: [-3.372, -0.31]
    aim: far
  - id: tops-2
    device: turbo-top
    on: main-1
    at: [-2.897, -0.31]
    aim: far
  - id: tops-3
    device: turbo-top
    on: main-1
    at: [-2.422, -0.31]
    aim: far
