# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --from=wall-bass --from=mid-bass --from=nuke
#     --from=iq-sub --from=turbo-top --stacks=2 --align=center --low-end=low --shape=v --mirror-style=alternate
#     --id=stacked --into=gmss
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 5 cabinets in 2 rows:
#
#   1  1× nuke + 1× wall-bass                                                   1.27 m wide
#   2  3× iq-sub                                                                 1.63 m wide
#
# Subs reach 2.07 m against a 2.0 m interface. The stack is 2.07 m of cabinet.
#   * the 3× iq-sub row is 1.630 m on a 1.270 m row, so it overhangs 180 mm each side
#   * row 1 (1× nuke + 1× wall-bass) is not mirror-symmetric, and the search found no symmetric arrangement of these
#     cabinets that stands
#
# main-2 — 2, 6 cabinets in 4 rows:
#
#   1  1× nuke                                                                   0.59 m wide
#   2  1× wall-bass                                                              0.66 m wide
#   3  1× mid-bass                                                                1.2 m wide
#   4  3× iq-sub                                                                 1.63 m wide
#
# Subs reach 3.34 m against a 2.0 m interface. The stack is 3.34 m of cabinet.
#   * the subs reach 3.340 m against the 3.000 m ceiling asked for, so they stand 340 mm too high — 3.340 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× wall-bass row is 0.660 m on a 0.590 m row, so it overhangs 35 mm each side
#   * the 1× mid-bass row is 1.200 m on a 0.660 m row, so it overhangs 270 mm each side
#   * the 3× iq-sub row is 1.630 m on a 1.200 m row, so it overhangs 215 mm each side
#
# The tops stand in one row across both walls: turbo-top + turbo-top + turbo-top, at an equal pitch of 0.59 m.
#
id: stacked-2-pooled--------v-------upright-alternate-center-low-----possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 5 cabinets in 2 rows
  - id: main-1
    at: [-1.367, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      mirror: true             # the mirror image of stack 1
      shared_tops: true        # the tops below stand on this wall
      from:
        - device: wall-bass
          count: 1
        - device: nuke
          count: 1
        - device: iq-sub
          count: 3

  # 2, 6 cabinets in 4 rows
  - id: main-2
    at: [0.763, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      shared_tops: true        # the tops below stand on this wall
      from:
        - device: wall-bass
          count: 1
        - mid-bass
        - device: nuke
          count: 1
        - device: iq-sub
          count: 3

  # The tops, one row standing on both walls at an equal pitch of 0.59 m.
  - id: tops-1
    device: turbo-top
    on: main-2
    at: [0.173, -0.31]
    aim: far
  - id: tops-2
    device: turbo-top
    on: main-2
    at: [0.763, -0.31]
    aim: far
  - id: tops-3
    device: turbo-top
    on: main-2
    at: [1.353, -0.31]
    aim: far
