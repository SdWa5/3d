# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=4.4 --orientation=turned --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top
#     --stacks=1 --align=center --shape=free --mirror-style=centred --id=stacked-gmss-sepp-1
#
# What it deals out today:
#
#   1  1× gmss-nuke rolled 270° + 1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass rolled 90° + 1× gmss-nuke rolled 90°      4.4 m wide
#   2  2× achenbach-18 rolled 270° + 2× achenbach-18 rolled 90°               2.46 m wide
#   3  1× gmss-iq-sub rolled 270° + 1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90° + 1× gmss-iq-sub rolled 90°      2.6 m wide
#   4  2× gmss-iq-sub rolled 270° + 2× gmss-iq-sub rolled 90°                 2.74 m wide
#   5  2× gmss-turbo-top + 2× eighteensound-2way-15 + 1× gmss-turbo-top      2.3612 m wide
#
# Subs reach 2.39 m against a 2.0 m interface. The stack is 3.226 m of cabinet.
#   * gmss-mid-bass: LEFT OUT, it cannot be carried in this stack — a gmss-iq-sub in the 1× gmss-iq-sub rolled
#     270° + 1× gmss-iq-sub rolled 90° row would land on only 7% of its own width — it is touching what carries it
#     rather than sitting on it. Line the segments up with what carries them
#   * the 1× gmss-iq-sub rolled 270° + 1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90° + 1×
#     gmss-iq-sub rolled 90° row is 2.600 m on a 2.460 m row, so it overhangs 70 mm each side
#   * the 2× gmss-iq-sub rolled 270° + 2× gmss-iq-sub rolled 90° row is 2.740 m on a 2.600 m row, so it overhangs
#     70 mm each side
#
id: stacked-gmss-sepp-1-free-turned-centred-center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 4.4
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: gmss-turbo-top
          aim: near

