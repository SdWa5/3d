      shape: tower
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - device: kicker-15
          roll_mirror: 90.0
        - device: sub-60x60
          roll_mirror: 90.0
        - tms4
