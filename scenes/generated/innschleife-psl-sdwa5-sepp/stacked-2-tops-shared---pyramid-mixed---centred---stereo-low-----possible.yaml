id: stacked-2-tops-shared---pyramid-mixed---centred---stereo-low-----possible
name: "Solved rig — 6 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours-1, 12 cabinets in 4 rows
  - id: main-ours-1
    at: [-11.262, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      mirror: true             # the mirror image of stack ours-1
      from:
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
        - device: eighteensound-2way-15
          count: 1
        - device: thebox-achat-112m
          count: 1
          aim: near

