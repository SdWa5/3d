id: stacked-1-tops-shared---free----turned--centred---stereo-central-possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 26 cabinets in 4 rows
  - id: main-ours
    at: [-6.165, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      low_end: central
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0
        - device: tms4
          count: 1
        - device: tecnare-m2122
          count: 2
        - device: thebox-achat-115m
          aim: near
        - device: thebox-pa302
          aim: near
        - device: thebox-achat-112m
          count: 1
          aim: near

  # psl, 22 cabinets in 3 rows
  - id: main-psl
    at: [-0.078, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
