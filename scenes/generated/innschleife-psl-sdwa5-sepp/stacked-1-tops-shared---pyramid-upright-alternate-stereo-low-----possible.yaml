id: stacked-1-tops-shared---pyramid-upright-alternate-stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 20 cabinets in 3 rows
  - id: main-ours
    at: [-8.3147, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - skram
        - flexy-folded-horn-hybrid
        - achenbach-18

  # psl, 14 cabinets in 3 rows
  - id: main-psl
    at: [-2.9497, -0.0245]
