#     --from=thebox-achat-115m --from=thebox-achat-112m --from=hk-linear5-112x --from=thebox-dsp-112 --stacks=1
#     --align=stereo --low-end=low --shape=pyramid --mirror-style=alternate --id=stacked --into=innschleife-psl-sdwa5-sepp
#
# 3 stacks side by side, with 0.5 m of air between them.
#
# main-ours — ours, 20 cabinets in 3 rows:
#
#   1  10× flexy-folded-horn-hybrid                                              6.09 m wide
#   2  1× flexy-folded-horn-hybrid + 6× achenbach-18 + 1× flexy-folded-horn-hybrid    4.922 m wide
#   3  2× skram                                                                  1.24 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 2.44 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
# main-psl — psl, 14 cabinets in 3 rows:
#
#   1  6× concert-audio-esx                                                      3.64 m wide
#   2  1× thebox-tp118-800 + 1× concert-audio-esf + 2× thebox-tp218-1600 + 1× concert-audio-esf + 1× thebox-tp118-800    3.476 m wide
#   3  1× thebox-achat-112m + 1× thebox-achat-112m                              0.74 m wide
#
# Subs reach 2.38 m against a 2.0 m interface. The stack is 2.98 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
# main-innschleife — innschleife, 33 cabinets in 2 rows:
#
#   1  2× kicker-15 + 2× sub-60x60 + 2× wsx-18 + 4× sbh-18 + 2× wsx-18 + 2× sub-60x60 + 2× kicker-15    10.98 m wide
#   2  2× concert-audio-ef6 + 1× tms4 + 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tms2 + 1× tecnare-m2122 + 1× thebox-achat-115m + 1× thebox-pa302 + 1× hk-linear5-112x + 1× thebox-dsp-112 + 1× tms2 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× tms4 + 2× concert-audio-ef6   8.5372 m wide
