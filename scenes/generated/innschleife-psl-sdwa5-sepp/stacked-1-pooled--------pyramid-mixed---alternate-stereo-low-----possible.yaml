# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=pooled --order=ours,psl,innschleife --from=wsx-18
#     --from=sbh-18 --from=skram --from=thebox-tp218-1600 --from=flexy-folded-horn-hybrid --from=concert-audio-esx
#     --from=sub-95x57 --from=achenbach-18 --from=kicker-15 --from=thebox-tp118-800 --from=concert-audio-esf
#     --from=tecnare-m2122 --from=concert-audio-ef6 --from=thl4 --from=eighteensound-2way-15 --from=tms4
#     --from=thebox-pa302 --from=thebox-achat-115m --from=thebox-achat-112m --from=hk-linear5-112x --from=thebox-dsp-112
#     --stacks=1 --align=stereo --low-end=low --shape=pyramid --mirror-style=alternate --id=stacked
#     --into=innschleife-psl-sdwa5-sepp
#
# What it deals out today:
#
#   1  1× thebox-tp118-800 rolled 270° + 1× thebox-tp218-1600 rolled 270° + 2× sbh-18 rolled 270° + 2× sub-95x57 + 2× wsx-18 rolled 270° + 1× concert-audio-esf rolled 270° + 3× concert-audio-esx rolled 270° + 6× flexy-folded-horn-hybrid rolled 270° + 2× kicker-15 + 3× achenbach-18 + 1× skram rolled 270° + 1× skram rolled 90° + 3× achenbach-18 + 2× kicker-15 + 6× flexy-folded-horn-hybrid rolled 90° + 3× concert-audio-esx rolled 90° + 1× concert-audio-esf rolled 90° + 2× wsx-18 rolled 90° + 2× sub-95x57 + 2× sbh-18 rolled 90° + 1× thebox-tp218-1600 rolled 90° + 1× thebox-tp118-800 rolled 90°     43.2 m wide
#   2  2× concert-audio-ef6 + 1× tecnare-m2122 + 1× thl4 + 1× eighteensound-2way-15 + 1× tms4 + 1× thebox-achat-112m + 1× tecnare-m2122 + 1× thebox-achat-115m + 1× thebox-pa302 + 1× hk-linear5-112x + 1× thebox-dsp-112 + 1× thebox-achat-112m + 1× tms4 + 1× eighteensound-2way-15 + 1× thl4 + 1× tecnare-m2122 + 2× concert-audio-ef6   9.2972 m wide
#
# Subs reach 0.61 m against a 2.0 m interface. The stack is 1.75 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 0.610 m against the 2.000 m interface asked for, so the tops sit 1390 mm lower than ideal —
#     0.610 m is the most they reach while every tier is still carried
#
id: stacked-1-pooled--------pyramid-mixed---alternate-stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - device: skram
          roll_mirror: 90.0
        - device: thebox-tp218-1600
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: concert-audio-esx
          roll_mirror: 90.0
        - sub-95x57
        - achenbach-18
        - kicker-15
        - device: thebox-tp118-800
          roll_mirror: 90.0
        - device: concert-audio-esf
          roll_mirror: 90.0
        - device: tecnare-m2122
          aim: near
        - concert-audio-ef6
        - device: thl4
          aim: near
        - device: eighteensound-2way-15
          aim: near
        - device: tms4
          aim: near
        - device: thebox-pa302
          aim: near
        - device: thebox-achat-115m
          aim: near
        - device: thebox-achat-112m
          aim: near
        - device: hk-linear5-112x
          aim: near
        - device: thebox-dsp-112
          aim: near

