        - device: tecnare-m2122
          count: 1
          aim: near
        - device: thl4
          count: 1
          aim: near
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: tms4
          count: 1
          aim: near
        - device: hk-linear5-112x
          aim: near
