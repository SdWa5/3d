id: stacked-1-tops-shared---free----upright-alternate-stereo-central-possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 28 cabinets in 4 rows
  - id: main-ours
    at: [-5.3168, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      low_end: central
      from:
        - skram
        - flexy-folded-horn-hybrid
        - achenbach-18
        - device: concert-audio-ef6
          count: 2
        - device: tecnare-m2122
          count: 2
          aim: near
        - device: thl4
          count: 1
          aim: near
        - device: thebox-achat-115m
          aim: near
        - device: thebox-pa302
          aim: near
        - device: thebox-achat-112m
          count: 1
          aim: near

  # psl, 20 cabinets in 3 rows
  - id: main-psl
    at: [-0.714, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    align:
      mode: stereo
    stack:
