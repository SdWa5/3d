id: stacked-1-systems-apart-v-------mixed---centred---center-low-----possible
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 25 cabinets in 6 rows
  - id: main-ours
    at: [-5.0181, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
