id: stacked-1-systems-apart-v-------turned--column----center-low-----possible
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, 25 cabinets in 8 rows
  - id: main-ours
    at: [-8.26, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: v
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near

  # psl, 22 cabinets in 2 rows
  - id: main-psl
    at: [-0.2564, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: v
      from:
        - device: thebox-tp218-1600
          roll_mirror: 90.0
        - device: concert-audio-esx
          roll_mirror: 90.0
        - device: thebox-tp118-800
          roll_mirror: 90.0
        - device: concert-audio-esf
          roll_mirror: 90.0
        - concert-audio-ef6
        - device: thebox-pa302
          aim: near
        - device: thebox-achat-115m
          aim: near
        - device: thebox-achat-112m
          aim: near
        - device: hk-linear5-112x
          aim: near
        - device: thebox-dsp-112
          aim: near

  # innschleife, 20 cabinets in 9 rows
  - id: main-innschleife
    at: [7.7016, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    focus:
      far:
        distance_m: 10.0
        height_m: 1.8
      near:
        distance_m: 2.0
        height_m: 1.8
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: v
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - device: kicker-15
          roll_mirror: 90.0
        - device: sub-60x60
          roll_mirror: 90.0
        - tms4
        - device: tms2
          aim: near

