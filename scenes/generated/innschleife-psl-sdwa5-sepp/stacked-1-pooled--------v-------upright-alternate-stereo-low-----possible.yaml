# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=pooled --order=ours,psl,innschleife --from=wsx-18
#     --from=sbh-18 --from=skram --from=thebox-tp218-1600 --from=flexy-folded-horn-hybrid --from=concert-audio-esx
#     --from=kicker-15 --from=achenbach-18 --from=sub-60x60 --from=thebox-tp118-800 --from=concert-audio-esf --from=tms4
#     --from=tecnare-m2122 --from=concert-audio-ef6 --from=tms2 --from=eighteensound-2way-15 --from=thebox-pa302
#     --from=thebox-achat-115m --from=thebox-achat-112m --from=hk-linear5-112x --from=thebox-dsp-112 --stacks=1
#     --align=stereo --low-end=low --shape=v --mirror-style=alternate --id=stacked --into=innschleife-psl-sdwa5-sepp
#
# What it deals out today:
#
#   1  3× achenbach-18 + 2× sub-60x60 + 1× thebox-tp118-800 + 6× flexy-folded-horn-hybrid + 1× concert-audio-esf + 1× skram + 2× wsx-18 + 3× concert-audio-esx + 2× sbh-18 + 2× thebox-tp218-1600 + 2× sbh-18 + 3× concert-audio-esx + 2× wsx-18 + 1× skram + 1× concert-audio-esf + 6× flexy-folded-horn-hybrid + 1× thebox-tp118-800 + 2× sub-60x60 + 3× achenbach-18   26.568 m wide
#   2  2× concert-audio-ef6 + 1× tms4 + 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tms2 + 1× thebox-achat-112m + 1× tecnare-m2122 + 1× thebox-achat-115m + 1× thebox-pa302 + 1× hk-linear5-112x + 1× thebox-dsp-112 + 1× thebox-achat-112m + 1× tms2 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× tms4 + 2× concert-audio-ef6   9.2972 m wide
#
# Subs reach 1.2 m against a 2.0 m interface. The stack is 2.34 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * kicker-15: LEFT OUT, it cannot be carried in this stack — the 8× flexy-folded-horn-hybrid row is 4.868 m on a
#     5.334 m row, so the wall narrows as it rises — `shape: v` asks for the opposite and this is not one of its
#     arrangements
#   * the subs reach 1.200 m against the 2.000 m interface asked for, so the tops sit 800 mm lower than ideal —
#     1.200 m is the most they reach while every tier is still carried
#
id: stacked-1-pooled--------v-------upright-alternate-stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - wsx-18
        - sbh-18
        - skram
        - thebox-tp218-1600
        - flexy-folded-horn-hybrid
        - concert-audio-esx
        - achenbach-18
        - sub-60x60
        - thebox-tp118-800
        - concert-audio-esf
        - device: tms4
          aim: near
        - device: tecnare-m2122
          aim: near
        - concert-audio-ef6
        - device: tms2
          aim: near
        - device: eighteensound-2way-15
          aim: near
        - device: thebox-pa302
          aim: near
        - device: thebox-achat-115m
          aim: near
        - device: thebox-achat-112m
          aim: near
        - device: hk-linear5-112x
          aim: near
        - device: thebox-dsp-112
          aim: near
