id: stacked-gmss-sdwa5-1-systems-apart-pyramid-upright-alternate-stereo-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # sdwa5, 17 cabinets in 4 rows
  - id: main-sdwa5
    at: [-2.872, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - skram
        - flexy-folded-horn-hybrid
        - tecnare-m2122

  # gmss, 14 cabinets in 3 rows
  - id: main-gmss
    at: [1.79, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - gmss-iq-sub
        - gmss-turbo-top

