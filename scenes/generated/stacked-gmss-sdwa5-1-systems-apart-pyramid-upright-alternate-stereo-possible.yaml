# main-gmss — gmss, 14 cabinets in 3 rows:
#
#   1  3× gmss-iq-sub + 2× gmss-wall-bass + 3× gmss-iq-sub                     4.64 m wide
#   2  2× gmss-nuke + 1× gmss-mid-bass                                          2.42 m wide
#   3  1× gmss-turbo-top + 1× gmss-turbo-top + 1× gmss-turbo-top               1.39 m wide
#
