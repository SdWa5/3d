#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --per-owner --from=gmss-wall-bass --from=gmss-mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=gmss-turbo-top --stacks=1 --align=stereo --shape=pyramid
#     --mirror-style=alternate --id=stacked-all--------1-systems-apart
#
# 3 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 14 cabinets in 5 rows:
#
#   1  2× gmss-iq-sub rolled 270° + 3× gmss-iq-sub rolled 90°                 3.43 m wide
#   2  1× gmss-wall-bass rolled 270° + 1× gmss-iq-sub rolled 90°              2.09 m wide
#   3  1× gmss-wall-bass rolled 270° + 1× gmss-nuke rolled 90°                2.19 m wide
#   4  1× gmss-nuke rolled 270° + 1× gmss-mid-bass                             1.99 m wide
#   5  1× gmss-turbo-top + 1× gmss-turbo-top + 1× gmss-turbo-top               1.39 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.15 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× gmss-wall-bass rolled 270° + 1× gmss-nuke rolled 90° row is 2.190 m on a 2.090 m row, so it overhangs
#     50 mm each side
#
# main-sepp — sepp, 8 cabinets in 4 rows:
#
#   1  2× achenbach-18                                                           1.22 m wide
#   2  2× achenbach-18                                                           1.22 m wide
#   3  2× achenbach-18                                                           1.22 m wide
#   4  1× eighteensound-2way-15 + 1× eighteensound-2way-15                    0.9512 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 2.636 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.800 m against the 2.000 m interface asked for, so the tops sit 200 mm lower than ideal —
#     1.800 m is the most they reach while every tier is still carried
#
# main-sdwa5 — sdwa5, 17 cabinets in 5 rows:
#
#   1  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   2  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   3  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   4  1× skram rolled 270° + 1× skram rolled 90°                            1.848 m wide
#   5  1× tecnare-m2122 + 1× tecnare-m2122 + 1× tecnare-m2122                  1.54 m wide
#
# Subs reach 2.383 m against a 2.0 m interface. The stack is 3.343 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
id: stacked-all--------1-systems-apart-pyramid-mixed---alternate-stereo-possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 14 cabinets in 5 rows
  - id: main-gmss
    at: [-2.968, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - gmss-turbo-top

  # sepp, 8 cabinets in 4 rows
  - id: main-sepp
    at: [-0.143, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - achenbach-18
        - eighteensound-2way-15

  # sdwa5, 17 cabinets in 5 rows
  - id: main-sdwa5
    at: [2.523, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - tecnare-m2122

