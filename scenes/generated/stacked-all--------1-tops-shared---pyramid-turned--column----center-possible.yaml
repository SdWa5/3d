id: stacked-all--------1-tops-shared---pyramid-turned--column----center-possible
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # sdwa5, 18 cabinets in 4 rows
  - id: main-sdwa5
    at: [-3.922, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: pyramid
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: gmss-turbo-top
          count: 1
          aim: near

  # gmss, 12 cabinets in 4 rows
  - id: main-gmss
    at: [0.7255, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: pyramid
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: gmss-mid-bass
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - device: gmss-turbo-top
          count: 1

  # sepp, 9 cabinets in 3 rows
  - id: main-sepp
    at: [4.3455, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      shape: pyramid
      from:
        - device: achenbach-18
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: gmss-turbo-top
          count: 1
          aim: near

