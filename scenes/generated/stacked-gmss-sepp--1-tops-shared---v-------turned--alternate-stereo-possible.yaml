# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=tops-shared --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top
#     --stacks=1 --align=stereo --shape=v --mirror-style=alternate --id=stacked-gmss-sepp--1-tops-shared--
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-sepp — sepp, 6 cabinets in 3 rows:
#
#   1  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   2  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   3  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 1.8 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.800 m against the 2.000 m interface asked for and **nothing stands on them** — this stack is
#     a sub wing, so the interface decides nothing about it
#
# main-gmss — gmss, 15 cabinets in 2 rows:
#
#   1  3× gmss-iq-sub rolled 270° + 1× gmss-nuke rolled 270° + 1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass rolled 90° + 1× gmss-nuke rolled 90° + 3× gmss-iq-sub rolled 90°     8.54 m wide
#   2  1× eighteensound-2way-15 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× eighteensound-2way-15   2.3612 m wide
#
# Subs reach 0.66 m against a 2.0 m interface. The stack is 1.496 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-mid-bass: LEFT OUT, it cannot be carried in this stack — the 2× gmss-iq-sub rolled 270° + 2×
#     gmss-iq-sub rolled 90° row is 2.740 m on a 2.780 m row, so the wall narrows as it rises — `shape: v` asks for the
#     opposite and this is not one of its arrangements
#   * the subs reach 0.660 m against the 2.000 m interface asked for, so the tops sit 1340 mm lower than ideal —
#     0.660 m is the most they reach while every tier is still carried
#
id: stacked-gmss-sepp--1-tops-shared---v-------turned--alternate-stereo-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # sepp, 6 cabinets in 3 rows
  - id: main-sepp
    at: [-4.822, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - device: achenbach-18
          roll_mirror: 90.0

  # gmss, 15 cabinets in 2 rows
  - id: main-gmss
    at: [0.558, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: gmss-turbo-top
          aim: near

