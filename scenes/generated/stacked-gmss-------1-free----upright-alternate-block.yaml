# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --from=gmss-wall-bass --from=gmss-mid-bass --from=gmss-nuke
#     --from=gmss-iq-sub --from=gmss-turbo-top --stacks=1 --align=block --shape=free --mirror-style=alternate
#     --id=stacked-gmss-------1
#
# What it deals out today:
#
#   1  2× gmss-wall-bass                                                         1.34 m wide
#   2  1× gmss-nuke + 1× gmss-mid-bass                                          1.81 m wide
#   3  1× gmss-iq-sub + 1× gmss-nuke + 2× gmss-iq-sub                          2.24 m wide
#   4  3× gmss-iq-sub                                                            1.63 m wide
#   5  3× gmss-turbo-top                                                         1.39 m wide
#
# Subs reach 3.61 m against a 2.0 m interface. The stack is 4.32 m of cabinet.
# `align: block` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.610 m against the 3.000 m ceiling asked for, so they stand 610 mm too high — 3.610 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× gmss-nuke + 1× gmss-mid-bass row is 1.810 m on a 1.340 m row, so it overhangs 235 mm each side
#   * the 1× gmss-iq-sub + 1× gmss-nuke + 2× gmss-iq-sub row is 2.240 m on a 1.810 m row, so it overhangs 215 mm
#     each side
#
id: stacked-gmss-------1-free----upright-alternate-block
name: "Solved rig — one stack, tiers justified"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: block
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - gmss-iq-sub
        - gmss-turbo-top

