# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --systems=tops-shared --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top
#     --stacks=1 --align=center --shape=v --mirror-style=centred --id=stacked-gmss-sepp--1-tops-shared--
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 16 cabinets in 4 rows:
#
#   1  1× gmss-nuke rolled 270° + 1× gmss-nuke + 1× gmss-mid-bass              2.6 m wide
#   2  1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass + 1× gmss-iq-sub rolled 90°     2.77 m wide
#   3  2× gmss-iq-sub rolled 270° + 1× gmss-iq-sub + 2× gmss-iq-sub rolled 90°     3.29 m wide
#   4  2× gmss-turbo-top + 2× eighteensound-2way-15 + 1× gmss-turbo-top      2.3612 m wide
#
# Subs reach 2.84 m against a 2.0 m interface. The stack is 3.676 m of cabinet.
#   * the 1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass + 1× gmss-iq-sub rolled 90° row is 2.770 m on a 2.600
#     m row, so it overhangs 85 mm each side
#   * the 2× gmss-iq-sub rolled 270° + 1× gmss-iq-sub + 2× gmss-iq-sub rolled 90° row is 3.290 m on a 2.770 m
#     row, so it overhangs 260 mm each side
#
# main-sepp — sepp, 6 cabinets in 3 rows:
#
#   1  2× achenbach-18                                                           1.22 m wide
#   2  2× achenbach-18                                                           1.22 m wide
#   3  2× achenbach-18                                                           1.22 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 1.8 m of cabinet.
#   * the subs reach 1.800 m against the 2.000 m interface asked for and **nothing stands on them** — this stack is
#     a sub wing, so the interface decides nothing about it
#
id: stacked-gmss-sepp--1-tops-shared---v-------mixed---centred---center-possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 16 cabinets in 4 rows
  - id: main-gmss
    at: [-1.162, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: gmss-turbo-top
          aim: near

  # sepp, 6 cabinets in 3 rows
  - id: main-sepp
    at: [1.593, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
      from:
        - achenbach-18

