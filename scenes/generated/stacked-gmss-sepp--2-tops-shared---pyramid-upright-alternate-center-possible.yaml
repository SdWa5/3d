# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=tops-shared --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top
#     --stacks=2 --align=center --shape=pyramid --mirror-style=alternate --id=stacked-gmss-sepp--2-tops-shared--
#
# 4 stacks side by side, with 0.5 m of air between them.
#
# main-sepp-2 — sepp-2, 5 cabinets in 2 rows:
#
#   1  3× achenbach-18                                                           1.84 m wide
#   2  1× gmss-turbo-top + 1× eighteensound-2way-15                           0.9356 m wide
#
# Subs reach 0.6 m against a 2.0 m interface. The stack is 1.436 m of cabinet.
#   * the subs reach 0.600 m against the 2.000 m interface asked for, so the tops sit 1400 mm lower than ideal —
#     0.600 m is the most they reach while every tier is still carried
#
# main-gmss-2 — gmss-2, 7 cabinets in 4 rows:
#
#   1  3× gmss-iq-sub                                                            1.63 m wide
#   2  1× gmss-mid-bass                                                           1.2 m wide
#   3  1× gmss-wall-bass + 1× gmss-nuke                                         1.27 m wide
#   4  1× gmss-turbo-top                                                         0.45 m wide
#
# Subs reach 2.57 m against a 2.0 m interface. The stack is 3.28 m of cabinet.
#   * the 1× gmss-wall-bass + 1× gmss-nuke row is 1.270 m on a 1.200 m row, so it overhangs 35 mm each side
#
# main-gmss-1 — gmss-1, 5 cabinets in 3 rows:
#
#   1  3× gmss-iq-sub                                                            1.63 m wide
#   2  1× gmss-wall-bass                                                         0.66 m wide
#   3  1× gmss-nuke                                                              0.59 m wide
#
# Subs reach 2.84 m against a 2.0 m interface. The stack is 2.84 m of cabinet.
#
# main-sepp-1 — sepp-1, 5 cabinets in 2 rows:
#
#   1  3× achenbach-18                                                           1.84 m wide
#   2  1× eighteensound-2way-15 + 1× gmss-turbo-top                           0.9356 m wide
#
# Subs reach 0.6 m against a 2.0 m interface. The stack is 1.436 m of cabinet.
#   * the subs reach 0.600 m against the 2.000 m interface asked for, so the tops sit 1400 mm lower than ideal —
#     0.600 m is the most they reach while every tier is still carried
#
id: stacked-gmss-sepp--2-tops-shared---pyramid-upright-alternate-center-possible
name: "Solved rig — 4 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # sepp-2, 5 cabinets in 2 rows
  - id: main-sepp-2
    at: [-3.602, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: achenbach-18
          count: 3
        - device: eighteensound-2way-15
          count: 1
        - device: gmss-turbo-top
          count: 1
          aim: near

  # gmss-2, 7 cabinets in 4 rows
  - id: main-gmss-2
    at: [-1.367, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: gmss-wall-bass
          count: 1
        - gmss-mid-bass
        - device: gmss-nuke
          count: 1
        - device: gmss-iq-sub
          count: 3
        - device: gmss-turbo-top
          count: 1

  # gmss-1, 5 cabinets in 3 rows
  - id: main-gmss-1
    at: [0.763, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: gmss-wall-bass
          count: 1
        - device: gmss-nuke
          count: 1
        - device: gmss-iq-sub
          count: 3

  # sepp-1, 5 cabinets in 2 rows
  - id: main-sepp-1
    at: [2.998, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack sepp-1
      from:
        - device: achenbach-18
          count: 3
        - device: eighteensound-2way-15
          count: 1
        - device: gmss-turbo-top
          count: 1
          aim: near

