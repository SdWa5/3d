#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --from=gmss-wall-bass --from=gmss-mid-bass --from=gmss-nuke
#     --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top --stacks=1 --align=stereo
#     --shape=free --mirror-style=alternate --id=stacked-gmss-sepp--1-pooled-------
#
# What it deals out today:
#
#   1  1× gmss-wall-bass rolled 270° + 1× gmss-mid-bass rolled 90° + 1× gmss-wall-bass rolled 90°     3.34 m wide
#   2  1× gmss-nuke rolled 270° + 2× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90° + 1× gmss-nuke rolled 90°     3.42 m wide
#   3  1× gmss-iq-sub rolled 270° + 2× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90° + 2× gmss-iq-sub rolled 90°     3.91 m wide
#   4  2× gmss-iq-sub rolled 270° + 1× gmss-iq-sub rolled 90°                 2.05 m wide
#   5  1× eighteensound-2way-15 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× eighteensound-2way-15   2.3612 m wide
#
# Subs reach 2.93 m against a 2.0 m interface. The stack is 3.766 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× gmss-nuke rolled 270° + 2× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90° + 1× gmss-nuke
#     rolled 90° row is 3.420 m on a 3.340 m row, so it overhangs 40 mm each side
#   * the 1× gmss-iq-sub rolled 270° + 2× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90° + 2×
#     gmss-iq-sub rolled 90° row is 3.910 m on a 3.420 m row, so it overhangs 245 mm each side
#   * the 1× eighteensound-2way-15 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× gmss-turbo-top + 1×
