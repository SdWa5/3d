# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=3.7 --orientation=mixed --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=gmss-iq-sub --from=tecnare-m2122
#     --from=gmss-turbo-top --stacks=2 --align=stereo --shape=pyramid --mirror-style=alternate --id=stacked-gmss-sdwa5-2
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 16 cabinets in 5 rows:
#
#   1  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   2  1× gmss-iq-sub rolled 270° + 1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90° + 1× gmss-iq-sub rolled 90°    2.926 m wide
#   3  1× gmss-wall-bass rolled 270° + 1× gmss-iq-sub rolled 90°              2.09 m wide
#   4  1× gmss-nuke rolled 270° + 1× gmss-mid-bass                             1.99 m wide
#   5  1× tecnare-m2122 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× tecnare-m2122     1.96 m wide
#
# Subs reach 2.432 m against a 2.0 m interface. The stack is 3.392 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * skram: LEFT OUT, it cannot be carried in this stack — the 1× gmss-wall-bass rolled 270° + 1× gmss-iq-sub
#     rolled 90° + 1× gmss-mid-bass row is 3.310 m on a 2.926 m row, so it steps out 192 mm each side against the 140 mm a
#     1.400 m cabinet may sit proud — `shape: pyramid` asks for a wall that does not widen as it rises
#
# main-1 — 1, 13 cabinets in 5 rows:
#
#   1  2× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    2.329 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    2.329 m wide
#   3  2× gmss-iq-sub rolled 270° + 1× gmss-iq-sub rolled 90°                 2.05 m wide
#   4  1× gmss-nuke rolled 270° + 1× skram rolled 90°                        1.704 m wide
#   5  1× gmss-turbo-top + 1× tecnare-m2122                                     0.97 m wide
#
# Subs reach 2.322 m against a 2.0 m interface. The stack is 3.282 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-wall-bass: LEFT OUT, it cannot be carried in this stack — the 1× gmss-turbo-top + 1× tecnare-m2122 row
#     is 0.970 m on a 0.770 m row, so it steps out 100 mm each side against the 45 mm a 0.450 m cabinet may sit proud —
#     `shape: pyramid` asks for a wall that does not widen as it rises
#
id: stacked-gmss-sdwa5-2-mixed-stereo
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 16 cabinets in 5 rows
  - id: main-2
    at: [-1.7165, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: gmss-wall-bass
          count: 1
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: gmss-nuke
          count: 1
          roll_mirror: 90.0
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2
        - device: gmss-turbo-top
          count: 2
          aim: near

  # 1, 13 cabinets in 5 rows
  - id: main-1
    at: [1.504, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: gmss-nuke
          count: 1
          roll_mirror: 90.0
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: gmss-turbo-top
          count: 1
          aim: near

