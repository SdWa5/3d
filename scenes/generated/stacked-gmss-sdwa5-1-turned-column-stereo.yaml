# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=5.2 --orientation=turned --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=gmss-iq-sub --from=tecnare-m2122
#     --from=gmss-turbo-top --stacks=1 --align=stereo --shape=pyramid --mirror-style=column --id=stacked-gmss-sdwa5-1
#
# What it deals out today:
#
#   1  3× flexy-folded-horn-hybrid rolled 270° + 3× flexy-folded-horn-hybrid rolled 90°    4.678 m wide
#   2  3× flexy-folded-horn-hybrid rolled 270° + 3× flexy-folded-horn-hybrid rolled 90°    4.678 m wide
#   3  3× gmss-iq-sub rolled 270° + 3× gmss-iq-sub rolled 90°                 4.12 m wide
#   4  1× gmss-nuke rolled 270° + 1× skram rolled 270° + 1× gmss-mid-bass rolled 90° + 1× skram rolled 90° + 1× gmss-nuke rolled 90°    3.948 m wide
#   5  1× tecnare-m2122 + 1× gmss-turbo-top + 1× tecnare-m2122 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× tecnare-m2122     2.95 m wide
#
# Subs reach 2.912 m against a 2.0 m interface. The stack is 3.872 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-wall-bass: LEFT OUT, it cannot be carried in this stack — a tecnare-m2122 in the 1× tecnare-m2122 + 1×
#     gmss-turbo-top + 1× tecnare-m2122 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× tecnare-m2122 row has nothing under
#     it at all, so it would fall to the floor — inside the row below it
#
id: stacked-gmss-sdwa5-1-turned-column-stereo
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 5.2
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      shape: pyramid
      from:
        - device: gmss-mid-bass
          roll_mirror: 90.0
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - tecnare-m2122
        - device: gmss-turbo-top
          aim: near

