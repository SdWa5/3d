# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --from=gmss-wall-bass --from=gmss-mid-bass --from=gmss-nuke
#     --from=gmss-iq-sub --from=gmss-turbo-top --stacks=1 --align=center --shape=pyramid --mirror-style=alternate
#     --id=stacked-gmss-------1
#
# What it deals out today:
#
#   1  3× gmss-iq-sub + 2× gmss-wall-bass + 3× gmss-iq-sub                     4.64 m wide
#   2  2× gmss-nuke + 1× gmss-mid-bass                                          2.42 m wide
#   3  3× gmss-turbo-top                                                         1.39 m wide
#
# Subs reach 2.17 m against a 2.0 m interface. The stack is 2.88 m of cabinet.
#
id: stacked-gmss-------1-pyramid-upright-alternate-center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - gmss-iq-sub
        - gmss-turbo-top

