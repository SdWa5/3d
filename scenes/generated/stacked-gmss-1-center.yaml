# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=3.7 --from=gmss-wall-bass --from=gmss-mid-bass --from=gmss-nuke
#     --from=gmss-iq-sub --from=gmss-turbo-top --stacks=1 --align=center --shape=pyramid --mirror-style=alternate
#     --id=stacked-gmss-1
#
# What it deals out today:
#
#   1  5× gmss-iq-sub                                                            2.73 m wide
#   2  2× gmss-wall-bass + 1× gmss-iq-sub                                       1.89 m wide
#   3  2× gmss-nuke + 1× gmss-mid-bass                                          2.42 m wide
#   4  3× gmss-turbo-top                                                         1.39 m wide
#
# Subs reach 2.84 m against a 2.0 m interface. The stack is 3.55 m of cabinet.
#   * the 2× gmss-nuke + 1× gmss-mid-bass row is 2.420 m on a 1.890 m row, so it overhangs 265 mm each side
#
id: stacked-gmss-1-center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - gmss-iq-sub
        - gmss-turbo-top

