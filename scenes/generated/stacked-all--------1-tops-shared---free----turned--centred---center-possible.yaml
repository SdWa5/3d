# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --systems=tops-shared --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub
#     --from=tecnare-m2122 --from=eighteensound-2way-15 --from=gmss-turbo-top --stacks=1 --align=center --shape=free
#     --mirror-style=centred --id=stacked-all--------1-tops-shared--
#
# 3 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 14 cabinets in 5 rows:
#
#   1  1× gmss-wall-bass rolled 270° + 1× gmss-mid-bass + 1× gmss-wall-bass rolled 90°     4.04 m wide
#   2  1× gmss-nuke rolled 270° + 1× gmss-nuke rolled 90°                     1.56 m wide
#   3  1× gmss-iq-sub rolled 270° + 1× gmss-iq-sub + 1× gmss-iq-sub rolled 90°     1.91 m wide
#   4  1× gmss-iq-sub rolled 270° + 1× gmss-iq-sub + 1× gmss-iq-sub rolled 90°     1.91 m wide
#   5  1× gmss-turbo-top + 1× eighteensound-2way-15 + 1× tecnare-m2122       1.4556 m wide
#
# Subs reach 2.59 m against a 2.0 m interface. The stack is 3.55 m of cabinet.
#   * the 1× gmss-iq-sub rolled 270° + 1× gmss-iq-sub + 1× gmss-iq-sub rolled 90° row is 1.910 m on a 1.560 m
#     row, so it overhangs 175 mm each side
#
# main-sdwa5 — sdwa5, 17 cabinets in 5 rows:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 270° + 1× skram rolled 90° + 1× flexy-folded-horn-hybrid rolled 90°    3.414 m wide
#   2  2× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.112 m wide
#   3  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid + 1× flexy-folded-horn-hybrid rolled 90°    2.157 m wide
#   4  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid + 1× flexy-folded-horn-hybrid rolled 90°    2.157 m wide
#   5  1× gmss-turbo-top + 2× tecnare-m2122                                     1.49 m wide
#
# Subs reach 2.727 m against a 2.0 m interface. The stack is 3.687 m of cabinet.
#
# main-sepp — sepp, 8 cabinets in 4 rows:
#
#   1  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   2  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   3  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   4  1× gmss-turbo-top + 1× eighteensound-2way-15                           0.9356 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 2.636 m of cabinet.
#   * the subs reach 1.800 m against the 2.000 m interface asked for, so the tops sit 200 mm lower than ideal —
#     1.800 m is the most they reach while every tier is still carried
#
id: stacked-all--------1-tops-shared---free----turned--centred---center-possible
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 14 cabinets in 5 rows
  - id: main-gmss
    at: [-3.119, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: gmss-mid-bass
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: gmss-turbo-top
          count: 1
          aim: near

  # sdwa5, 17 cabinets in 5 rows
  - id: main-sdwa5
    at: [1.108, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      from:
        - device: skram
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2
        - device: gmss-turbo-top
          count: 1
          aim: near

  # sepp, 8 cabinets in 4 rows
  - id: main-sepp
    at: [3.925, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      from:
        - device: achenbach-18
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: gmss-turbo-top
          count: 1
          aim: near

