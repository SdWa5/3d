id: stacked-gmss-sdwa5-2-v-------upright-alternate-center
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 11 cabinets in 4 rows
  - id: main-1
    at: [-2.375, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: gmss-iq-sub
          count: 3
        - device: tecnare-m2122
          count: 1
        - device: gmss-turbo-top
          count: 1
          aim: near

  # 2, 19 cabinets in 4 rows
  - id: main-2
    at: [0.8545, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
