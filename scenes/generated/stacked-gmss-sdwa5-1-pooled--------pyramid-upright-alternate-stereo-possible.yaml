# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --from=gmss-wall-bass --from=gmss-mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=gmss-iq-sub --from=tecnare-m2122 --from=gmss-turbo-top
#     --stacks=1 --align=stereo --shape=pyramid --mirror-style=alternate --id=stacked-gmss-sdwa5-1-pooled-------
#
# What it deals out today:
#
#   1  7× flexy-folded-horn-hybrid                                              4.257 m wide
#   2  1× gmss-iq-sub + 5× flexy-folded-horn-hybrid + 1× gmss-iq-sub          4.135 m wide
#   3  2× gmss-iq-sub + 2× gmss-wall-bass + 1× skram + 2× gmss-iq-sub         4.17 m wide
#   4  1× gmss-nuke + 1× skram + 1× gmss-nuke + 1× gmss-mid-bass              3.05 m wide
#   5  1× tecnare-m2122 + 1× gmss-turbo-top + 1× tecnare-m2122 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× tecnare-m2122     2.95 m wide
#
# Subs reach 3.84 m against a 2.0 m interface. The stack is 4.8 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.840 m against the 3.000 m ceiling asked for, so they stand 840 mm too high — 3.840 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 2× gmss-iq-sub + 2× gmss-wall-bass + 1× skram + 2× gmss-iq-sub row is 4.170 m on a 4.135 m row, so it
#     overhangs 17 mm each side
#
id: stacked-gmss-sdwa5-1-pooled--------pyramid-upright-alternate-stereo-possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - skram
        - flexy-folded-horn-hybrid
        - gmss-nuke
        - gmss-iq-sub
        - tecnare-m2122
        - device: gmss-turbo-top
          aim: near

