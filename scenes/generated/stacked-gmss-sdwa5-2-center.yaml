# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=3.7 --orientation=upright --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=gmss-iq-sub --from=tecnare-m2122
#     --from=gmss-turbo-top --stacks=2 --align=center --shape=pyramid --mirror-style=alternate --id=stacked-gmss-sdwa5-2
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 14 cabinets in 3 rows:
#
#   1  6× flexy-folded-horn-hybrid                                              3.646 m wide
#   2  2× gmss-iq-sub + 1× gmss-nuke + 1× skram + 1× gmss-wall-bass + 1× gmss-iq-sub     3.55 m wide
#   3  1× tecnare-m2122 + 1× gmss-turbo-top                                     0.97 m wide
#
# Subs reach 2.163 m against a 2.0 m interface. The stack is 3.123 m of cabinet.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#
# main-2 — 2, 16 cabinets in 3 rows:
#
#   1  6× flexy-folded-horn-hybrid                                              3.646 m wide
#   2  1× gmss-iq-sub + 1× gmss-wall-bass + 1× skram + 1× gmss-nuke + 2× gmss-iq-sub     3.55 m wide
#   3  1× gmss-turbo-top + 2× tecnare-m2122 + 1× gmss-turbo-top                1.96 m wide
#
# Subs reach 2.163 m against a 2.0 m interface. The stack is 3.123 m of cabinet.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-mid-bass: LEFT OUT, it cannot be carried in this stack — the 1× gmss-turbo-top + 2× tecnare-m2122 + 1×
#     gmss-turbo-top row is 1.960 m on a 1.220 m row, so it steps out 370 mm each side against the 45 mm a 0.450 m cabinet
#     may sit proud — `shape: pyramid` asks for a wall that does not widen as it rises
#
id: stacked-gmss-sdwa5-2-center
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 14 cabinets in 3 rows
  - id: main-1
    at: [-2.375, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: gmss-wall-bass
          count: 1
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: gmss-nuke
          count: 1
        - device: gmss-iq-sub
          count: 3
        - device: tecnare-m2122
          count: 1
        - device: gmss-turbo-top
          count: 1
          aim: near

  # 2, 16 cabinets in 3 rows
  - id: main-2
    at: [1.771, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: gmss-wall-bass
          count: 1
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: gmss-nuke
          count: 1
        - device: gmss-iq-sub
          count: 3
        - device: tecnare-m2122
          count: 2
        - device: gmss-turbo-top
          count: 2
          aim: near

