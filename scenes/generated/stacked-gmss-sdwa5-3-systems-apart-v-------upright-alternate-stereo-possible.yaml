id: stacked-gmss-sdwa5-3-systems-apart-v-------upright-alternate-stereo-possible
name: "Solved rig — 6 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-2, 8 cabinets in 5 rows
  - id: main-gmss-2
    at: [-5.676, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - device: gmss-iq-sub
          count: 2
        - device: gmss-turbo-top
          count: 1

  # sdwa5-3, 5 cabinets in 3 rows
  - id: main-sdwa5-3
    at: [-3.905, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - device: flexy-folded-horn-hybrid
          count: 4
        - device: tecnare-m2122
          count: 1

  # gmss-1, 3 cabinets in 2 rows
  - id: main-gmss-1
    at: [-2.264, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: gmss-iq-sub
          count: 2
        - device: gmss-turbo-top
          count: 1

  # gmss-3, 3 cabinets in 2 rows
  - id: main-gmss-3
    at: [-0.684, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - device: gmss-iq-sub
          count: 2
        - device: gmss-turbo-top
          count: 1

  # sdwa5-2, 7 cabinets in 2 rows
  - id: main-sdwa5-2
    at: [2.198, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - skram
        - device: flexy-folded-horn-hybrid
          count: 4
        - device: tecnare-m2122
          count: 1

  # sdwa5-1, 5 cabinets in 3 rows
  - id: main-sdwa5-1
    at: [5.141, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      mirror: true             # the mirror image of stack sdwa5-1
      from:
        - device: flexy-folded-horn-hybrid
          count: 4
