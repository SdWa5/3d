# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=2.8 --orientation=mixed --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top
#     --stacks=2 --align=stereo --shape=pyramid --mirror-style=centred --id=stacked-gmss-sepp-2
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-2 — 2, 11 cabinets in 5 rows:
#
#   1  1× gmss-iq-sub rolled 270° + 1× gmss-iq-sub rolled 90°                 1.36 m wide
#   2  1× achenbach-18 + 1× gmss-iq-sub rolled 90°                             1.29 m wide
#   3  2× achenbach-18                                                           1.22 m wide
#   4  1× gmss-wall-bass rolled 270° + 1× gmss-mid-bass                        2.62 m wide
#   5  1× gmss-turbo-top + 1× eighteensound-2way-15 + 1× gmss-turbo-top      1.4056 m wide
#
# Subs reach 2.39 m against a 2.0 m interface. The stack is 3.226 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-nuke: LEFT OUT, it cannot be carried in this stack — a gmss-wall-bass in the 1× gmss-wall-bass rolled
#     270° + 1× gmss-mid-bass row would land on only 28% of its own width — it is touching what carries it rather than
#     sitting on it. Line the segments up with what carries them
#   * the 1× gmss-wall-bass rolled 270° + 1× gmss-mid-bass row is 2.620 m on a 1.220 m row, so it overhangs 700 mm
#     each side
#
# main-1 — 1, 10 cabinets in 5 rows:
#
#   1  1× gmss-iq-sub rolled 270° + 1× gmss-iq-sub rolled 90°                 1.36 m wide
#   2  1× gmss-iq-sub rolled 270° + 1× achenbach-18                            1.29 m wide
#   3  2× achenbach-18                                                           1.22 m wide
#   4  1× gmss-nuke rolled 270° + 1× gmss-wall-bass rolled 90°                2.19 m wide
#   5  1× gmss-turbo-top + 1× eighteensound-2way-15                           0.9356 m wide
#
# Subs reach 2.39 m against a 2.0 m interface. The stack is 3.226 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * the 1× gmss-nuke rolled 270° + 1× gmss-wall-bass rolled 90° row is 2.190 m on a 1.220 m row, so it overhangs
#     485 mm each side
#
id: stacked-gmss-sepp-2-mixed-centred-stereo
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 11 cabinets in 5 rows
  - id: main-2
    at: [-1.647, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 2.8
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      from:
        - device: gmss-wall-bass
          count: 1
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: achenbach-18
          count: 3
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: gmss-turbo-top
          count: 2
          aim: near

  # 1, 10 cabinets in 5 rows
  - id: main-1
    at: [1.258, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      max_width_m: 2.8
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: gmss-wall-bass
          count: 1
          roll_mirror: 90.0
        - device: gmss-nuke
          count: 1
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: gmss-turbo-top
          count: 1
          aim: near

