# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --from=skram --from=flexy-folded-horn-hybrid --from=tecnare-m2122
#     --stacks=2 --align=stereo --shape=pyramid --mirror-style=column --id=stacked-sdwa5------2
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 8 cabinets in 5 rows:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    1.546 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    1.546 m wide
#   3  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    1.546 m wide
#   4  1× skram rolled 270°                                                    0.914 m wide
#   5  1× tecnare-m2122                                                           0.5 m wide
#
# Subs reach 2.383 m against a 2.0 m interface. The stack is 3.343 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#
# main-2 — 2, 9 cabinets in 4 rows:
#
#   1  1× flexy-folded-horn-hybrid rolled 270° + 1× skram rolled 90° + 1× flexy-folded-horn-hybrid rolled 90°     2.48 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    1.546 m wide
#   3  1× flexy-folded-horn-hybrid rolled 270° + 1× flexy-folded-horn-hybrid rolled 90°    1.546 m wide
#   4  1× tecnare-m2122 + 1× tecnare-m2122                                      1.02 m wide
#
# Subs reach 1.792 m against a 2.0 m interface. The stack is 2.752 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * the subs reach 1.792 m against the 2.000 m interface asked for, so the tops sit 208 mm lower than ideal —
#     1.792 m is the most they reach while every tier is still carried
#
id: stacked-sdwa5------2-pyramid-turned--column----stereo-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 8 cabinets in 5 rows
  - id: main-1
    at: [-1.792, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1

  # 2, 9 cabinets in 4 rows
  - id: main-2
    at: [0.721, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      shape: pyramid
      from:
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2

