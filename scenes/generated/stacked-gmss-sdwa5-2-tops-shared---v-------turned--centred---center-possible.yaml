id: stacked-gmss-sdwa5-2-tops-shared---v-------turned--centred---center-possible
name: "Solved rig — 4 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-2, 8 cabinets in 2 rows
  - id: main-gmss-2
    at: [-4.638, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      from:
        - device: gmss-wall-bass
          count: 1
          roll_mirror: 90.0
        - device: gmss-nuke
          count: 1
          roll_mirror: 90.0
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 1
        - device: gmss-turbo-top
          count: 2
          aim: near

  # sdwa5-2, 7 cabinets in 4 rows
  - id: main-sdwa5-2
    at: [-1.325, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      from:
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0

  # sdwa5-1, 7 cabinets in 4 rows
  - id: main-sdwa5-1
    at: [0.721, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      mirror: true             # the mirror image of stack sdwa5-1
      from:
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0

  # gmss-1, 8 cabinets in 2 rows
  - id: main-gmss-1
    at: [4.034, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      mirror: true             # the mirror image of stack gmss-1
