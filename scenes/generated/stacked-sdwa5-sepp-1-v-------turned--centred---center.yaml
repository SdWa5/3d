# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --from=skram --from=flexy-folded-horn-hybrid --from=achenbach-18
#     --from=tecnare-m2122 --from=eighteensound-2way-15 --stacks=1 --align=center --shape=v --mirror-style=centred
#     --id=stacked-sdwa5-sepp-1
#
# What it deals out today:
#
#   1  3× achenbach-18 rolled 270° + 3× achenbach-18 rolled 90°                3.7 m wide
#   2  3× flexy-folded-horn-hybrid rolled 270° + 3× flexy-folded-horn-hybrid rolled 90°    4.678 m wide
#   3  3× flexy-folded-horn-hybrid rolled 270° + 3× flexy-folded-horn-hybrid rolled 90°    4.678 m wide
#   4  1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15   2.5112 m wide
#
# Subs reach 1.782 m against a 2.0 m interface. The stack is 2.742 m of cabinet.
#   * skram: LEFT OUT, it cannot be carried in this stack — the 4× flexy-folded-horn-hybrid rolled 270° + 4×
#     flexy-folded-horn-hybrid rolled 90° row is 6.244 m on a 8.700 m row, so the wall narrows as it rises — `shape: v`
#     asks for the opposite and this is not one of its arrangements
#   * the subs reach 1.782 m against the 2.000 m interface asked for, so the tops sit 218 mm lower than ideal —
#     1.782 m is the most they reach while every tier is still carried
#   * the 3× flexy-folded-horn-hybrid rolled 270° + 3× flexy-folded-horn-hybrid rolled 90° row is 4.678 m on a
#     3.700 m row, so it overhangs 489 mm each side
#
id: stacked-sdwa5-sepp-1-v-------turned--centred---center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: v
      from:
        - device: flexy-folded-horn-hybrid
          roll_mirror: 90.0
        - device: achenbach-18
          roll_mirror: 90.0
        - tecnare-m2122
