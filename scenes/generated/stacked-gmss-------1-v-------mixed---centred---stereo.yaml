# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=mixed --from=gmss-wall-bass --from=gmss-mid-bass --from=gmss-nuke
#     --from=gmss-iq-sub --from=gmss-turbo-top --stacks=1 --align=stereo --shape=v --mirror-style=centred
#     --id=stacked-gmss-------1
#
# What it deals out today:
#
#   1  1× gmss-nuke rolled 270° + 1× gmss-nuke + 1× gmss-mid-bass              2.6 m wide
#   2  1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass + 1× gmss-iq-sub rolled 90°     2.77 m wide
#   3  2× gmss-iq-sub rolled 270° + 1× gmss-iq-sub + 2× gmss-iq-sub rolled 90°     3.29 m wide
#   4  1× gmss-turbo-top + 1× gmss-turbo-top + 1× gmss-turbo-top               1.39 m wide
#
# Subs reach 2.84 m against a 2.0 m interface. The stack is 3.55 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass + 1× gmss-iq-sub rolled 90° row is 2.770 m on a 2.600
#     m row, so it overhangs 85 mm each side
#   * the 2× gmss-iq-sub rolled 270° + 1× gmss-iq-sub + 2× gmss-iq-sub rolled 90° row is 3.290 m on a 2.770 m
#     row, so it overhangs 260 mm each side
#
id: stacked-gmss-------1-v-------mixed---centred---stereo
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      shape: v
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - gmss-turbo-top

