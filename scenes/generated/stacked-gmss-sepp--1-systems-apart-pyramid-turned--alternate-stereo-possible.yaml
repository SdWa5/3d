# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=turned --per-owner --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top
#     --stacks=1 --align=stereo --shape=pyramid --mirror-style=alternate --id=stacked-gmss-sepp--1-systems-apart
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 14 cabinets in 4 rows:
#
#   1  1× gmss-iq-sub rolled 270° + 1× gmss-wall-bass rolled 270° + 1× gmss-wall-bass rolled 90° + 1× gmss-iq-sub rolled 90°      4.2 m wide
#   2  2× gmss-iq-sub rolled 270° + 2× gmss-iq-sub rolled 90°                 2.74 m wide
#   3  1× gmss-nuke rolled 270° + 1× gmss-mid-bass rolled 90° + 1× gmss-nuke rolled 90°     2.08 m wide
#   4  1× gmss-turbo-top + 1× gmss-turbo-top + 1× gmss-turbo-top               1.39 m wide
#
# Subs reach 2.39 m against a 2.0 m interface. The stack is 3.1 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
# main-sepp — sepp, 8 cabinets in 4 rows:
#
#   1  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   2  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   3  1× achenbach-18 rolled 270° + 1× achenbach-18 rolled 90°               1.22 m wide
#   4  1× eighteensound-2way-15 + 1× eighteensound-2way-15                    0.9512 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 2.636 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.800 m against the 2.000 m interface asked for, so the tops sit 200 mm lower than ideal —
#     1.800 m is the most they reach while every tier is still carried
#
id: stacked-gmss-sepp--1-systems-apart-pyramid-turned--alternate-stereo-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 14 cabinets in 4 rows
  - id: main-gmss
    at: [-1.162, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: gmss-mid-bass
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - gmss-turbo-top

  # sepp, 8 cabinets in 4 rows
  - id: main-sepp
    at: [2.048, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - device: achenbach-18
          roll_mirror: 90.0
        - eighteensound-2way-15

