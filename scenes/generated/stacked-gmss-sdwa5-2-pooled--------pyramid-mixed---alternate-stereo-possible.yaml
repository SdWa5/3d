id: stacked-gmss-sdwa5-2-pooled--------pyramid-mixed---alternate-stereo-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 17 cabinets in 2 rows
  - id: main-2
    at: [-5.498, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: gmss-wall-bass
          count: 1
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: gmss-nuke
          count: 1
          roll_mirror: 90.0
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: tecnare-m2122
          count: 2
        - device: gmss-turbo-top
          count: 2
          aim: near

  # 1, 14 cabinets in 2 rows
  - id: main-1
    at: [5.504, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: gmss-wall-bass
          count: 1
          roll_mirror: 90.0
        - device: skram
          count: 1
          roll_mirror: 90.0
