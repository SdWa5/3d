# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --from=gmss-wall-bass --from=gmss-mid-bass --from=skram
#     --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=tecnare-m2122
#     --from=eighteensound-2way-15 --from=gmss-turbo-top --stacks=1 --align=stereo --shape=v --mirror-style=alternate
#     --id=stacked-all--------1
#
# What it deals out today:
#
#   1  3× achenbach-18 + 3× gmss-iq-sub + 6× flexy-folded-horn-hybrid + 1× gmss-nuke + 2× skram + 1× gmss-nuke + 6× flexy-folded-horn-hybrid + 3× gmss-iq-sub + 3× achenbach-18 + 1× gmss-mid-bass   18.032 m wide
#   2  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× gmss-turbo-top + 1× tecnare-m2122 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× eighteensound-2way-15 + 1× tecnare-m2122   3.9212 m wide
#
# Subs reach 0.914 m against a 2.0 m interface. The stack is 1.874 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-wall-bass: LEFT OUT, it cannot be carried in this stack — the 4× flexy-folded-horn-hybrid row is 2.424 m
#     on a 6.108 m row, so the wall narrows as it rises — `shape: v` asks for the opposite and this is not one of its
#     arrangements
#   * the subs reach 0.914 m against the 2.000 m interface asked for, so the tops sit 1086 mm lower than ideal —
#     0.914 m is the most they reach while every tier is still carried
#
id: stacked-all--------1-v-------upright-alternate-stereo
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - gmss-mid-bass
        - skram
        - flexy-folded-horn-hybrid
        - gmss-nuke
        - achenbach-18
        - gmss-iq-sub
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near
        - device: gmss-turbo-top
          aim: near

