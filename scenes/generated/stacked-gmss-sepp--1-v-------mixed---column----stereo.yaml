#   1  1× gmss-mid-bass                                                           1.2 m wide
#   2  1× gmss-nuke rolled 270° + 1× gmss-nuke rolled 90°                     1.56 m wide
#   3  3× achenbach-18                                                           1.84 m wide
#   4  3× achenbach-18                                                           1.84 m wide
#   5  1× gmss-iq-sub rolled 270° + 2× gmss-iq-sub rolled 90°                 2.05 m wide
#   6  1× gmss-iq-sub rolled 270° + 2× gmss-iq-sub rolled 90°                 2.05 m wide
#   7  1× eighteensound-2way-15 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× eighteensound-2way-15   2.3612 m wide
#
# Subs reach 3.35 m against a 2.0 m interface. The stack is 4.186 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * gmss-wall-bass: LEFT OUT, it cannot be carried in this stack — the 5× achenbach-18 + 1× gmss-iq-sub rolled
#     90° row is 3.770 m on a 6.240 m row, so the wall narrows as it rises — `shape: v` asks for the opposite and this is
#     not one of its arrangements
#   * the subs reach 3.350 m against the 3.000 m ceiling asked for, so they stand 350 mm too high — 3.350 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× gmss-nuke rolled 270° + 1× gmss-nuke rolled 90° row is 1.560 m on a 1.200 m row, so it overhangs 180
#     mm each side
#   * the 3× achenbach-18 row is 1.840 m on a 1.560 m row, so it overhangs 140 mm each side
#   * the 1× gmss-iq-sub rolled 270° + 2× gmss-iq-sub rolled 90° row is 2.050 m on a 1.840 m row, so it overhangs
