id: stacked-gmss-sepp--1-v-------mixed---column----stereo
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      shape: v
      from:
        - gmss-mid-bass
        - device: gmss-nuke
          roll_mirror: 90.0
        - achenbach-18
        - device: gmss-iq-sub
          roll_mirror: 90.0
        - eighteensound-2way-15
        - device: gmss-turbo-top
          aim: near

