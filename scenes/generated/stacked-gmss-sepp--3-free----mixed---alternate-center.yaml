id: stacked-gmss-sepp--3-free----mixed---alternate-center
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 6 cabinets in 3 rows
  - id: main-1
    at: [-2.892, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror: true             # the mirror image of stack 1
      from:
        - device: achenbach-18
          count: 2
        - device: gmss-iq-sub
          count: 2
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: gmss-turbo-top
          count: 1
          aim: near

  # 2, 9 cabinets in 5 rows
  - id: main-2
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: gmss-wall-bass
          roll_mirror: 90.0
        - device: gmss-nuke
          roll_mirror: 90.0
        - device: achenbach-18
          count: 2
        - device: gmss-iq-sub
          count: 2
          roll_mirror: 90.0
        - device: gmss-turbo-top
          count: 1
          aim: near

  # 3, 6 cabinets in 3 rows
  - id: main-3
    at: [2.288, 0.0]
