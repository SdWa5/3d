id: stacked-2-pooled--------free----upright-alternate-center-low-----possible
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 7 cabinets in 3 rows
  - id: main-1
    at: [-1.702, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
