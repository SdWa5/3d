# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --room-width=13 --room-height=4 --system-interface=innschleife:1.6
#     --system-target=innschleife:1.75 --system-orientation=innschleife:turned --system-orientation=psl:turned
#     --system-orientation=sdwa5:upright --system-orientation=sepp:upright --stand=kicker-15 --systems=pooled
#     --quantity=sub-60x60:0 --quantity=tms4:0 --from=wsx-18 --from=sbh-18 --from=kicker-15 --from=top-70x93 --from=tms2
#     --stacks=1 --align=center --low-end=central --shape=free --mirror-style=centred --id=stacked
#     --into=innschleife-next-event
#
# What it deals out today:
#
#   1  2× wsx-18 rolled 270° + 2× wsx-18 rolled 90°                           4.46 m wide
#   2  2× sbh-18 rolled 270° + 2× sbh-18 rolled 90°                           4.86 m wide
#   3  4× kicker-15                                                              3.86 m wide
#   4  1× tms2 + 1× top-70x93 + 1× tms2                                         1.6 m wide
#
# Subs reach 1.69 m against a 1.6 m interface. The stack is 2.62 m of cabinet.
#   * the 2× sbh-18 rolled 270° + 2× sbh-18 rolled 90° row is 4.860 m on a 4.460 m row, so it overhangs 200 mm
#     each side
#
id: stacked-1-pooled--------free----stated--centred---center-central-possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 1.6
      max_sub_height_m: 3.0
      target_sub_height_m: 1.75
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: centred
      low_end: central
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - kicker-15
        - top-70x93
        - device: tms2
          aim: near

