# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --interface-height=1.6 --target-sub-height=1.75 --orientation=turned --systems=pooled
#     --quantity=sub-60x60:0 --quantity=tms4:0 --from=wsx-18 --from=sbh-18 --from=kicker-15 --from=top-70x93 --from=tms2
#     --stacks=1 --align=stereo --low-end=low --shape=v --mirror-style=alternate --id=stacked
#     --into=innschleife-next-event
#
# What it deals out today:
#
#   1  1× kicker-15 rolled 270° + 2× kicker-15 rolled 90°                     1.75 m wide
#   2  1× wsx-18 rolled 270° + 1× kicker-15 rolled 270° + 1× wsx-18 rolled 90°     2.81 m wide
#   3  1× wsx-18 rolled 270° + 1× wsx-18 rolled 90° + 1× sbh-18 rolled 90°     3.44 m wide
#   4  2× sbh-18 rolled 270° + 1× sbh-18 rolled 90°                           3.64 m wide
#   5  1× tms2 + 1× top-70x93 + 1× tms2                                         1.6 m wide
#
# Subs reach 3.02 m against a 1.6 m interface. The stack is 3.95 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.020 m against the 3.000 m ceiling asked for, so they stand 20 mm too high — 3.020 m is the
#     nearest the 1.750 m target that every tier is still carried at
#   * the 1× wsx-18 rolled 270° + 1× kicker-15 rolled 270° + 1× wsx-18 rolled 90° row is 2.810 m on a 1.750 m
#     row, so it overhangs 530 mm each side
#   * the 1× wsx-18 rolled 270° + 1× wsx-18 rolled 90° + 1× sbh-18 rolled 90° row is 3.440 m on a 2.810 m row,
#     so it overhangs 315 mm each side
#   * the 2× sbh-18 rolled 270° + 1× sbh-18 rolled 90° row is 3.640 m on a 3.440 m row, so it overhangs 100 mm
#     each side
#
id: stacked-1-pooled--------v-------turned--alternate-stereo-low-----possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 1.6
      max_sub_height_m: 3.0
      target_sub_height_m: 1.75
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - device: kicker-15
          roll_mirror: 90.0
        - top-70x93
        - device: tms2
          aim: near

