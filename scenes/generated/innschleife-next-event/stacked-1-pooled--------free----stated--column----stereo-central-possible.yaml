# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --room-width=13 --room-height=4 --system-interface=innschleife:1.6
#     --system-target=innschleife:1.75 --system-orientation=innschleife:turned --system-orientation=psl:turned
#     --system-orientation=sdwa5:upright --system-orientation=sepp:upright --stand=kicker-15 --systems=pooled
#     --quantity=sub-60x60:0 --quantity=tms4:0 --from=wsx-18 --from=sbh-18 --from=kicker-15 --from=top-70x93 --from=tms2
#     --stacks=1 --align=stereo --low-end=central --shape=free --mirror-style=column --id=stacked
#     --into=innschleife-next-event
#
# What it deals out today:
#
#   1  1× wsx-18 rolled 270° + 2× wsx-18 rolled 90°                           3.34 m wide
#   2  1× sbh-18 rolled 270° + 1× wsx-18 rolled 90° + 1× sbh-18 rolled 90°     3.54 m wide
#   3  1× sbh-18 rolled 270° + 1× kicker-15 + 1× sbh-18 rolled 90°           3.39 m wide
#   4  3× kicker-15                                                              2.89 m wide
#   5  1× tms2 + 1× top-70x93 + 1× tms2                                         1.6 m wide
#
# Subs reach 2.28 m against a 1.6 m interface. The stack is 3.21 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 1× sbh-18 rolled 270° + 1× wsx-18 rolled 90° + 1× sbh-18 rolled 90° row is 3.540 m on a 3.340 m row,
#     so it overhangs 100 mm each side
#
id: stacked-1-pooled--------free----stated--column----stereo-central-possible
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 1.6
      max_sub_height_m: 3.0
      target_sub_height_m: 1.75
      gap_m: 0.02
      slide_slack_m: .inf
      mirror_style: column
      low_end: central
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - kicker-15
        - top-70x93
        - device: tms2
          aim: near

