# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --interface-height=1.6 --target-sub-height=1.75 --orientation=turned --systems=pooled
#     --quantity=sub-60x60:0 --quantity=tms4:0 --from=wsx-18 --from=sbh-18 --from=kicker-15 --from=top-70x93 --from=tms2
#     --stacks=1 --align=center --low-end=low --shape=pyramid --mirror-style=alternate --id=stacked
#     --into=innschleife-next-event
#
# What it deals out today:
#
#   1  2× sbh-18 rolled 270° + 2× sbh-18 rolled 90°                           4.86 m wide
#   2  2× wsx-18 rolled 270° + 2× wsx-18 rolled 90°                           4.46 m wide
#   3  2× kicker-15 rolled 270° + 2× kicker-15 rolled 90°                     2.34 m wide
#   4  1× tms2 + 1× top-70x93 + 1× tms2                                         1.6 m wide
#
# Subs reach 2.07 m against a 1.6 m interface. The stack is 3.0 m of cabinet.
#
id: stacked-1-pooled--------pyramid-turned--alternate-center-low-----possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 1.6
      max_sub_height_m: 3.0
      target_sub_height_m: 1.75
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - device: kicker-15
          roll_mirror: 90.0
        - top-70x93
        - device: tms2
          aim: near

