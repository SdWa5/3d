# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --clearance=0.24 --room-width=13 --room-height=4 --system-interface=innschleife:1.6
#     --system-target=innschleife:1.75 --system-orientation=innschleife:turned --system-orientation=psl:turned
#     --system-orientation=sdwa5:upright --system-orientation=sepp:upright --system-low-end=innschleife:low
#     --system-low-end=sdwa5:central --system-low-end=sepp:central --stand=kicker-15 --systems=pooled
#     --quantity=sub-60x60:0 --quantity=tms4:1 --from=wsx-18 --from=sbh-18 --from=kicker-15 --from=tms4 --from=tms2
#     --stacks=1 --align=center --low-end=low --shape=pyramid --mirror-style=alternate --id=stacked
#     --into=innschleife-next-event
#
# What it deals out today:
#
#   1  1× wsx-18 rolled 270° + 1× sbh-18 rolled 270° + 1× sbh-18 rolled 90° + 1× wsx-18 rolled 90°     4.66 m wide
#   2  1× wsx-18 rolled 270° + 1× sbh-18 rolled 270° + 1× sbh-18 rolled 90° + 1× wsx-18 rolled 90°     4.66 m wide
#   3  4× kicker-15                                                              3.86 m wide
#   4  1× tms2 + 1× tms4 + 1× tms2                                              1.4 m wide
#
# Subs reach 1.71 m against a 1.6 m interface. The stack is 2.85 m of cabinet.
#
id: stacked-1-pooled--------pyramid-stated--alternate-center-stated--possible
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 1.6
      max_sub_height_m: 3.0
      target_sub_height_m: 1.75
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - device: wsx-18
          roll_mirror: 90.0
        - device: sbh-18
          roll_mirror: 90.0
        - kicker-15
        - device: tms4
          count: 1
        - device: tms2
          aim: near

