# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=4.4 --roll-mirror=flexy-folded-horn-hybrid --roll-mirror=skram
#     --from=gmss-wall-bass --from=gmss-mid-bass --from=skram --from=flexy-folded-horn-hybrid --from=gmss-nuke
#     --from=achenbach-18 --from=gmss-iq-sub --from=tecnare-m2122 --from=eighteensound-2way-15 --from=gmss-turbo-top
#     --stacks=2 --align=center --shape=pyramid --mirror-style=alternate --id=stacked-all-2-turned
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 18 cabinets in 4 rows:
#
#   1  3× flexy-folded-horn-hybrid rolled 270° + 2× flexy-folded-horn-hybrid rolled 90°    3.895 m wide
#   2  1× flexy-folded-horn-hybrid rolled 270° + 2× achenbach-18 + 1× gmss-iq-sub + 1× achenbach-18    3.173 m wide
#   3  1× skram rolled 270° + 1× gmss-iq-sub + 1× gmss-nuke + 1× gmss-wall-bass + 1× gmss-iq-sub    3.304 m wide
#   4  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× gmss-turbo-top       1.4556 m wide
#
# Subs reach 2.661 m against a 2.0 m interface. The stack is 3.621 m of cabinet.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * the 1× skram rolled 270° + 1× gmss-iq-sub + 1× gmss-nuke + 1× gmss-wall-bass + 1× gmss-iq-sub row is 3.304
#     m on a 3.173 m row, so it overhangs 65 mm each side
#
# main-2 — 2, 20 cabinets in 4 rows:
#
#   1  2× flexy-folded-horn-hybrid rolled 270° + 3× flexy-folded-horn-hybrid rolled 90°    3.895 m wide
#   2  1× achenbach-18 + 1× gmss-iq-sub + 2× achenbach-18 + 1× flexy-folded-horn-hybrid rolled 90°    3.173 m wide
#   3  1× gmss-iq-sub + 1× gmss-wall-bass + 1× gmss-nuke + 1× gmss-iq-sub + 1× skram rolled 90°    3.304 m wide
#   4  1× gmss-turbo-top + 1× eighteensound-2way-15 + 2× tecnare-m2122 + 1× gmss-turbo-top   2.4456 m wide
#
# Subs reach 2.661 m against a 2.0 m interface. The stack is 3.621 m of cabinet.
#   * tecnare-m2122: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so the
#     stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * gmss-mid-bass: LEFT OUT, it cannot be carried in this stack — a gmss-turbo-top in the 1× gmss-turbo-top + 1×
#     eighteensound-2way-15 + 2× tecnare-m2122 + 1× gmss-turbo-top row has nothing under it at all, so it would fall to
#     the floor — inside the row below it
#   * the 1× gmss-iq-sub + 1× gmss-wall-bass + 1× gmss-nuke + 1× gmss-iq-sub + 1× skram rolled 90° row is 3.304
#     m on a 3.173 m row, so it overhangs 65 mm each side
#
id: stacked-all-2-turned-center
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 18 cabinets in 4 rows
  - id: main-1
    at: [-2.4995, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 4.4
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack 1
      from:
        - device: gmss-wall-bass
          count: 1
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: gmss-nuke
          count: 1
        - device: achenbach-18
          count: 3
        - device: gmss-iq-sub
          count: 3
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: gmss-turbo-top
          count: 1
          aim: near

  # 2, 20 cabinets in 4 rows
  - id: main-2
    at: [1.8955, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 4.4
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: gmss-wall-bass
          count: 1
        - device: skram
          count: 1
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
          roll_mirror: 90.0
        - device: gmss-nuke
          count: 1
        - device: achenbach-18
          count: 3
        - device: gmss-iq-sub
          count: 3
        - device: tecnare-m2122
          count: 2
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: gmss-turbo-top
          count: 2
          aim: near

