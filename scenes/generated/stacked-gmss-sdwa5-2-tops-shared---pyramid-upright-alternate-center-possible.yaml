id: stacked-gmss-sdwa5-2-tops-shared---pyramid-upright-alternate-center-possible
name: "Solved rig — 4 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-2, 9 cabinets in 2 rows
  - id: main-gmss-2
    at: [-3.68, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: gmss-wall-bass
          count: 1
        - gmss-mid-bass
        - device: gmss-nuke
          count: 1
        - device: gmss-iq-sub
          count: 3
        - device: tecnare-m2122
          count: 2
        - device: gmss-turbo-top
          count: 1
          aim: near

  # sdwa5-1, 8 cabinets in 4 rows
  - id: main-sdwa5-1
    at: [-0.2035, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack sdwa5-1
      from:
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: tecnare-m2122
          count: 1

