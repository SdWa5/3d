id: stacked-all--------3-free----upright-alternate-stereo
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 17 cabinets in 6 rows
  - id: main-2
    at: [-2.2576, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - skram
        - device: flexy-folded-horn-hybrid
          count: 4
        - gmss-nuke
        - device: achenbach-18
          count: 2
        - device: gmss-iq-sub
          count: 2
        - device: tecnare-m2122
          count: 1
        - device: gmss-turbo-top
          count: 1
          aim: near

  # 3, 11 cabinets in 5 rows
  - id: main-3
    at: [0.1917, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: flexy-folded-horn-hybrid
          count: 4
        - device: achenbach-18
          count: 2
        - device: gmss-iq-sub
          count: 2
        - device: tecnare-m2122
          count: 1
        - device: eighteensound-2way-15
          count: 1
          aim: near
        - device: gmss-turbo-top
