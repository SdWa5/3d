# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --from=gmss-wall-bass --from=gmss-mid-bass --from=gmss-nuke
#     --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top --stacks=1 --align=center
#     --shape=pyramid --mirror-style=alternate --id=stacked-gmss-sepp--1
#
# What it deals out today:
#
#   1  5× achenbach-18                                                           3.08 m wide
#   2  4× gmss-iq-sub + 1× achenbach-18                                          2.8 m wide
#   3  1× gmss-iq-sub + 2× gmss-wall-bass + 1× gmss-iq-sub                     2.44 m wide
#   4  2× gmss-nuke + 1× gmss-mid-bass                                          2.42 m wide
#   5  2× gmss-turbo-top + 2× eighteensound-2way-15 + 1× gmss-turbo-top      2.3612 m wide
#
# Subs reach 3.44 m against a 2.0 m interface. The stack is 4.276 m of cabinet.
#   * the subs reach 3.440 m against the 3.000 m ceiling asked for, so they stand 440 mm too high — 3.440 m is the
#     nearest the 2.500 m target that every tier is still carried at
#
id: stacked-gmss-sepp--1-pyramid-upright-alternate-center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: pyramid
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - achenbach-18
        - gmss-iq-sub
        - eighteensound-2way-15
        - device: gmss-turbo-top
          aim: near

