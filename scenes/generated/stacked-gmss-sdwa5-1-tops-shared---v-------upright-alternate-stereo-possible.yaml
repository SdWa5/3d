# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=tops-shared --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=gmss-iq-sub --from=tecnare-m2122
#     --from=gmss-turbo-top --stacks=1 --align=stereo --shape=v --mirror-style=alternate
#     --id=stacked-gmss-sdwa5-1-tops-shared--
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-sdwa5 — sdwa5, 14 cabinets in 3 rows:
#
#   1  1× flexy-folded-horn-hybrid + 2× skram + 1× flexy-folded-horn-hybrid    2.462 m wide
#   2  5× flexy-folded-horn-hybrid                                              3.035 m wide
#   3  5× flexy-folded-horn-hybrid                                              3.035 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 2.44 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the 5× flexy-folded-horn-hybrid row is 3.035 m on a 2.462 m row, so it overhangs 286 mm each side
#
# main-gmss — gmss, 17 cabinets in 2 rows:
#
#   1  3× gmss-iq-sub + 1× gmss-nuke + 2× gmss-wall-bass + 1× gmss-nuke + 3× gmss-iq-sub + 1× gmss-mid-bass     7.08 m wide
#   2  1× tecnare-m2122 + 1× gmss-turbo-top + 1× tecnare-m2122 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× tecnare-m2122     2.95 m wide
#
# Subs reach 1.4 m against a 2.0 m interface. The stack is 2.36 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.400 m against the 2.000 m interface asked for, so the tops sit 600 mm lower than ideal —
#     1.400 m is the most they reach while every tier is still carried
#
id: stacked-gmss-sdwa5-1-tops-shared---v-------upright-alternate-stereo-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # sdwa5, 14 cabinets in 3 rows
  - id: main-sdwa5
    at: [-4.092, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - skram
        - flexy-folded-horn-hybrid

  # gmss, 17 cabinets in 2 rows
  - id: main-gmss
    at: [1.4655, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      shape: v
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - gmss-iq-sub
        - tecnare-m2122
        - device: gmss-turbo-top
          aim: near

