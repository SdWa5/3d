# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --max-width=3.7 --orientation=mixed --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=gmss-nuke --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top
#     --stacks=2 --align=center --shape=v --mirror-style=column --id=stacked-gmss-sepp-2
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-1 — 1, 10 cabinets in 5 rows:
#
#   1  1× gmss-nuke rolled 270°                                                 0.77 m wide
#   2  1× gmss-wall-bass rolled 270°                                             1.4 m wide
#   3  3× achenbach-18                                                           1.84 m wide
#   4  2× gmss-iq-sub rolled 270° + 1× gmss-iq-sub rolled 90°                 2.05 m wide
#   5  1× eighteensound-2way-15 + 1× gmss-turbo-top                           0.9356 m wide
#
# Subs reach 2.38 m against a 2.0 m interface. The stack is 3.216 m of cabinet.
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * the 1× gmss-wall-bass rolled 270° row is 1.400 m on a 0.770 m row, so it overhangs 315 mm each side
#   * the 3× achenbach-18 row is 1.840 m on a 1.400 m row, so it overhangs 220 mm each side
#   * the 2× gmss-iq-sub rolled 270° + 1× gmss-iq-sub rolled 90° row is 2.050 m on a 1.840 m row, so it overhangs
#     105 mm each side
#
# main-2 — 2, 12 cabinets in 6 rows:
#
#   1  1× gmss-nuke rolled 90°                                                  0.77 m wide
#   2  1× gmss-mid-bass                                                           1.2 m wide
#   3  1× gmss-wall-bass rolled 90°                                              1.4 m wide
#   4  3× achenbach-18                                                           1.84 m wide
#   5  1× gmss-iq-sub rolled 270° + 2× gmss-iq-sub rolled 90°                 2.05 m wide
#   6  1× gmss-turbo-top + 1× eighteensound-2way-15 + 1× gmss-turbo-top      1.4056 m wide
#
# Subs reach 2.88 m against a 2.0 m interface. The stack is 3.716 m of cabinet.
#   * gmss-turbo-top: SPLIT UNEVENLY, 1 of 3 over 2 stacks — 1 each and the remaining 1 dealt outermost first, so
#     the stacks are not identical. --no-asymmetry leaves them out instead
#   * the 1× gmss-mid-bass row is 1.200 m on a 0.770 m row, so it overhangs 215 mm each side
#   * the 1× gmss-wall-bass rolled 90° row is 1.400 m on a 1.200 m row, so it overhangs 100 mm each side
#   * the 3× achenbach-18 row is 1.840 m on a 1.400 m row, so it overhangs 220 mm each side
#   * the 1× gmss-iq-sub rolled 270° + 2× gmss-iq-sub rolled 90° row is 2.050 m on a 1.840 m row, so it overhangs
#     105 mm each side
#
id: stacked-gmss-sepp-2-v-mixed-column-center
name: "Solved rig — 2 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 10 cabinets in 5 rows
  - id: main-1
    at: [-1.577, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      shape: v
      mirror: true             # the mirror image of stack 1
      from:
        - device: gmss-wall-bass
          count: 1
          roll_mirror: 90.0
        - device: gmss-nuke
          count: 1
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: gmss-turbo-top
          count: 1
          aim: near

  # 2, 12 cabinets in 6 rows
  - id: main-2
    at: [0.973, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: column
      shape: v
      from:
        - device: gmss-wall-bass
          count: 1
          roll_mirror: 90.0
        - gmss-mid-bass
        - device: gmss-nuke
          count: 1
          roll_mirror: 90.0
        - device: achenbach-18
          count: 3
        - device: gmss-iq-sub
          count: 3
          roll_mirror: 90.0
        - device: eighteensound-2way-15
          count: 1
        - device: gmss-turbo-top
          count: 2
          aim: near

