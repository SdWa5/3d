id: stacked-2-pooled--------free----stated--alternate-stereo-low-----possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 1, 21 cabinets in 4 rows
  - id: main-1
    at: [-3.412, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror: true             # the mirror image of stack 1
      from:
        - device: wsx-18
          count: 2
          roll_mirror: 90.0
        - device: sbh-18
          count: 2
          roll_mirror: 90.0
        - device: skram
          count: 1
        - device: concert-audio-esx
          count: 4
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: kicker-15
          count: 2
        - device: tecnare-m2122
          count: 1
          aim: near
        - device: concert-audio-ef6
          count: 1
        - device: tms2
          count: 1
          aim: near
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # 2, 23 cabinets in 4 rows
  - id: main-2
    at: [3.063, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: wsx-18
          count: 2
          roll_mirror: 90.0
        - device: sbh-18
          count: 2
          roll_mirror: 90.0
        - device: skram
          count: 1
        - device: concert-audio-esx
          count: 5
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: kicker-15
          count: 2
        - device: tecnare-m2122
          count: 2
          aim: near
        - device: concert-audio-ef6
          count: 1
        - device: tms2
          count: 1
          aim: near
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # Backdrop: deco-panel-8x2-03 hung from 5× truss-f33-2m on two truss-tower-4m, 0.75 m behind the rig's deepest back face.
  # The truss tops out at 4 m. Each tower carries 35.4 kg.
  - id: backdrop-tower-left
    device: truss-tower-4m
    at: [-5.2, 1.232]
    extend_to_m: 3.742
  - id: backdrop-tower-right
    device: truss-tower-4m
    at: [4.597, 1.232]
    extend_to_m: 3.742
  - id: backdrop-truss
    device: truss-f33-2m
    at: [-0.302, 1.232]
    fly:
      height_m: 3.742
      id: backdrop
    row:
      count: 5
      gap_m: 0.0
  - id: backdrop-deco
    device: deco-panel-8x2-03
    at: [-0.302, 1.062]
    fly:
      height_m: 1.974
      id: backdrop
