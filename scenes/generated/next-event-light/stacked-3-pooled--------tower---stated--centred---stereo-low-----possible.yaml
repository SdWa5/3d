id: stacked-3-pooled--------tower---stated--centred---stereo-low-----possible
name: "Solved rig — 3 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 2, 17 cabinets in 5 rows
  - id: main-2
    at: [-2.964, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: tower
      from:
        - device: wsx-18
          count: 2
          roll_mirror: 90.0
        - device: sbh-18
          count: 2
          roll_mirror: 90.0
        - skram
        - device: concert-audio-esx
          count: 3
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 4
        - device: kicker-15
          count: 2
        - device: tms4
          count: 1
          aim: near
        - device: tecnare-m2122
          count: 1
          aim: near

  # 1, 14 cabinets in 5 rows
  - id: main-1
    at: [0.3085, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: tower
      mirror: true             # the mirror image of stack 1
      from:
        - device: wsx-18
          count: 1
          roll_mirror: 90.0
        - device: sbh-18
          count: 1
          roll_mirror: 90.0
        - device: concert-audio-esx
          count: 3
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 4
        - device: kicker-15
          count: 1
        - device: tecnare-m2122
          count: 1
          aim: near
        - device: concert-audio-ef6
          count: 1
        - device: tms2
          count: 1
          aim: near
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # 3, 14 cabinets in 5 rows
  - id: main-3
    at: [2.9705, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror_style: centred
      shape: tower
      from:
        - device: wsx-18
          count: 1
          roll_mirror: 90.0
        - device: sbh-18
          count: 1
          roll_mirror: 90.0
        - device: concert-audio-esx
          count: 3
          roll_mirror: 90.0
        - device: flexy-folded-horn-hybrid
          count: 4
        - device: kicker-15
          count: 1
        - device: tecnare-m2122
          count: 1
          aim: near
        - device: concert-audio-ef6
          count: 1
        - device: tms2
          count: 1
          aim: near
        - device: eighteensound-2way-15
          count: 1
          aim: near

  # Backdrop: deco-panel-8x2-03 hung from 5× truss-f33-2m on two truss-tower-4m, 0.75 m behind the rig's deepest back face.
  # The truss tops out at 4 m. Each tower carries 35.4 kg.
  - id: backdrop-tower-left
    device: truss-tower-4m
    at: [-5.2, 1.232]
    extend_to_m: 3.742
  - id: backdrop-tower-right
    device: truss-tower-4m
    at: [4.597, 1.232]
    extend_to_m: 3.742
  - id: backdrop-truss
    device: truss-f33-2m
    at: [-0.302, 1.232]
    fly:
      height_m: 3.742
      id: backdrop
    row:
      count: 5
      gap_m: 0.0
  - id: backdrop-deco
    device: deco-panel-8x2-03
    at: [-0.302, 1.062]
    fly:
      height_m: 1.974
      id: backdrop
