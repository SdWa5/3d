id: stacked-gmss-sdwa5-2-systems-apart-pyramid-upright-alternate-stereo-possible
name: "Solved rig — 4 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-1, 6 cabinets in 4 rows
  - id: main-gmss-1
    at: [-3.6895, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack gmss-1
      from:
        - device: gmss-wall-bass
          count: 1
        - device: gmss-nuke
          count: 1
        - device: gmss-iq-sub
          count: 3
        - device: gmss-turbo-top
          count: 1

  # sdwa5-1, 8 cabinets in 4 rows
  - id: main-sdwa5-1
    at: [-1.468, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      mirror: true             # the mirror image of stack sdwa5-1
      from:
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: tecnare-m2122
          count: 1

  # sdwa5-2, 9 cabinets in 4 rows
  - id: main-sdwa5-2
    at: [0.8545, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: skram
          count: 1
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: tecnare-m2122
          count: 2

  # gmss-2, 8 cabinets in 4 rows
  - id: main-gmss-2
    at: [3.0855, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: gmss-wall-bass
          count: 1
        - gmss-mid-bass
        - device: gmss-nuke
          count: 1
        - device: gmss-iq-sub
          count: 3
        - device: gmss-turbo-top
          count: 2

