# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --systems=tops-shared --from=gmss-wall-bass --from=gmss-mid-bass
#     --from=skram --from=flexy-folded-horn-hybrid --from=gmss-nuke --from=gmss-iq-sub --from=tecnare-m2122
#     --from=gmss-turbo-top --stacks=1 --align=stereo --shape=free --mirror-style=alternate
#     --id=stacked-gmss-sdwa5-1-tops-shared--
#
# 2 stacks side by side, with 0.5 m of air between them.
#
# main-gmss — gmss, 13 cabinets in 5 rows:
#
#   1  2× gmss-wall-bass                                                         1.34 m wide
#   2  1× gmss-nuke + 1× gmss-mid-bass                                          1.81 m wide
#   3  1× gmss-iq-sub + 1× gmss-nuke + 2× gmss-iq-sub                          2.24 m wide
#   4  3× gmss-iq-sub                                                            1.63 m wide
#   5  1× tecnare-m2122 + 1× gmss-turbo-top                                     0.97 m wide
#
# Subs reach 3.61 m against a 2.0 m interface. The stack is 4.57 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 3.610 m against the 3.000 m ceiling asked for, so they stand 610 mm too high — 3.610 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× gmss-nuke + 1× gmss-mid-bass row is 1.810 m on a 1.340 m row, so it overhangs 235 mm each side
#   * the 1× gmss-iq-sub + 1× gmss-nuke + 2× gmss-iq-sub row is 2.240 m on a 1.810 m row, so it overhangs 215 mm
#     each side
#
# main-sdwa5 — sdwa5, 18 cabinets in 4 rows:
#
#   1  2× flexy-folded-horn-hybrid + 2× skram + 2× flexy-folded-horn-hybrid    3.684 m wide
#   2  4× flexy-folded-horn-hybrid                                              2.424 m wide
#   3  4× flexy-folded-horn-hybrid                                              2.424 m wide
#   4  1× tecnare-m2122 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× tecnare-m2122     1.96 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.4 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
id: stacked-gmss-sdwa5-1-tops-shared---free----upright-alternate-stereo-possible
name: "Solved rig — 2 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss, 13 cabinets in 5 rows
  - id: main-gmss
    at: [-2.394, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - gmss-iq-sub
        - device: tecnare-m2122
          count: 1
        - device: gmss-turbo-top
          count: 1
          aim: near

  # sdwa5, 18 cabinets in 4 rows
  - id: main-sdwa5
    at: [1.068, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      from:
        - skram
        - flexy-folded-horn-hybrid
        - device: tecnare-m2122
          count: 2
        - device: gmss-turbo-top
          count: 2
          aim: near

