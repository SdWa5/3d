id: stacked-gmss-sepp--3-tops-shared---v-------upright-alternate-stereo-possible
name: "Solved rig — 6 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-2, 12 cabinets in 2 rows
  - id: main-gmss-2
    at: [-4.462, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: v
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - device: gmss-iq-sub
          count: 2
        - eighteensound-2way-15
