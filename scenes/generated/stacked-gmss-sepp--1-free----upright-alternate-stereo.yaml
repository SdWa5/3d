# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --orientation=upright --from=gmss-wall-bass --from=gmss-mid-bass --from=gmss-nuke
#     --from=achenbach-18 --from=gmss-iq-sub --from=eighteensound-2way-15 --from=gmss-turbo-top --stacks=1 --align=stereo
#     --shape=free --mirror-style=alternate --id=stacked-gmss-sepp--1
#
# What it deals out today:
#
#   1  2× gmss-wall-bass                                                         1.34 m wide
#   2  1× gmss-nuke + 1× gmss-mid-bass                                          1.81 m wide
#   3  1× achenbach-18 + 1× gmss-nuke + 2× achenbach-18                        2.45 m wide
#   4  1× achenbach-18 + 2× gmss-iq-sub + 2× achenbach-18                      2.94 m wide
#   5  4× gmss-iq-sub                                                            2.18 m wide
#   6  1× eighteensound-2way-15 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× eighteensound-2way-15   2.3612 m wide
#
# Subs reach 4.28 m against a 2.0 m interface. The stack is 5.116 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 4.280 m against the 3.000 m ceiling asked for, so they stand 1280 mm too high — 4.280 m is the
#     nearest the 2.500 m target that every tier is still carried at
#   * the 1× gmss-nuke + 1× gmss-mid-bass row is 1.810 m on a 1.340 m row, so it overhangs 235 mm each side
#   * the 1× achenbach-18 + 1× gmss-nuke + 2× achenbach-18 row is 2.450 m on a 1.810 m row, so it overhangs 320 mm
#     each side
#   * the 1× achenbach-18 + 2× gmss-iq-sub + 2× achenbach-18 row is 2.940 m on a 2.450 m row, so it overhangs 245
#     mm each side
#   * the 1× eighteensound-2way-15 + 1× gmss-turbo-top + 1× gmss-turbo-top + 1× gmss-turbo-top + 1×
#     eighteensound-2way-15 row is 2.361 m on a 2.180 m row, so it overhangs 91 mm each side
#
id: stacked-gmss-sepp--1-free----upright-alternate-stereo
name: "Solved rig — one stack, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      slide_slack_m: .inf
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - achenbach-18
        - gmss-iq-sub
        - eighteensound-2way-15
        - device: gmss-turbo-top
          aim: near

