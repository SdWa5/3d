id: stacked-gmss-sdwa5-3-pooled--------pyramid-upright-alternate-center-possible
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 3, 8 cabinets in 4 rows
  - id: main-3
    at: [-3.925, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      shape: pyramid
      from:
        - device: flexy-folded-horn-hybrid
          count: 4
        - device: gmss-iq-sub
          count: 2
        - device: tecnare-m2122
          count: 1
        - device: gmss-turbo-top
          count: 1
          aim: near

