id: stacked-gmss-sepp--3-systems-apart-free----upright-alternate-stereo-possible
name: "Solved rig — 6 stacks side by side, tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # gmss-2, 8 cabinets in 4 rows
  - id: main-gmss-2
    at: [-4.462, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - gmss-wall-bass
        - gmss-mid-bass
        - gmss-nuke
        - device: gmss-iq-sub
          count: 2
        - device: gmss-turbo-top
          count: 1

  # gmss-3, 3 cabinets in 2 rows
  - id: main-gmss-3
    at: [-2.517, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: gmss-iq-sub
          count: 2
        - device: gmss-turbo-top
          count: 1

  # sepp-2, 2 cabinets in 1 row
  - id: main-sepp-2
    at: [-0.867, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: achenbach-18
          count: 2

  # sepp-3, 3 cabinets in 2 rows
  - id: main-sepp-3
    at: [0.853, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      from:
        - device: achenbach-18
          count: 2
        - device: eighteensound-2way-15
          count: 1

  # sepp-1, 3 cabinets in 2 rows
  - id: main-sepp-1
    at: [2.573, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      max_sub_height_m: 3.0
      gap_m: 0.02
      mirror: true             # the mirror image of stack sepp-1
      from:
        - device: achenbach-18
          count: 2
        - device: eighteensound-2way-15
          count: 1

  # gmss-1, 3 cabinets in 2 rows
  - id: main-gmss-1
    at: [4.223, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
