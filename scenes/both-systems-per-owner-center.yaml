# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# 3 stacks side by side, with 0.5 m of air between them.
#
# main-sdwa5 — sdwa5, 17 cabinets in 4 rows:
#
#   1  2× flexy-folded-horn-hybrid + 2× skram + 2× flexy-folded-horn-hybrid    3.684 m wide
#   2  4× flexy-folded-horn-hybrid                                              2.424 m wide
#   3  4× flexy-folded-horn-hybrid                                              2.424 m wide
#   4  3× tecnare-m2122                                                          1.54 m wide
#
# Subs reach 2.44 m against a 2.0 m interface. The stack is 3.4 m of cabinet.
#
# main-sepp — sepp, 8 cabinets in 4 rows:
#
#   1  2× achenbach-18                                                           1.22 m wide
#   2  2× achenbach-18                                                           1.22 m wide
#   3  2× achenbach-18                                                           1.22 m wide
#   4  2× eighteensound-2way-15                                                0.9512 m wide
#
# Subs reach 1.8 m against a 2.0 m interface. The stack is 2.636 m of cabinet.
#   * the subs reach 1.800 m against the 2.000 m interface asked for, so the tops sit 200 mm lower than ideal —
#     1.800 m is the most they reach while every tier is still carried
#
# main-gmss — gmss, 16 cabinets in 5 rows:
#
#   1  4× gmss-turbo-sub                                                         3.26 m wide
#   2  4× gmss-turbo-sub                                                         3.26 m wide
#   3  3× gmss-middle-sub                                                        2.74 m wide
#   4  2× gmss-mid-bass                                                          1.82 m wide
#   5  3× gmss-turbo-top                                                         1.42 m wide
#
# Subs reach 3.85 m against a 2.0 m interface. The stack is 5.0 m of cabinet.
#
id: both-systems-per-owner-center
name: "Solved rig — 3 stacks side by side, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # sdwa5, 17 cabinets in 4 rows
  - id: main-sdwa5
    at: [-3.042, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      gap_m: 0.02
      from:
        - skram
        - flexy-folded-horn-hybrid
        - tecnare-m2122

  # sepp, 8 cabinets in 4 rows
  - id: main-sepp
    at: [-0.09, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      gap_m: 0.02
      from:
        - achenbach-18
        - eighteensound-2way-15

  # gmss, 16 cabinets in 5 rows
  - id: main-gmss
    at: [2.65, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      # 0.05 rather than the 0.02 the other two stacks use, and this is a HAND EDIT to a generated file.
      # `scene:stack` wrote 0.02 and the result overlapped: this stack sits 2.65 m off the centre line, so its
      # three aimed tops toe in on the focus at 17.4, 14.8 and 12.25 degrees — about 2.6 apart — and two boxes at
      # different angles need roughly depth x sin(difference), so 0.70 x sin(2.6) = 32 mm, more than the 20 mm
      # they were given. They bit 22.8 mm into each other. The solver spaces an aimed row on the cabinet's flat
      # width and does not account for the toe-in at all; see TODO.md. Regenerating this file reintroduces it.
      gap_m: 0.05
      from:
        - gmss-turbo-sub
        - gmss-middle-sub
        - gmss-mid-bass
        - gmss-turbo-top

