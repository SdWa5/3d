# EVERYTHING — every device in the repository, in one picture.
#
# WHY IT EXISTS. Nothing else shows the whole inventory at once. `detail-check.yaml` lines every device up as a
# contact sheet with nothing standing on anything; `full-rig-truss.yaml` is our own rig; `gmss-full-stack-truss.yaml`
# is theirs. This is a load-in: both systems' speakers, the truss over them with the lights hung, both scaffold
# towers and all three racks.
#
# THE SPEAKERS ARE `all-speakers-three-center.yaml`, block for block. Three stacks, 39 of the 41 cabinets both
# systems own, owner ignored — two turbo subs are left out because three stacks take two each and an odd cabinet
# would make one stack a different height, which the solver states for itself. Three rather than one or two because
# it is the widest of the set, so there is room under a truss and the stacks are close to level.
#
# THE TOPS ARE NOT AIMED, for the reason `all-speakers-three-center.yaml` records: aiming a mixed tops row of more
# than a couple of device types places two of them coincident. Pre-existing, filed in TODO.md.
#
# EVERY POSITION OUTSIDE THE STACKS IS COPIED FROM A SCENE THAT ALREADY PROVED IT, rather than derived again:
#
#   the truss          `full-rig-truss.yaml`, but carried by the GERÜSTE — ours cannot clear this rig, see below
#   the lights         `gmss-full-stack-truss.yaml` — `roll_deg: 180`, and `fly.height_m` is the fixture's TOP
#   the Gerüste        moved under the truss ends, because their 5.000 m platforms are what can carry it
#   the racks          `full-rig-truss.yaml` — behind the wall, 43 mm off its back face
#
# WHAT IS DIFFERENT HERE, and both differences are the rig's size rather than choices. The stacks are 6.77 m across
# where our own rig is 3.70, so the truss spans 10 m — every segment we own — with a tower 5 m either side of centre.
# And they reach 4.085 m, which is TALLER THAN OUR 4 m STANDS, so the goalpost stands on GMSS's 5.2 m towers.
id: everything
name: "Everything — both systems, truss, lights, scaffold and racks"

focus:
  far:
    distance_m: 14.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ─── THE SPEAKERS: all-speakers-three-center, unchanged ───────────────────────────────────────────────────────
  # 1, 12 cabinets in 5 rows
  - id: main-1
    at: [-2.9355, 0.0]
    stack:
      max_width_m: 3.7
      interface_height_m: 2.5
      gap_m: 0.05
      mirror: true             # the mirror image of stack 1
      from:
        - device: flexy-folded-horn-hybrid
          count: 4
        - device: achenbach-18
          count: 2
        - device: gmss-turbo-sub
          count: 2
        - device: gmss-middle-sub
          count: 1
        - device: tecnare-m2122
          count: 1
        - device: gmss-turbo-top
          count: 1
        - device: eighteensound-2way-15
          count: 1

  # 2, 15 cabinets in 5 rows
  - id: main-2
    at: [-0.302, 0.0]
    stack:
      max_width_m: 3.7
      interface_height_m: 2.5
      gap_m: 0.05
      from:
        - skram
        - device: flexy-folded-horn-hybrid
          count: 4
        - device: achenbach-18
          count: 2
        - device: gmss-turbo-sub
          count: 2
        - device: gmss-middle-sub
          count: 1
        - gmss-mid-bass
        - device: tecnare-m2122
          count: 1
        - device: gmss-turbo-top
          count: 1

  # 3, 12 cabinets in 5 rows
  - id: main-3
    at: [2.3315, 0.0]
    stack:
      max_width_m: 3.7
      interface_height_m: 2.5
      gap_m: 0.05
      from:
        - device: flexy-folded-horn-hybrid
          count: 4
        - device: achenbach-18
          count: 2
        - device: gmss-turbo-sub
          count: 2
        - device: gmss-middle-sub
          count: 1
        - device: tecnare-m2122
          count: 1
        - device: gmss-turbo-top
          count: 1
        - device: eighteensound-2way-15
          count: 1

  # ─── THE GOALPOST ─────────────────────────────────────────────────────────────────────────────────────────────
  # Five 2 m segments — every one we own — so 10 m of span, with a tower under each end at 5 m either side of the
  # rig's centre line. `gap_m: 0.0` because truss bolts up flush.
  #
  # THE TRUSS RESTS ON THE TWO GERÜSTE, whose platforms are at 5.000 m — which is the neatest answer to a problem
  # this scene turned up. Three stacks of all 39 cabinets reach 4.106 m, so a truss on our 4 m crank stands sits
  # BELOW the tops of the rig it spans: the overlap sweep caught a MAC hanging 285 mm inside stack 1. The scaffold
  # towers are the tallest thing we own and they are already in the scene, so they carry it. Nothing was bought and
  # nothing was invented — the Gerüste simply moved to where the span needs support.
  #
  # `fly` rather than `on:`, for the reason `full-rig-truss.yaml` gives: `on:` would claim the truss stands on ONE
  # named Gerüst, where it spans between two.
  #
  # THE GMSS TOWERS STILL STAND, outboard of the Gerüste. They are not carrying anything here and that is honest for
  # a scene whose whole point is showing everything we own: at 5.200 m they could take the truss instead, and the
  # Gerüste would then be work platforms rather than structure.
  - id: geruest-left
    device: geruest-krause-ah7
    at: [ -5.302, 0.0 ]

  - id: geruest-right
    device: geruest-krause-ah7
    at: [ 4.698, 0.0 ]

  - id: tower-left
    device: gmss-tower-5m
    at: [ -7.302, 0.0 ]

  - id: tower-right
    device: gmss-tower-5m
    at: [ 6.698, 0.0 ]

  - id: truss
    device: truss-f33-2m
    at: [ -0.302, 0.0 ]
    fly:
      height_m: 5.000
    row:
      count: 5
      gap_m: 0.0

  # The four MACs under it, upside down as a clamped fixture is, sharing one `fly.id` so the report adds them and
  # the truss into a single bar total. `fly.height_m` is the fixture's TOP once rolled — see gmss-full-stack-truss.
  - id: macs
    device: gmss-mac-2000-performance-ii
    at: [ -0.302, 0.0 ]
    roll_deg: 180
    fly:
      height_m: 4.930
      id: truss
    row:
      count: 4
      gap_m: 1.800

  # ─── THE RACKS ────────────────────────────────────────────────────────────────────────────────────────────────
  # Behind the stacks, where amp racks live: short speaker runs and out of the audience's way.
  - id: amp-racks
    device: rack-amp-12u
    at: [ -0.902, 1.300 ]
    row:
      count: 2
      gap_m: 0.05

  - id: power-rack
    device: rack-power-12u
    at: [ 0.298, 1.300 ]

notes: |
  Every device in the repository in one scene: both systems' speakers in three stacks, 10 m of truss on two stands
  with all four MACs hung, both Gerüste and all three racks.

  The speakers are `all-speakers-three-center.yaml` block for block — 39 of 41 cabinets, owner ignored, two turbo
  subs left out for the reason the solver states. Everything outside the stacks is copied from `full-rig-truss.yaml`
  and `gmss-full-stack-truss.yaml` rather than derived again, so anything learned here holds there too.

  `scene:build` reports gear from three owners and warns that the positions lean on un-measured cabinets — every
  GMSS cabinet is a reconstruction from one photograph, and the truss, stands, scaffold and racks are all
  `provenance: estimated` on dimensions. The MACs are the exception.

  The tops are not aimed. See the header, and TODO.md.
