# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# What it deals out today:
#
#   1  5× flexy-folded-horn-hybrid + 2× skram + 5× flexy-folded-horn-hybrid     7.35 m wide
#   2  4× achenbach-18                                                           2.46 m wide
#   3  2× flexy-folded-horn-hybrid                                              1.202 m wide
#   4  3× tecnare-m2122                                                          1.54 m wide
#   5  2× eighteensound-2way-15                                                0.9512 m wide
#
# Subs reach 2.277 m, so the tops clear the 2.0 m interface. The stack is 4.073 m of cabinet.
# `align: stereo` spreads every tier above the bottom one onto that row's edges.
#
# The build report will warn about this, and both are real:
#   * the 5× flexy-folded-horn-hybrid + 2× skram + 5× flexy-folded-horn-hybrid row is stepped by 151 mm, so
#     whatever stands on it rests on the tall cabinets and bridges the short ones
#   * the 3× tecnare-m2122 row is 1.540 m on a 1.202 m row, so it overhangs 169 mm each side
id: stacked-stereo
name: "Solved rig — tiers split left and right"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    align:
      mode: stereo
    stack:
      interface_height_m: 2.0
      gap_m: 0.02
      from:
        - skram
        - achenbach-18
        - flexy-folded-horn-hybrid
        - tecnare-m2122
        - eighteensound-2way-15

