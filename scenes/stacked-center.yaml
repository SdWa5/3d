# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# What it deals out today:
#
#   1  2× flexy-folded-horn-hybrid + 2× skram + 2× flexy-folded-horn-hybrid    3.684 m wide
#   2  4× flexy-folded-horn-hybrid                                              2.424 m wide
#   3  4× flexy-folded-horn-hybrid                                              2.424 m wide
#   4  4× achenbach-18                                                           2.46 m wide
#   5  1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15   2.5112 m wide
#
# Subs reach 3.04 m against a 2.0 m interface. The stack is 4.0 m of cabinet.
#   * the 4× achenbach-18 row is 2.460 m on a 2.424 m row, so it overhangs 18 mm each side
#   * the 1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15 row is 2.511 m on a 2.460 m row,
#     so it overhangs 26 mm each side
#
id: stacked-center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      gap_m: 0.02
      from:
        - skram
        - flexy-folded-horn-hybrid
        - achenbach-18
        - tecnare-m2122
        - eighteensound-2way-15

