# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# What it deals out today:
#
#   1  1× flexy-folded-horn-hybrid + 2× skram + 1× flexy-folded-horn-hybrid    2.462 m wide
#   2  5× flexy-folded-horn-hybrid                                              3.035 m wide
#   3  5× flexy-folded-horn-hybrid                                              3.035 m wide
#   4  3× achenbach-18                                                           1.84 m wide
#   5  3× achenbach-18                                                           1.84 m wide
#   6  1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15   2.5112 m wide
#
# Subs reach 3.64 m against a 2.0 m interface. The stack is 4.6 m of cabinet.
#   * the 5× flexy-folded-horn-hybrid row is 3.035 m on a 2.462 m row, so it overhangs 286 mm each side
#   * the 1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15 row is 2.511 m on a 1.840 m row,
#     so it overhangs 336 mm each side
#
id: stacked-center
name: "Solved rig — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      gap_m: 0.02
      from:
        - skram
        - flexy-folded-horn-hybrid
        - achenbach-18
        - tecnare-m2122
        - device: eighteensound-2way-15
          aim: near

