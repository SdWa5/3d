# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# What it deals out today:
#
#   1  6× flexy-folded-horn-hybrid                                              3.646 m wide
#   2  6× flexy-folded-horn-hybrid                                              3.646 m wide
#   3  4× achenbach-18                                                           2.46 m wide
#   4  1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15   2.5112 m wide
#
# Subs reach 2.126 m, so the tops clear the 2.0 m interface. The stack is 3.086 m of cabinet.
#
# The build report will warn about this, and both are real:
#   * the 1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15 row is stepped by 124 mm, so
#     whatever stands on it rests on the tall cabinets and bridges the short ones
#   * the 1× eighteensound-2way-15 + 3× tecnare-m2122 + 1× eighteensound-2way-15 row is 2.511 m on a 2.460 m row,
#     so it overhangs 26 mm each side
id: stacked-center
name: "Solved rig — tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]
    aim: far                 # the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.7
      interface_height_m: 2.0
      gap_m: 0.02
      from:
        - flexy-folded-horn-hybrid
        - achenbach-18
        - tecnare-m2122
        - eighteensound-2way-15

