# The mirrored sub wall with the three tops aimed at one point in the crowd instead of firing straight
# ahead. Each top works out its own yaw and down-tilt from where it actually stands, so the outer two
# toe inwards and all three tilt down.
#
# The focus is stated the way the decision is actually made — how far out, and how high — rather than as
# absolute coordinates. Distance is measured from the rig's front face.
id: full-rig-aimed
name: "Full rig — tops aimed at the crowd"

focus:
  distance_m: 10.0    # out into the crowd, past the front rows
  height_m: 1.8       # ear height for a standing audience

placements:
  - id: sub-row-bottom
    device: flexy-folded-horn-hybrid
    at: [-0.302, 0.0]        # the middle of the wall, not its left edge
    roll_deg: 180
    row:
      count: 6
      gap_m: 0.02

  - id: sub-row-top
    device: flexy-folded-horn-hybrid
    on: sub-row-bottom
    at: [-0.302, 0.0]        # the middle of the wall, not its left edge
    row:
      count: 6
      gap_m: 0.02

  - id: top-left
    device: tecnare-m2122
    on: sub-row-top
    at: [-1.8295, 0.0]
    aim: focus

  - id: top-centre
    device: tecnare-m2122
    on: sub-row-top
    at: [-0.302, 0.0]
    aim: focus

  - id: top-right
    device: tecnare-m2122
    on: sub-row-top
    at: [1.2255, 0.0]
    aim: focus

notes: |
  Compare with full-rig-mirrored.yaml, which is the same wall with the tops firing straight ahead.
  Raising `height_m` or `distance_m` flattens the tilt; a nearer or lower focus steepens it.
