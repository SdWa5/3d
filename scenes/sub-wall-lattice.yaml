# The mirrored sub wall as one placement, and the same fourteen cabinets full-rig-mirrored.yaml lays out
# in two. Nothing here states a spacing or an edge position, which is the whole point: the row is spaced
# and centred from the Flexy's own 591 mm plus a 20 mm working gap, so the wall follows the specs instead
# of the specs having to match a number typed into the scene.
#
# What this shows that full-rig-mirrored.yaml does not: the whole wall as ONE placement. There the two
# tiers are two entries and the mirroring is a `roll_deg` on one of them; here a `row` of six is nested in
# a two-tier `lattice` and `roll_cycle` turns the lower tier over, so the wall is one thing with a shape
# rather than two things that happen to line up.
#
# `roll_cycle` turns the *lower* tier over. A Flexy's mouths sit low on its face, so rolling the bottom
# row lifts them to the seam where the upper row's already are — flipping the top row instead drives them
# apart, which is worth knowing before trying it on site. `cycle_axis: z` is required rather than
# optional here: two axes have cells (7 along x, 2 up z), and a cycle running down the wrong one would
# turn every *column* over instead of every tier. Fourteen cabinets wrong, and it renders plausibly.
id: sub-wall-lattice
name: "Sub wall — one placement, mirrored"

placements:
  - id: sub-wall
    device: flexy-folded-horn-hybrid
    # The middle of the wall, not its left edge: a lattice is centred on `at` in x and y, and stacks
    # upward in z from it.
    at: [-0.302, 0.0]
    row:
      count: 6
      gap_m: 0.02
    in:
      - lattice:
          count: [1, 1, 2]
          roll_cycle: [180, 0]
          cycle_axis: z

  # Three tops on the wall, as a fan whose angle is the cabinet's own taper. `on:` stacks on the
  # lattice's anchor, which is the middle cell of its *top* tier — the wall's actual top.
  - id: tops
    device: tecnare-m2122
    on: sub-wall
    aim: focus
    arc:
      mode: convex
      count: 3

focus:
  distance_m: 10.0
  height_m: 1.8

notes: |
  The same wall as full-rig-mirrored.yaml with every derived number removed. Measure a Flexy and this
  scene moves; measure a Flexy and full-rig-mirrored.yaml quietly stops matching the cabinets.
