id: a3-skram-turned-mouths
name: "Turned SKRAM rig, Flexy columns 2 and 5 turned 180 degrees"
# Hand-placed example from a `scene:stack` run into scratch-skram-turned (pyramid-turned centred stereo low). Flexy columns 2 and 5 turned 180 degrees in their own slots so the horn mouths meet in pairs.

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: s1a-1
    device: skram
    at: [-2.1800, -0.0755]
    roll_deg: 270
  - id: s1a-2
    device: skram
    at: [-1.2460, -0.0755]
    roll_deg: 270
  - id: s1a-3
    device: skram
    at: [-0.3120, -0.0755]
    roll_deg: 270
  - id: s1b-1
    device: skram
    at: [-0.2920, -0.0755]
    roll_deg: 90
  - id: s1b-2
    device: skram
    at: [0.6420, -0.0755]
    roll_deg: 90
  - id: s1b-3
    device: skram
    at: [1.5760, -0.0755]
    roll_deg: 90
  - id: f2a-1
    device: flexy-folded-horn-hybrid
