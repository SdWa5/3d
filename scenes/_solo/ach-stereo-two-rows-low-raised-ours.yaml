# Mock-up. Stands in for a generator gap: StackSolver builds no LF-ordered symmetric
# two-row candidate. Written by tools/two-row-variants.py, the low-raised variant with our stack alone, a fifth Achenbach under the centre Tecnare.
#
#   2  F F F F F F F    4.257 m
#   1  F F S F S F F    4.295 m
id: ach-stereo-two-rows-low-raised-ours
name: "Achenbach event, stereo, ours in two rows, LF low-raised-ours"

# Our tops aim at our own centre, the way a generated systems-apart stack aims at its own front centre.
focus:
  far:
    distance_m: 10.0
    height_m: 1.8
    x_m: 0.0
  near:
    distance_m: 2.0
    height_m: 1.8
    x_m: 0.0

