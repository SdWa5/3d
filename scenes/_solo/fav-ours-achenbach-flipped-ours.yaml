# Our stack extracted from scenes/_solo/fav-ours-achenbach-flipped.yaml, without PSL,
# Innschleife and the backdrop, shifted so its centre column stands at x = 0.
# The favourite scene with our stack replaced, written by tools/combined-variants.py and edited by hand since.
# Generated by `bin/console scene:stack` — edit it freely, it is an ordinary scene file.
#
# Nothing here says which cabinet goes in which row. The constraints below do, and the compiler
# re-solves them every build, so the rig follows the specs when a cabinet is finally measured.
#
# Regenerate it with:
#
#   bin/console scene:stack --clearance=0.24 --room-width=13 --room-height=4
#     --backdrop=truss-f33-2m:5:truss-tower-4m --system-interface=innschleife:1.6 --system-interface=sdwa5:1.6
#     --system-interface=sepp:1.6 --system-target=innschleife:1.75 --system-target=sdwa5:1.75 --system-target=sepp:1.75
#     --system-orientation=innschleife:turned --system-orientation=psl:turned --system-orientation=sdwa5:upright
#     --system-orientation=sepp:upright --system-low-end=innschleife:low --system-low-end=sdwa5:central
#     --system-low-end=sepp:central --stand=kicker-15 --systems=systems-apart --order=ours,psl,innschleife
#     --quantity=achenbach-18:0 --quantity=concert-audio-esf:0 --quantity=concert-audio-esx:9
#     --quantity=deco-panel-8x2-03:1 --quantity=hk-linear5-112x:0 --quantity=sub-60x60:0 --quantity=thebox-achat-112m:0
#     --quantity=thebox-achat-115m:0 --quantity=thebox-dsp-112:0 --quantity=thebox-pa302:0 --quantity=thebox-tp118-800:0
#     --quantity=thebox-tp218-1600:0 --quantity=tms4:1 --from=wsx-18 --from=sbh-18 --from=skram
#     --from=flexy-folded-horn-hybrid --from=concert-audio-esx --from=kicker-15 --from=tms4 --from=tecnare-m2122
#     --from=concert-audio-ef6 --from=tms2 --from=eighteensound-2way-15 --stacks=1 --align=stereo --low-end=low
#     --shape=pyramid --mirror-style=alternate --id=stacked --into=next-event-light
#
# 3 stacks side by side, with 0.24 m of air between them.
#
# main-ours — ours, 19 cabinets in 3 rows:
#
#   1  3× flexy-folded-horn-hybrid + 1× skram + 3× flexy-folded-horn-hybrid    4.276 m wide
#   2  3× flexy-folded-horn-hybrid + 1× skram + 3× flexy-folded-horn-hybrid    4.276 m wide
#   3  1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122 + 1× eighteensound-2way-15 + 1× tecnare-m2122   2.5112 m wide
#
# Subs reach 1.828 m against a 1.6 m interface. The stack is 2.788 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
# main-psl — psl, 13 cabinets in 4 rows:
#
#   1  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   2  2× concert-audio-esx rolled 270° + 1× concert-audio-esx rolled 90°     3.58 m wide
#   3  1× concert-audio-esx rolled 270° + 2× concert-audio-esx rolled 90°     3.58 m wide
#   4  2× concert-audio-ef6 + 2× concert-audio-ef6                             2.412 m wide
#
# Subs reach 1.77 m against a 2.0 m interface. The stack is 2.55 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#   * the subs reach 1.770 m against the 2.000 m interface asked for, so the tops sit 230 mm lower than ideal —
#     1.770 m is the most they reach while every tier is still carried
#
# main-innschleife — innschleife, 15 cabinets in 4 rows:
#
#   1  1× wsx-18 rolled 270° + 1× sbh-18 rolled 270° + 1× sbh-18 rolled 90° + 1× wsx-18 rolled 90°     4.66 m wide
#   2  1× wsx-18 rolled 270° + 1× sbh-18 rolled 270° + 1× sbh-18 rolled 90° + 1× wsx-18 rolled 90°     4.66 m wide
#   3  4× kicker-15                                                              3.86 m wide
#   4  1× tms2 + 1× tms4 + 1× tms2                                              1.4 m wide
#
# Subs reach 1.71 m against a 1.6 m interface. The stack is 2.85 m of cabinet.
# `align: stereo` spreads the top tier onto the edges of the row carrying it.
#
id: fav-ours-achenbach-flipped-ours
name: "Favourite light next-event rig, ours as solo-ours-achenbach-flipped, our stack alone"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # ours, the solo-ours-achenbach-flipped variant written out cabinet by cabinet
  - id: ours-flexy-l1
    device: flexy-folded-horn-hybrid
    at: [-1.2315, 0.0000]
    roll_deg: 180
    row: { count: 3, gap_m: 0.02 }
  - id: ours-skram-1
    device: skram
    at: [0.0000, -0.0755]
    # turned over so its mouth meets the upper SKRAM's at the seam, like the Flexy pairs either side
    roll_deg: 180
  - id: ours-flexy-r1
    device: flexy-folded-horn-hybrid
    at: [1.2315, 0.0000]
    roll_deg: 180
    row: { count: 3, gap_m: 0.02 }
  - id: ours-flexy-l2
    device: flexy-folded-horn-hybrid
    at: [-1.2315, 0.0000]
    on: ours-flexy-l1
    row: { count: 3, gap_m: 0.02 }
  - id: ours-skram-2
    device: skram
    at: [0.0000, -0.0755]
    on: ours-skram-1
  - id: ours-flexy-r2
    device: flexy-folded-horn-hybrid
    at: [1.2315, 0.0000]
    on: ours-flexy-r1
    row: { count: 3, gap_m: 0.02 }
  - id: ours-ach-l
    device: achenbach-18
    at: [-1.2315, -0.1320]
    on: ours-flexy-l2
    # three across the whole Flexy block, 3 x 0.600 m and two 6.5 mm gaps make its 1.813 m
    row: { count: 3, gap_m: 0.0065 }
  - id: ours-ach-r
    device: achenbach-18
    at: [1.2315, -0.1320]
    on: ours-flexy-r2
    # three across the whole Flexy block, 3 x 0.600 m and two 6.5 mm gaps make its 1.813 m
    row: { count: 3, gap_m: 0.0065 }
  - id: ours-top-c
    device: tecnare-m2122
    at: [0.0000, -0.2223]
    on: ours-skram-2
    aim_at: [0.0000, -10.482, 1.8]
  - id: ours-top-la
    device: tecnare-m2122
    at: [-1.8880, -0.1812]
    on: ours-ach-l
    aim_at: [0.0000, -10.482, 1.8]
  - id: ours-top-lb
    device: eighteensound-2way-15
    at: [-1.3599, -0.1801]
    on: ours-ach-l
    aim_at: [0.0000, -2.482, 1.8]
  - id: ours-top-rb
    device: eighteensound-2way-15
    at: [1.3599, -0.1801]
    on: ours-ach-r
    aim_at: [0.0000, -2.482, 1.8]
  - id: ours-top-ra
    device: tecnare-m2122
    at: [1.8880, -0.1812]
    on: ours-ach-r
    aim_at: [0.0000, -10.482, 1.8]

