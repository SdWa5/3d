# Mock-up. Stands in for a generator gap: StackSolver builds no LF-ordered symmetric
# two-row candidate. Written by tools/two-row-variants.py, the low variant with its Achenbach one row up, on the outer Flexys, as in fav-ours-achenbach-flipped.
#
#   2  F F F F F F F    4.257 m
#   1  F F S F S F F    4.295 m
id: ach-stereo-two-rows-low-raised
name: "Achenbach event, stereo, ours in two rows, LF low-raised"

# Our tops aim at our own centre, the way a generated systems-apart stack aims at its own front centre.
