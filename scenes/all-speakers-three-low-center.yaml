# All 41 speakers in three stacks, every one of them under a 3 m sub/top transition.
#
# WHY THIS EXISTS ALONGSIDE `all-speakers-three-center.yaml`, which is generated and sits at 3.122–3.146 m. That is
# not the generator being lazy: 3.146 m is the FLOOR for the contents it deals itself. Setting the interface target to
# zero — which makes the solver take the widest rows and so the shortest stack it can — gives exactly the same
# 3.146 m, and no combination of `--mix`, `--max-width` from 3.70 to 8 m, or two/three/four/five stacks got the worst
# stack under 3 m.
#
# WHAT ACTUALLY DECIDES A STACK'S HEIGHT is which device types are in it. **Each type costs at least one row**, and a
# stack's sub height is the sum of its rows — so a stack holding six sub types is six rows tall whatever the stage
# width. `scene:stack` splits the inventory by count and keeps small-quantity devices together, which lands one stack
# with most of the types and makes it the tall one. That split is not something `--from` can override.
#
# So this scene states the contents per stack, and the arithmetic it is built on:
#
#   A  achenbach 6 + flexy 6            0.600 + 0.763                  = 1.363 m   15 cabinets
#   B  flexy 6 + turbo sub 8            0.763 + 0.637 + 0.637          = 2.037 m   17 cabinets
#   C  middle sub 3 + skram 2 + mid-bass 2   the solver finds a shorter fill still  = 1.445 m    9 cabinets
#
# Two or three sub types each, never six, and all 33 subs and 8 tops placed — 41 cabinets, nothing left out.
#
# ORDER IS WIDEST-ROW-FIRST, and it is load-bearing rather than cosmetic. `from` is the fill order and the solver
# deals it bottom-up, so a wide row listed after a narrow one lands on top of it and fails the bearing check. Six
# Achenbachs are 3.700 m and six Flexys 3.646, so in stack A the Achenbachs go first; in stack B the Flexys (3.646)
# go under the turbo subs (2.100), not over them. Reversing either pair refuses the stack.
#
# `interface_height_m: 0` because the interface is a height the tops must CLEAR and the solver narrows rows until they
# do — which is the opposite of what is wanted here. At zero it takes the widest rows, which is the shortest stack.
# The tops end up at 1.363–2.037 m, below the 2 m the other scenes aim for; that is the trade this scene makes, and
# it is the whole point of it.
id: all-speakers-three-low-center
name: "All speakers — three stacks, sub transition under 3 m"

focus:
  distance_m: 12.0
  height_m: 1.8

placements:
  # ─── A: the Achenbachs and half the Flexys ────────────────────────────────────────────────────────────────────
  - id: main-a
    at: [ -4.200, 0.0 ]
    stack:
      max_width_m: 3.80
      interface_height_m: 0
      gap_m: 0.02
      from:
        - device: achenbach-18
          count: 6
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: tecnare-m2122
          count: 3

  # ─── B: the other half of the Flexys, and every turbo sub ─────────────────────────────────────────────────────
  - id: main-b
    at: [ 0.0, 0.0 ]
    stack:
      max_width_m: 3.80
      interface_height_m: 0
      gap_m: 0.02
      from:
        - device: flexy-folded-horn-hybrid
          count: 6
        - device: gmss-turbo-sub
          count: 8
        - device: gmss-turbo-top
          count: 3

  # ─── C: everything that comes in twos and threes ──────────────────────────────────────────────────────────────
  # The small-quantity devices in one stack on purpose — the same grouping `scene:stack` arrives at, for the same
  # reason: a lone cabinet can neither flank a mixed row nor be flanked into one. Here it costs nothing — three types
  # would be 2.359 m of rows and the solver finds 1.445.
  - id: main-c
    at: [ 3.300, 0.0 ]
    stack:
      max_width_m: 3.80
      interface_height_m: 0
      gap_m: 0.02
      from:
        - device: gmss-middle-sub
          count: 3
        - device: skram
          count: 2
        - device: gmss-mid-bass
          count: 2
        - device: eighteensound-2way-15
          count: 2

notes: |
  All 41 speakers both systems own, in three stacks, with every sub/top transition under 3 m: 1.363, 2.037 and
  1.445 m. Stack C comes out lower than the 2.359 m its three row heights add up to, because with no interface target
  the solver finds a fill with fewer rows than one-per-type — the arithmetic in the header is the ceiling, not the
  answer.

  It is hand-written because the height depends on which device types share a stack, and that is the one thing
  `scene:stack` decides for itself and `--from` cannot override. Its generated sibling
  `all-speakers-three-center.yaml` sits at 3.122–3.146 m, and that is the floor for the contents it deals — an
  interface target of zero, every stage width from 3.70 to 8 m, `--mix` in six combinations and two to five stacks all
  gave the same or worse.

  EACH DEVICE TYPE COSTS AT LEAST ONE ROW. That is the whole rule: a stack's sub height is the sum of its rows, so
  six sub types is six rows however wide the stage. Here no stack holds more than three.

  `from` is listed widest-row-first, which is not cosmetic — the solver fills bottom-up, so a wide row listed after a
  narrow one lands on top of it and fails the bearing check.

  The tops sit lower than in the other scenes, at 1.363–2.037 m rather than above 2 m. That is the trade: a low
  transition and a low rig. `all-speakers-three-center.yaml` is the one to compare against if head height matters
  more than transition height.

  AND IT IS WIDER, which is the other half of the trade and the reason `everything.yaml` does not use it: two or three
  types per stack means the stacks stand side by side rather than piling up, so this is 10.59 m across where the
  generated three-stack is 6.77. Ten metres is every truss segment we own, so a goalpost cannot span outboard of this
  rig — the supports land inside a stack. A low rig and a truss over it are not both available with this much gear.
