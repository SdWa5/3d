# Every speaker both systems own, in ONE stack — all 41 cabinets, and the arrangement `scene:stack` cannot reach.
#
# WHY THIS FILE IS HAND-WRITTEN where its two- and three-stack siblings are generated: it states a `mix_with`, and
# `--from` on the command line can only name devices, not say which of them share a row. Everything else here is
# solver-solved — the `stack:` block is re-dealt on every build.
#
# THE MIX IS WHAT MAKES ONE STACK POSSIBLE AT ALL. Without it the three GMSS middle subs make a tier 1.825 m wide and
# there are only three of them, so no row count widens it; every tier above is then bounded to two thirds of a
# cabinet's overhang by `Gravity::MIN_BEARING`, which caps the top of the stack near 2.5 m — while all eight tops in
# one row are 3.744 m, and tops cannot be split across rows because nothing stands on a top. The stack was refused at
# every stage width from 3.70 m to 10 m.
#
# Stating `mix_with: [gmss-turbo-sub]` on the middle subs puts one turbo sub either side of them, which widens that
# tier from 1.825 to 2.885 m. Everything above widens with it — six turbo subs at 3.160, six Achenbachs at 3.700 —
# and the 3.744 m tops row is then carried. NINE TIERS BECAME SEVEN and every cabinet went in.
#
# THE SUB/TOP TRANSITION IS 4.163 m. That is 1.2 m lower than the 6.546 m this scene had when it left three Tecnares
# out, and it is still above a 2–3 m band: one stack of 33 subs is a festival wall, and each device type costs at
# least one row. A mixed row's height is its TALLEST member, so merging two types only buys height when it removes a
# row outright — which needs the whole flanking stock to fit in one row, and the support cap decides that.
#
id: all-speakers-one-center
name: "All speakers — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 38 cabinets: every sub both systems own, and five of the eight tops.
  - id: main
    at: [-0.302, 0.0]
    stack:
      max_width_m: 5.0
      interface_height_m: 2.5
      gap_m: 0.02
      # Low frequency first, which is the fill order — the same order `scene:stack` derives for itself.
      from:
        - skram
        - flexy-folded-horn-hybrid
        - gmss-mid-bass
        # The mix is what makes one stack possible at all — see the header.
        - device: gmss-middle-sub
          mix_with: [ gmss-turbo-sub ]
        - gmss-turbo-sub
        - achenbach-18
        - eighteensound-2way-15
        - gmss-turbo-top
        - tecnare-m2122

notes: |
  Every speaker both systems own in one stack: all 41 cabinets, 33 subs and 8 tops, owner ignored.

  It needs one stated `mix_with`. Without it the three middle subs pin a 1.825 m tier that no row count widens, the
  bearing rule caps everything above near 2.5 m, and the 3.744 m tops row has nothing to stand on — `scene:stack`
  refuses this inventory at every width from 3.70 m to 10 m. Mixing one turbo sub either side of the middle subs takes
  that tier to 2.885 m, and the whole stack widens with it: nine tiers become seven and nothing is left out.

  Sub/top transition 4.163 m, down from 6.546 m when three Tecnares were left out. Still above a 2–3 m band, and that
  is arithmetic rather than a setting: 33 subs in one stack is a wall, each device type costs at least one row, and a
  mixed row is as tall as its tallest member — so merging types only buys height when it removes a row outright.

  Compare `all-speakers-two-center.yaml` (also all 41, in two), `all-speakers-two-matched-center.yaml` (a true pair at
  the cost of 13 cabinets) and `all-speakers-three-center.yaml`.
