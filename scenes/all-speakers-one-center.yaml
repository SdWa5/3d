# Every speaker both systems own bar one, in ONE stack — 38 of 39 cabinets on an 8 m stage.
#
# WHY IT IS STILL HAND-WRITTEN, now that `scene:stack` can do the arrangement: nothing here is a row the solver
# could not find, but the *combination* is a deliberate demonstration rather than a rig anybody would build, and the
# header is the point of the file. `scene:stack --stacks=1 --max-sub-height=3.0 --max-width=8.0` reaches the same
# thing.
#
# IT NO LONGER STATES A `mix_with`, AND THAT IS THE CHANGE. This file used to exist because `--from` could name
# devices but not say which of them shared a row, and one stack of everything was impossible without saying it: the
# three GMSS middle subs pinned a 1.825 m tier that no row count widened, `Gravity::MIN_BEARING` then capped
# everything above it near 2.5 m, and the tops row had nothing to stand on. Stating `mix_with` on the middle subs
# widened that tier to 2.885 m and nine tiers became seven.
#
# `max_sub_height_m` supersedes all of it. Under a ceiling a row may hold as many device types as it takes, chosen by
# the solver, so the hand-stated mix is no longer the only way to merge a tier — and the result is better than the
# hand-tuned one was: FOUR ROWS against seven, and 3.077 m of sub against 4.163 m.
#
# THE STAGE IS 8 m WIDE, WHERE THIS SCENE USED TO ASK FOR 5. Not a preference — 5 m no longer solves. When GMSS gave
# real figures the wall basses came out 1.400 m tall and 0.660 m wide against the 1.020 × 0.595 that had been guessed
# from the photo, and a nuke beside two of them lands on 17 % of itself on any row narrow enough to fit 5 m. One
# stack of 31 subs was always a festival wall; it is now a wider one.
#
# THE CEILING IS MISSED BY 77 mm, and the file states it anyway rather than rounding the target up to hide that. The
# solver reports the miss in millimetres, and 3.077 m is the floor for 30 subs in one stack — every arrangement that
# stands up is at least this tall.
#
# THE MID BASS IS LEFT OUT, and it is the one cabinet that cannot go in this rig. It is 1.200 m wide against the next
# widest sub's 0.660, so it fits no row here without pushing the tops row onto a shoulder — a Tecnare ends up on 12 %
# of its own width. `scene:stack --stacks=1` drops it for the same reason and says so; the two- and three-stack rigs
# place it, because there it can have a row of its own without the whole wall having to be that wide. One stack of
# everything is the arrangement with no room to absorb an odd shape.
id: all-speakers-one-center
name: "All speakers — one stack, tiers centred"

focus:
  far:
    distance_m: 12.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # Every cabinet both systems own, in one pile.
  - id: main
    at: [-0.302, 0.0]
    aim: far
    stack:
      max_width_m: 8.0
      interface_height_m: 0
      max_sub_height_m: 3.0
      gap_m: 0.05
      # Low frequency first, which is the fill order — the same order `scene:stack` derives for itself. A packed row
      # may only combine types that are ADJACENT in this list, so the order is what keeps the deepest cabinets on the
      # floor: shuffle it and the solver builds a different, worse wall.
      #
      # THE NUKES STAY UPRIGHT HERE, and this is the one scene where they do. Everywhere else they are rolled a
      # quarter turn, because a 0.770 x 0.590 foot is wider and lower and carries what stands on it better. In ONE
      # stack it backfires: the wider pair changes what the packer can fit in the rows around them and the subs go
      # from 3.077 m to 3.747 — 670 mm worse against the ceiling — and picks up two overhangs of 177 and 271 mm on
      # the way. Measured both ways rather than assumed, because the same change helps every other rig in the
      # library. Roll them here and this scene gets worse; that is the whole reason for the exception.
      from:
        - skram
        - flexy-folded-horn-hybrid
        - achenbach-18
        - iq-sub
        - wall-bass
        # mid-bass is deliberately NOT here — see the note below.
        - nuke
        - tecnare-m2122
        - turbo-top
        - eighteensound-2way-15

notes: |
  Every speaker both systems own bar one, in one stack, owner ignored — 38 of 39 cabinets on an 8 m stage.

  THE MID BASS IS LEFT OUT. At 1.200 m it is nearly twice the width of the next widest sub, and in one stack there is
  no row it fits without pushing the tops onto a shoulder: a Tecnare lands on 12 % of itself. The three-stack rigs
  place it — there it gets a row of its own without the whole wall having to be 1.2 m wide.

  It states a ceiling rather than a mix now. `max_sub_height_m: 3.0` lets a row hold as many device types as it takes,
  which is what the hand-stated `mix_with` used to do for one tier only, and the solver picks the merges itself. Four
  rows where the hand-tuned version needed seven, and 3.077 m of sub where it reached 4.163.

  THE CEILING IS MISSED BY 77 mm and that is reported rather than hidden: 3.077 m is the floor for 31 subs in one
  stack. Every arrangement that stands up is at least this tall, and the solver walked the whole search to say so.

  8 m of stage, not the 5 this scene used to ask for. With the re-measured GMSS wall basses — 1.400 m tall against the
  1.020 m guessed off the photo — a nuke beside two of them lands on 17 % of itself on any row narrow enough for 5 m.

  For a rig anybody would actually build, `scenes/generated/all-speakers-three-low-center.yaml` puts the same cabinets
  in three stacks at 1.526 / 1.684 / 2.070 m, and `all-speakers-three-stated-low.yaml` does it with the groupings
  chosen by hand.
