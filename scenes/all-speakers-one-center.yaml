# Every speaker both systems own, in ONE stack — and the one arrangement the solver cannot reach on its own.
#
# WHY THIS FILE IS HAND-WRITTEN where its two- and three-stack siblings are generated. `scene:stack --stacks=1`
# refuses this inventory at every stage width from 3.70 m to 10 m, and after 0.61.0 fixed the fill's row sizing the
# refusal is no longer a solver limitation — it is arithmetic:
#
#   the three GMSS middle subs make a tier 3 x 0.595 + 2 x 0.02 = 1.825 m wide, and there are only three of them,
#   so no row count makes it wider. Every tier above it is bounded by `Gravity::MIN_BEARING` to two thirds of a
#   cabinet's overhang each side, which caps the top of the stack at about 2.5 m. All eight tops in one row are
#   3.744 m, and tops cannot be split across rows — every top belongs in one row, because nothing stands on a top.
#
# So a single stack physically cannot carry all eight tops. What it CAN carry is five, and this scene states which:
# the two 18sound 2-ways and the three GMSS turbo tops, 2.184 m of row on the 1.840 m Achenbach tier. THE THREE
# TECNARES ARE LEFT OUT, and that is the only concession — every sub both systems own is in this stack.
#
# THE TOPS ARE NOT AIMED, and that is not a preference either. Aiming a mixed tops row of more than a couple of
# device types places two of them COINCIDENT — 391 mm inside each other, exactly one turbo top's width — and a wider
# gap barely moves it, so it is not toe-in. Un-aimed the row is correct. The defect is in the aiming of a mixed row
# and is pre-existing; it is filed in TODO.md and it is why no scene in this set aims its tops.
#
# NOTHING HERE IS HAND-PLACED. The `stack:` block states the constraints and the compiler re-solves them on every
# build, exactly as in the generated scenes; the only difference is that a human chose which tops to state. Change
# the list and the rig re-deals itself.
#
# WHY THE TECNARES AND NOT THE OTHERS: they are the widest tops we own at 0.500 m against the turbo top's 0.391 and
# the 2-way's 0.4656, so dropping the three of them buys the most row for the fewest cabinets. Dropping three turbo
# tops instead would leave 2.446 m of tops on the same 1.840 m tier, which the bearing rule still allows — so this
# is a preference rather than the only answer, and it is stated rather than derived.
id: all-speakers-one-center
name: "All speakers — one stack, tiers centred"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # 38 cabinets: every sub both systems own, and five of the eight tops.
  - id: main
    at: [-0.302, 0.0]
    stack:
      max_width_m: 5.0
      interface_height_m: 2.5
      gap_m: 0.05
      # Low frequency first, which is the fill order — the same order `scene:stack` derives for itself.
      from:
        - skram
        - flexy-folded-horn-hybrid
        - gmss-mid-bass
        - gmss-middle-sub
        - gmss-turbo-sub
        - achenbach-18
        - eighteensound-2way-15
        - gmss-turbo-top

notes: |
  Every speaker in one stack: all 33 subs both systems own, plus five of the eight tops.

  `scene:stack --stacks=1` refuses this inventory at every width tried, and since 0.61.0 that refusal is arithmetic
  rather than a solver limitation. Three middle subs pin a 1.825 m tier; the bearing rule allows two thirds of a
  cabinet's overhang per tier above it, capping the stack's top around 2.5 m; and eight tops in one row are 3.744 m.
  Tops cannot be split across rows, so a single stack cannot carry all eight.

  THE THREE TECNARES ARE LEFT OUT. They are the widest tops we own, so dropping them buys the most row width for the
  fewest cabinets. Dropping three turbo tops instead would also fit — this is a stated preference, not the only
  answer.

  5.0 m rather than the 3.70 m its siblings use: at 3.70 the tops row alone exceeds the stage, and one stack of
  this many cabinets is a festival wall rather than a club rig.

  Compare `all-speakers-two-center.yaml` (everything in, asymmetric), `all-speakers-two-matched-center.yaml` (a true
  pair, 13 cabinets out) and `all-speakers-three-center.yaml`.
