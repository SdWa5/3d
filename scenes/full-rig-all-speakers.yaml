# Every speaker we own, in one stack, solved from two numbers.
#
# All 23 cabinets: 12 Flexys, 2 SKRAMs, 4 Achenbachs, 3 M2122s and 2 18sound 2-ways. Nothing here says which
# cabinet goes in which row — `max_width_m` and `interface_height_m` do, and the fill works the rest out.
#
# What it deals out:
#
#   1  2× flexy + 2× SKRAM + 2× flexy   3.684 m   0.914 m    the MIXED row — see below
#   2  4× flexy                         2.424 m   1.677 m
#   3  4× flexy                         2.424 m   2.440 m
#   4  4× achenbach                     2.460 m   3.040 m    the sub/top interface, clears 2.0 m
#   5  3× tecnare-m2122                 1.540 m              the long throw, aimed
#   6  2× eighteensound-2way-15         0.951 m              near-field fill, aimed
#
# THE BOTTOM ROW IS MIXED, and that is the whole reason this scene is possible. Only two SKRAMs exist, so a
# row of nothing but SKRAMs is 1.240 m — narrower than the 2.460 m Achenbach row that would come to stand on
# it, and a stack whose tiers get *wider* as they rise is not a stack; it is 610 mm of Achenbach hanging in
# mid-air at each end. Putting the two SKRAMs in the middle of the bottom row, where the widest and heaviest
# cabinets belong anyway, and flanking them with Flexys makes that row 3.684 m and the rig a pyramid.
#
# The leftover Flexys are dealt out EVENLY, 4 + 4, not greedily as 6 + 2. Same number of rows either way, but
# a 1.222 m row could not carry the Achenbachs above it and a 2.424 m one can.
#
# TWO THINGS THE BUILD REPORT WILL WARN ABOUT, both real and neither a reason not to build it:
#
#   * The mixed row is STEPPED BY 151 mm — a SKRAM is 0.914 m tall and a Flexy 0.763 m — so row 2 rests on
#     the SKRAMs and bridges the Flexys either side. That is a shim on the day, not a modelling error, and
#     the compiler says so rather than pretending the row is flat.
#   * The Achenbach row is 2.460 m on a 2.424 m Flexy row, so it stands 18 mm proud at each end. Absorbed by
#     the working gaps in practice; reported because a render makes an overhang look deliberate.
#
# At 4.99 m tall this is taller than anything we would actually stand a crowd next to — it is what "all of it
# in one pile" looks like, and it is here to be looked at and argued with. (4.84 m of that is the cabinets'
# own heights added up; the rest is the aimed tops tilting, which makes them occupy more z than they are
# tall.) `full-rig-stacked.yaml` is the same solver on the 19 cabinets that make a sensible rig.
id: full-rig-all-speakers
name: "Every speaker — all 23, solved from a width and an interface height"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  - id: main
    at: [-0.302, 0.0]        # the middle of the rig, not its left edge
    aim: far                 # applied to the TOP tiers only; subs fire straight ahead
    stack:
      max_width_m: 3.70      # what the stage allows
      interface_height_m: 2.0 # the tops' bottom edge has to clear this
      gap_m: 0.02
      from:                  # low frequency first — the order is the fill order
        - flexy-folded-horn-hybrid
        - skram
        - achenbach-18
        - tecnare-m2122
        - eighteensound-2way-15

notes: |
  The two inventory sweeps TODO.md asked for, as scenes rather than only as assertions:
  full-rig-stacked.yaml is the 19-cabinet case (no SKRAMs), this is all 23. The second is the one that
  breaks a grid assumption, because the SKRAM is the widest cabinet we own at 0.610 m and the second
  tallest at 0.914 m, so it is what a tier boundary has to bend around.

  Mixes owners — the Achenbachs and the 2-ways are Sepp's — which `scene:build` reports.
