# One of every device in a row, for looking at the models themselves rather than at a setup.
# Useful after changing the geometry builder or switching a mesh_override on: render it with
# `-l flat` and every chamfer, grille inset and horn mouth is visible side by side.
#
# Spacing is generous and uniform rather than tight, because this scene is a contact sheet, not a rig.
id: detail-check
name: "Detail check — one of each"

placements:
  - id: flexy
    device: flexy-folded-horn-hybrid
    at: [ -2.6, 0.0 ]
  - id: skram
    device: skram
    at: [ -1.6, 0.0 ]
  - id: achenbach
    device: achenbach-18
    at: [ -0.6, 0.0 ]
  - id: tecnare
    device: tecnare-m2122
    at: [ 0.4, 0.0 ]
  - id: eighteensound
    device: eighteensound-2way-15
    at: [ 1.2, 0.0 ]

  # The GMSS cabinets, to the right of our own with a wider break before them. They are `estimated` boxes rather
  # than measured ones — the builder's own stated figures, which the enum has no case for — so what this sheet
  # shows for them is the reconstruction. That comparison is worth being able to make beside real cabinets,
  # because it is the quickest way to see whether an estimate is plausible at all: it is what showed the first
  # reconstruction had the tops half a metre too tall.
  #
  # They are also the biggest things here. The wall bass is 1.400 m tall against a SKRAM's 0.914, and the mid bass
  # is 1.200 m **wide** — wider than any other cabinet in the library and the reason the spacing along this row is
  # set from their own widths rather than kept at the 1.0 m the others use.
  - id: nuke
    device: nuke
    at: [ 2.2, 0.0 ]

  - id: iq-sub
    device: iq-sub
    at: [ 3.0, 0.0 ]

  - id: wall-bass
    device: wall-bass
    at: [ 3.9, 0.0 ]

  # A metre of clearance either side of this one, not the 0.8 the rest of the row uses: at 1.200 m across it would
  # otherwise touch both neighbours.
  - id: mid-bass
    device: mid-bass
    at: [ 5.2, 0.0 ]

  - id: turbo-top
    device: turbo-top
    at: [ 6.4, 0.0 ]

  # The non-speaker gear, further right again. The truss segment is the point of interest here: it is the only
  # device in the library that is not a hexahedron, so this is where its chords and bracing can be looked at
  # against a cabinet for scale. Our wind-up stand is a `shape: mast` whose legs spread to 1.6 m, so it stands a
  # full metre clear of the truss end and of GMSS's tower, which is still a `shape: box` placeholder.
  - id: truss-f33-2m
    device: truss-f33-2m
    at: [ 7.8, 0.0 ]

  - id: truss-tower-4m
    device: truss-tower-4m
    at: [ 9.8, 0.0 ]

  - id: tower-5m
    device: tower-5m
    at: [ 11.0, 0.0 ]

  # A moving head and a scaffold tower, the two shapes that are neither cabinet nor truss. The MAC is the only
  # GMSS device with a datasheet behind it, and the Gerüst at 5 m is the tallest thing in the library — which is
  # what makes this sheet worth rendering from the front: everything is to the same scale.
  - id: mac-2000-performance-ii
    device: mac-2000-performance-ii
    at: [ 12.0, 0.0 ]

  - id: geruest-krause-ah7
    device: geruest-krause-ah7
    at: [ 13.4, 0.0 ]

  # The two rack types. Nothing to inspect in the geometry — a rack case IS a box, and these are the first
  # non-speaker devices that needed no new shape at all. They are here because the sheet is the inventory.
  - id: rack-amp-12u
    device: rack-amp-12u
    at: [ 14.8, 0.0 ]

  - id: rack-power-12u
    device: rack-power-12u
    at: [ 15.6, 0.0 ]

notes: |
  Not a real setup — `scene:build` will warn that it uses gear from more than one owner, which is
  expected here, and that it leans on un-measured cabinets, which is the five GMSS boxes.

  One of every device in the repository, which is the whole point of the file: if a device exists and is not on
  this sheet, the sheet is broken. Seventeen of the eighteen are here — five speakers of ours, five of GMSS's, a
  truss segment, two towers, a moving head, a scaffold and the two rack types.

  GMSS went from four cabinets to five when the builder gave real figures: what had been modelled as one eight-strong
  "turbo sub" is two different boxes, six IQ subs and two nukes, and the mid bass turned out to be a single 1.200 m
  cabinet rather than a pair. That is 300 mm of extra sheet, which is why everything right of the mid bass moved.
  Since 0.134.0 our wind-up stand draws its 1.6 m legs, so everything right of the truss segment moved again.

  THE ONE DELIBERATE OMISSION is `truss-9m`. It is the same geometry as `truss-f33-2m` at four and a half
  times the length, so it shows nothing new, and including it would stretch this sheet past 20 m and leave every
  cabinet on it too small to inspect — which is the one thing the sheet exists to allow. Any other device missing
  from here is a bug.
