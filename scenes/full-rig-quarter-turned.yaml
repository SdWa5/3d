# full-rig-all-tops with the subs laid on their SIDES: twelve Flexys in two tiers of six, alternating 270 and
# 90 along each row. Everything above the subs is unchanged, so this is a straight comparison of what turning
# the sub wall on its side does to the same rig.
#
# WHY A QUARTER TURN PAIRS THEM. Rolling 180 turns a cabinet over and leaves it where it was; rolling 90
# swings it onto its side, and because geometry runs from the cabinet's own bottom-centre the body ends up
# entirely to ONE SIDE of where that origin was — to the right at 90, to the left at 270. So two cabinets
# whose origins nearly coincide, rolled opposite ways, do not overlap: they fall to opposite sides and meet
# back to back. That pair is what this wall is built from, six across and two tiers up.
#
# THE ORDER OF THE CYCLE MATTERS, which is not obvious and is worth stating. `[270, 90]` opens each pair
# outward from its shared origin and the cabinets touch exactly. `[90, 270]` closes it inward. Same two angles,
# opposite result.
#
# AND THE SPACING IS DERIVED. It could not always be: `roll_cycle` used to space *origins* uniformly, and a
# rolled cabinet is not centred on its origin, so this file carried a hand-stated `step_m: 0.02` inside a
# two-cabinet row nested twice — a pair, two tiers of the pair, three groups of that. It now lays the bodies
# out at a uniform pitch and puts each origin where its own body needs it, so one row of six with a `gap_m`
# says the same thing and stays right if a Flexy is ever re-measured. The geometry is unchanged to the
# micrometre; only the file is simpler.
#
# The wall comes out 4.678 m wide and 1.182 m tall, against 3.646 x 1.526 for the same twelve cabinets
# standing up. Wider and lower: the Achenbach row now sits comfortably inside it rather than overhanging by
# 27 mm, and every top is 344 mm lower, which flattens their down-tilt.
id: full-rig-quarter-turned
name: "Full rig — subs on their sides, three groups of four"

focus:
  far:
    distance_m: 10.0
    height_m: 1.8
  near:
    distance_m: 2.0
    height_m: 1.8

placements:
  # Twelve cabinets: one row of six on their sides, alternating the quarter turn, and two tiers of it.
  - id: sub-wall
    device: flexy-folded-horn-hybrid
    at: [-0.302, 0.0]
    row:
      count: 6
      gap_m: 0.02
      roll_cycle: [270, 90]
    in:
      - lattice:
          count: [1, 1, 2]   # two tiers of that row

  # Six Achenbach 18s across the middle. On this wall the row is 3.70 m against 4.678 m and sits well
  # inside it, which is not true of the twelve-cabinet wall standing up.
  - id: achenbach-row
    device: achenbach-18
    on: sub-wall
    at: [-0.302, 0.0]
    row:
      count: 6
      gap_m: 0.02

  - id: tops
    device: tecnare-m2122
    on: achenbach-row
    at: [-0.302, 0.0]
    aim: far
    row:
      count: 3
      step_m: 1.55

  # Near-field fill, inside the outer tops with 20 mm to spare. Solved rather than stated, because both
  # cabinets are toed in and half-widths get it wrong — see full-rig-all-tops.yaml for the full argument.
  - id: near-fills
    device: eighteensound-2way-15
    on: achenbach-row
    at: [-0.302, 0.0]
    aim: near
    align:
      mode: block
      inside: tops
      inset_m: 0.020
    row:
      count: 2

notes: |
  Compare full-rig-all-tops.yaml, which is this rig with the same twelve subs standing up. Same cabinets,
  same tops, same two foci — only the sub wall's orientation differs, and it changes the wall from
  3.65 x 1.53 m to 4.68 x 1.18 m.

  Whether laying horn-loaded subs on their sides is a good idea acoustically is not something this file can
  answer; what it can show is that the arrangement fits, what it measures, and where every cabinet ends up.

  Six Achenbachs against four owned, as in every three-tier scene. Mixes owners.
