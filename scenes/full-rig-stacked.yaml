# full-rig-three-tier, but nobody chose the tiers.
#
# Every other rig scene in this folder is the same decision made by hand: subs low, 18" above them, tops on
# top, six per row because six is what fits. This one states the two things that are actually decided — how
# wide the rig may be, and how high the tops have to sit — and lets the compiler deal the cabinets into rows.
#
# What it works out, against the gear list as it stands:
#
#   1  flexy-folded-horn-hybrid  x6    0.763 m     six fit in 3.70 m: (3.70 + 0.02) / (0.591 + 0.02) = 6.09
#   2  flexy-folded-horn-hybrid  x6    1.526 m     twelve owned, so a second row — and 1.526 MISSES 2.0
#   3  achenbach-18              x4    2.126 m     which is what puts the Achenbachs in, and now it clears
#   4  tecnare-m2122             x3                the tops, aimed, because they are the tops
#
# `align: { mode: block }` on the stack then spreads every tier above the bottom one onto that one's edges,
# so all four rows run -2.1250 .. +1.5210. The Achenbach step comes out at 1.0153 and the tops at 1.6131 —
# and the second of those is a fixed point rather than a division, because the tops are aimed and a
# toed-in cabinet is wider across x than it is wide. Neither number is in this file.
#
# The interface height is the whole point of the exercise. Two Flexy tiers reach 1.526 m and the tops would
# fire into the crowd; the Achenbach row lifts the interface to 2.126 m and they fire over it. That is the
# same answer full-rig-three-tier.yaml arrived at by hand, reached here from the constraint instead — so it
# follows the specs when somebody finally measures a cabinet.
#
# One honest difference from the hand-written version, and it is a correction rather than a variation:
# full-rig-three-tier calls for SIX Achenbachs and only FOUR exist. A stack deals out what the inventory
# says is there, so the third tier is four wide and the scene does not over-book gear that is not in the
# building.
#
# NOTHING HERE ASSUMES A GRID, and it could not: the five cabinets we own have five different widths
# (0.4656 / 0.500 / 0.591 / 0.600 / 0.610) and five different heights (0.600 / 0.763 / 0.836 / 0.914 /
# 0.960), no two of them multiples of anything. Every row count is worked out per cabinet and every height
# is summed, never multiplied.
id: full-rig-stacked
name: "Full rig — solved from a width and an interface height"

focus:
  distance_m: 10.0    # out into the crowd, past the front rows
  height_m: 1.8       # ear height for a standing audience

placements:
  - id: main
    at: [-0.302, 0.0]        # the middle of the rig, not its left edge
    aim: focus               # applied to the TOP tiers only; subs fire straight ahead
    align:
      mode: block            # every tier above the bottom one spread to the bottom one's edges
    stack:
      max_width_m: 3.70      # what the stage allows
      interface_height_m: 2.0 # the tops' bottom edge has to clear this
      gap_m: 0.02            # working gap between neighbours in a row
      from:                  # low frequency first — the order is the fill order
        - flexy-folded-horn-hybrid
        - achenbach-18
        - tecnare-m2122

notes: |
  Compare full-rig-three-tier.yaml, which is this rig written out tier by tier. The two should agree on the
  Flexy rows and on the tops; they differ on the Achenbach row, where this one places the four that exist
  and that one asks for six.

  Things worth trying, because each of them is now one number rather than a rewrite:

    max_width_m: 2.50       a narrower stage — four Flexys a row, three rows, and the interface clears
                            without the Achenbachs having to be there at all
    interface_height_m: 3.0 higher than the inventory can reach, which fails and says by how much
    min_width_m / max_height_m   the other two bounds, for a ceiling or a truss

  Mixes owners — the Achenbachs are Sepp's — which `scene:build` reports.
