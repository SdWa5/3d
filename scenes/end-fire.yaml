# End fire: subs stepping front to back rather than side by side, so the ones behind fire into the ones
# in front and the array cancels backwards instead of radiating there.
#
# The spacing along y is the one number here that is *not* geometry, and so the one that is stated. It is a
# decision about frequency: flush would put the cabinets 0.964 m apart, which is a quarter wavelength at
# about 89 Hz, and 1.20 m tunes the same column to about 71 Hz. Delay per cabinet follows from the same
# distance and belongs in the DSP, not in a 3D model — this scene only says where the boxes stand.
#
# Everything else is derived. `step_m`'s zeros mean "work this axis out", so x needs nothing said about it,
# and the outer lattice spaces its four columns on the column's own width plus a 20 mm working gap.
id: end-fire
name: "End fire — four columns of three"

placements:
  - id: end-fire-array
    device: flexy-folded-horn-hybrid
    at: [0.0, 0.0]
    # Three deep. Centred on `at` like x is, so the front cabinet of each column stands 1.20 m in front
    # of the placement rather than on it.
    lattice:
      count: [1, 3, 1]
      step_m: [0.0, 1.20, 0.0]
    in:
      - lattice:
          count: [4, 1, 1]
          gap_m: 0.02

notes: |
  Twelve Flexys, and only eight exist — `scene:build` says so. The arrangement is what matters here; cut
  the outer lattice to `count: [2, 1, 1]` for a buildable six.

  Compare against sub-wall-lattice.yaml, which is the same cabinet spaced flush and mirrored instead.
