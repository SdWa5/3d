# WHAT INNSCHLEIFE IS BRINGING TO THE NEXT EVENT, in the variant with their two big THL-4 tops.
#
# Stated by Innschleife to Stefan on 2026-09-02: "Also wir nehmen 4x Sbh 18, 4x Wsx 18, 4x die blauen Kicker 15,
# und entweder alle 4 kleinen Tops oder die 2 großen Thl4." The small tops are two rather than four, corrected the
# same day when the mapping was read back.
#
# **THE NAMES MOVED ON 2026-09-03 AND THE COUNTS DID NOT.** Innschleife corrected the mapping: the 0.60 x 0.60 is
# a small wbin kicker rather than the SBH, and the SBH is a 1.20 x 0.55 x 0.80 horn that appears in no drawing.
# So the same three lines now name three different specs. The blue kicker was a reading for about an hour and is
# a statement now: Innschleife added "Electrovoice wbins, sind die blauen", which is the 0.60 x 0.60 cabinet.
# What is left over is `sub-95x57`, which nobody has named and nobody put in the statement.
#
# THE OTHER HALF OF THE EITHER/OR IS NOT WRITTEN, DELIBERATELY. A `innschleife-next-event-small-tops` roster
# existed for an hour and was dropped on the owner's word, because nobody is comparing the two rigs right now and
# a second folder of scenes is a second folder to keep true. Bringing it back is five lines: copy this file, swap
# the two top counts, rename the id to match the file. The fork itself is real and is recorded in the two top
# specs, which is where it belongs.
#
# WHAT THE FORK IS ACTUALLY ASKING. It is two tops either way, so this is not about how many cabinets go up. It is
# 0.430 x 0.870 m each against 0.500 x 1.140 m each: 0.270 m taller on top of a sub wall the sweep already aims to
# keep under 3.0 m, and 0.140 m wider in a row whose width every silhouette check reads. So the two rosters are
# the same rig twice with a different answer to "how high does this end up", and that is what to compare them for.
id: innschleife-next-event-thl4
name: "Innschleife, next event — two THL-4"

brings:
  wsx-18: 4         # "4x Wsx 18"
  sbh-18: 4         # "4x Sbh 18" — the 0.55 x 1.20 horn, built lying down
  kicker-15: 4      # "4x die blauen Kicker 15" — the Electro-Voice wbins, confirmed 2026-09-03
  sub-95x57: 0      # not in the statement, so it stays at home rather than being forgotten
  tms4: 0      # left at home in this variant
  thl4: 2           # "die 2 großen Thl4"

notes: |
  `thl4` is the cabinet this repository refused to spec until the statement above proved it real.
  Its weight is a 200 kg/m³ model and is probably light by 20 kg — the spec says so at length. A rig built from
  this roster is therefore lighter on paper than in the van.
