# WHAT INNSCHLEIFE IS BRINGING TO THE NEXT EVENT, with the tops their own photograph shows.
#
# Stated by Innschleife to Stefan on 2026-09-02: "Also wir nehmen 4x Sbh 18, 4x Wsx 18, 4x die blauen Kicker 15,
# und entweder alle 4 kleinen Tops oder die 2 großen Thl4." The small tops are two rather than four, corrected the
# same day when the mapping was read back.
#
# **THE NAMES MOVED TWICE AND THE COUNTS NEVER DID.** On 2026-09-03 Innschleife corrected the sub mapping: the
# 0.60 x 0.60 is a small wbin kicker rather than the SBH, and the SBH is a 1.20 x 0.55 x 0.80 horn that appears in
# no drawing. "Electrovoice wbins, sind die blauen" settled which sub is the blue kicker. What is left over is
# `sub-95x57`, which nobody has named and nobody put in the statement.
#
# **ON 2026-09-05 INNSCHLEIFE SWAPPED A SUB, AND THE SENTENCE THAT DID IT ALSO FIXED THE MAPPING.** They are
# **not** bringing the four black JBL 60 x 60 and are bringing **the blue Electro-Voice 95 x 57 instead**. Three
# facts in one line: which box comes, what colour it is, and who made it. That names the blue EV as the 0.95 x
# 0.57 cabinet, and "die blauen Kicker 15" with it — which is where `kicker-15` sat on 2026-09-02 before a
# correction moved it to the 60 x 60 and got it wrong. So the id came back and the 60 x 60 is `sub-60x60`, an
# unnamed black JBL. **The count did not change: four either way, of a different cabinet.**
#
# WHAT THAT SWAP COSTS THE RIG. The 60 x 60 JBL is 0.600 wide and the EV is 0.950, so a row of four goes from
# 2.40 m to 3.80 m before any gap, and every silhouette rule here is a width in metres rather than a cabinet
# count. Four of these are the widest sub row Innschleife can field.
#
# **AND ON 2026-09-05 THE TOPS MOVED TOO, THIS TIME AGAINST PUBLISHED FIGURES RATHER THAN AGAINST A STATEMENT.**
# There is no THL-4. The big top's drawn 0.500 x 1.140 m front is the published Turbosound TMS-4's 502 x 1143 mm,
# and the small top's 0.430 x 0.870 m is the TMS-2's 432 x 865 mm. See tms2.yaml and tms4.yaml.
#
# **ON 2026-10-01 A PHOTOGRAPH SETTLED THE EITHER/OR, AND THIS FILE STOPPED BEING THE TMS-4 VARIANT.** Until then it
# was `innschleife-next-event-tms4` and brought the two TMS-4s, the other half of "entweder alle kleinen Tops oder
# die 2 großen" left unwritten. Stefan then showed a photo of Innschleife's stack as they build it: two rows of
# [WSX | SBH | SBH | WSX] lying down, the four blue kickers standing on top, and three tops above that, a TMS-2 either
# side of a big black top that no drawing shows. Stefan's decision on the same day was to bring the photo's tops,
# so the TMS-4s are at zero, both TMS-2s come, and the black one is `top-70x93`, a spec estimated off that photo.
# The roster lost its `-tms4` suffix with it, because the name was the variant and there is now only one.
#
# **THE FOLDER IT REPLACES HELD NONE OF INNSCHLEIFE'S GEAR.** `scenes/generated/innschleife-next-event-tms4/` was
# swept at 0.105.0 without `--owner=innschleife`, so all 146 scenes in it were sdwa5 and sepp cabinets under an
# Innschleife name, and the roster's counts touched nothing in them. That folder is gone, and `scene:stack` now
# refuses a roster that brings a cabinet the swept inventory does not hold.
id: innschleife-next-event
name: "Innschleife, next event — the tops on their photo"

brings:
  wsx-18: 4
  sbh-18: 4
  kicker-15: 4
  sub-60x60: 0
  tms2: 2
  top-70x93: 1
  tms4: 0

notes: |
  The photo roster brings two TMS-2 and one unidentified middle top. The middle top's dimensions and 78 kg
  weight are estimates. The weight uses this library's 200 kg/m3 volume model and is not a measured bound.
  The sub weights use the same model, so transport totals remain estimates.
