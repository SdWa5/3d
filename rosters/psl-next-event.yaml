# WHAT PSL IS BRINGING TO THE NEXT EVENT: twelve of their biggest sub and five of their biggest top.
#
# Stated by PSL to Stefan on 2026-09-02, as "12x the biggest / most powerful sub they have" and "5x the biggest /
# most powerful top they have". THE CABINETS ARE NOT NAMED IN THAT STATEMENT AND THE SPECS ANSWER IT WITHOUT
# AMBIGUITY, which is the one piece of reading this file does:
#
#   * THE SUB IS THE `concert-audio-esx`. It is 0.590 x 1.180 x 0.915 m and 94 kg against 82 for the next heaviest,
#     it carries two 18" against everything else's one, and at 33 Hz it reaches lower than any cabinet anybody in
#     this library publishes a figure for. Biggest and most powerful pick the same box, which is what makes the
#     statement safe to act on.
#   * THE TOP IS THE `concert-audio-ef6` at 65 kg, where the next is 32. The other five tops are 12" and 15" boxes
#     between 14.6 and 32 kg, so there is nothing to weigh up.
#   * They are the two halves of one system — PSL's published "Hornsystem Mod" package is exactly these two — so a
#     rig of twelve subs under five tops is that package scaled up rather than two cabinets picked off a list.
#
# TWELVE AND FIVE ARE MORE THAN THE SPECS SAY EXIST, AND THAT IS NOT AN ERROR IN EITHER PLACE. The specs say six
# and four, sourced from the package PSL publish and confirmed by our own Kraut drawing placing exactly six and
# four. What a rental company publishes as a package is not an inventory, so the two numbers answer different
# questions. The specs keep their sourced figures and this file records what is coming to one event, because
# "brought to one gig" and "owned" are different facts and this file is for the first.
#
# **WHAT PSL OWN IS NOT WRITTEN DOWN HERE, AND THAT IS DELIBERATE.** A count brought to one event would bound
# their stock from below, and their stock is theirs to state rather than ours to infer. Decided on 2026-09-14,
# while this repository was being read for publication. The crews whose figures are in this library cleared
# them, PSL are a rental company who were never asked, and docs/requests.md carries the open question instead.
#
# EIGHT ZEROS, BECAUSE THE STATEMENT IS EXHAUSTIVE. "The following" means the following and nothing else, so every
# other PSL cabinet is named at zero rather than left out — left out means "whatever the spec says", which would
# quietly add nine more boxes to the rig. See src/Spec/Roster.php.
#
# THE DECO PANEL WAS ADDED ON 2026-10-01, stated by Stefan as about 10 x 2.5 m and hung from the front of our F33
# truss behind the systems. It is no cabinet, so the solver never places it. `scene:stack` stands our truss on our
# two wind-up towers behind the rig and hangs the panel from it, see docs/scenes.md.
id: psl-next-event
name: "PSL, next event — twelve ESX under five EF 6"

brings:
  concert-audio-esx: 12         # "12x the biggest / most powerful sub they have"
  concert-audio-ef6: 5          # "5x the biggest / most powerful top they have"
  concert-audio-esf: 0
  thebox-tp118-800: 0
  thebox-tp218-1600: 0
  thebox-achat-112m: 0
  thebox-achat-115m: 0
  thebox-dsp-112: 0
  thebox-pa302: 0
  hk-linear5-112x: 0
  deco-panel-10x3-03: 1          # hung from our truss behind the systems, stated 2026-10-01

notes: |
  A rig from this roster is 1128 kg of sub and 325 kg of top by the published figures, all of it arriving in PSL's
  own vehicles. The load plan does not see it: `load:plan` looks at our gear and Sepp's, which is what travels in
  our vans.

  The ESX is published without its castors, four 100 mm ones, so a wall built from these is about 100 mm taller in
  the yard than in the file. On twelve cabinets that is worth knowing before a truss height is fixed.
