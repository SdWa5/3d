# PSL's deco panel, about 10 x 2.5 m, HUNG FROM THE FRONT OF OUR TRUSS BEHIND THE SYSTEMS AT THE NEXT EVENT.
#
# Stated by Stefan on 2026-10-01 as "about 10m wide and about 2,5m high", to be "mounted hanging from the front of the
# three point truss, truss standing behind the systems". The size is the whole of what is known. Make, material and
# weight are not.
#
# THE ID IS ITS SIZE because that is all there is, the same convention `top-70x93` and `sub-60x60` are under.
#
#   * DEPTH 0.050 m is a guess for a framed panel. A banner would be a few millimetres, and the difference moves the
#     panel's front face by 45 mm, which nothing downstream is sensitive to.
#   * WEIGHT 37.5 kg is 1.5 kg/m2 over 25 m2, an estimate for printed fabric on a light aluminium frame. It is the
#     number the tower check reads. Our two Varytec stands carry 85 kg each, and five F33 segments are 46.5 kg, so
#     the panel may weigh up to 123.5 kg before `scene:stack` refuses the backdrop. Weighed or stated by PSL, this
#     becomes a fact, and only a panel heavier than about three times this estimate would change the answer.
#
# SUBTYPE `deco`, CATEGORY `other`, because the taxonomy has no category for set dressing. `scene:stack` reads the
# subtype: a roster that brings a `deco` device gets a truss backdrop to hang it from. See docs/scenes.md.
id: deco-panel-10x2-5
name: "PSL deco panel 10 x 2.5 m"
category: other
subtype: deco
quantity: 1
owner: psl
build: original

provenance:
  dimensions: estimated
  weight: estimated

geometry:
  shape: box
  # Lying along X like a truss segment: `width` is the 10 m span, `height` the 2.5 m drop, `depth` the panel.
  dimensions_m: { width: 10.000, height: 2.500, depth: 0.050 }
  origin: bottom-center
  chamfer_m: 0.004

appearance:
  # No photograph of the panel is on disk, so it renders in one colour. A neutral dark grey reads as "a panel"
  # behind the cabinets without pretending to be its print. A `front_image` can follow once the file exists.
  color: "#3a3a40"

physical:
  weight_kg: 37.5
  handles: [ ]

rigging:
  # It hangs from the truss with clamps or ties, which are not modelled. Nothing hangs from it.
  flyable: false
  points: [ ]

notes: |
  ADDED 2026-10-01 for the next event, from the size stated by Stefan. The weight is the open question, and it is the
  one that matters: it is what the two wind-up stands carry together with the truss.
