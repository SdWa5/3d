# PSL's deco panel, 9 x 1.8 m, HUNG FROM THE FRONT OF OUR TRUSS BEHIND THE SYSTEMS AT THE NEXT EVENT.
#
# Stated by Stefan on 2026-10-01 as "about 10m wide and about 2,5m high", to be "mounted hanging from the front of the
# three point truss, truss standing behind the systems". Corrected the same day to 10 x 3.03 m, together with PSL's
# print file, and later that day to 9 x 1.8 m. Size and print are what is known. Make, material and weight are not.
#
# THE ID IS ITS SIZE because that is all there is, the same convention `sub-60x60` is under. It was
# `deco-panel-10x2-5` and then `deco-panel-10x3-03` until the size changed.
#
#   * DEPTH 0.050 m is a guess for a framed panel. A banner would be a few millimetres, and the difference moves the
#     panel's front face by 45 mm, which nothing downstream is sensitive to.
#   * WEIGHT 24.3 kg is 1.5 kg/m2 over 16.2 m2, an estimate for printed fabric on a light aluminium frame. It is the
#     number the tower check reads. Our two Varytec stands carry 85 kg each, and five F33 segments are 46.5 kg, so
#     the panel may weigh up to 123.5 kg before `scene:stack` refuses the backdrop. Weighed or stated by PSL, this
#     becomes a fact, and only a panel heavier than about five times this estimate would change the answer.
#
# SUBTYPE `deco`, CATEGORY `other`, because the taxonomy has no category for set dressing. `scene:stack` reads the
# subtype: a roster that brings a `deco` device gets a truss backdrop to hang it from. See docs/scenes.md.
id: deco-panel-9x1-8
name: "PSL deco panel 9 x 1.8 m"
category: other
subtype: deco
quantity: 1
owner: psl
build: original

provenance:
  dimensions: estimated
  weight: estimated

geometry:
  shape: box
  # Lying along X like a truss segment: `width` is the 9 m span, `height` the 1.8 m drop, `depth` the panel.
  dimensions_m: { width: 9.000, height: 1.800, depth: 0.050 }
  origin: bottom-center
  chamfer_m: 0.004

appearance:
  # The colour of the back and the edges. The front carries the print, see `front_image`.
  color: "#3a3a40"

# PSL's print file, 1978 x 600 px, which is 3.3:1. The panel is 5:1 since Stefan chose 9 x 1.8 m on 2026-10-01
# knowing the two differ, so the print is STRETCHED ON PURPOSE. The model maps any image to the whole face. Mapped at
# 2.198 px/cm the file is 9.000 m wide and 2.730 m high, so the height misses by 52 % and the tolerance says so,
# instead of the default 10 % that exists to catch a photograph of the wrong cabinet. A print made at 5:1 replaces
# this with the default. Kept under the gitignored meshes/ like every front image, see docs/sources.md. A checkout
# without it builds the panel plain.
front_image:
  path: meshes/psl/deco-panel-front.jpg
  px_per_cm: 2.198
  tolerance: 0.52

physical:
  weight_kg: 24.3
  handles: [ ]

rigging:
  # It hangs from the truss with clamps or ties, which are not modelled. Nothing hangs from it.
  flyable: false
  points: [ ]

notes: |
  ADDED 2026-10-01 for the next event, from the size stated by Stefan, corrected the same day to 10 x 3.03 m with
  PSL's print, and later that day to 9 x 1.8 m with the print stretched to fit. The weight is the open question, and
  it is the one that matters: it is what the two wind-up stands carry together with the truss.
