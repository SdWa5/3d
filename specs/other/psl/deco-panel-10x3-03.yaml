# PSL's deco panel, 10 x 3.03 m, HUNG FROM THE FRONT OF OUR TRUSS BEHIND THE SYSTEMS AT THE NEXT EVENT.
#
# Stated by Stefan on 2026-10-01 as "about 10m wide and about 2,5m high", to be "mounted hanging from the front of the
# three point truss, truss standing behind the systems". Corrected the same day to 10 x 3.03 m, together with PSL's
# print file. Size and print are what is known. Make, material and weight are not.
#
# THE ID IS ITS SIZE because that is all there is, the same convention `top-70x93` and `sub-60x60` are under.
#
#   * DEPTH 0.050 m is a guess for a framed panel. A banner would be a few millimetres, and the difference moves the
#     panel's front face by 45 mm, which nothing downstream is sensitive to.
#   * WEIGHT 45.45 kg is 1.5 kg/m2 over 30.3 m2, an estimate for printed fabric on a light aluminium frame. It is the
#     number the tower check reads. Our two Varytec stands carry 85 kg each, and five F33 segments are 46.5 kg, so
#     the panel may weigh up to 123.5 kg before `scene:stack` refuses the backdrop. Weighed or stated by PSL, this
#     becomes a fact, and only a panel heavier than about two and a half times this estimate would change the answer.
#
# SUBTYPE `deco`, CATEGORY `other`, because the taxonomy has no category for set dressing. `scene:stack` reads the
# subtype: a roster that brings a `deco` device gets a truss backdrop to hang it from. See docs/scenes.md.
id: deco-panel-10x3-03
name: "PSL deco panel 10 x 3.03 m"
category: other
subtype: deco
quantity: 1
owner: psl
build: original

provenance:
  dimensions: estimated
  weight: estimated

geometry:
  shape: box
  # Lying along X like a truss segment: `width` is the 10 m span, `height` the 3.03 m drop, `depth` the panel.
  dimensions_m: { width: 10.000, height: 3.030, depth: 0.050 }
  origin: bottom-center
  chamfer_m: 0.004

appearance:
  # The colour of the back and the edges. The front carries the print, see `front_image`.
  color: "#3a3a40"

# PSL's print file, 1978 x 600 px. That is 1.978 px/cm across the 10 m and 1.980 px/cm down the 3.03 m, so the file
# has the panel's proportions and is mapped at 1.978. Kept under the gitignored meshes/ like every front image, see
# docs/sources.md. A checkout without it builds the panel plain.
front_image:
  path: meshes/psl/deco-panel-front.jpg
  px_per_cm: 1.978

physical:
  weight_kg: 45.45
  handles: [ ]

rigging:
  # It hangs from the truss with clamps or ties, which are not modelled. Nothing hangs from it.
  flyable: false
  points: [ ]

notes: |
  ADDED 2026-10-01 for the next event, from the size stated by Stefan, and corrected the same day to 10 x 3.03 m
  with PSL's print. The weight is the open question, and it is the one that matters: it is what the two wind-up
  stands carry together with the truss.
