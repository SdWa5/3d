# Power distribution rack, 12U — one of them, and the least-known device in the library.
#
# STATED BY THE OWNER: "2 racks for amps 1 rack for power distribution". That is the whole of it — one rack, for
# power. What is inside it is not stated anywhere, and unlike the amp racks there is no list of published
# components to derive a weight from.
#
# SO THIS IS THE WEAKEST SPEC HERE, and it is worth being blunt rather than dressing it up. The case is the same
# 12U shock-mount as `rack-amp-12u.yaml` — that much is a reasonable reading of "a rack" alongside two others — and
# its ~30 kg empty is the same estimate. The 15 kg of contents is a guess at what a distro of this size holds:
# breakers, a few socket panels, cable. Nothing published, nothing measured, no list to add up.
#
# WHAT IT HAS TO CARRY, which is the useful thing this spec can say even without knowing its contents. The amp
# racks hold three Gisen MM14Ks, each rated 14 000 W bridged at 4 Ω, plus an FP10000Q at 10 000 W peak and either
# an EP4000 or a Proline 3000. Those are *output* ratings and not what the wall sees, but they put the rig firmly
# in the range where a distro's breaker layout is the thing that decides whether the show starts. This schema has
# no field for electrical load, so that stays in prose.
#
# `subtype: power` IS NEW. `Category::Rack` had `amp`, `network` and `shipping`, and a distribution rack is none of
# the three — a mistake filed as a TODO when the truss work went in and fixed here because this is the spec that
# needed it.
id: rack-power-12u
name: "Power distribution rack — 12U"
category: rack
subtype: power
quantity: 1
owner: sdwa5
build: original

provenance:
  # The case follows the amp racks; the contents are a guess. Both estimated, and the weight more loosely than most.
  dimensions: estimated
  weight: estimated

geometry:
  shape: box
  # The same 12U shock-mount envelope as the amp racks: 533.4 mm of rails plus shock mounts and lids.
  dimensions_m: { width: 0.600, height: 0.700, depth: 0.750 }
  origin: bottom-center
  chamfer_m: 0.008

appearance:
  color: "#141414"

physical:
  # ESTIMATE, and the loosest one in the repository: ~30 kg of empty case plus ~15 kg of breakers, socket panels
  # and cable. No component list exists to add up.
  weight_kg: 45.0
  handles: [ left, right ]

rigging:
  flyable: false
  points: [ ]

notes: |
  One 12U rack for power distribution. What is in it is not documented — this spec exists so a scene can show the
  rack that has to stand somewhere, and so its weight is in the load-in total rather than missing from it.

  THE 45 kg IS A GUESS, not a derivation. The amp racks' weights come from published amplifier figures; this one has
  nothing behind it. If somebody opens the rack and lists what is in it, this becomes as solid as the others.

  It carries a rig whose amplifiers are rated in the tens of kilowatts — three MM14Ks at 14 000 W bridged each, an
  FP10000Q at 10 000 W peak, and one more. Output ratings are not mains draw, but the breaker layout is what decides
  whether everything can be switched on at once, and nothing in this schema can record it.

  Uses the `power` subtype added to `Category::Rack` for this spec: `amp` / `network` / `shipping` had no room for a
  distro.
