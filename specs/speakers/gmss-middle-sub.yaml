# GMSS "middle sub" — the pair of fin-mouthed folded horns in the centre of the stack in GMSS.jpeg.
#
# EVERY DIMENSION HERE IS AN ESTIMATE AND NONE OF THEM HAS BEEN MEASURED. See `gmss-turbo-sub.yaml` for the
# whole of what GMSS supplied and why there is no datasheet to fall back on.
#
# "MIDDLE" IS A POSITION, NOT A PASSBAND. GMSS's wording is "Middle subs are 18/1600rms", and in the photo
# these are the cabinets in the middle of the stack, between the two outer columns — not a mid-range box. The
# mid-bass is a separate cabinet, `gmss-mid-bass`.
#
# HOW THE NUMBERS WERE ARRIVED AT:
#
#   - The 18" IS stated data — "18/1600rms" — so unlike the other three GMSS cabinets this one has a real
#     driver size and it is recorded in `audio.drivers`.
#   - The class is fixed by the photo: a wide mouth divided by three or four vertical fins, which is a folded
#     horn mouth rather than a ported baffle.
#   - THESE ARE THE BIGGEST CABINETS IN THE STACK, which the photo shows plainly: the middle pair runs from the
#     ground to above the second cabinet of the outer columns, about 455 px of height where an outer cabinet is
#     320 — so roughly 1.4 times a turbo sub's height, whatever the absolute scale turns out to be.
#   - 0.700 x 1.200 x 1.000, which is that ratio applied to the turbo sub's 0.750. The turbo sub in turn is
#     anchored to our measured Flexy rather than to the photograph — see `gmss-turbo-sub.yaml` for why an earlier
#     absolute scale read off a blue logo was abandoned, and note that these were 0.900 x 1.350 x 1.100 under it.
#   - Depth is inferred from the class, since the photo shows the mouth and not the box behind it.
#   - The weight follows: 5.48 m2 of skin at 18 mm and ~680 kg/m3 is 67.1 kg, plus ~18 kg of internal horn panels
#     (a folded horn is mostly internal panels), plus ~12 kg for the 18", plus ~3 kg of hardware. 100 kg is a
#     two-person lift, which is worth knowing before a load-in, and it sits just above our SKRAM's 90.
#
# NO PASSBAND. The 1600 W RMS is a power rating and says nothing about where the cabinet is crossed over.
# Frequencies are exactly the kind of number this repository refuses to invent.
id: gmss-middle-sub
name: "GMSS Middle Sub"
category: speaker
subtype: sub
quantity: 3
owner: gmss
build: own-design

provenance: estimated

geometry:
  # Block-level outer box; the fold is not modelled.
  shape: box
  dimensions_m: { width: 0.700, height: 1.200, depth: 1.000 }
  origin: bottom-center
  chamfer_m: 0.012

appearance:
  color: "#141414"

physical:
  # ESTIMATE, calculated not guessed — see the header for the arithmetic.
  weight_kg: 100.0
  handles: [ left, right ]

rigging:
  flyable: false
  points: [ ]

audio:
  # The one piece of driver data GMSS actually stated. No passband: see the header.
  drivers:
    - { size_in: 18, type: woofer, count: 1 }

notes: |
  Stated by GMSS: "Middle subs are 18/1600rms". An 18" driver, 1600 W RMS.

  The count is NOT stated and is read off the photograph: two stand side by side on the ground in the middle of
  GMSS.jpeg and a third lies on its side above them, carrying the row of three tops — so `quantity: 3`. The
  third one is the least certain of the three, since what the photo actually shows there is a cross-braced horn
  mouth that is wider than it is tall, and a middle sub laid on its side is the reading that fits both that
  shape and the height the tops end up at. It could be a cabinet type GMSS never mentioned.

  NOT MEASURED. The 18" is real; the box around it is an estimate scaled from the measured folded horns in this
  repository. Needs a tape measure before it plans a real load-in.
