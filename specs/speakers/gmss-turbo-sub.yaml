# GMSS "turbo sub" — the eight cabinets that make up the two outer columns in GMSS.jpeg.
#
# EVERY DIMENSION HERE IS AN ESTIMATE AND NONE OF THEM HAS BEEN MEASURED. What GMSS actually supplied was a
# count and a power rating — "8 turbo subs 3000rms" — and one photograph taken on site with no scale reference
# in it. There is no datasheet: GMSS (Gena Made Sound System) is a self-built system and searching for it
# online returns nothing, which is expected for a locally built rig rather than a product.
#
# HOW THE NUMBERS WERE ARRIVED AT, so the next person can judge them rather than trust them:
#
#   - The class is fixed by the photo: a grille across the whole front, deep enough to be horn or bandpass
#     loaded rather than a plain reflex box. Four stand in each of the two outer columns, which is the stated
#     eight — the low box at the foot of each column that reads as a plinth carries the same recessed oval logo
#     as the cabinets above it, so it is one of them rather than a riser.
#   - THE PROPORTIONS: taller than wide, roughly 4:5 in the photo. An early estimate made these a 0.700 cube,
#     which the photograph never showed.
#   - THE SIZE IS ANCHORED TO A MEASURED CABINET OF THE SAME CLASS, not to the photograph. `flexy-folded-horn-hybrid`
#     is a single-18" folded horn sub in this repository at 0.591 x 0.763 x 0.964, and its numbers come from the
#     design's own CAD. A GMSS turbo sub is the same kind of box doing the same job, so 0.600 x 0.750 x 0.900 —
#     within 40 mm of the Flexy on every axis.
#   - THIS REPLACED A SCALE READ OFF THE PHOTO, and the reason is worth recording. An earlier pass measured the
#     blue illuminated logo on the front face, assumed a ~60 mm badge, and derived 0.800 x 0.950 x 0.900 from
#     3 mm per pixel. Standing that rig beside our own in `both-systems-side-by-side.yaml` showed it was much too
#     big: it made fourteen GMSS cabinets a wider, taller wall than our twenty-three. A photograph with no scale
#     reference in it cannot settle absolute size, and the 60 mm was doing all the work. Comparison against a
#     cabinet somebody has actually measured is the better anchor, so that is what this now uses.
#   - Depth is the least certain of the three. The side face is heavily foreshortened, so 0.900 is inferred from
#     the class rather than measured off the photo at all.
#   - The weight is calculated rather than guessed, the same way `achenbach-18` and `eighteensound-2way-15` do
#     it: 3.33 m2 of skin at 18 mm and ~680 kg/m3 is 40.8 kg, plus ~10 kg of internal horn panels, plus ~12 kg
#     for an 18" driver, plus ~3 kg of hardware. 66 kg against the Flexy's 85 for a slightly bigger box.
#
# WHAT IS DELIBERATELY ABSENT: there is no `audio` block. The driver complement and the passband are not known
# — 3000 W RMS is a power rating, and on a locally built cabinet it usually describes the amplifier channel
# rather than the driver — so stating a passband or a driver count here would be inventing data, not estimating
# it. An 18" is *likely* from the size and the class, but likely is not a source. See docs/measuring.md.
id: gmss-turbo-sub
name: "GMSS Turbo Sub"
category: speaker
subtype: sub
quantity: 8
owner: gmss
build: own-design

provenance: estimated

geometry:
  # Block-level outer box, which is all an estimate can honestly describe. Whatever the loading is inside, it
  # is not modelled and nothing here claims to know it.
  shape: box
  dimensions_m: { width: 0.600, height: 0.750, depth: 0.900 }
  origin: bottom-center
  chamfer_m: 0.012

appearance:
  # Black textured finish, as every cabinet in the photo has.
  color: "#141414"

physical:
  # ESTIMATE, calculated not guessed — see the header for the arithmetic.
  weight_kg: 66.0
  handles: [ left, right ]

rigging:
  # Ground-stacked in the photo, on a plinth. Nothing suggests fly points and none are visible.
  flyable: false
  points: [ ]

notes: |
  Stated by GMSS: "8 turbo subs 3000rms". Eight cabinets, 3000 W RMS. Whether that figure is per cabinet or
  for the group of eight is not stated; per cabinet is the ordinary reading and is what is assumed here.

  The repository has no field for power handling, so the rating lives in this note rather than in `audio`.

  NOT MEASURED, NOT FROM A DATASHEET. Dimensions and weight are estimates derived from the photograph and from
  the measured cabinets already in this repository. Everything about this cabinet needs a tape measure before it
  is used to plan a real load-in — the numbers are good enough to see the shape of the rig and no better.
