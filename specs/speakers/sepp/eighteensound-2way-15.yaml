# Built from Eighteen Sound's published "15 inch 2 Ways Kit". Outer dimensions come from the FreeCAD
# model in Drive, converted with `ddev mesh-convert` — NOT from the drawings' 420/800/335, which are
# partial dimensions measured inside the overhanging top and bottom panels. See docs/sources.md.
id: eighteensound-2way-15
name: "Eighteensound 2-Way 15\""
category: speaker
subtype: top
quantity: 2
owner: sepp
build: self-built

clone_of:
  manufacturer: "Eighteen Sound"
  model: "15\" 2 Ways Kit"
  reference: cad
  url: null

provenance:
  # Dimensions come from the design's own CAD; the weight is a calculation, not a source.
  dimensions: plans
  weight: estimated
deviations: |
  The FreeCAD model uses 18 mm panels, while Eighteen Sound's note specifies 15 mm Baltic birch — so
  this build is heavier and slightly larger than the published kit.

geometry:
  shape: box
  dimensions_m: { width: 0.4656, height: 0.836, depth: 0.4268 }
  origin: bottom-center
  chamfer_m: 0.010

appearance:
  # Birch plywood with a weatherproof black textured finish.
  color: "#141414"

physical:
  # ESTIMATE, calculated not guessed: ~1.89 m2 of 18 mm ply at ~680 kg/m3 = 23.1 kg, plus ~5 kg
  # internal baffles and braces, plus drivers (15W700 8.6 kg + ND1460 1.0 kg + XT1464 horn ~1.5 kg),
  # plus ~2 kg hardware. Recomputed for the CAD's larger box and 18 mm panels. Eighteen Sound
  # publishes no finished-cabinet weight — it is a DIY kit. Not weighed; see docs/measuring.md.
  weight_kg: 41.0
  handles: [ left, right ]

rigging:
  flyable: false
  points: [ ]

audio:
  drivers:
    - { size_in: 15, type: woofer, count: 1 }
    - { size_in: 1.4, type: compression-driver, count: 1 }

  layout:
    # MEASURED OUT OF THE MESH, not read off the drawings. The two openings are cut in the FreeCAD model,
    # so the mesh is the only thing that can agree with what gets rendered:
    #
    #   octagonal horn cut-out  362 wide (100.7 + 160.6 + 100.7) x 285 high (84.5 + 116 + 84.5),
    #                           centre at cabinet z 653.0  ->  baffle-frame z = +0.235
    #   driver cut-out          DIA 353.0 mm, centre at cabinet z 293.0  ->  baffle-frame z = -0.125
    #   2x port                 DIA 100.0 mm at x +/-0.140, baffle-frame z = -0.340 (not modelled yet)
    #
    # The baffle panel spans cabinet z 18..818, centred in the 836 mm box, so baffle-frame z is cabinet z
    # minus 418.
    #
    # The drawings' front view puts both openings 22.5 mm HIGHER than the mesh does — it dimensions them
    # 142.5 mm and 502.5 mm below the baffle top, which works out to +0.2575 and -0.1025. Both were wrong
    # by the same 22.5 mm, so the drawing measures from a datum 22.5 mm below the panel's top edge rather
    # than from the edge itself. The symptom was a black crescent along the bottom of each cut-out where
    # the hole's inner wall showed, which reads as a horn sitting too high and a cone too small for its
    # hole. Reported from a front render.
    #
    # The cone is drawn at the 353 mm cut-out rather than the driver's nominal 15" (381 mm): the frame
    # sits behind the panel and only the cone shows through, so the cut-out is what is visible.
    #
    # The horn itself is ELLIPTICAL — confirmed by the owner against the cabinet — even though the baffle
    # cut-out around it is the octagon the drawing dimensions (100.7 + 160.6 + 100.7). So the mouth_m
    # below is the cut-out's flat-to-flat size and the flare inscribed in it is round. The flare law is
    # not in the drawing either: an XT1464 is a flared horn, not a straight-walled one, so `exponential`
    # is the closer of the two available laws.
    provenance: plans
    # Measured out of the mesh: the baffle carrying both cut-outs is 55.8 mm behind the front-most point
    # of the cabinet, because the top and bottom panels project forward past it with a curved front edge.
    # That lip is why this cabinet's openings sit visibly deeper than any other's — the features are flush
    # with the baffle, the baffle itself is deep. See docs/sources.md.
    inset_m: 0.0558
    features:
      - { id: horn,   kind: horn, at_m: [ 0.0,  0.235 ], mouth_m: [ 0.362, 0.285 ], throat_in: 1.4, depth_m: 0.18,
          profile: elliptical, flare: exponential }
      - { id: woofer, kind: cone, at_m: [ 0.0, -0.125 ], diameter_in: 13.9, depth_m: 0.10 }

mesh_override:
  path: meshes/eighteensound-2way-15.stl
  units: mm
  rotate_deg: [ 0, 0, 0 ]
  # The two ports are lined green on the cabinet, as reference-files/pasted file 3.png shows (2026-10-01).
  # In the CAD a port is only its 100 mm hole through the 18 mm baffle, so the hole's wall is what gets
  # painted. The holes were ray-cast out of the mesh on 2026-10-01 and run x 0.092 to 0.192 and z 0.030 to
  # 0.126 from the floor. The box starts 0.5 mm behind the baffle's front face, so the face itself stays black.
  # The colour is sampled off that photo at three points of the two port rings.
  paint:
    - { id: port-left,  at_m: [ -0.142, -0.340 ], size_m: [ 0.104, 0.100 ], setback_m: 0.0563, depth_m: 0.019, color: "#37822f" }
    - { id: port-right, at_m: [  0.142, -0.340 ], size_m: [ 0.104, 0.100 ], setback_m: 0.0563, depth_m: 0.019, color: "#37822f" }

notes: |
  15W700 woofer plus ND1460 compression driver on an XT1464 horn, crossover around 1.5 kHz.
  Hardware Overview lists 60 - 20000 Hz and 550 W continuous.
  The override mesh carries the real baffle: octagonal horn cut-out, the DIA 353 mm driver hole and
  two DIA 100 mm ports, all matching the drawings' own callouts.
  Earlier versions of this spec used 0.420 x 0.800 x 0.335 m, read straight off the drawings. Those
  are partial dimensions: 420 is the baffle width and 800 the side-panel height, both measured inside
  the overhanging top and bottom panels (parts F and E), and 335 stops short of the back. The CAD's
  outer box is 46 mm wider, 36 mm taller and ~92 mm deeper.
