# Innschleife's big top, IDENTIFIED AS A TURBOSOUND TMS-4 ON 2026-09-05 — and the identification moved two
# numbers that had been estimates since this spec was written.
#
# **THE FRONT MATCHES THE PUBLISHED CABINET TO 2 AND 3 MILLIMETRES.** The drawn front is 0.500 x 1.140 m at the
# one pixel to the centimetre the drawing's owner states. The published TMS-4 is 45" x 19.75" x 28.75" and
# 165 lb, which is **1143 x 502 x 730 mm and 74.8 kg** — cited in docs/sources.md from Warehouse Sound and from
# the manual on archive.org. Both measured edges agree inside the drawing's own resolution.
#
# **THE REST OF THE SERIES DOES NOT FIT, WHICH IS WHAT MAKES IT AN IDENTIFICATION RATHER THAN A RESEMBLANCE.**
# The TMS-3 is 1019 x 844 x 578 mm and 134 kg, and the THL-4.3 is 1007 x 574 x 718 mm and 92 kg. Neither is
# within 70 mm of this cabinet on either edge. One published model matches and the neighbouring ones miss by a
# lot, so the match is not the kind a similar-looking box would produce by chance.
#
# **INNSCHLEIFE PUT THE NAME ON THE WRONG BOX, AND THE OWNER CALLED THAT A SIMPLE MISTAKE.** Sammy said "die
# kleinen sind Turbosound Tms4" and called these the "2 großen THL4", so both names sat one cabinet over. Stefan
# settled it on 2026-09-05: a cabinet whose measurements match a published one is that cabinet.
#
# **BOTH PURPLE CABINETS ARE TMS SERIES, SO THE STATEMENT WAS ONE DIGIT OUT RATHER THAN WRONG.** The small top
# matches the published TMS-2 at 432 x 865 x 578 mm and 48 kg to 2 and 5 mm, and is `tms2` now. "THL4" is the one
# name that belongs to neither: the published THL-4.3 is 1007 x 574 x 718 mm and misses both boxes by over 70 mm
# on both edges.
#
# **DEPTH AND WEIGHT ARE THE DATASHEET'S NOW, AND THAT IS THE POINT OF IDENTIFYING IT.** This spec used to carry
# depth 0.520 m by analogy with `tecnare-m2122` and 59 kg from the 200 kg/m3 volume model, and its own header said
# both would be replaced in one edit if the cabinet turned out to be the TMS-4. It did.
#
#   * DEPTH 0.730 m against the 0.520 m estimated: **210 mm deeper per cabinet**. Depth is what every stack
#     clearance and load plan is computed from, and it is the axis this repository has already been badly wrong
#     about — the GMSS reconstruction missed the IQ sub's depth by 205 mm having got its width and height inside
#     35 mm. See docs/sources.md.
#   * WEIGHT 74.8 kg against the 59 kg modelled: **15.8 kg heavier each**. The old header predicted this and said
#     so, on the grounds that a big three-way runs nearer 272 kg/m3 than 200.
#
# **WIDTH AND HEIGHT STAY THE DRAWN ONES.** 0.500 x 1.140 rather than the published 0.502 x 1.143, because the
# drawing is a measurement of the cabinet Innschleife own and the datasheet is a measurement of the model. Where
# both exist the one that was taken off this gear wins, and 2 mm changes no rig. The depth and the weight are
# adopted only because there is no measurement of them at all.
#
# `build: original` AND STILL NO `clone_of`. The enum's `clone_of` is for a cabinet we built from somebody else's
# drawing, and this is a factory box. A `manufacturer`/`model` pair is not in the schema, so the identification
# lives in this header and in docs/sources.md rather than in a field.
#
# NO `audio` BLOCK, EVEN THOUGH THE DATASHEET HAS ONE. The published TMS-4 states 450 W RMS, 105 dB sensitivity,
# a 55 Hz to 17 kHz response and an 18"/10"/1" complement. None of it is written here yet, because adopting a
# passband changes `Passband::orderingLowHz()` and therefore which cabinet goes where in every stack, and that is
# a rig change rather than a documentation change. It is worth doing deliberately — see docs/requests.md.
#
# QUANTITY 2, stated by the owner on 2026-09-02 and drawn twice in the first two revisions of the 06.12.25
# Staudham drawing.
id: tms4
name: "Innschleife Turbosound TMS-4"
category: speaker
subtype: top
quantity: 2
owner: innschleife
build: original

provenance:
  # `datasheet` on both, which is new for an Innschleife cabinet and true of no other spec in this folder. The
  # front is drawn and the depth and weight are published, and the enum has one value for the pair — so this
  # says the cabinet is identified rather than that every number came off the same page. The header has the split.
  dimensions: datasheet
  weight: datasheet

geometry:
  shape: box
  dimensions_m: { width: 0.500, height: 1.140, depth: 0.730 }
  origin: bottom-center
  chamfer_m: 0.012

appearance:
  # The classic Turbosound purple, read as a body colour rather than as the photograph's average. See
  # tms2.yaml, which is the same livery and is the reason the livery alone was never enough to name either.
  color: "#3d1f4a"

physical:
  weight_kg: 74.8
  handles: [ left, right ]

rigging:
  flyable: false
  points: [ ]

mesh_override: null

notes: |
  IT IS THE TALLEST TOP IN THE LIBRARY at 1.140 m, half a metre taller than our Tecnare, and now also **the
  deepest at 0.730 m**. Both matter for the sub/top transition: two of these on a sub wall put the interface
  where a `--max-sub-height` of 3.0 m has already spent most of its budget, and the extra 210 mm of depth is
  210 mm the stack behind them does not have.

  rosters/innschleife-next-event-tms4.yaml is the rig that brings them, and it is one half of a fork — Innschleife
  bring either these two or the four small tops, never both. A rig holding both is one nobody has ever stood up.

  ONLY THE EARLIEST DRAWING REVISIONS SHOW IT, so there is one source for its front and no second look at it. The
  later revisions replace it with `tms2`, and the owner's "either the four small ones or the two big ones"
  is what explains why: they are alternatives to each other rather than a correction.
