# NOBODY HAS NAMED THIS CABINET, AND IT HAD A NAME FOR A DAY. THE ID IS ITS FRONT SIZE AGAIN.
#
# **IT WAS `kicker-15` ON 2026-09-02 AND THAT WAS WRONG.** Innschleife listed four "SBH 18", four "WSX 18" and
# four "die blauen Kicker 15", which is three sub types at four each, and the three drawn specs were three sub
# types at four each — so the names were mapped one to one onto them. Reading the mapping back produced two
# corrections at once: the 60 x 60 is a small wbin kicker, and the SBH is 120 x 55 x 80 and appears in no drawing.
# That leaves **four** sub types where the statement listed three, and this is the one with no name and no place
# in the statement.
#
# **SO IT IS PROBABLY NOT COMING TO THE NEXT EVENT**, which is a different fact from not existing: the drawings
# place four of them and they are still four in this file. The rosters say `sub-95x57: 0` for exactly that reason
# — a cabinet named at zero is one somebody decided to leave at home, where a cabinet left out of a roster is one
# nobody thought about.
#
# TWO QUESTIONS GO BACK WITH IT, both on docs/requests.md: **what is this cabinet**, and **which of the four sub
# types is "die blauen Kicker 15"**. The wbin reading is a reading rather than a statement, and if it is wrong
# then this is the blue kicker after all and the ids swap back.
#
# Innschleife's wide low mid-bass horn.
#
# Source, method and their limits are written out once in wsx-18.yaml and apply unchanged
# here: two Staudham setup drawings in our own Drive, one embedded cabinet photograph each, placed at one
# pixel to the centimetre. This image is 95 x 57 px, so 0.950 x 0.570 m.
#
#   * DEPTH 0.600 m is `mid-bass` by analogy, which is the one cabinet in this library of the same
#     shape: 1.200 wide, 0.500 tall, 0.600 deep. A wide flat horn is deep enough for its horn path and no
#     deeper, and 0.600 is that path length at this mouth width. IT IS AN ANALOGY, NOT A MEASUREMENT.
#   * WEIGHT 65 kg is the modelled volume at 200 kg/m3, this library's central density. See the sibling spec.
#
# SUBTYPE `sub`, WHICH IS THE SCHEMA'S ANSWER RATHER THAN THE RIGHT WORD. In the 2026-02-28 drawing four of
# these are placed in a row ABOVE the six Achenbach subs and BELOW our three Tecnare tops, which is a mid-bass
# position. `Category::allowedSubtypes()` offers top, sub, monitor and line-array-element, so there is no
# `mid` to choose — and `mid-bass`, the same cabinet in the same position, is `subtype: sub` for the same
# reason. Worth knowing before reading a rig that puts it under the tops.
#
# QUANTITY 4 IS THE DRAWN COUNT. The 2026-02-28 revision places four in one row. The 06.12.25 drawing parks
# four in its legend column and places none, which is the same four. See docs/requests.md.
id: sub-95x57
name: "Innschleife 95x57 mid-bass horn"
category: speaker
subtype: sub
quantity: 4
owner: innschleife
build: own-design

provenance:
  dimensions: estimated
  weight: estimated

geometry:
  shape: box
  dimensions_m: { width: 0.950, height: 0.570, depth: 0.600 }
  origin: bottom-center
  chamfer_m: 0.012

appearance:
  # Sampled off the drawing's cabinet photograph (#1D201C). Near black; see the sibling spec on why a
  # photograph's average is not a paint colour.
  color: "#1d201c"

physical:
  weight_kg: 65.0
  handles: [ left, right ]

rigging:
  flyable: false
  points: [ ]

# NO `audio` BLOCK. The photograph shows two horn mouths side by side and states nothing about what drives
# them. See wsx-18.yaml.

mesh_override: null

notes: |
  NAMED ON 2026-09-02 AND UNNAMED AGAIN ON 2026-09-03. See wsx-18.yaml for what a rename costs, and the
  header for why this one went back to its front size.

  The second-widest cabinet in the repository at 0.950 m, behind `mid-bass` at 1.200. That matters
  because every silhouette rule here is a width in metres rather than a cabinet count — see
  `StackChecks::silhouetteProblem()` — so a row of these two is already 2.15 m before any gap, and a pyramid
  built on them needs a wide base.

  The photograph shows two horn mouths side by side across the full width, which is what a horn-loaded
  mid-bass front looks like. Whether that is one cabinet with two paths or two drivers into one mouth is not
  readable from it.
