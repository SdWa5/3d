# Innschleife's blue Electro-Voice wbin, "die blauen Kicker 15". IDENTIFIED ON 2026-09-05, AND THIS ID HAS BEEN
# ON THIS CABINET BEFORE.
#
# **THE MAPPING WENT ROUND A FULL CIRCLE AND CAME BACK, WHICH IS WORTH READING BEFORE TRUSTING ANY OF IT.**
#
#   * 2026-09-02, `kicker-15`. Innschleife listed "4x Sbh 18, 4x Wsx 18, 4x die blauen Kicker 15" — three sub
#     types at four each — and three drawn specs were three sub types at four each, so the names were mapped one
#     to one. This cabinet got `kicker-15`.
#   * 2026-09-03, `sub-95x57`. Reading the mapping back produced two corrections at once: the 0.60 x 0.60 was
#     called a small wbin kicker, and the SBH turned out to be a 1.20 x 0.55 x 0.80 horn in no drawing. So
#     `kicker-15` moved to the 0.60 x 0.60 and this cabinet lost its name.
#   * 2026-09-05, `kicker-15` again. Innschleife stated for the next event that they are **not** bringing the four
#     black JBL 60 x 60 and are bringing **the blue Electro-Voice 95 x 57 instead**. That names the blue EV as this
#     box, and "die blauen Kicker 15" with it. The 03.09 correction was wrong and the 02.09 mapping was right.
#
# **SO THE LESSON docs/sources.md RECORDS NOW HAS A SECOND HALF.** "Read a count and a name back before writing
# either down" is what produced the 03.09 correction, and reading it back is exactly what got it wrong: the answer
# came back about the wrong cabinet. What finally settled it was a statement nobody prompted — a sentence about
# what is going in the van, which names a colour, a manufacturer and a size together.
#
# **THE COLOUR IS THE EVIDENCE THAT CHANGED, AND IT CONTRADICTS THE PHOTOGRAPH.** This spec carried #1D201C,
# sampled off the drawing's own cabinet photograph, near black. The owners say blue. That is the same conflict the
# 0.60 x 0.60 had for two days in the other direction, and it resolves the same way: a sampled average is not a
# paint colour, our own Flexy averages #C7C7C7 where the cabinet is black. The value below is a mid blue standing
# in for a shade nobody has measured, and one photograph in daylight would settle it. `sub-60x60` gets the near
# black back, because that photograph was of the JBL and was right all along.
#
# `build: original` AND NO `clone_of`. Electro-Voice is stated by the owners. Whether these are factory EV boxes
# or built to EV's published wbin plans is **not** stated, and the two are a real fork rather than a quibble —
# EV's drawings were built by hand for twenty years. `original` is the weaker assertion of the two the enum
# offers. The question is on docs/requests/innschleife-fragen.md, and if the answer is self-built this becomes
# `self-built` with a `clone_of`.
#
# Source, method and their limits are written out once in wsx-18.yaml and apply unchanged here: two Staudham
# setup drawings in our own Drive, one embedded cabinet photograph each, placed at one pixel to the centimetre.
# This image is 95 x 57 px, so 0.950 x 0.570 m.
#
#   * DEPTH 0.600 m is `mid-bass` by analogy, which is the one cabinet in this library of the same shape:
#     1.200 wide, 0.500 tall, 0.600 deep. A wide flat horn is deep enough for its horn path and no deeper, and
#     0.600 is that path length at this mouth width. IT IS AN ANALOGY, NOT A MEASUREMENT — and both Innschleife
#     tops had their analogous depths corrected upward by 148 and 210 mm the moment they were identified, so read
#     this one as probably short.
#   * WEIGHT 65 kg is the modelled volume at 200 kg/m3, this library's central density. Both tops came out 16 kg
#     heavy against that model once measured, in the same direction.
#
# SUBTYPE `sub`, WHICH IS THE SCHEMA'S ANSWER RATHER THAN THE RIGHT WORD. In the 2026-02-28 drawing four of these
# are placed in a row ABOVE the six Achenbach subs and BELOW our three Tecnare tops, which is a mid-bass position.
# `Category::allowedSubtypes()` offers top, sub, monitor and line-array-element, so there is no `mid` to choose —
# and `mid-bass`, the same cabinet in the same position, is `subtype: sub` for the same reason.
#
# QUANTITY 4, drawn and stated. The 2026-02-28 revision places four in one row, the 06.12.25 drawing parks four in
# its legend column, and the owners are bringing four to the next event.
id: kicker-15
name: "Innschleife Electro-Voice wbin Kicker 15"
category: speaker
subtype: sub
quantity: 4
owner: innschleife
build: own-design

provenance:
  dimensions: estimated
  weight: estimated

geometry:
  shape: box
  dimensions_m: { width: 0.950, height: 0.570, depth: 0.600 }
  origin: bottom-center
  chamfer_m: 0.012

appearance:
  # **BLUE, STATED BY THE OWNERS, AND THE PHOTOGRAPH SAID NEAR BLACK.** Its average is #1D201C, which is what this
  # file carried until Innschleife named this box as "die blaue Electro-Voice 95 x 57" on 2026-09-05. See the
  # header: the same statement moved the near black onto `sub-60x60`, where the photograph had been right.
  #
  # A mid blue standing in for a shade nobody has measured. One photograph in daylight would settle it.
  color: "#2f4f8f"

physical:
  weight_kg: 65.0
  handles: [ left, right ]

rigging:
  flyable: false
  points: [ ]

# NO `audio` BLOCK. The photograph shows two horn mouths side by side and states nothing about what drives
# them. See wsx-18.yaml.

mesh_override: null

notes: |
  RENAMED THREE TIMES IN FOUR DAYS AND IS BACK WHERE IT STARTED: `kicker-15` on 02.09, `sub-95x57` on 03.09,
  `kicker-15` again on 05.09. See wsx-18.yaml for what a rename costs and the header for why it went round.

  The second-widest cabinet in the repository at 0.950 m, behind `mid-bass` at 1.200. That matters because every
  silhouette rule here is a width in metres rather than a cabinet count — see `StackChecks::silhouetteProblem()` —
  so a row of two is already 2.15 m before any gap, and a pyramid built on them needs a wide base.

  The photograph shows two horn mouths side by side across the full width, which is what a horn-loaded wbin front
  looks like. Whether that is one cabinet with two paths or two drivers into one mouth is not readable from it.
