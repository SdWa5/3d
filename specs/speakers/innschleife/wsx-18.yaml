# THE CABINET IS CALLED "WSX 18", NEW ON 2026-09-02 AND NOT YET CONFIRMED BY INNSCHLEIFE THEMSELVES.
#
# Innschleife told Stefan what they are bringing to the next event and named the cabinets doing it: four "SBH 18",
# four "WSX 18", four "die blauen Kicker 15", and either all four small tops or the two big "THL4". Three sub types
# at four each is exactly what these three specs already say, so the counts line up one to one and the names fall
# out of that mapping rather than out of a guess at each cabinet.
#
# THIS IS THE ONE THE NAME CONFIRMS RATHER THAN MERELY LABELS. A Martin Audio WSX is an 18" bass horn published
# at roughly 1100 x 545 x 890 mm. This cabinet's front was read off a drawing as 0.570 x 1.100 m and its depth was
# derived at 0.900 m from the horn-sub class in this library, months before anybody said the word WSX. The name and
# the derivation agree on all three axes without having been told about each other, which is the strongest thing
# anybody has been able to say about a number in this file.
#
# WHAT WAS DONE WITH IT. The spec is renamed: this file, its id and its `name` all carry the cabinet's name now,
# and the front size lives on in the text below because it is still where every dimension came from. The owner
# prefix went with the same pass — the file sits in `specs/speakers/innschleife/`, so an id repeating the system
# said it twice. **THE MAPPING IS STILL GOING BACK TO INNSCHLEIFE FOR CONFIRMATION**, and if it comes back wrong
# the fix is another rename of the same shape. docs/requests.md carries the open question.
#
# Innschleife's tall horn sub, and THE ID WAS ITS FRONT SIZE UNTIL 2026-09-02 BECAUSE NOBODY HAD NAMED IT.
#
# WHERE EVERY NUMBER IN THIS FILE COMES FROM, AND WHAT IS MISSING. Innschleife is a befriended system that has
# played with us at Staudham. Unlike PSL they publish nothing and searching for them returns nothing, so the
# only source in existence is two setup drawings in our own Drive:
#
#   Hardware/Speaker Enclosures _ Lautsprecher-Gehaeuse/setups/Staudham_Sdwa5_Innschleife_06_12_25/
#   Hardware/Speaker Enclosures _ Lautsprecher-Gehaeuse/setups/06.12.25 Staudham/   (the 2026-02-28 revision)
#
# Those drawings embed one photograph per cabinet type, placed at a scale the owner states outright: ONE PIXEL
# IS ONE CENTIMETRE. So the embedded image's pixel size is the cabinet's front size in centimetres, and this
# one is 57 x 110 px — hence 0.570 x 1.100 m and hence the id. That is the whole extent of the source.
#
# WIDTH AND HEIGHT ARE READ OFF A SCALED FRONT ELEVATION. DEPTH AND WEIGHT ARE DERIVED. That split is the
# single most important thing about this file, and docs/sources.md says why in the repository's own words:
# front-on ratios survive a photograph and depth does not. The GMSS reconstruction missed the IQ sub's depth
# by 205 mm, a third of the cabinet, while getting its width and height inside 35 mm.
#
#   * DEPTH 0.900 m is the horn-sub class in our own library rather than a guess at this box. The three horn
#     subs here whose depth has a source are the Flexy at 0.964 on a 0.591 m width, the SKRAM at 0.813 on
#     0.610 and the Achenbach at 0.700 on 0.600. A 1.100 m tall horn sub sits at the deep end of that, so
#     0.900 is the middle of the two deepest. IT IS THE FIRST NUMBER TO REPLACE.
#   * WEIGHT 110 kg is the modelled volume at 200 kg/m3, which is this library's own central density: twenty
#     cabinets run from 139 to 333 kg/m3 with a mean of 212, and 200 is where the wooden horn subs sit
#     (Flexy 196, Achenbach 198, SKRAM 199). So the method is sound and the spread is +/- 50 %.
#
# SUBTYPE `sub` COMES FROM WHERE IT STANDS, NOT FROM ITS LOOKS. In the 06.12.25 drawing one of these is placed
# on the ground at the outboard left end of the same row as our six Flexy subs. A cabinet in the bottom row
# beside the subs is a sub.
#
# HOW MANY EXIST IS UNKNOWN AND 4 IS WHAT THE DRAWINGS SUPPORT. The 06.12.25 drawing places one and parks
# three more in a legend column off the left of the page; the 2026-02-28 revision parks four and places none.
# Four distinct copies are drawn, so four exist, but a drawing shows what was brought to one gig rather than
# what a system owns. See docs/requests.md.
id: wsx-18
name: "Innschleife WSX 18"
category: speaker
subtype: sub
quantity: 4
owner: innschleife
build: own-design

provenance:
  # `estimated` for both, and for two different reasons. The enum has no case for "read off a drawing the
  # owner scaled", any more than it had one for "the builder stated it" — see docs/sources.md on GMSS. Width
  # and height are better than the word suggests and depth and weight are exactly as bad as it suggests.
  dimensions: estimated
  weight: estimated

geometry:
  shape: box
  dimensions_m: { width: 0.570, height: 1.100, depth: 0.900 }
  origin: bottom-center
  chamfer_m: 0.012

appearance:
  # Read off meshes/innschleife/photo-2026-09-19.jpeg on 2026-10-01 and white-balanced as described under
  # `audio.layout`. The body is a blue-black, and the dividers across the open front are painted blue. The
  # drawing's photograph averaged #45464D, which was what this file carried before. The owner stated on
  # 2026-10-01 that the cabinet is black all over except the coloured boards in the front row, and that those
  # are a normal blue rather than the light one the photo's #244b8b rendered as. #12307a was still too light, as
  # the owner stated on 2026-10-01.
  color: "#141414"

physical:
  weight_kg: 110.0
  handles: [ left, right ]

rigging:
  flyable: false
  points: [ ]

# `audio` CARRIES ONLY THE BAFFLE LAYOUT. No passband, no driver size, no driver count and no coverage figure
# exists for this cabinet. The photograph shows a curved horn mouth over four cells and that is a description of a front, not
# a driver complement. Inventing an 18" because the box is big enough for one is exactly what this repository
# does not do.

audio:
  # Front-baffle layout in the upright baffle frame: origin at the centre of the 0.570 x 1.100 front face, +X
  # right, +Z up. READ OFF meshes/innschleife/photo-2026-09-19.jpeg on 2026-10-01, where these lie on their side in
  # the bottom row, at about 700 px/m and turned back upright with the photo's left end at the top. Which
  # end is up is not readable from the photo, and a scene's roll decides it anyway.
  #
  # The front is one open recess behind a 20 mm frame, split by two blue boards running across it. The section
  # between them holds one upright board and the lower end section another. How deep it all goes is not
  # readable, so 0.40 is ESTIMATED like every size here. The photo also shows a black board across the middle,
  # which the owner stated on 2026-10-01 is not there, the middle section holding only the upright one.
  #
  # ONLY THE BLUE BOARDS REACH THE FRONT, as the owner stated on 2026-10-01. The blue boards are 0.20 deep, half of
  # what they were first, as the owner asked on 2026-10-01. Both upright boards start where the blue ones end,
  # 0.201 back at their tilted corners, so they touch without passing through them, in one line and at one depth. That is the folded
  # horn's path turning rather than a port. The cabinet has no port. The 0.20
  # is ESTIMATED. The blue boards are angled like the SBH's white ones, at the same -20° and -13°, as the owner
  # stated on 2026-10-01. Each upright runs the whole way between the back edges of
  # the blue boards around it, as the owner asked on 2026-10-01. Both uprights stand on the centreline, where the photo
  # shows them in the WSX on either side of the wall. Off it, a copy rolled the other way put them 100 mm apart.
  #
  # THE HORN FLARES IN THE SECTION ABOVE THE UPPER BLUE BOARD, as the owner stated on 2026-10-01. Its back wall
  # leaves the front 20 mm inside the frame and slopes back at 18° to 0.236 m, 0.666 m down, which is past the
  # upper blue board and two thirds of the way down the middle section. The owner asked on 2026-10-01 for twice the
  # length it had ending at the board. So the upper blue board is 0.14 deep, which stops it in front of the wall,
  # and the middle upright only fills the part of that section below the wall's end. It was 49° at first,
  # then 60° and 30°, and the owner stated on 2026-10-01 that the wall runs flatter still, at 15° to 20°. 18° is
  # the middle of that. It overlaps the rest of the mouth by 16 mm so the two cuts
  # share no face. Which section flares is read off the photo, where that one is empty and dark while the
  # others hold boards and shelves, so it is ESTIMATED like its angle.
  #
  # The colours are white-balanced against the SBH's white fins in the same photo, which is the only white in
  # it, so every colour here carries that one assumption.
  layout:
    provenance: estimated
    inset_m: 0.0
    features:
      - { id: flare, kind: cell, at_m: [ 0.0,  0.197 ], mouth_m: [ 0.53, 0.666 ], depth_m: 0.1282, angle_deg: -18, turn: pitch }
      - { id: mouth, kind: cell, at_m: [ 0.0, -0.325 ], mouth_m: [ 0.53, 0.41 ], depth_m: 0.40 }
      - { id: divider-up,  kind: fin, at_m: [ 0.0,  0.207 ], mouth_m: [ 0.53, 0.025 ], depth_m: 0.14, angle_deg: -20, color: "#0b1f52" }
      - { id: divider-lo,  kind: fin, at_m: [ 0.0, -0.210 ], mouth_m: [ 0.53, 0.025 ], depth_m: 0.20, angle_deg: -13, color: "#0b1f52" }
      - { id: shelf-mid, kind: fin, at_m: [ 0.0, -0.1815 ], mouth_m: [ 0.02, 0.123 ], depth_m: 0.199, setback_m: 0.201 }
      - { id: shelf-lo,  kind: fin, at_m: [ 0.0, -0.3935 ], mouth_m: [ 0.02, 0.253 ], depth_m: 0.199, setback_m: 0.201 }

mesh_override: null

notes: |
  RENAMED ON 2026-09-02, AND THE PRICE WAS WHAT THIS PARAGRAPH SAID IT WOULD BE. It used to read "rename this
  spec as soon as somebody names the cabinet", and priced that at a file move, an id change and a sweep
  regeneration. All three were paid, in one pass with the other four Innschleife cabinets and with every other
  borrowed system's ids. Writing the spec before the name was known was the right call: a spec that exists can be
  rendered and argued with, which is how the counts and the names arrived at all.

  The photograph shows a wide curved horn mouth across the upper third with four rectangular cells below it,
  which is the front of a folded horn rather than of a direct-radiating box. That is consistent with the
  1.100 m height and with standing in the bottom row, and it is not evidence of anything else.

  Drawn as one image in both drawings, so this is one cabinet type rather than two similar ones.
