# Dimensions derived from the panel geometry in the FreeCAD model in Drive
# (Achenbach 18.FCStd): 600x700x18 top/bottom, 18x700x564 sides, so height = 564 + 2x18.
# See docs/sources.md.
id: achenbach-18
name: "Achenbach 18"
category: speaker
subtype: sub
quantity: 4
owner: sepp
build: self-built

clone_of:
  manufacturer: Achenbach
  model: "18"
  reference: cad
  url: null

provenance:
  # Dimensions derived from the FreeCAD panel model; the weight is a calculation, not a source.
  dimensions: plans
  weight: estimated

geometry:
  shape: box
  dimensions_m: { width: 0.600, height: 0.600, depth: 0.700 }
  origin: bottom-center
  chamfer_m: 0.012

appearance:
  # Birch plywood with a weatherproof black textured finish.
  color: "#141414"

physical:
  # ESTIMATE, calculated not guessed: ~2.4 m2 of 18 mm plywood at ~680 kg/m3 = 29.4 kg, plus ~8 kg
  # of internal horn panels (the FreeCAD model has a 564x564 divider and several 268 mm pieces),
  # plus ~12 kg for the B&C 18TBW100, plus ~2 kg hardware. Not weighed and in no spreadsheet —
  # see docs/measuring.md.
  weight_kg: 50.0
  handles: [ left, right ]

rigging:
  flyable: false
  points: [ ]

audio:
  drivers:
    - { size_in: 18, type: woofer, count: 1 }

  layout:
    # Measured out of the FreeCAD model's own mesh, not estimated: the baffle carrying the driver cut-out
    # is the front-most panel of the cabinet, so inset_m is 0, and the cut-out is DIA 416 mm (16.38"),
    # centred on the 600 x 600 baffle. 416 mm is the driver's cut-out, not its nominal 18" (457 mm) frame
    # diameter — the frame sits behind the panel and only the cone shows through, so the cut-out is what
    # is visible. Same reasoning as the 18sound's 353 mm.
    provenance: plans
    inset_m: 0.0
    features:
      - { id: woofer, kind: cone, at_m: [ 0.0, 0.0 ], diameter_in: 16.38, depth_m: 0.11 }

mesh_override:
  # Converted from the FreeCAD model with `ddev mesh-convert`; its 600 x 700 x 600 mm matches this
  # spec exactly, which is a third confirmation of the dimensions after the panel geometry and
  # lsv-achenbach.de's own published panel sizes.
  path: meshes/achenbach-18.stl
  units: mm
  rotate_deg: [ 0, 0, 0 ]

notes: |
  Driver: B&C 18TBW100 (18", 1000 W, 8 Ohm, 35 - 1000 Hz), one per cabinet.
  Hardware Overview lists 35 - 1000 Hz and 1000 W continuous.
  weight_kg is an estimate; the dimensions are derived from the FreeCAD panel model, so they are
  solid but describe the design rather than the built cabinets.
  A FreeCAD model exists in Drive and could replace the generated block once mesh_override works.
