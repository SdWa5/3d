# the box pro TP 118/800, PSL's single-18 touring sub. Their small-package low end, in two of the three
# The Box Pro bundles.
#
# Figures from PSL's own published technical data, https://pro-sound-light.de/equipment/tontechnik/ — see
# concert-audio-ef6.yaml for why that counts as a datasheet here.
#
# "OHNE ROLLEN" AGAIN, AND IT MATTERS MORE ON A SUB THAN ON A TOP. The published 55 x 61.8 x 68 cm excludes the
# castor set, which the catalogue says is included in the delivery. A sub on its wheels is the one that ends up
# at the bottom of a stack, so the height this spec reports is the cabinet's and not the stack's. On the
# request list with the ESX's wheels.
id: thebox-tp118-800
name: "the box pro TP 118/800"
category: speaker
subtype: sub
quantity: 2
owner: psl
build: original

provenance: datasheet

geometry:
  shape: box
  dimensions_m: { width: 0.550, height: 0.618, depth: 0.680 }
  origin: bottom-center
  chamfer_m: 0.010

appearance:
  # "Finish: schwarzer Strukturlack".
  color: "#141414"

physical:
  weight_kg: 37.0
  handles: [ left, right ]

rigging:
  flyable: false
  points: [ ]

audio:
  passband_hz:
    low_hz: 35
    high_hz: 150
    provenance: datasheet
  # The box's own rating, 600 W RMS.
  power_w:
    rms: 600
    provenance: datasheet
  drivers:
    - { size_in: 18, type: woofer, count: 1 }

mesh_override: null

notes: |
  Passive bass-reflex sub, 1x 18" for touring use. Power 600 W RMS / 2400 W peak. Impedance 8 Ohm. Sensitivity
  96 dB at 1 W / 1 m, 129 dB peak. Frequency range 35 - 150 Hz at -3 dB, which is a tighter tolerance than the
  -6 dB figures the Concert Audio cabinets are quoted at, so the two are not directly comparable. Two NL4 in
  and two NL4 through, two M20 flange adapters on top. Castor set included.

  Quantity 2 is a package floor: "The Box Pro Bundle 1" states two of these and "Bundle 3" states two of these
  plus two TP218. See docs/requests.md.
