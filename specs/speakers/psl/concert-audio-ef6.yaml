# Concert Audio EF 6, the fullrange top of the EVOLUTION series and PSL's main top.
#
# PSL is Pro Sound & Light (Paunzhausen), a rental company rather than a self-build crew, so unlike GMSS every
# figure here is published by the people who own the cabinets: https://pro-sound-light.de/equipment/tontechnik/
# lists the full technical data for their whole speaker inventory. That is a datasheet in the sense this
# repository means it — the owner's own published spec for a catalogue product — so `provenance: datasheet`.
#
# THE CABINET IS A TRAPEZOID AND THE SOURCE SAYS SO OUTRIGHT: "780 x 588 / 224 x 720 mm (H x B x T)". The two
# widths are the front and the back face, which is what `back_width_m` is for. 588 across the front narrowing to
# 224 across the back over 720 mm of depth is a 14 degree taper per side, which is what makes the array the
# datasheet talks about possible at all.
#
# BLACK WITH A WHITE FRONT, as the owner stated on 2026-10-01. The catalogue describes the finish as black, and
# the "Evolution Mod System" and "Hornsystem Mod" packages are described as "in weiss ein echter Hingucker". The
# setup drawing's cabinet images and PSL's photo show the fronts, which are white, so this file carried an
# all-white cabinet until the owner corrected it. The front colour is the one field in this file that does not
# come from the technical data.
#
# QUANTITY 4 IS THE PACKAGE FIGURE, CONFIRMED BY THE DRAWING. "Hornsystem Mod" is stated as four horn tops plus
# six hybrid-horn subs, and PSL_SdWa5_Kraut_V7 places exactly four of these. Two independent statements of the
# same number, which is better than either alone — but neither is an inventory, so it is a floor rather than a
# count. See docs/requests.md.
id: concert-audio-ef6
name: "Concert Audio EF 6"
category: speaker
subtype: top
quantity: 4
owner: psl
build: original

provenance: datasheet

geometry:
  # Tapered cabinet: 588 mm across the front, 224 mm across the back.
  shape: trapezoid
  dimensions_m: { width: 0.588, height: 0.780, depth: 0.720 }
  back_width_m: 0.224
  origin: bottom-center
  chamfer_m: 0.010

appearance:
  # Black with a white front. See the header. No PSL black was sampled.
  # The body is #0a0a0a, a shade under the #141414 every cone in this library is drawn in, so the cones read a bit
  # lighter than the cabinet, as the owner asked on 2026-10-01. The body went darker rather than the cone lighter.
  color: "#0a0a0a"
  front_color: "#f2f2f0"

physical:
  weight_kg: 65.0
  # "vier grosse Metallgriffe und acht Griffschalen" — four handles and eight recessed grips, whose faces the
  # source does not name, so only the side pair is modelled.
  handles: [ left, right ]

rigging:
  # The catalogue states an "integriertes EVOLUTION Flugsystem mit Verbinderelementen", so this cabinet does fly.
  # WHERE ITS POINTS ARE IS PUBLISHED NOWHERE, and the validator rightly refuses `flyable: true` with no points,
  # since a fly point nobody can place is worse than no fly point at all. Left false until PSL states the
  # positions; it is on the request list.
  flyable: false
  points: [ ]

audio:
  coverage_deg: { horizontal: 55, vertical: 40 }
  passband_hz:
    # "Frequenzbereich: 70 - 17.000 Hz +/- 3 dB ueber Systemcontroller" — the controller is part of the system
    # rather than an extension of it, so this is the cabinet's stated range.
    low_hz: 70
    high_hz: 17000
    provenance: datasheet
  drivers:
    - { size_in: 12, type: woofer, count: 2 }
    - { size_in: 1.5, type: compression-driver, count: 1 }

  # Front-baffle layout. Origin at the centre of the 0.588 x 0.780 front face, +X right, +Z up. READ OFF
  # meshes/psl/photo-2026-10-01.jpeg on 2026-10-01, where four of these stand in two mirrored pairs on the
  # ESX, at about 630 px/m across. Every size is a reading off one photo taken at an angle, so the layout is
  # `estimated`.
  #
  # ONE CONNECTED HORN FRONT, as the owner stated on 2026-10-01, built like the Tecnare M2122's. The two 12"
  # fire into two horns that share one mouth across the whole face, with a black plug in each throat and a
  # green waveguide in front of it. So the LF pair is joined to 0.15 m.
  # A horn's throat sits on its mouth's axis, so the LF throats are drawn at the centre of their mouths,
  # about 0.07 m nearer the middle than the photo has the plugs, and the whole front at x -0.02 rather than
  # the photo's -0.05. Mouths, throats, depths and the join depth are ESTIMATED. This is the right-hand
  # cabinet of a pair, and a scene's mirror makes the other one. The colours are white-balanced against the
  # body's own white, giving #749375 for the waveguides and #2a1812 for the plugs.
  #
  # EACH WAVEGUIDE HOLDS A PHASE PLUG between it and the driver, as the owner stated on 2026-10-01. The plug stands
  # 0.10 m forward from the 0.30 m deep throat, so its tip ends 0.20 m back and stays behind the waveguide, which
  # runs from 0.12 to 0.18 m. Its 6" base sits inside the 8" throat. Both sizes are ESTIMATED.
  #
  # THE HF SECTION HAS NO RECESS OF ITS OWN, as the owner stated on 2026-10-01. It is the band of the shared horn
  # between two horizontal white shelves, so its sides are the LF horns' sides and the 1.5" driver sits as deep as
  # the 12" pair. `hf` carves that band with the LF horns' own width law (0.53 m mouth, 8" throat, exponential over
  # 0.30 m), so its side walls run on from theirs. The shelves are 0.02 m plates like the waveguides but deeper,
  # 0.15 m from 0.15 m back to the driver. Their front edge spans the 0.33 m the horn is wide there, and their back
  # runs into the side walls. The driver's exit is a dark 1.5" disc on the flat back wall, drawn as a flat plug.
  # The photo puts the shelves at about z +0.13 and -0.11 m, so the band is centred at +0.01 m. The exit reads at
  # +0.03 m, which is within the reading error, so it stays on the band's axis. Every size is ESTIMATED.
  layout:
    provenance: estimated
    inset_m: 0.0
    features:
      - { id: lf-up, kind: horn, at_m: [ -0.02,  0.195 ], mouth_m: [ 0.53, 0.36 ], throat_in: 8.0, driver_in: 12, depth_m: 0.30,
          profile: pyramid, sides: 4, throat_profile: elliptical, flare: exponential, color: "#2a1812" }
      - { id: lf-lo, kind: horn, at_m: [ -0.02, -0.185 ], mouth_m: [ 0.53, 0.36 ], throat_in: 8.0, driver_in: 12, depth_m: 0.30,
          profile: pyramid, sides: 4, throat_profile: elliptical, flare: exponential, color: "#2a1812",
          join: { with: lf-up, depth_m: 0.15 } }
      - { id: hf, kind: horn, at_m: [ -0.02, 0.01 ], mouth_m: [ 0.53, 0.24 ], throat_in: 8.0, depth_m: 0.30,
          profile: pyramid, sides: 4, flare: exponential }
      - { id: shelf-up, kind: fin, at_m: [ -0.02,  0.13 ], mouth_m: [ 0.33, 0.02 ], depth_m: 0.15, setback_m: 0.15, color: "#f2f2f0" }
      - { id: shelf-lo, kind: fin, at_m: [ -0.02, -0.11 ], mouth_m: [ 0.33, 0.02 ], depth_m: 0.15, setback_m: 0.15, color: "#f2f2f0" }
      - { id: hf-exit, kind: plug, inside: hf, diameter_in: 1.5, depth_m: 0.002, color: "#1a1210" }
      - { id: guide-up, kind: fin, at_m: [ -0.02,  0.195 ], mouth_m: [ 0.27, 0.02 ], depth_m: 0.06, setback_m: 0.12, color: "#749375" }
      - { id: guide-lo, kind: fin, at_m: [ -0.02, -0.185 ], mouth_m: [ 0.27, 0.02 ], depth_m: 0.06, setback_m: 0.12, color: "#749375" }
      - { id: plug-up, kind: plug, inside: lf-up, diameter_in: 6, depth_m: 0.10, color: "#2a1812" }
      - { id: plug-lo, kind: plug, inside: lf-lo, diameter_in: 6, depth_m: 0.10, color: "#2a1812" }

mesh_override: null

notes: |
  2-way active fullrange top, switchable to passive as the EF6p (66 kg in that version). GFK fullrange coaxial
  horn across the whole cabinet front, constant directivity. 12" voice coils 76 mm, 1.5" compression driver
  75 mm. Impedance 8 Ohm low-mid and 8 Ohm mid-high, 8 Ohm fullrange passive. Power 1000 W programme /
  2000 W peak low-mid and 160 W / 640 W mid-high. Sensitivity 109 dB low-mid and 112 dB mid-high at 1 W / 1 m,
  146 dB peak at 1 m at 1200 Hz. Connectors 2x Speakon NL-4.

  Coverage is stated as 55 x 40 degrees at -6 dB between 600 and 10000 Hz, which is a narrower band than the
  passband and is the figure the array design rests on.

  The baffle layout is read off PSL's own photo. Neither the coaxial horn's mouth size nor its flare law is
  published, so the outer flare is left out rather than invented.
