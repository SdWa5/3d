# the box pro DSP 112, PSL's active fullrange top. The only powered cabinet in this repository.
#
# Figures from PSL's own published technical data, https://pro-sound-light.de/equipment/tontechnik/ — see
# concert-audio-ef6.yaml for why that counts as a datasheet here.
#
# AN ACTIVE CABINET IS A CABINET AS FAR AS THIS SCHEMA GOES, and that is a limitation worth naming rather than
# hiding. Its amplifier, its DSP presets and the fact that it needs mains rather than an amp rack are all
# invisible here: `physical.weight_kg` carries the amplifier's weight because it is inside the box, and
# nothing records that this one wants a power drop where the others want speaker cable. If a second active
# cabinet ever arrives, that is the point at which a field earns its place.
#
# QUANTITY 1 IS A FLOOR, NOT A COUNT. Same as the Achat 115 M — no package, no drawing, no statement. See
# docs/requests.md.
id: thebox-dsp-112
name: "the box pro DSP 112"
category: speaker
subtype: top
quantity: 1
owner: psl
build: original

provenance: datasheet

geometry:
  shape: box
  dimensions_m: { width: 0.348, height: 0.607, depth: 0.355 }
  origin: bottom-center
  chamfer_m: 0.010

appearance:
  color: "#141414"

physical:
  # Includes the class-D amplifier and DSP, which are inside the cabinet.
  weight_kg: 14.6
  handles: [ left, right ]

rigging:
  flyable: false
  points: [ ]

audio:
  coverage_deg: { horizontal: 90, vertical: 60 }
  # NO PASSBAND. The catalogue gives a max level and a coverage pattern for this one but prints no frequency
  # range at all, and an active cabinet's response is a property of its DSP preset rather than of its box.
  # Nothing to record, so the block is absent — see SPEC-6 in TODO.md for the general shape of this problem.
  drivers:
    - { size_in: 12, type: woofer, count: 1 }
    - { size_in: 1, type: compression-driver, count: 1 }

mesh_override: null

notes: |
  Active 2-way fullrange top. 300 W RMS / 1200 W peak class-D. 12" woofer and a 1" compression driver with a
  1.4" voice coil. Built-in DSP with four presets and a low cut. Two XLR/jack combo inputs, one XLR output.
  Max level 134 dB. 90 x 60 degrees.
