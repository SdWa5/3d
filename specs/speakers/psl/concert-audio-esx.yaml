# Concert Audio ESX, the hybrid-expo horn subwoofer under PSL's EF 6 tops. Their biggest cabinet and the one
# the joint stack is built around.
#
# Figures from PSL's own published technical data, https://pro-sound-light.de/equipment/tontechnik/ — see
# concert-audio-ef6.yaml for why that counts as a datasheet here.
#
# THE SETUP DRAWING HAS IT ON ITS SIDE AND THE DATASHEET HAS IT UPRIGHT, WHICH IS WORTH STATING BECAUSE THE TWO
# LOOK LIKE A CONTRADICTION. The drawing's cabinet image is 118 cm wide by 59 high with the two 18" side by
# side; the datasheet says "1180 x 590 x 915 mm (H x B x T o. Rollen)", so the cabinet is 590 across and 1180
# tall with the drivers stacked vertically. Both are the same box, rolled 90 degrees — which is exactly what
# this repository's `--orientation=turned` does, and it is how PSL stacks them: "ca. 180 Grad horizontal bei
# vier hochkant auf dem Boden nebeneinander gestellten Systemen" describes them upright, the drawing shows six
# rolled. The upright figures are what the spec carries and the orientation axis produces the other case.
#
# THE DEPTH EXCLUDES THE CASTORS AND THE HEIGHT DOES NOT INCLUDE THEM EITHER. "o. Rollen" is stated for the
# whole triple, and there are four 100 mm castors, so a cabinet standing on its wheels is about 100 mm taller
# than this spec says. Which axis the wheels are on depends on which way up it is, so nothing here can be
# corrected for it — the spec models the cabinet and the wheels are on the request list.
id: concert-audio-esx
name: "Concert Audio ESX"
category: speaker
subtype: sub
quantity: 6
owner: psl
build: original

provenance: datasheet

geometry:
  shape: box
  dimensions_m: { width: 0.590, height: 1.180, depth: 0.915 }
  origin: bottom-center
  chamfer_m: 0.010

appearance:
  # Black with a white front, as the owner stated on 2026-10-01, like the EF 6 above it. The catalogue's own
  # finish is "mattschwarze Strukturlackierung", and the front is PSL's own. See concert-audio-ef6.yaml.
  color: "#141414"
  front_color: "#f2f2f0"

physical:
  weight_kg: 94.0
  # "zehn grosse Metallgriffe" — ten of them, faces unstated.
  handles: [ left, right ]

rigging:
  flyable: false
  points: [ ]

audio:
  # NO COVERAGE FIGURE, DELIBERATELY. The published "ca. 180 Grad horizontal (-6 dB)" is measured with four
  # cabinets side by side, so it describes an array of four rather than this cabinet. `coverage_deg` is a
  # property of one box and there is no honest number to put in it.
  passband_hz:
    # "38 - 220 Hz, -6 dB ohne Controller / 33 Hz, -6 dB mit Systemcontroller". The controller ships with the
    # system, so 33 Hz is the reach and 38 is what it does unassisted.
    low_hz: 33
    high_hz: 220
    driven_from_hz: 38
    provenance: datasheet
  drivers:
    - { size_in: 18, type: woofer, count: 2 }

  # Front-baffle layout in the upright baffle frame: origin at the centre of the 0.590 x 1.180 front face, +X
  # right, +Z up. READ OFF meshes/psl/photo-2026-10-01.jpeg on 2026-10-01, where twelve of these lie on their
  # side, at about 655 px/m and turned back upright. Every size is a reading off one photo taken at an angle,
  # so the layout is `estimated`.
  #
  # EACH CONE HAS A ROUND GRILLE, as the owner stated on 2026-10-01. The datasheet's "2 mm plastic-coated
  # mesh" agrees, and the photo is too small and too far off to show it. The grilles are the cones' own 17"
  # across and stand 12 mm off the sloping wall. Each is a dark grey sheet pressed 20 mm forward in the middle
  # inside a 15 mm black rim, as the owner chose on 2026-10-01, because black mesh over a black cone vanished at
  # scene distance. Both the grey and the rim are ESTIMATED. Between the cones runs a slot the full width. A green cross of two bars braces the slot
  # at its back end, where the port is, as the owner stated on 2026-10-01. The upright bar is drawn 2 mm
  # smaller than the cross bar, so that where they cross no two faces share a plane and flicker.
  #
  # The colours are white-balanced against the body's own white. The cones sampled #4a4640, which the
  # owner judged far too bright on 2026-10-01, so they went to #1e1c1a and then, asked for once more, to
  # #0e0d0c. The green is the one sampled off the EF 6 slats in the same photo, because the ESX bars are
  # 3 px wide and mixed with the white around them.
  #
  # EACH DRIVER SITS ON A WALL SLOPING 45° BACK TOWARDS THE SLOT, as the owner stated on 2026-10-01. Driver
  # and wall form a short horn that leads in towards the slot, and the slot runs on to the back as the port.
  # Each horn is a cell whose back wall starts at the front face 20 mm inside the cabinet's outer end and
  # reaches 0.445 m deep at the slot edge, where it overlaps the slot by 10 mm so that the two cuts share no
  # face. The slot is drawn 0.45 m deep so that it is deeper than the horns it continues. The photo agrees:
  # the cones read about 0.84 times as tall as they are wide in the upright frame, which an angled view of a
  # 45° wall gives. The angle is the owner's, and the slot depth is ESTIMATED.
  layout:
    provenance: estimated
    inset_m: 0.0
    features:
      - { id: horn-up, kind: cell, at_m: [ 0.0,  0.3475 ], mouth_m: [ 0.54, 0.445 ], depth_m: 0.2225, angle_deg: -45, turn: pitch }
      - { id: horn-lo, kind: cell, at_m: [ 0.0, -0.3475 ], mouth_m: [ 0.54, 0.445 ], depth_m: 0.2225, angle_deg:  45, turn: pitch }
      - { id: lf-up, kind: cone, inside: horn-up, diameter_in: 17, depth_m: 0.12, color: "#2a2724" }
      - { id: lf-lo, kind: cone, inside: horn-lo, diameter_in: 17, depth_m: 0.12, color: "#2a2724" }
      - { id: grille-up, kind: grille, inside: horn-up, diameter_in: 17, depth_m: 0.002, dome_m: 0.02, rim_m: 0.015, color: "#3a3a3a", rim_color: "#141414" }
      - { id: grille-lo, kind: grille, inside: horn-lo, diameter_in: 17, depth_m: 0.002, dome_m: 0.02, rim_m: 0.015, color: "#3a3a3a", rim_color: "#141414" }
      - { id: slot,  kind: cell, at_m: [ 0.0,  0.0 ],   mouth_m: [ 0.54, 0.27 ], depth_m: 0.45 }
      - { id: bar-h, kind: fin, at_m: [ 0.0, 0.0 ], mouth_m: [ 0.54, 0.02 ], depth_m: 0.02, setback_m: 0.42, color: "#749375" }
      - { id: bar-v, kind: fin, at_m: [ 0.0, 0.0 ], mouth_m: [ 0.018, 0.27 ], depth_m: 0.018, setback_m: 0.421, color: "#749375" }

mesh_override: null

notes: |
  Hybrid-expo bass-reflex enclosure, 18 mm birch plywood, developed as the high-power sub extension to the
  EVOLUTION EF-6 fullrange system. 2x 18" with 100 mm voice coils and passive cooling. Power 2800 W programme /
  14000 W peak. Resonance 39 Hz. Impedance 2x 8 Ohm nominal. Sensitivity 99 dB at 1 W / 1 m from 40 Hz,
  102 dB at 45 Hz, 138 dB peak at 1 m from 40 Hz. Connectors 2x Speakon NL-4, pins 1 and 2. Grille is 2 mm
  plastic-coated mesh at 70 % transmission over black acoustic foam. Four 100 mm castors.

  The lowest-reaching cabinet in the whole library at 33 Hz, ahead of our own SKRAM at 15 Hz nominal but
  driven from 38. That matters beyond bragging: `Passband::orderingLowHz()` decides which cabinet goes at the
  bottom of a stack, so in a joint rig this box outranks PSL's own ESF and sits under it.

  The baffle layout is read off PSL's own photo, with the grilles the datasheet and the owner describe. The horn path
  behind the slot is internal and is not modelled.
