# Concert Audio ESX, the hybrid-expo horn subwoofer under PSL's EF 6 tops. Their biggest cabinet and the one
# the joint stack is built around.
#
# Figures from PSL's own published technical data, https://pro-sound-light.de/equipment/tontechnik/ — see
# concert-audio-ef6.yaml for why that counts as a datasheet here.
#
# THE SETUP DRAWING HAS IT ON ITS SIDE AND THE DATASHEET HAS IT UPRIGHT, WHICH IS WORTH STATING BECAUSE THE TWO
# LOOK LIKE A CONTRADICTION. The drawing's cabinet image is 118 cm wide by 59 high with the two 18" side by
# side; the datasheet says "1180 x 590 x 915 mm (H x B x T o. Rollen)", so the cabinet is 590 across and 1180
# tall with the drivers stacked vertically. Both are the same box, rolled 90 degrees — which is exactly what
# this repository's `--orientation=turned` does, and it is how PSL stacks them: "ca. 180 Grad horizontal bei
# vier hochkant auf dem Boden nebeneinander gestellten Systemen" describes them upright, the drawing shows six
# rolled. The upright figures are what the spec carries and the orientation axis produces the other case.
#
# THE DEPTH EXCLUDES THE CASTORS AND THE HEIGHT DOES NOT INCLUDE THEM EITHER. "o. Rollen" is stated for the
# whole triple, and there are four 100 mm castors, so a cabinet standing on its wheels is about 100 mm taller
# than this spec says. Which axis the wheels are on depends on which way up it is, so nothing here can be
# corrected for it — the spec models the cabinet and the wheels are on the request list.
id: concert-audio-esx
name: "Concert Audio ESX"
category: speaker
subtype: sub
quantity: 6
owner: psl
build: original

provenance: datasheet

geometry:
  shape: box
  dimensions_m: { width: 0.590, height: 1.180, depth: 0.915 }
  origin: bottom-center
  chamfer_m: 0.010

appearance:
  # White, like the rest of PSL's Evolution gear. The catalogue's own finish is "mattschwarze
  # Strukturlackierung"; see concert-audio-ef6.yaml.
  color: "#f2f2f0"

physical:
  weight_kg: 94.0
  # "zehn grosse Metallgriffe" — ten of them, faces unstated.
  handles: [ left, right ]

rigging:
  flyable: false
  points: [ ]

audio:
  # NO COVERAGE FIGURE, DELIBERATELY. The published "ca. 180 Grad horizontal (-6 dB)" is measured with four
  # cabinets side by side, so it describes an array of four rather than this cabinet. `coverage_deg` is a
  # property of one box and there is no honest number to put in it.
  passband_hz:
    # "38 - 220 Hz, -6 dB ohne Controller / 33 Hz, -6 dB mit Systemcontroller". The controller ships with the
    # system, so 33 Hz is the reach and 38 is what it does unassisted.
    low_hz: 33
    high_hz: 220
    driven_from_hz: 38
    provenance: datasheet
  drivers:
    - { size_in: 18, type: woofer, count: 2 }

mesh_override: null

notes: |
  Hybrid-expo bass-reflex enclosure, 18 mm birch plywood, developed as the high-power sub extension to the
  EVOLUTION EF-6 fullrange system. 2x 18" with 100 mm voice coils and passive cooling. Power 2800 W programme /
  14000 W peak. Resonance 39 Hz. Impedance 2x 8 Ohm nominal. Sensitivity 99 dB at 1 W / 1 m from 40 Hz,
  102 dB at 45 Hz, 138 dB peak at 1 m from 40 Hz. Connectors 2x Speakon NL-4, pins 1 and 2. Grille is 2 mm
  plastic-coated mesh at 70 % transmission over black acoustic foam. Four 100 mm castors.

  The lowest-reaching cabinet in the whole library at 33 Hz, ahead of our own SKRAM at 15 Hz nominal but
  driven from 38. That matters beyond bragging: `Passband::orderingLowHz()` decides which cabinet goes at the
  bottom of a stack, so in a joint rig this box outranks PSL's own ESF and sits under it.

  No baffle layout. The two drivers are behind a full-face grille and the horn path is internal, so there is
  nothing to model that is not invented.
