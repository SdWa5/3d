# The two factory cabinets. Dimensions and weight from the Tecnare L2122LT datasheet, which shares
# this cabinet's geometry. The third, self-built one is tecnare-m2122-clone. See docs/sources.md.
id: tecnare-m2122
name: "Tecnare M2122"
category: speaker
subtype: top
quantity: 2
owner: sdwa5
build: original

provenance: datasheet
deviations: |
  Re-fitted with different compression drivers than the factory L2122LT: the factory 2" is
  replaced by an RCF ND650 (1.4"). The 2x 12" are Celestion, the 2x 1" are B&C DE25. Power
  handling in the Hardware Overview (1200 W mid + 250 W high) reflects these drivers, not
  Tecnare's original 1000 W + 300 W.

geometry:
  # Tapered cabinet: 500 mm across the front, 345 mm across the back.
  shape: trapezoid
  dimensions_m: { width: 0.500, height: 0.960, depth: 0.520 }
  back_width_m: 0.345
  origin: bottom-center
  chamfer_m: 0.010

appearance:
  # Birch plywood with a weatherproof black textured finish.
  color: "#141414"
  grille:
    inset_m: 0.012
    color: "#0a0a0a"

physical:
  weight_kg: 68.0
  handles: [left, right]

rigging:
  flyable: false
  points: []

audio:
  coverage_deg: { horizontal: 60, vertical: 40 }
  drivers:
    - { size_in: 12, type: woofer, count: 2 }
    - { size_in: 1.4, type: compression-driver, count: 1 }
    - { size_in: 1, type: compression-driver, count: 2 }

mesh_override: null

notes: |
  3-way mid-high top (two active sections plus one passive). 150 Hz - 20 kHz +/-4 dB.
  Impedance: mid 4 Ohm, high 8 Ohm. Crossover: active 185 Hz / 2.5 kHz, passive 6.5 kHz.
  Three of these tops exist in total: these two are genuine Tecnare cabinets, the third is
  self-built and lives in tecnare-m2122-clone.yaml. Hardware Overview.xlsx lists "2", which counts
  only the factory pair.
