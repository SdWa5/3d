# GMSS "nuke" — the two plain-faced cabinets on the ground at the foot of each outer column in GMSS.jpeg.
#
# EVERY NUMBER IN THIS FILE COMES FROM THE OWNER OF GMSS. What he stated, in centimetres and in his own order
# (w, d, h):
#
#     2 nukes: 59w, 70d, 77h, 58kg each
#
# THIS CABINET IS NEW TO THE REPOSITORY AND IT IS NOT A NEW CABINET. It was always in the photo and it was
# always modelled — as the wrong thing. Two readings of it were tried before the owner was asked:
#
#   - `gmss-turbo-sub` had quantity 8 and counted these two among them ("the low box at the foot of each column
#     that reads as a plinth carries the same recessed oval logo as the cabinets above it, so it is one of them
#     rather than a riser"). Half right: they are turbo subs in GMSS's sense, but they are not the same box as
#     the six above them.
#   - `mid-bass` had quantity 2 and docs/sources.md described it as "the short wide box at the foot of each
#     column ... the turbo subs stand on it", which is these. That was wrong outright: the mid bass is the single
#     wide horn in the middle of the stack, one cabinet and not two — see `mid-bass.yaml`.
#
# WHAT SETTLED IT was asking whether the outer bottom-row boxes were the "USB 2x" mid bass. The answer was
# "That's the mid bass (usb) [pointing at the horn in the middle] and the ones on the outside of the bottom row
# are also turbo subs", and the itemised list that came with it — 2 nukes + 6 IQ subs — accounts for the eight
# turbo subs exactly. Two cabinet types, and the photo separates them cleanly: the six above carry a perforated
# grille across the front and a small blue illuminated logo, these two have no grille at all, just a plain face
# with a recessed oval. See `iq-sub.yaml` for the six and for why the old shared "set scale" is gone.
#
# IT STANDS UPRIGHT, WHICH IS WORTH CHECKING RATHER THAN ASSUMING, because the old specs read this box as a low
# plinth and a 0.77 m cabinet is not that. Stated 0.59 wide by 0.77 tall is 1.30:1 tall to wide. Measured off the
# front-left of the photograph — the one part of the frame seen nearly front-on, where a cabinet's proportions
# survive — its face reads about 1.15:1. Standing on its 0.59 x 0.70 footprint is what fits; laid down with the
# 0.77 m axis horizontal it would read about 0.77:1, which the photo clearly is not. It reads like a plinth because
# its face is plain where everything above it is grille, and because it stands 140 mm deeper than the IQ subs so
# the column sits back from its front edge — not because it is low.
#
# WHY `provenance: estimated` FOR STATED FIGURES: see `iq-sub.yaml`. Short version — the enum has
# datasheet / plans / measured / estimated and no case for "the builder told us", there is no datasheet for a
# self-built rig, and `measured` would claim we put a tape on it.
#
# NO `audio` BLOCK. No driver size, no count and no passband was ever stated for this cabinet, and the "8 turbo
# subs 3000rms" rating covers a mixed group of two cabinet types — see the notes.
id: nuke
name: "GMSS Nuke"
category: speaker
subtype: sub
quantity: 2
owner: gmss
build: own-design

provenance: estimated

geometry:
  # Block-level outer box. The face in the photo is plain, so unlike the horns in this set there is nothing
  # visible that a block fails to describe.
  shape: box
  dimensions_m: { width: 0.590, height: 0.770, depth: 0.700 }
  origin: bottom-center
  chamfer_m: 0.012

appearance:
  # Black textured finish, as every cabinet in the photo has.
  color: "#141414"

physical:
  # Stated by the owner: 58 kg each. Heavier and bigger than the IQ sub above it (40 kg, 0.53 x 0.67 x 0.56),
  # which is the ordinary way round for the box at the bottom of a column.
  weight_kg: 58.0
  handles: [ left, right ]

rigging:
  # On the ground in the photo, carrying three IQ subs. No fly points are visible or stated.
  flyable: false
  points: [ ]

notes: |
  Stated by the owner of GMSS, answering questions about GMSS.jpeg: "2 nukes: 59w, 70d, 77h, 58kg each".
  Centimetres, width / depth / height. That is the source for every number in this spec.

  "Nuke" is his word, kept verbatim. Whether it names a design he copied or is his own name for the box is not
  known, so `build: own-design` and no `clone_of` — the same treatment every GMSS cabinet gets.

  WHAT IT IS FOR IS NOT STATED. GMSS groups it with the IQ subs as a "turbo sub", so it is low end, and it is the
  bigger of the two boxes — but no driver, passband or crossover was ever given, and the earlier "8 turbo subs
  3000rms" rating covers this cabinet and the IQ sub together, so it cannot be split between them.

  NOT MEASURED BY US, AND NOT FROM A DATASHEET. The builder's own figures for his own box; still a message
  rather than a measurement, so `estimated`.
