# GMSS "turbo top" — the tall curved-grille cabinets across the top of the stack in GMSS.jpeg.
#
# EVERY NUMBER IN THIS FILE COMES FROM THE OWNER OF GMSS. What he stated, in centimetres and in his own order
# (w, d, h):
#
#     Tops: 45w, 38d, 71h, 26kg each
#
# THE ONE GMSS CABINET THAT HAD AN OUTSIDE SANITY CHECK IS THE ONE THE STATED FIGURES CONTRADICT HARDEST, and
# that is the most useful thing in this file. The old estimate reasoned from the Turbosound TMS-4 — a documented,
# tall, horn-loaded three-way, 1143 x 502 x 730 mm and 74.8 kg — on the grounds that "turbo" in a system like this
# points at Turbosound or at cabinets copied from them, and that a published cabinet of the same class beats a
# photograph with no scale in it. The real cabinet is 710 mm tall and 26 kg:
#
#   - height 0.710 against the TMS-4's 1.143 — the class anchor was 61 % too tall
#   - weight 26 kg against 74.8 — nearly three times too heavy
#   - and even the hedged compromise the old file settled on, 0.391 x 0.935 x 0.552 and 56 kg, is 225 mm too tall
#     and more than twice the weight
#
# SO THE CLASS ARGUMENT WAS THE WRONG ARGUMENT, not merely a coarse one. "Turbo" was GMSS's word for its own
# cabinets and never a lineage — the old file was careful to say so and refused a `clone_of` on exactly that
# ground, which was right. What it did anyway was let the TMS-4 set the size. A cabinet of a similar SHAPE is not
# evidence of size, and this is the entry that shows how far that can go: a stated 26 kg box was modelled from a
# published 74.8 kg one. For comparison our own `tecnare-m2122` is 0.50 x 0.96 x 0.52 and 68 kg, so GMSS's top is
# a much smaller and much lighter box than anything the old reasoning reached for.
#
#   - THE PHOTO'S PROPORTIONS DO NOT HOLD UP HERE EITHER, and that is checkable rather than a matter of opinion.
#     Stated 0.45 wide by 0.71 tall is 1.58:1. In the photograph these cabinets read closer to 2.4:1 — but so does
#     the IQ sub next to them, whose stated 0.53 x 0.67 is 1.26:1. Every cabinet in the middle and right of that
#     frame is seen at a steep angle through a phone's wide lens, which compresses apparent width and leaves
#     height alone; the left-hand column, seen nearly front-on, reads about 1.39:1 for the same IQ sub and is
#     within roughly 10 % of the truth. So the old file's "distinctly tall and narrow" was reading obliquity, not
#     the cabinet. What the photo does still show is the convex curved grille across the front.
#   - 26 kg over 0.121 m3 is 214 kg/m3, a little above the IQ sub's 201 and the nuke's 182 — which is what the same
#     construction at a smaller size does, since skin area falls more slowly than volume. Nothing about the weight
#     is out of line; it is simply a small box.
#   - The shared 0.85 "set scale" all four GMSS cabinets used to carry is gone. See `gmss-iq-sub.yaml`.
#
# WHY `provenance: estimated` FOR STATED FIGURES: see `gmss-iq-sub.yaml`. The enum has no case for "the builder
# told us" and `measured` would claim we put a tape on it. Note that these are the only GMSS figures the owner
# gave without hedging anything, dimensions and weight both.
#
# NO PASSBAND AND NO DRIVERS. 2500 W RMS is a power rating. The photo shows a grille and tells us nothing about
# what is behind it, and the TMS-4's own 18" + 10" + 1" belongs to the TMS-4 — which this file now has a very
# concrete reason to keep at arm's length.
id: gmss-turbo-top
name: "GMSS Turbo Top"
category: speaker
subtype: top
quantity: 3
owner: gmss
build: own-design

provenance: estimated

geometry:
  # Block-level outer box. The curved front visible in the photo is not modelled — `shape: box` is what the
  # repository draws, and a curve would be a claim about a radius nobody has measured.
  shape: box
  dimensions_m: { width: 0.450, height: 0.710, depth: 0.380 }
  origin: bottom-center
  chamfer_m: 0.012

appearance:
  color: "#141414"

physical:
  # Stated by the owner: 26 kg each. Not calculated and not anchored to the TMS-4 any more, which was 74.8 kg —
  # see the header for how badly that anchor read this cabinet.
  weight_kg: 26.0
  handles: [ left, right ]

rigging:
  # Ground-stacked on the sub columns in the photo. A cabinet of this class often has fly points, but none are
  # visible and none are stated, so this claims none.
  flyable: false
  points: [ ]

notes: |
  Stated by the owner of GMSS, answering questions about GMSS.jpeg: "Tops: 45w, 38d, 71h, 26kg each".
  Centimetres, width / depth / height. That is the source for the dimensions and the weight.

  THE COUNT IS NOT FROM THAT MESSAGE — he gave dimensions "each" and no number. `quantity: 3` still comes from
  GMSS's first message, "3 turbo top 2500rms", and is left alone because no new figure replaced it.

  WORTH CHECKING, THOUGH: the photo appears to show FOUR of these, not three — three standing side by side on the
  mid bass in the middle of the stack and a fourth on top of the right-hand outer column. Same curved grille, same
  narrow silhouette, same blue illuminated logo. That is an observation off a photograph and not a figure, so it
  changes nothing here; it is the next thing to ask GMSS.

  Turbosound TMS-4 figures (1143 x 502 x 730 mm, 74.8 kg) were used as a size anchor before the owner's numbers
  arrived, and the numbers contradict them flatly — see the header. Kept in the file as a rejected line of
  reasoning rather than deleted, because the same reasoning would otherwise be reached for again.
  See https://www.warehousesound.com/turtms4.php and https://archive.org/stream/Turbosound/Turbosound%20TMS-4_djvu.txt

  NOT MEASURED BY US, AND NOT FROM A DATASHEET. The builder's own figures for his own box; still a message rather
  than a measurement, so `estimated`.
