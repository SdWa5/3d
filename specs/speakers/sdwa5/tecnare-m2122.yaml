# All three M2122-shaped tops. Dimensions and weight from the Tecnare L2122LT datasheet, which shares
# this cabinet's geometry. See docs/sources.md.
id: tecnare-m2122
name: "Tecnare M2122"
category: speaker
subtype: top
quantity: 3
owner: sdwa5
build: original

provenance: datasheet
deviations: |
  The 2x 12" are Celestion and the 2x 1" are B&C DE25 rather than Tecnare's own. Power handling in the
  Hardware Overview (1200 W mid + 250 W high) reflects these drivers, not Tecnare's 1000 W + 300 W.

  The mid driver is contradictory in the sources: the Hardware Overview lists an RCF ND650, which is a
  1.4" unit, while the horn's throat is 2" as the owner describes and as the factory L2122LT specifies.
  The driver list here follows the 2" throat. Either the Overview entry is wrong or an adapter is
  fitted — worth checking against the cabinet.

geometry:
  # Tapered cabinet: 500 mm across the front, 345 mm across the back.
  shape: trapezoid
  dimensions_m: { width: 0.500, height: 0.960, depth: 0.520 }
  back_width_m: 0.345
  origin: bottom-center
  chamfer_m: 0.010

appearance:
  # Birch plywood with a weatherproof black textured finish.
  color: "#141414"

physical:
  weight_kg: 68.0
  handles: [ left, right ] # left side and right side each have two handles (at the bottom and top in the back of the side)

rigging:
  flyable: true
  # ESTIMATED FROM THE NOMINAL BOX — not measured, and not from any source. The three points are the ones
  # the cabinet is known to have (two on top, one pull-back low on the rear); where they sit is derived
  # geometry, so treat the positions as placeholders until somebody puts a tape on the real fly track.
  #
  # Positions are in the measuring frame: origin at the middle of the footprint, +X right, front towards
  # −Y, +Z up — the frame a tape measure gives you, independent of `geometry.origin`. See
  # docs/conventions.md.
  #
  # The top face is a trapezoid, 0.500 m across at the front and 0.345 at the back, so a point 0.100 m
  # behind the front face has 0.452 m of width to sit in; ±0.185 leaves ~40 mm of margin to each side
  # edge. The rear face is the narrow one, so the pull-back point is on its centre line.
  points:
    - { id: top-left, position_m: [ -0.185, -0.100, 0.960 ] }
    - { id: top-right, position_m: [ 0.185, -0.100, 0.960 ] }
    - { id: bottom-back, position_m: [ 0.000, 0.260, 0.120 ] }

audio:
  coverage_deg: { horizontal: 60, vertical: 40 }
  drivers:
    - { size_in: 12, type: woofer, count: 2 }
    - { size_in: 2, type: compression-driver, count: 1 }
    - { size_in: 1, type: compression-driver, count: 2 }

  # Front-baffle openings. Positions are in the baffle frame: origin at the centre of the 0.500 x 0.960
  # front face, +X right, +Z up.
  layout:
    # ESTIMATED. Nobody has measured this baffle: the arrangement is as the owner describes it (mid horn
    # on top, the two 12" LF horns stacked below, a 1" horn inside each as a phase plug), but every mouth
    # size and centre height below is derived from the outer dimensions and the driver sizes. A tape
    # measure on one horn mouth would promote this to `measured`.
    #
    # SHAPES are confirmed by the owner against the cabinet: ALL FIVE horns are straight-edged at the mouth
    # and round at the throat — the two LF horns at their 12" drivers, the mid and the two 1" HF plugs at
    # their compression drivers, whose throats are round bolt flanges. So `profile: pyramid` with
    # `throat_profile: elliptical` throughout.
    #
    # THE LF SIDE WALLS ARE FLAT, as the owner stated on 2026-10-01. Morphing the square mouth into the round
    # throat over the whole depth bowed each side wall, so the joined pair showed two ridges and read as three
    # pieces. `throat_blend_m: 0.04` keeps the walls straight until 40 mm in front of the drivers.
    #
    # THE WHOLE FRONT IS CENTRED ON THE BAFFLE, as the owner stated on 2026-10-01. It spans 0.812 m from the
    # top of the mid horn to the bottom of the lower LF horn, which leaves 74 mm above and below. It sat
    # 63 mm higher before, with 25 mm above and 151 mm below. The mid horn stands 40 mm clear of the LF pair,
    # widened from 12 mm on the owner's request of the same day.
    #
    # SIZES are still estimated: every mouth size, centre height, throat size, depth and flare law below is
    # derived from the outer dimensions and the driver sizes, which is why this layout's provenance stays
    # `estimated`. Exponential because no real compression-driver horn is straight-walled; the HF plugs are
    # left linear because at this size the law makes no visible difference.
    #
    # All three compression-driver horns share the mid horn's 2.25 : 1 mouth — 0.45 x 0.20 for the mid and
    # 0.175 x 0.078 for the two HF plugs. The plugs were 0.135 x 0.06 x 0.05 deep, the mouth area they had
    # when they were square, and were scaled by 1.3 in all three dimensions on the owner's request of
    # 2026-10-01. Their 1" throat stays, because it is the driver's exit. The mid horn is 0.12 deep rather than 0.18: at 0.18 it read as a tunnel next
    # to the two LF horns beside it.
    provenance: estimated
    inset_m: 0.018
    features:
      - { id: mid,   kind: horn, at_m: [ 0.0,  0.306 ], mouth_m: [ 0.45, 0.20 ], throat_in: 2.0, depth_m: 0.12,
          profile: pyramid, sides: 4, throat_profile: elliptical, flare: exponential }
      - { id: lf-up, kind: horn, at_m: [ 0.0,  0.026 ], mouth_m: [ 0.45, 0.28 ], throat_in: 10.0, driver_in: 12, depth_m: 0.20,
          profile: pyramid, sides: 4, throat_profile: elliptical, flare: exponential, throat_blend_m: 0.04 }
      - { id: hf-up, kind: horn, inside: lf-up,       mouth_m: [ 0.175, 0.078 ], throat_in: 1.0, depth_m: 0.065, setback_m: 0.12,
          profile: pyramid, sides: 4, throat_profile: elliptical }
      # SHARED MOUTH, from the owner: the two 12" horns are connected. The wall between them is gone for
      # 0.190 of the 0.20 they are deep — practically the whole flare — so the front is one opening
      # 0.45 x 0.572 and the two paths only part company as a 10 mm lip at the drivers. What is left of
      # the wall there is 37 mm thick.
      #
      # HOW FAR BACK IS ESTIMATED like every size here. The owner's account is that the pair is connected
      # rather than that the wall ends at some measured depth, and 0.190 is that account taken as far as
      # the geometry allows: at 0.20 there would be no wall left at all, which is a different cabinet —
      # one horn with two throats — and not something this spec can say. A tape measure settles it.
      - { id: lf-lo, kind: horn, at_m: [ 0.0, -0.266 ], mouth_m: [ 0.45, 0.28 ], throat_in: 10.0, driver_in: 12, depth_m: 0.20,
          profile: pyramid, sides: 4, throat_profile: elliptical, flare: exponential, throat_blend_m: 0.04,
          join: { with: lf-up, depth_m: 0.130 } }
      - { id: hf-lo, kind: horn, inside: lf-lo,       mouth_m: [ 0.175, 0.078 ], throat_in: 1.0, depth_m: 0.065, setback_m: 0.12,
          profile: pyramid, sides: 4, throat_profile: elliptical }
      # HF BRACKET ARMS, read off meshes/sdwa5/photo-full-rig.png (2026-10-01), where they show as bars in the
      # shared LF mouth. One bar runs across each LF horn and one down the centre line through both, and the
      # two 1" plugs sit directly in front of them, as the owner stated on 2026-10-01: each plug's mouth is
      # `setback_m: 0.12` behind the baffle, so it ends at 0.185, and the bars start 1 mm behind that and stop
      # 1 mm short of the LF drivers. Their ends run on into the solid body, which hides them where the LF
      # flare is narrower than the bar. The upright bar is 2 mm thinner and 1 mm further back than the cross
      # bars, so that where they cross no two faces share a plane and flicker. Section and length are
      # ESTIMATED: the photo is sepia-graded and taken from below, so bars of about 15 mm are an assumption,
      # not a reading. They are black, as the owner stated on 2026-10-01, drawn a shade lighter than the body
      # so that they still read against the dark mouth.
      - { id: arm-up,  kind: fin, at_m: [ 0.0,  0.026 ], mouth_m: [ 0.45, 0.015 ], depth_m: 0.013, setback_m: 0.186, color: "#1c1c1c" }
      - { id: arm-lo,  kind: fin, at_m: [ 0.0, -0.266 ], mouth_m: [ 0.45, 0.015 ], depth_m: 0.013, setback_m: 0.186, color: "#1c1c1c" }
      - { id: arm-v,   kind: fin, at_m: [ 0.0, -0.12 ],  mouth_m: [ 0.013, 0.572 ], depth_m: 0.011, setback_m: 0.187, color: "#1c1c1c" }

mesh_override: null

notes: |
  3-way mid-high top (two active sections plus one passive). 150 Hz - 20 kHz +/-4 dB.
  Impedance: mid 4 Ohm, high 8 Ohm. Crossover: active 185 Hz / 2.5 kHz, passive 6.5 kHz.

  Three of these exist: two genuine Tecnare cabinets and one self-built copy. They were separate specs
  (tecnare-m2122 and tecnare-m2122-clone) until 0.14.0, when they were merged at quantity 3 because the
  geometry is identical and modelling it twice was wasted work. The cost of merging is that `build` and
  `provenance` can now only describe one of the two cases — the self-built one is recorded here in prose
  rather than as data. Split the spec again if that distinction starts to matter.
  Hardware Overview.xlsx lists "2", which counted only the factory pair.
