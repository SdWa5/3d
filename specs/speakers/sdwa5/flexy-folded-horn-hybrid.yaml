# Dimensions from the design's own CAD mesh (3d models/subwoofer v28.obj in the Drive folder).
# See docs/sources.md.
id: flexy-folded-horn-hybrid
name: "Flexy Folded Horn Hybrid"
category: speaker
subtype: sub
quantity: 12
owner: sdwa5
build: self-built

clone_of:
  manufacturer: MrFlexySMP
  model: "Folded Horn Hybrid" # Single version of https://www.youtube.com/watch?v=tzwWSL8TyKI which is similar to https://www.sbaudience.com/index.php/application/dual-18inch-horn-subwoofer/
  reference: cad
  url: null

provenance: plans
deviations: |
  Width is 0.591 m — confirmed by the owner and by
  PA-Gehaeuse_Vergleich_und_Effizienzberechnung.xlsx. The CAD mesh in Drive measures only 0.573 m
  across, so it is missing roughly 17 mm of the real cabinet (side cladding or a baffle the model
  leaves out). Height and depth are taken from that mesh, which agrees with the spreadsheet's
  rounded 0.76 / 0.96 while being more precise.

geometry:
  # Block-level outer box. The cabinet is a folded horn internally; none of that is modelled.
  shape: box
  dimensions_m: { width: 0.591, height: 0.763, depth: 0.964 }
  origin: bottom-center
  chamfer_m: 0.012

appearance:
  # Birch plywood with a weatherproof black textured finish.
  color: "#141414"

physical:
  # 70 kg empty + 15 kg driver, per the comparison spreadsheet.
  weight_kg: 85.0
  handles: [ left, right ]

rigging:
  flyable: false
  points: [ ]

audio:
  # Stated by the owner from how the rig is actually driven, not read off a datasheet — hence `estimated`.
  passband_hz:
    low_hz: 38
    high_hz: 200
    provenance: estimated
  drivers:
    - { size_in: 18, type: woofer, count: 1 }

# The design's CAD mesh is available and correctly oriented with `units: mm` and
# `rotate_deg: [90, 0, 90]`, but it measures 0.573 m across where this cabinet is 0.591 m, so the
# builder rejects it. Reconcile the 18 mm first — see TODO.md item 1.3.
mesh_override:
  path: meshes/flexy-1to10.stl
  units: cm
  rotate_deg: [ 90, 0, 90 ]

notes: |
  The backbone of the PA — 14 cabinets, 1190 kg of sub on its own.
  Drivers across the 14: 6x Eighteensound 18NLW9601 and 8x 18NLW9600 (both 18", 1800 W, 8 Ohm).
  38-200 Hz, 1800 W continuous per cabinet.
  A CAD mesh exists in Drive. It imports cleanly with `units: mm` and `rotate_deg: [90, 0, 90]`,
  and its depth and height match this spec exactly — but it is 18 mm narrower, so the builder
  rejects it. That is two independent confirmations that the mesh omits something.
