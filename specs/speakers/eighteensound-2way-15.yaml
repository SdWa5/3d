# Built from Eighteen Sound's published "15 inch 2 Ways Kit" application note. Dimensions read
# off its FRONT VIEW and SIDE VIEW drawings. See docs/sources.md.
id: eighteensound-2way-15
name: "Eighteensound 2-Way 15\""
category: speaker
subtype: top
quantity: 2
owner: sepp
build: clone

clone_of:
  manufacturer: "Eighteen Sound"
  model: "15\" 2 Ways Kit"
  reference: plans
  url: null

provenance:
  # Dimensions come from the kit drawings; the weight is a calculation, not a source.
  dimensions: plans
  weight: estimated

geometry:
  shape: box
  dimensions_m: { width: 0.420, height: 0.800, depth: 0.335 }
  origin: bottom-center
  chamfer_m: 0.010

appearance:
  color: "#111111"
  grille:
    inset_m: 0.012
    color: "#0a0a0a"

physical:
  # ESTIMATE, calculated not guessed: ~1.42 m2 of 15 mm Baltic birch at ~680 kg/m3 = 14.4 kg,
  # plus ~3 kg internal braces, plus drivers (15W700 8.6 kg + ND1460 1.0 kg + XT1464 horn ~1.5 kg),
  # plus ~2 kg grille and hardware. Eighteen Sound publishes no finished-cabinet weight — it is a
  # DIY kit, so the weight depends on the builder. Not weighed; see docs/measuring.md.
  weight_kg: 30.0
  handles: [left, right]

rigging:
  flyable: false
  points: []

audio:
  drivers:
    - { size_in: 15, type: woofer, count: 1 }
    - { size_in: 1.4, type: compression-driver, count: 1 }

mesh_override: null

notes: |
  15W700 woofer plus ND1460 compression driver on an XT1464 horn, crossover around 1.5 kHz.
  Enclosure is 15 mm Baltic birch plywood with two 96 mm internal-diameter vent pipes.
  Hardware Overview lists 60 - 20000 Hz and 550 W continuous.
  weight_kg is the only estimated value here — the dimensions come from the kit drawings.
