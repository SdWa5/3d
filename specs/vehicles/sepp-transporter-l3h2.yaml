# Sepp's transporter — EVERY NUMBER HERE IS AN ESTIMATE AND THE VEHICLE ITSELF IS NOT IDENTIFIED.
#
# This spec exists because the owner asked for an estimate rather than a blank, and because a two-bin packer needs a
# second bin to be written at all. It is not evidence of anything. Read the four uncertainties before using a figure
# out of it.
#
# WHAT IS ACTUALLY KNOWN, and it is the owner's description rather than a document: "from sepp (sdwa5 member) and a
# L3H2 or L3H3 (not sure which), probably peugot, old deutsche post vehicle".
#
# UNCERTAINTY 1 — THE MAKE. "Probably Peugeot" means probably a Boxer, which shares a body with the Citroën Jumper
# and the Fiat Ducato and has identical bay dimensions across all three. So the make matters less than it sounds:
# get the make wrong within that family and the numbers below do not move. Get it wrong outside it — a Sprinter, a
# Crafter, a Master — and they all do.
#
# UNCERTAINTY 2 — THE ROOF. L3H2 and L3H3 differ in exactly one dimension, 1932 mm against 2168 mm, and share
# everything else. THE LOWER ROOF IS ASSUMED HERE. That is the safe end of the owner's own uncertainty: a packer
# told 1932 refuses a load that would have fitted, and one told 2168 authorises a load that will not go in. One look
# at the vehicle settles it and removes 236 mm of doubt.
#
# UNCERTAINTY 3 — THE PAYLOAD, AND IT IS THE DANGEROUS ONE. No Zulassungsbescheinigung has been supplied, so there
# is no field F.2 and no field G. 3500 kg permitted is stated because a Boxer of this size is a 3.5 t vehicle in
# nearly every specification sold, and the mass in service is a GUESS AT THE HIGH END on purpose — an ex-Deutsche-
# Post van was bought to a fleet specification and carries shelving, a bulkhead and a ply floor that a catalogue
# kerb weight knows nothing about. That is exactly the mistake the GMSS reconstruction is the worked example of: a
# photograph put a cabinet's weight out by 139 kg and the whole apparatus had to be thrown away.
#
#   A WRONG CABINET WEIGHT MAKES A BAD RENDER. A WRONG PAYLOAD MAKES AN OVERLOADED VAN, WHICH IS A FINE, A
#   LIABILITY QUESTION AFTER AN ACCIDENT AND A REFUSED INSURANCE CLAIM. Do not plan a real load against this
#   number. It is here so the packer has two bins, and nothing more.
#
# UNCERTAINTY 4 — WHAT IS BOLTED IN. Unknown, and for an ex-fleet vehicle it is likely to be a lot. Shelving does
# not come out for a gig.
#
# THE OUTER BOX is the Boxer L3H2 body, which is the least uncertain thing here and still a catalogue figure.
#
# See docs/sources.md. Replace all of this the day the papers appear.
id: sepp-transporter-l3h2
name: "Sepp's transporter — L3H2 van, unidentified"
category: vehicle
subtype: van
quantity: 1
owner: sepp
build: original

provenance:
  # Nothing here is better than estimated, and the payload is the weakest number in the whole library.
  dimensions: estimated
  weight: estimated

geometry:
  shape: box
  # Peugeot Boxer L3H2 body. Depth is the fore-aft axis, so the vehicle's length is its depth.
  dimensions_m: { width: 2.050, height: 2.522, depth: 5.998 }
  origin: bottom-center
  chamfer_m: 0.02

appearance:
  # Deutsche Post yellow is the one thing about this van nobody is unsure of, and it is also the one thing that has
  # no effect on a pack. Left plain white rather than invented.
  color: "#e8e8e8"

physical:
  # GUESSED, AT THE HIGH END. A catalogue kerb weight for a bare Boxer L3H2 is nearer 2050 kg; the extra 250 kg is
  # a deliberate allowance for ex-fleet shelving, a bulkhead and a ply floor nobody has looked at. Erring heavy
  # makes the derived payload smaller, which is the direction that cannot hurt anybody.
  weight_kg: 2300.0
  handles: [ ]

rigging:
  flyable: false
  points: [ ]

vehicle:
  # ASSUMED 3.5 t, the near-universal specification for this body. Not read off any document.
  permitted_gross_kg: 3500.0
  load_bay_m:
    # ESTIMATED, manufacturer figures for the Boxer L3H2 body. The H3 roof would make `height` 2.168 instead.
    width: 1.870
    height: 1.932
    depth: 3.705
    width_between_arches: 1.422

notes: |
  DERIVED PAYLOAD 1200 kg, from 3500 − 2300, and it is a planning aid rather than a clearance. Both halves are
  guesses, so the difference is a guess twice over. Stefan's Movano states 1024 kg off a document by comparison,
  which is the one figure of the two anybody should plan against.

  WHY THIS SPEC IS WORTH HAVING ANYWAY. LOAD-3 is a two-bin packing problem and a second bin of roughly the right
  size changes which heuristic is worth writing. It does not change what may legally be driven.

  WHAT SETTLES IT: the Zulassungsbescheinigung, fields F.2 and G, exactly as Stefan's did. One photograph of the
  document replaces every number in this file, and until then the make, the roof and the payload are all open.
