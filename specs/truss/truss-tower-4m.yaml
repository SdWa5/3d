# Telescopic crank stand, 4 m — what holds a truss up.
#
# WHAT WE OWN: "2x 4 meter telescope feet". A 4 m telescopic lifting stand for truss, and the class is well
# standardised, so unlike the truss segments there is a specific product whose published figures fit exactly:
# the Global Truss ST-132 medium duty crank stand.
#
# PUBLISHED ST-132 FIGURES:
#
#   max height     4.0 m (13.2 ft)
#   min height     1.8 m (5.9 ft)
#   weight         25 kg (55 lb)
#   max load       100 kg (220 lb)
#   folded base    8 x 8 in   -> 203 x 203 mm
#   unfolded base  59 x 59 in -> 1499 x 1499 mm
#
# https://www.globaltruss.com/st-132 and
# https://www.globaltruss.com/pub/media/globaltrdownloads/downloads/s/t/st132_manual.pdf
#
# `shape: box`, AND DELIBERATELY SO. A crank stand is a nested telescopic mast on folding outriggers, which is
# neither a hexahedron nor a truss — it wants a shape of its own and does not have one yet. A 0.203 m column is a
# harmless placeholder in a way a solid truss never would be: it occludes almost nothing, and at 4 m tall in a
# render it reads as roughly the right thing in roughly the right place. Recorded as a follow-up in TODO.md rather
# than half-built here.
#
# WHAT THE BOUNDING BOX IS: the MAST, at its full 4 m extension, 203 mm square — the folded base size, which is
# also about the column's own footprint. THE OUTRIGGERS ARE NOT MODELLED: unfolded they spread to 1.499 x 1.499 m,
# which is what actually has to be kept clear on a stage and is stated here in the notes rather than drawn. So the
# footprint this spec reports is the mast's, not the working footprint, and not the folded transport size either.
# That is the one number to be careful with in the catalog.
id: truss-tower-4m
name: "Truss tower — 4 m crank stand"
category: truss
subtype: tower
quantity: 2
owner: sdwa5
build: original

# No `clone_of`: a factory stand copies nothing. Manufacturer and datasheet are in the notes and docs/sources.md.

provenance:
  # The mast section is inferred from the published folded base; the height and weight are published outright.
  dimensions: estimated
  weight: datasheet

geometry:
  shape: box
  # The mast at full extension. See the header for what this box does and does not include.
  dimensions_m: { width: 0.203, height: 4.000, depth: 0.203 }
  origin: bottom-center
  chamfer_m: 0.004

appearance:
  # Mill-finish aluminium, as the truss it carries.
  color: "#9A9EA3"

physical:
  # Published: 25 kg.
  weight_kg: 25.0
  handles: [ ]

rigging:
  # A stand is what gets stood on the floor, not flown. Its own load rating — 100 kg — is a fact about what it can
  # carry and has nowhere to go in this schema; it is in the notes.
  flyable: false
  points: [ ]

notes: |
  Stated by the owner: 2 stands, 4 m, telescopic. Modelled on the Global Truss ST-132 medium duty crank stand,
  whose published figures match that description exactly — https://www.globaltruss.com/st-132.

  Max load 100 kg per stand, which is the number that matters when deciding what may hang from the truss between
  them. There is no field for it in this schema.

  Min height 1.8 m: a stand does not have to be at full extension, and `dimensions_m.height` is the 4 m maximum.
  A scene that stands one lower is stating something this spec cannot express.

  NOT MODELLED: the folding outriggers, which unfolded spread to 1.499 x 1.499 m. That is the working footprint
  and it is far larger than the 0.203 m mast this spec reports. Keep it in mind when reading a scene's footprint.
