# Varytec Wind Up 85 kg, a 4 m wind-up lifting stand. **IDENTIFIED, and the guess it replaces was the wrong
# product with the right numbers.**
#
# WHAT WE OWN: two, from a Stairville Wind Up DJ Bundle III. The owner supplied the bundle's product data on
# 2026-08-17. Until then this spec assumed a **Global Truss ST-132** on the reasoning that the class is well
# standardised — and that reasoning got the height and the weight exactly right while naming the wrong machine and
# overstating what it may carry by 15 kg.
#
# PUBLISHED VARYTEC WIND UP 85 kg FIGURES, and which document gives each:
#
#   max height          4.00 m          manual and bundle page
#   min height          2.05 m          manual
#   transport length    1.75 m          manual and bundle page  <- NOT the same as the modelled height. See below.
#   weight              25 kg           manual and bundle page
#   max load            85 kg           manual and bundle page, with a centric load
#   min load            25 kg           bundle page             <- a wind-up needs load on it to be safe
#   receiver            1 3/8", 35 mm   manual and bundle page
#   crossbar (T-bar)    1300 x 35 x 35 mm  manual and bundle page
#   footprint, max      1.50 m          manual
#   TÜV tested
#
# The manual is Thomann's user manual for the Varytec Wind Up 85 kg TÜV, technical data on page 15
# (manualslib.com/manual/3360414). The bundle page is Thomann article 267121,
# https://www.thomann.de/de/stairville_wind_up_dj_bundle_iii.htm, supplied by the owner on 2026-08-17.
#
# WHERE THE TWO DISAGREE, THE MANUAL HOLDS, as the owner decided on 2026-10-04. The bundle page gives a base spread
# of 1.6 m where the manual gives a footprint of at most 1.50 m. Until 0.150.0 this spec carried the 1.6 m, and a
# minimum height of 2.225 m that no document gave at all. It came from a hub height estimated off a photograph.
#
# WHAT THE GUESS GOT WRONG, and it is worth keeping: **max load 100 kg against a real 85**. Height and weight
# matched to the kilogramme, which is exactly what makes a plausible substitution dangerous — the two figures easy
# to check agreed, so the one that matters for hanging things did not get checked. A truss bar loaded to 100 kg on
# a pair of stands rated 85 is the sort of error that only shows up once.
#
# THE MINIMUM LOAD IS NEW INFORMATION AND HAS NO FIELD. 25 kg minimum is a real constraint on a wind-up: too light
# and it is unsafe to crank. Nothing in the schema holds a *lower* bound on a load, so it is in the notes.
#
# TWO TRUSS ADAPTERS came with the bundle, Varytec 35 mm, for putting a truss on the 1 3/8" receiver. They have no
# published mass or dimensions, so their mass is not in the 25 kg. Since 0.134.0 each stand is drawn with one on top.
#
# `shape: mast`, drawn from the bundle's Thomann photographs, looked at on 2026-10-01: three black square legs hinged
# from a hub collar, struts from a lower collar where the chrome sleeve ends, two round chrome stages out of it, a
# black winch with a crank on its back, and the truss adapter on top. See docs/spec-format.md#mast.
#
# **WHAT THE BOUNDING BOX IS.** The mast column at its full 4 m extension, as before, so placement and the overlap
# sweep read the same box they always did. The legs reach outside it to the manual's 1.50 m footprint, and no scene
# check sees them. A backdrop stands its towers 0.75 m behind the rig for that reason, see src/Scene/StackBackdrop.php.
# A pack reads the `transport` box instead, the stand folded to its 1.75 m.
#
# WHERE EACH FIGURE COMES FROM:
#
#   height 4.00 m, min height 2.05 m, footprint 1.50 m             manual
#   transport 1.75 m, 35 mm receiver, weight, max load              manual
#   the sleeve's foot at 0.30 m                                     derived, min height less transport length
#   three legs, a round mast of three tubes, the winch at the back   photographs
#   every diameter, the hub height, the adapter's sizes              estimated off the photographs
#
# The 4.00 m and the 2.05 m are taken at the adapter's top face, where the truss rests, because the manual does not
# say whether they include one. The manual covers the stand alone, so the truss may in truth rest one adapter higher.
# Fully cranked down the stand is its 1.75 m folded length standing on the sleeve's foot, which therefore sits 0.30 m
# off the floor. A scene that asks for less than 2.05 m is refused.
id: truss-tower-4m
name: "Varytec Wind Up 85 kg — 4 m truss lift"
category: truss
subtype: tower
quantity: 2
owner: sdwa5
build: original

# No `clone_of`: a factory stand copies nothing. Manufacturer and datasheet are in the notes and docs/sources.md.

provenance:
  # The height, spread and transport length are published. Every tube, the hub and the adapter are estimated off
  # the photographs, so the model keeps its estimated marker.
  dimensions: estimated
  weight: datasheet

geometry:
  shape: mast
  # The mast column at full extension. See the header for what this box does and does not include.
  dimensions_m: { width: 0.203, height: 4.000, depth: 0.203 }
  origin: bottom-center
  chamfer_m: 0.0
  mast:
    sections_m: [ 0.060, 0.050, 0.040 ]
    transport_length_m: 1.750
    # Manual: "Height, min. 2.05 m". The sleeve's foot follows from it, 2.05 less 1.75.
    min_height_m: 2.050
    # Estimated off the photographs, and bounded by the manual: folded, each leg swings up from the hub along the
    # sleeve, and the 1.75 m folded length leaves room for that only with the hub at about 0.88 m or below.
    hub_height_m: 0.850
    spigot_diameter_m: 0.035
    legs: 3
    # Manual: "Stand footprint, max. 1.50 m". The bundle page's 1.6 m is not used, see the header.
    base_spread_m: 1.500
    leg_width_m: 0.030
    # One leg straight back, +Y, away from the rig. The other two then reach 0.375 m towards it, half the 0.75 m a
    # backdrop leaves.
    leg_yaw_deg: 90
    winch: true
    adapter: { length_m: 0.400, bar_m: 0.040, height_m: 0.120, clamp_spacing_m: 0.240 }

appearance:
  # Mill-finish aluminium, as the truss it carries.
  color: "#9A9EA3"

physical:
  # Published: 25 kg.
  weight_kg: 25.0
  # Published: 85 kg. `scene:stack` refuses a truss backdrop whose share on either stand is more, see
  # docs/scenes.md. The 25 kg minimum load still has no field and stays in the notes.
  max_load_kg: 85.0
  handles: [ ]

transport:
  # Folded: every stage inside the sleeve and the legs up against it. The 1.75 m is the datasheet's transport length
  # and must equal `mast.transport_length_m`. Nobody publishes the folded cross-section, so it is half of Thon's case
  # for two of these stands, 1810 x 507 x 363 mm outside (thomann.de, Thon Case Varytec Wind Up 85kg), less its walls.
  dimensions_m: { width: 0.240, height: 1.750, depth: 0.300 }
  provenance: estimated

rigging:
  # A stand is what gets stood on the floor, not flown.
  flyable: false
  points: [ ]

notes: |
  Varytec Wind Up 85 kg, two of them, from a Stairville Wind Up DJ Bundle III. Product data supplied by the owner on
  2026-08-17, which replaced an assumed Global Truss ST-132.

  MAX LOAD 85 kg PER STAND, and that is the number that decides what may hang from a truss between two of them. The
  spec previously said 100 kg, inherited from the substituted product — the height and the weight had matched to the
  kilogramme, which is precisely what made the substitution look safe.

  MINIMUM LOAD 25 kg, which has no field anywhere. A wind-up needs weight on it to be safe to crank, so an empty
  stand is not a lightly loaded stand. Nothing in the schema expresses a lower bound on a load.

  IT TRANSPORTS AT 1.75 m, folded, and is modelled at its erected 4 m. Until 0.148.0 one field carried both, which is
  why the packed convoy render showed a mast standing out of a trailer. The `transport` block now carries the folded
  box, and a pack draws the stand folded.

  THE LEGS SPREAD TO 1.50 m, the manual's maximum footprint. That is the footprint to keep clear on a stage, seven
  times the 0.203 m column this spec reports, and since 0.134.0 the model draws it. Three legs, one straight back, as
  the photographs show. The bundle page says 1.6 m, and the manual holds.

  CRANKED DOWN, THE STAGES SLIDE. A scene that sets `extend_to_m` keeps the base, the legs and the winch as they are,
  and each stage drops by its share. 2.05 m is the lowest it goes, from the manual.

  THE RECEIVER IS 1 3/8" and takes a 35 mm speaker flange directly. Two Varytec 35 mm truss adapters came with the
  bundle for mounting truss instead. They are drawn on top of the stands, and their mass is unpublished.

  THE CROSSBAR that came with each stand is 130 x 3.5 x 3.5 cm. Not specced separately either — it is part of the
  stand as bought rather than a device in its own right.
