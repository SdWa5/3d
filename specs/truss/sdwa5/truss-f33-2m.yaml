# Global Truss F33200, 2 m straight three-point segment. **IDENTIFIED, from the product data.**
#
# WHAT WE OWN: five. Three came in a Stairville Wind Up DJ Bundle III and two were bought afterwards, the same
# segment. The owner supplied the bundle's product data on 2026-08-17, which settles the brand and the model — the
# guess below was that ours were "an F33 or equivalent", and they are literally F33200.
#
# PUBLISHED F33200 FIGURES, from the product data:
#
#   length              2.0 m
#   tube spacing        290 mm (outer)
#   main tube (chord)   50 mm diameter, 2 mm wall
#   material            AlMgSi F31, TÜV Nord type-tested
#   weight              9.3 kg
#   included            one set of conical quick connectors
#
# Thomann article 267121, the bundle: https://www.thomann.de/de/stairville_wind_up_dj_bundle_iii.htm
#
# **THE WEIGHT WAS DERIVED AND WAS 1 kg TOO HEAVY.** The old figure came from fitting a line through three
# published F33 weights — 1.0 m at 6.4 kg, 1.5 m at 8.2, 3.0 m at 14.1 — which gave 2.55 kg + 3.85 kg/m and so
# 10.25 kg at 2 m. The published F33200 figure is **9.3 kg**. The model was sound, the fit was good on its own
# points, and it was still 10 % out on the one length nobody had published. Across five segments that is 5 kg.
#
# A derivation that reproduces its inputs to two decimal places can still be wrong about the point between them,
# which is worth remembering the next time a curve looks convincing.
#
# THE CROSS-SECTION IS DERIVED FROM THE SAME FIGURES. Chords are 50 mm inside a 290 mm overall width, so the chord
# centres form an equilateral triangle of side 290 - 50 = 240 mm. Its height is 240 x sqrt(3)/2 = 207.8 mm, and the
# bounding box is that plus a chord diameter: 257.8 mm tall, 290 mm across. Rounded to 0.258 x 0.290.
#
# A SEGMENT LIES ALONG X, so `width` is the 2 m span and `height`/`depth` are the cross-section. That is what keeps
# `dimensions_m` the true bounding box, which is what scene placement, the overlap sweep in ShippedScenesTest and
# the catalog's shipping volume all read. None of them knows a truss from a subwoofer, and none of them needs to.
id: truss-f33-2m
name: "Truss F33 — 2 m straight"
category: truss
subtype: straight
quantity: 5
owner: sdwa5
build: original

# No `clone_of`: a factory truss is not a copy of anything, the same as `tecnare-m2122`. The manufacturer and the
# datasheet are recorded in the notes below and in docs/sources.md, which is where a factory device's provenance
# lives in this repository.

provenance:
  # Published figures for the identified product. The cross-section is still derived from the tube spacing rather
  # than stated as a bounding box — see the derivation above — which is why dimensions stay `datasheet` rather than
  # claiming to be measured.
  dimensions: datasheet
  weight: datasheet

geometry:
  shape: truss
  # The bounding box, derived above. Not the tubes — those are in `truss` below.
  dimensions_m: { width: 2.000, height: 0.258, depth: 0.290 }
  origin: bottom-center
  # Meaningless for a truss and ignored by the builder: there are no edges to round, only tubes.
  chamfer_m: 0.0

  truss:
    chords: 3
    chord_diameter_m: 0.050
    diagonal_diameter_m: 0.020
    # THE ONE FIGURE NOT PUBLISHED. Manufacturers give tube sizes and weights but rarely the brace pitch, and it
    # is the least consequential number here — it changes how many diagonals are drawn, nothing about the outer
    # box or the weight. 0.5 m puts four bays in a 2 m segment, which is what the photographs of F33 show.
    bay_length_m: 0.500

appearance:
  # Mill-finish aluminium, not the cabinets' black.
  color: "#9A9EA3"

physical:
  # Published for the F33200. The 10.25 kg the old line fit gave is in the header.
  weight_kg: 9.3
  handles: [ ]

rigging:
  # Truss is what other things hang FROM. It is not itself flown from a point on its shell, and a coupler is not
  # a rigging point in this schema's sense, so this claims none.
  flyable: false
  points: [ ]

notes: |
  Identified as the Global Truss F33200 from the bundle's product data, supplied by the owner on 2026-08-17. Five
  segments, three from the Stairville Wind Up DJ Bundle III and two bought afterwards. See docs/sources.md.

  Tube sizes, length and weight are published, so `provenance` is `datasheet` on both axes. The cross-section is
  derived from the published tube spacing, see the header.

  `bay_length_m` is the only number with no source at all. It affects the picture and nothing else.
