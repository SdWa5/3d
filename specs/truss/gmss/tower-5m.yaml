# GMSS's towers — two, 5.2 m at full extension.
#
# STATED BY GMSS: "2 pcs towers max 5.2m". A count and a maximum height. The word "max" is the useful part: it says
# these telescope, so 5.2 m is the top of a range and not a fixed dimension.
#
# `shape: box`, for the same reason as `truss-tower-4m.yaml`: a telescopic mast on outriggers is neither a
# hexahedron nor a truss, and a narrow column is a harmless placeholder where a solid truss would not be.
#
# THE WEIGHT IS THE WEAKEST NUMBER HERE and it is worth saying so plainly. Our own 4 m stand is a Varytec Wind Up
# at a published 25 kg. A 5.2 m stand is the next class up — taller mast, more sections, a bigger base — and
# scaling 25 kg by height alone gives 32.5, which is why 33 is written below. That is an inference from one
# datapoint in a neighbouring class, not a figure anybody published for these towers. It is the number to replace
# first if GMSS ever names the brand.
#
# MAST SECTION: 0.203 m square, the box our own stand was drawn as before 0.134.0, for want of anything better. A
# 5.2 m tower's mast is probably a little heavier in section than a 4 m one; nothing states it. THE OUTRIGGERS ARE
# NOT MODELLED, because nothing names the model, so this spec's footprint is the mast's and not the working one.
# Ours is drawn as a `shape: mast` with its legs since 0.134.0.
id: tower-5m
name: "GMSS Tower — 5.2 m"
category: truss
subtype: tower
quantity: 2
owner: gmss
build: original

provenance:
  dimensions: estimated
  weight: estimated

geometry:
  shape: box
  # The mast at the stated maximum extension.
  dimensions_m: { width: 0.203, height: 5.200, depth: 0.203 }
  origin: bottom-center
  chamfer_m: 0.004

appearance:
  color: "#9A9EA3"

physical:
  # ESTIMATE by comparison, not a published figure: our 4 m Varytec Wind Up is 25 kg, scaled by height for a taller class.
  weight_kg: 33.0
  handles: [ ]

rigging:
  flyable: false
  points: [ ]

notes: |
  Stated by GMSS: "2 pcs towers max 5.2m". The count and the maximum height, nothing else.

  "max" matters: these telescope, so 5.2 m is the top of a range. A scene standing them lower is stating something
  this spec cannot express — `dimensions_m.height` is the maximum, as it is for our own stand.

  The weight is an inference from our Varytec Wind Up's published 25 kg at 4 m, scaled by height. Not published for these.
  NOT MODELLED: the outriggers, so the reported footprint is the mast's rather than the working one.

  Two of these carrying `truss-9m` is a goalpost, and at 5.2 m it clears the 3.0 m GMSS stack comfortably.
