# Martin MAC 2000 Performance II — GMSS's moving heads, and the best-sourced thing they own.
#
# STATED BY GMSS: "4pcs Martin mac performance 2". That reads as the MAC 2000 Performance II, a 1200 W discharge
# moving-head profile Martin sold for years, and the identification is worth stating because it is what turns this
# from a guess into a datasheet: unlike every GMSS cabinet, this fixture has published numbers.
#
# PUBLISHED FIGURES:
#
#   length x width x height   408 x 490 x 743 mm, HEAD STRAIGHT UP
#   weight                    39.5 kg
#   lamp                      1200 W short-arc discharge (Philips MSR 1200 SA/DE Gold)
#   pan / tilt                540 deg / 267 deg
#
# https://www.martin.com/en-US/products/mac-2000-performance-ii
#
# THE AXES NEED CARE. Martin quotes 408 length x 490 width; this repository's `width` is across the device and
# `depth` front to back, so 490 is the width and 408 the depth. Getting that backwards would put the yoke arms on
# the wrong faces, which is exactly the sort of thing a render shows and a test does not.
#
# "HEAD STRAIGHT UP" IS THE POSE, and it is why `dimensions_m.height` is 0.743. A moving head's height depends on
# where its head is pointing, so a datasheet has to pick a pose to quote — and the model is built in that same pose,
# pan and tilt at zero. A fixture's aim is a cue rather than a dimension; a scene that wants one aimed uses
# `yaw_deg` and `pitch_deg`.
#
# WHAT IS SOURCED AND WHAT IS NOT, because this spec is a mix and the schema cannot express it. The OUTER BOX and
# the WEIGHT are datasheet. The SPLIT between base, yoke and head is not published anywhere and is read off product
# photographs: a base of about 0.240 m, yoke arms about 0.075 m thick, and a head about 0.300 m across and 0.430 m
# long. `provenance.dimensions` is a single field, so it cannot say "box sourced, internals estimated" — it says
# `datasheet`, because that is what the bounding box everything downstream uses actually is, and this comment is
# where the qualification lives. See docs/sources.md, and TODO.md for the schema gap.
id: gmss-mac-2000-performance-ii
name: "Martin MAC 2000 Performance II"
category: other
subtype: moving-head
quantity: 4
owner: gmss
build: original

# No `clone_of`: a factory fixture copies nothing. Manufacturer and datasheet are in the notes and docs/sources.md.

provenance:
  # The outer box and the weight are published; see the header for what inside it is not.
  dimensions: datasheet
  weight: datasheet

geometry:
  shape: moving-head
  # 490 across, 743 tall head-up, 408 front to back — see the header on Martin's axis naming.
  dimensions_m: { width: 0.490, height: 0.743, depth: 0.408 }
  origin: bottom-center
  # No chamfer: the builder rounds nothing on an open-frame shape, and a moving head's castings are not bevelled
  # plywood edges.
  chamfer_m: 0.0

  moving_head:
    # Off photographs, not off the datasheet. The base is roughly a third of the height, the head fills most of
    # the rest, and the arms are slim castings.
    base_height_m: 0.240
    yoke_arm_thickness_m: 0.075
    head_diameter_m: 0.300
    head_length_m: 0.430

appearance:
  # Martin's housing is dark grey UV-resistant composite, not the cabinets' near-black.
  color: "#2E3134"

physical:
  # Published: 39.5 kg. Note this is the fixture alone — Martin's flight-case figure of 39 kg per unit includes
  # omega brackets, clamps and a safety cable, which is a different number for a different purpose.
  weight_kg: 39.5
  handles: [ ]

rigging:
  # `false`, and this needs saying because a moving head obviously does hang: in this schema `flyable` means "we
  # know where its fly points are", since the validator pairs it with `rigging.points`. A MAC hangs from omega
  # brackets bolted to its base and Martin does not publish where those bolt holes are, so claiming a point would
  # be inventing hardware. The same call as `truss-f33-2m`, where a coupler is not a rigging point either.
  #
  # A scene still hangs it: `fly: { height_m }` without naming a point needs nothing from this block. What is not
  # possible until the bracket positions are known is checking a bar's capacity PER POINT rather than in total.
  flyable: false
  points: [ ]

notes: |
  Stated by GMSS: "4pcs Martin mac performance 2", read as the MAC 2000 Performance II —
  https://www.martin.com/en-US/products/mac-2000-performance-ii

  THE ONLY GMSS GEAR WITH A DATASHEET. Every GMSS cabinet is a reconstruction from one photograph; this fixture is
  a catalogue product with published dimensions and weight. Worth knowing when reading a scene that mixes them.

  Four of these are 158 kg, which is the number that matters when they go on a truss — and more than the 100 kg
  a single Global Truss ST-132 stand is rated to carry, though GMSS's own towers are not ST-132s.

  1200 W lamp each, so 4.8 kW of fixture before the rig. There is no field for electrical load in this schema.

  NOT SOURCED: how the height divides between base, yoke and head. Those come off photographs. The outer box does
  not depend on them — it is Martin's own — so a correction there changes the silhouette and nothing else.
