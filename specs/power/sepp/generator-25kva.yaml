# Sepp's 25 kVA generator. THE WEIGHT AND THE OUTPUT ARE THE OWNER'S FIGURES; THE BOX IS A GUESS.
#
# WHAT IS KNOWN, stated by the owner on 2026-08-17: **465 kg, 25 kVA, engine Hatz 3M41**. That is the whole source.
# The make of the *set* — as opposed to the engine in it — is not known at all.
#
# WHY THE ENGINE DOES NOT SETTLE THE BOX. A Hatz 3M41 is a three-cylinder air-cooled diesel that several firms build
# 25 kVA sets around, and the frame differs far more than the engine does: an open skid, a canopy and a trailer
# version of the same output are three different boxes. 465 kg reads like an open frame or a light canopy rather
# than a sound-attenuated one, which is the only thing the weight narrows down.
#
# THE DIMENSIONS ARE ESTIMATED AND ROUNDED **UP**, which is the opposite direction from the load bays and for the
# opposite reason. A bay estimated small refuses a load that would have fitted, which costs a trip; an *item*
# estimated small promises a fit that is not there, which costs an hour in a car park. So the numbers below are the
# generous end of a 25 kVA open set, and the real machine should be smaller by up to 200 mm on any axis.
#
# AIR-COOLED, WHICH IS WHY THE ESTIMATE IS GENEROUS RATHER THAN TIGHT. A 3M41 has no radiator, so a set built on it
# is more compact than a water-cooled 25 kVA of the same output.
#
# NO SCHEMA FIELD HOLDS 25 kVA. There is no `power:` block — the closest thing here is the `audio` section, which is
# about what a cabinet radiates rather than what a machine produces. The figure is in the notes rather than invented
# into a field nothing else would read. See SPEC-14 in TODO.
#
# WHAT SETTLES ALL OF IT: the nameplate. One photograph gives the make, the model, the real mass and the output
# together, exactly as the Zulassungsschein did for the Ducato, and a tape measure over the frame gives the box.
# See docs/sources.md.
id: generator-25kva
name: "Generator 25 kVA — Hatz 3M41, Sepp's"
category: other
subtype: generator
quantity: 1
owner: sepp
build: original

# **It rides on the trailer and nothing else, which the spec now states rather than the invocation.** Two people
# cannot lift 465 kg, no van has a ramp, and the planner scores bins by strain — so left to itself it sent the
# generator to a van and filled the trailer with speaker cabinets.
carried_on: trailer-750kg

provenance:
  # Both estimated, for different reasons. The dimensions are a guess from the output and the engine. The weight is
  # the owner's own figure, which the enum has no case for — the same treatment the GMSS cabinets get, where the
  # builder's stated numbers are recorded as estimates because nobody here has weighed them.
  dimensions: estimated
  weight: estimated

geometry:
  shape: box
  # ESTIMATED, generous end. Depth is the fore-aft axis of the frame.
  dimensions_m: { width: 0.850, height: 1.200, depth: 1.700 }
  origin: bottom-center
  chamfer_m: 0.02

appearance:
  color: "#e8e8e8"

physical:
  # The owner's figure. Whether it includes a full tank is not known, and on a 25 kVA set the tank is worth tens of
  # kilogrammes — so treat 465 as the lighter end and expect a weighbridge to say more.
  weight_kg: 465.0
  handles: [ ]

transport:
  # The generator travels standing, stated by the owner on 2026-10-04. It holds fuel and oil.
  upright: true

rigging:
  flyable: false
  points: [ ]

notes: |
  25 kVA, engine Hatz 3M41, three-cylinder air-cooled diesel. Neither figure has a field in the schema yet, so both
  live here — see SPEC-14 in TODO for the `power:` block they would belong in.

  THE HEAVIEST SINGLE OBJECT IN THE LIBRARY BY A FACTOR OF TWO. The next heaviest is GMSS's 220 kg wall bass, and
  the heaviest thing that actually travels is a 90 kg SKRAM. At 465 kg this is 45 per cent of either van's entire
  payload on its own, and it is the first device here that two people cannot carry at all: it needs a ramp, a tail
  lift or a forklift, none of which the load planner knows anything about.

  IT TRAVELS ON THE TRAILER, stated by the owner, and `carried_on: trailer-750kg` above is where that is recorded.
  It used to need `--exclude=generator-25kva` on every invocation, which said what it is *not* rather than
  what it is — and left the trailer free to be filled with cabinets instead.
