; **The JIT this repository has asked for since it had a solver, actually turned on.**
;
; `phpunit.xml` and `bin/console` both set `opcache.jit=tracing` at runtime, on the stated premise that the
; image ships a 64 MB JIT buffer. On 2026-09-11 it did not. `opcache.jit_buffer_size` is `PHP_INI_SYSTEM`,
; defaults to 0 and cannot be raised by `ini_set()`, so both of those lines were selecting a mode for a compiler
; with nowhere to emit code and the solver ran interpreted. Measured in this container before the fix:
; `opcache.jit_buffer_size => 0` and `opcache_get_status()['jit']['enabled'] === false`.
;
; The image may have shipped a buffer when 0.85.0 measured a fifth off the sweep and lost it in a later bump.
; That is exactly the silent regression this file exists to prevent, because an `ini_set()` that cannot work
; still succeeds and reports nothing.
;
; **Measured 1.57x on the commands and nothing at all on the test suite.** A bare `scene:stack` sweep in one
; process is 18.1 s against 28.5 s, three repeats each and a tight spread; an evenly spread 40-scene compile loop
; is 0.1449 s/scene against 0.2327 s/scene. The full PHPUnit suite is 22:06.248 against 22:06.927, which is the
; same number twice. That split is not explained — it is not the buffer, measured at 1.52% of 64 MB used at the
; end of a PHPUnit run, and not this file being overridden at runtime, measured at no cost on a quiet machine.
; See TOOL-22. The JIT stays because the commands are where the minutes actually are.
;
; **This file has to stay in step with the `ini-values` in `.github/workflows/tests.yml`.** A local timing that
; does not match CI's is worse than no local timing, because the next person to measure the suite gets a
; different answer for a reason nobody can see.
opcache.enable_cli = 1
opcache.jit_buffer_size = 64M
opcache.jit = tracing
